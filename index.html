<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>BRAWL SPY ONLINE - PREVIEW 2026</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Black+Ops+One&family=Rubik+Mono+One&display=swap" rel="stylesheet">
    
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>
        /* ГЛОБАЛЬНЫЕ ПЕРЕМЕННЫЕ ДИЗАЙН-СИСТЕМЫ */
        :root {
            --bg-deep: #05070a;
            --white-glow: #ffffff;
            --gold-top: #ffcc00;
            --gold-bottom: #ff8c00;
            --blue-top: #00a2ff;
            --blue-bottom: #004dff;
            --neon-blue: #00d2ff;
            --neon-red: #ff3131;
            --neon-yellow: #ffff00;
            --text-main: #ffffff;
            --font-battle: 'Black Ops One', cursive;
        }

        /* БАЗОВЫЕ НАСТРОЙКИ СТРАНИЦЫ */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            outline: none;
        }

        body {
            background-color: var(--bg-deep);
            color: var(--text-main);
            height: 100vh;
            width: 100vw;
            font-family: var(--font-battle);
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow: hidden;
            position: relative;
            /* Фоновый градиент для создания глубины и эффекта Halo за логотипом */
            background: radial-gradient(circle at 50% 30%, rgba(255,255,255,0.12) 0%, rgba(0,0,0,0) 65%), var(--bg-deep);
        }

        /* ВЕРХНЯЯ ИНФОРМАЦИОННАЯ ПАНЕЛЬ */
        .header-status-bar {
            width: 100%;
            padding: 15px 25px;
            display: flex;
            justify-content: flex-end;
            align-items: center;
            z-index: 100;
        }

        .online-status-container {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #00ff00;
            font-size: 13px;
            text-transform: uppercase;
            text-shadow: 0 0 10px #00ff00;
            font-family: sans-serif;
            font-weight: 800;
        }

        .pulse-indicator {
            width: 8px;
            height: 8px;
            background-color: #00ff00;
            border-radius: 50%;
            animation: pulse-glow 2s infinite ease-in-out;
        }

        @keyframes pulse-glow {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.3); opacity: 0.4; }
            100% { transform: scale(1); opacity: 1; }
        }

        /* ЦЕНТРАЛЬНЫЙ БЛОК ЛОГОТИПА */
        .branding-area {
            width: 100%;
            padding: 10px 30px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 30px;
            z-index: 10;
        }

        .branding-area img {
            width: 100%;
            max-width: 380px;
            filter: drop-shadow(0 0 25px rgba(255,255,255,0.3));
            animation: float-logo 4s infinite ease-in-out;
        }

        @keyframes float-logo {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        /* ОСНОВНОЙ КОНТЕЙНЕР ЭКРАНОВ */
        .app-screens {
            width: 100%;
            max-width: 440px;
            flex-grow: 1;
            position: relative;
            display: flex;
            justify-content: center;
            z-index: 50;
        }

        .screen {
            display: none;
            width: 100%;
            flex-direction: column;
            align-items: center;
            padding: 0 45px;
            position: absolute;
            top: 0;
        }

        .screen.active {
            display: flex;
            animation: fadeInScreen 0.4s ease-out forwards;
        }

        @keyframes fadeInScreen {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* СТИЛИЗАЦИЯ КНОПОК */
        .button-stack {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 18px;
            margin-top: 10px;
        }

        .btn-base {
            width: 100%;
            padding: 22px 0;
            font-family: inherit;
            font-size: 26px;
            text-transform: uppercase;
            border-radius: 16px;
            border: none;
            cursor: pointer;
            position: relative;
            box-shadow: 0 8px 0 rgba(0,0,0,0.65);
            transition: all 0.1s ease;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .btn-base:active {
            transform: translateY(4px);
            box-shadow: 0 4px 0 rgba(0,0,0,0.65);
        }

        /* СПЕЦИФИЧЕСКИЕ ЦВЕТА КНОПОК */
        .btn-gold-create {
            background: linear-gradient(180deg, var(--gold-top) 0%, var(--gold-bottom) 100%);
            color: #ffffff !important; /* БЕЛЫЙ ТЕКСТ ПО ТЗ */
            border: 2px solid rgba(255,255,255,0.25);
        }

        .btn-blue-join {
            background: linear-gradient(180deg, var(--blue-top) 0%, var(--blue-bottom) 100%);
            color: #ffffff;
        }

        .btn-dark-exit {
            background: #22252a;
            color: #7a7a7a;
            font-size: 18px;
            margin-top: 12px;
            box-shadow: 0 6px 0 rgba(0,0,0,0.6);
        }

        /* ЭКРАН НАСТРОЙКИ ЛОББИ */
        .lobby-main-title {
            font-size: 32px;
            color: var(--white-glow);
            text-shadow: 0 0 15px var(--white-glow);
            margin-bottom: 35px;
            text-transform: uppercase;
            text-align: center;
        }

        .lobby-tabs-row {
            display: flex;
            width: 100%;
            gap: 15px;
            margin-bottom: 40px;
        }

        .tab-element {
            flex: 1;
            padding: 22px 0;
            border: 4px solid;
            border-radius: 14px;
            text-align: center;
            font-size: 15px;
            font-weight: bold;
            text-transform: uppercase;
            background: transparent;
        }

        .tab-neon-blue {
            border-color: var(--neon-blue);
            color: var(--neon-blue);
            box-shadow: inset 0 0 15px var(--neon-blue), 0 0 15px var(--neon-blue);
        }

        .tab-neon-red {
            border-color: var(--neon-red);
            color: var(--neon-red);
            box-shadow: inset 0 0 15px var(--neon-red), 0 0 15px var(--neon-red);
        }

        /* СЕКЦИЯ ID КОМНАТЫ */
        .id-info-block {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            margin-bottom: 40px;
        }

        .id-label-text {
            color: #ffffff;
            font-size: 22px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .id-value-display {
            color: var(--gold-top);
            font-size: 46px;
            letter-spacing: 7px;
            text-shadow: 0 0 12px rgba(255, 204, 0, 0.45);
        }

        .btn-neon-yellow-start {
            background-color: var(--neon-yellow);
            color: #000000;
            box-shadow: 0 0 20px var(--neon-yellow), 0 8px 0 #b3b300;
            font-weight: 900;
        }

        /* ЭКРАН ВВОДА ID */
        .id-input-field {
            font-size: 52px;
            border-bottom: 5px solid #ffffff;
            width: 250px;
            text-align: center;
            margin: 40px 0;
            letter-spacing: 15px;
            color: #ffffff;
        }

    </style>
</head>
<body>

    <div class="header-status-bar">
        <div class="online-status-container">
            <div class="pulse-indicator"></div>
            <span>ОНЛАЙН: 9,412</span>
        </div>
    </div>

    <div class="branding-area">
        <img src="https://i.ibb.co/b29d0c/logo.png" alt="BRAWL SPY LOGO">
    </div>

    <div class="app-screens">
        
        <div id="scr-main-menu" class="screen active">
            <div class="button-stack">
                <button class="btn-base btn-gold-create" onclick="changeAppScreen('scr-lobby-settings')">СОЗДАТЬ ЛОББИ</button>
                <button class="btn-base btn-blue-join" onclick="changeAppScreen('scr-id-entry')">ВХОД ПО ID</button>
                <button class="btn-base btn-dark-exit" onclick="tg.close()">ВЫХОД</button>
            </div>
        </div>

        <div id="scr-lobby-settings" class="screen">
            <h2 class="lobby-main-title">НАСТРОЙКА ЛОББИ</h2>
            
            <div class="lobby-tabs-row">
                <div class="tab-element tab-neon-blue">УЧАСТНИКИ</div>
                <div class="tab-element tab-neon-red">ШПИОН</div>
            </div>

            <div class="id-info-block">
                <div class="id-label-text">ID КОМНАТЫ</div>
                <div id="generated-id-box" class="id-value-display">000-000</div>
            </div>

            <div class="button-stack">
                <button class="btn-base btn-neon-yellow-start" onclick="tg.showAlert('БИТВА НАЧИНАЕТСЯ!')">НАЧАТЬ ИГРУ</button>
                <button class="btn-base btn-dark-exit" onclick="changeAppScreen('scr-main-menu')">МЕНЮ</button>
            </div>
        </div>

        <div id="scr-id-entry" class="screen">
            <div class="id-info-block" style="margin-top: 30px;">
                <div class="id-label-text">ID КОМНАТЫ</div>
                <div class="id-input-field">____</div>
            </div>
            <div class="button-stack" style="margin-top: 40px;">
                <button class="btn-base btn-dark-exit" onclick="changeAppScreen('scr-main-menu')">НАЗАД</button>
            </div>
        </div>

    </div>

    <script>
        // Инициализация Telegram Web App
        const tg = window.Telegram.WebApp;
        tg.expand(); // Развернуть на весь экран

        /**
         * Функция переключения между экранами приложения
         * @param {string} screenId - ID целевого экрана
         */
        function changeAppScreen(screenId) {
            // Скрываем все доступные экраны
            const allScreens = document.querySelectorAll('.screen');
            allScreens.forEach(currentScreen => {
                currentScreen.classList.remove('active');
            });

            // Активируем выбранный экран
            const targetScreen = document.getElementById(screenId);
            if (targetScreen) {
                targetScreen.classList.add('active');
            }

            // Логика генерации ID при входе в настройки лобби
            if (screenId === 'scr-lobby-settings') {
                generateRandomRoomID();
            }

            // Тактильный отклик для пользователя
            if (tg.HapticFeedback) {
                tg.HapticFeedback.impactOccurred('medium');
            }
        }

        /**
         * Генерация случайного шестизначного ID комнаты
         */
        function generateRandomRoomID() {
            const partOne = Math.floor(100 + Math.random() * 899);
            const partTwo = Math.floor(100 + Math.random() * 899);
            const fullID = `${partOne}-${partTwo}`;
            
            const displayBox = document.getElementById('generated-id-box');
            if (displayBox) {
                displayBox.innerText = fullID;
            }
        }

        // Вызов при полной загрузке окна
        window.onload = () => {
            tg.ready();
            console.log("Brawl Spy WebApp Initialized");
        };
    </script>
</body>
</html>
