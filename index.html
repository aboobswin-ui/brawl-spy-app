<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brawl Spy</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Lilita+One&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #0A0A0F; /* Твой цвет фона */
            color: white;
            font-family: 'Lilita One', cursive; /* Шрифт как в игре */
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        h1 {
            font-size: 56px;
            color: #FFFFFF;
            text-transform: uppercase;
            letter-spacing: 2px;
            /* Объем и белое свечение с цианом */
            text-shadow: 
                0 0 15px rgba(0, 245, 255, 0.6), 
                2px 2px 0px #000, 
                4px 4px 0px #000;
            margin-bottom: 40px;
            text-align: center;
        }

        .btn-play {
            /* Эффект матового стекла */
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 25px;
            
            color: #B0B7C3; /* Твой цвет текста */
            font-family: 'Lilita One', cursive;
            font-size: 28px;
            padding: 20px 60px;
            cursor: pointer;
            text-transform: uppercase;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
        }

        .btn-play:active {
            transform: scale(0.95);
            background: rgba(255, 255, 255, 0.2);
        }

        p {
            color: #B0B7C3;
            font-size: 18px;
            margin-bottom: 20px;
            opacity: 0.8;
        }
    </style>
</head>
<body>

    <h1>BRAWL SPY</h1>
    <p>Нажми кнопку, чтобы начать игру</p>
    
    <button class="btn-play" onclick="sendData()">ИГРАТЬ</button>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();

        function sendData() {
            // Отправляем сигнал боту
            tg.sendData("start_game_selection");
            tg.close();
        }
    </script>
</body>
</html>
