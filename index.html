<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Brawl Stars: Spy Edition</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Rubik+One&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #050508;
            --panel: #121217;
            --primary: #7209B7;
            --accent: #F72585; /* Красный неон */
            --text: #FFFFFF;
            --glass: rgba(255, 255, 255, 0.05);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; font-family: 'Rubik One', sans-serif; -webkit-tap-highlight-color: transparent; }
        
        body { 
            background-color: var(--bg); 
            color: var(--text); 
            height: 100vh; 
            display: flex; 
            flex-direction: column;
            align-items: center; 
            justify-content: center; 
            overflow: hidden; 
        }

        .screen { display: none; width: 100%; height: 100%; flex-direction: column; align-items: center; justify-content: space-between; padding: 60px 25px; }
        .screen.active { display: flex; }

        /* Новый заголовок "ШПИОН" с красным неоном */
        .neon-title {
            font-size: 70px; /* Очень крупный */
            color: var(--text);
            text-shadow: 
                0 0 10px var(--accent), /* Мягкое свечение */
                0 0 20px var(--accent),
                0 0 30px var(--accent),
                0 0 40px var(--accent); /* Сильный неон */
            line-height: 0.8;
            margin-top: 50px; /* Отступ сверху */
            margin-bottom: 20px; /* Отступ до следующей строки */
            animation: neonPulse 1.5s ease-in-out infinite alternate; /* Анимация пульсации */
        }

        /* Анимация неонового свечения */
        @keyframes neonPulse {
            from { text-shadow: 0 0 5px var(--accent), 0 0 10px var(--accent), 0 0 15px var(--accent); }
            to { text-shadow: 0 0 15px var(--accent), 0 0 25px var(--accent), 0 0 35px var(--accent), 0 0 45px var(--accent); }
        }

        /* "BRAWL STARS edition" стиль */
        .subtitle {
            font-size: 35px; /* "BRAWL STARS" крупнее */
            color: var(--accent); /* Красный цвет */
            line-height: 1;
            margin-top: 10px; /* Отступ после "ШПИОН" */
            margin-bottom: 80px; /* Отступ до кнопки */
        }
        .subtitle span {
            font-size: 20px; /* "edition" мелким шрифтом */
            display: block; /* С новой строки */
            color: rgba(255, 255, 255, 0.7); /* Чуть приглушенный белый */
            margin-top: -5px; /* Поднимаем ближе к BRAWL STARS */
        }

        /* Кнопки как в оригинале */
        .btn-main {
            width: 100%; 
            max-width: 340px; 
            padding: 24px; 
            border-radius: 28px;
            background: var(--primary); 
            color: white; 
            border: none; 
            font-size: 26px;
            box-shadow: 0 8px 0 #4a0577; 
            transition: 0.1s; 
            cursor: pointer;
            text-transform: uppercase;
        }
        .btn-main:active { transform: translateY(4px); box-shadow: 0 3px 0 #4a0577; }

        /* Панель выбора игроков */
        .counter-box {
            background: var(--panel);
            padding: 25px;
            border-radius: 30px;
            border: 2px solid var(--glass);
            display: flex;
            align-items: center;
            gap: 40px;
            margin-bottom: 20px;
        }
        .btn-circle {
            width: 65px; height: 65px;
            border-radius: 20px;
            background: var(--primary);
            border: none;
            color: white;
            font-size: 35px;
            display: flex; align-items: center; justify-content: center;
        }

        /* 3D Карта */
        .card-wrap { width: 300px; height: 420px; perspective: 1200px; }
        .card-inner { position: relative; width: 100%; height: 100%; transition: transform 0.7s cubic-bezier(0.175, 0.885, 0.32, 1.275); transform-style: preserve-3d; }
        .card-inner.flipped { transform: rotateY(180deg); }
        .card-side { 
            position: absolute; width: 100%; height: 100%; 
            backface-visibility: hidden; border-radius: 40px; 
            border: 10px solid var(--primary); 
            display: flex; flex-direction: column; align-items: center; justify-content: center; 
            background: var(--panel); 
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
        }
        .card-front { transform: rotateY(180deg); background: #FFFFFF; color: #000; border-color: var(--accent); }
        
        .brawler-img { width: 240px; height: 240px; object-fit: contain; margin-top: 10px; }
        .role-name { font-size: 32px; color: #000; text-transform: uppercase; }

        #timer-display { font-size: 90px; color: var(--accent); text-shadow: 0 0 20px rgba(247, 37, 133, 0.3); }
    </style>
</head>
<body>

    <div id="scr-menu" class="screen active">
        <h1 class="neon-title">ШПИОН</h1>
        <h2 class="subtitle">BRAWL STARS <span>edition</span></h2>
        <button class="btn-main" onclick="nav('scr-lobby')">Играть</button>
    </div>

    <div id="scr-lobby" class="screen">
        <h2 style="font-size: 24px; opacity: 0.8;">КТО В ИГРЕ?</h2>
        <div class="counter-box">
            <button class="btn-circle" onclick="changeP(-1)">-</button>
            <span id="p-count" style="font-size: 55px;">3</span>
            <button class="btn-circle" onclick="changeP(1)">+</button>
        </div>
        <button class="btn-main" onclick="startGame()">Раздать</button>
    </div>

    <div id="scr-game" class="screen">
        <h3 id="p-label" style="color:var(--secondary); font-size: 22px;">ИГРОК 1</h3>
        <div class="card-wrap" onclick="flip()">
            <div id="card-obj" class="card-inner">
                <div class="card-side">
                    <h1 style="font-size: 100px; color: var(--primary);">?</h1>
                    <p style="font-size: 14px; opacity: 0.5;">НАЖМИ НА КАРТУ</p>
                </div>
                <div class="card-side card-front" id="role-ui"></div>
            </div>
        </div>
        <div id="timer-ui" style="display:none;">
            <div id="timer-display">05:00</div>
            <p style="font-size: 20px;">ОБСУЖДАЙТЕ!</p>
        </div>
        <button id="btn-next" class="btn-main" style="visibility:hidden;" onclick="next()">Далее</button>
        <button id="btn-restart" class="btn-main" style="display:none;" onclick="location.reload()">В меню</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        
        const BRAWLERS = [
            { n: "ШЕЛЛИ", i: "https://cdn.brawlstats.com/character-arts/16000000.png" },
            { n: "КОЛЬТ", i: "https://cdn.brawlstats.com/character-arts/16000001.png" },
            { n: "БУЛЛ", i: "https://cdn.brawlstats.com/character-arts/16000002.png" },
            { n: "РИКО", i: "https://cdn.brawlstats.com/character-arts/16000003.png" },
            { n: "ДЖЕССИ", i: "https://cdn.brawlstats.com/character-arts/16000004.png" },
            { n: "БРОК", i: "https://cdn.brawlstats.com/character-arts/16000005.png" },
            { n: "ДИНАМАЙК", i: "https://cdn.brawlstats.com/character-arts/16000006.png" },
            { n: "СПАЙК", i: "https://cdn.brawlstats.com/character-arts/16000007.png" },
            { n: "КРОУ", i: "https://cdn.brawlstats.com/character-arts/16000008.png" },
            { n: "ЛЕОН", i: "https://cdn.brawlstats.com/character-arts/16000017.png" },
            { n: "МОРТИС", i: "https://cdn.brawlstats.com/character-arts/16000014.png" },
            { n: "ЭДГАР", i: "https://cdn.brawlstats.com/character-arts/16000042.png" }
        ];

        let state = { p: 3, cur: 0, roles: [], isFlipped: false, time: 300 };

        function nav(id) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            tg.HapticFeedback.impactOccurred('light');
        }

        function changeP(v) {
            state.p = Math.max(3, Math.min(12, state.p + v));
            document.getElementById('p-count').innerText = state.p;
            tg.HapticFeedback.selectionChanged();
        }

        function startGame() {
            state.cur = 0; state.roles = []; state.isFlipped = false;
            let spyIdx = Math.floor(Math.random() * state.p);
            let brawler = BRAWLERS[Math.floor(Math.random() * BRAWLERS.length)];
            for(let i=0; i<state.p; i) {
                state.roles.push(i === spyIdx ? {n: "ШПИОН", i: "https://cdn-icons-png.flaticon.com/512/953/953791.png"} : brawler);
            }
            nav('scr-game');
            updateUI();
        }

        function flip() {
            if(state.isFlipped) return;
            const role = state.roles[state.cur];
            document.getElementById('role-ui').innerHTML = `<span class="role-name">${role.n}</span><img src="${role.i}" class="brawler-img">`;
            document.getElementById('card-obj').classList.add('flipped');
            document.getElementById('btn-next').style.visibility = 'visible';
            state.isFlipped = true;
            tg.HapticFeedback.impactOccurred('heavy');
        }

        function next() {
            state.cur++;
            if(state.cur < state.p) {
                state.isFlipped = false;
                document.getElementById('card-obj').classList.remove('flipped');
                document.getElementById('btn-next').style.visibility = 'hidden';
                setTimeout(updateUI, 300);
            } else {
                startTimer();
            }
        }

        function updateUI() { document.getElementById('p-label').innerText = `ИГРОК ${state.cur + 1}`; }

        function startTimer() {
            document.querySelector('.card-wrap').style.display = 'none';
            document.getElementById('btn-next').style.display = 'none';
            document.getElementById('p-label').innerText = "КТО ПРЕДАТЕЛЬ?";
            document.getElementById('timer-ui').style.display = 'block';
            document.getElementById('btn-restart').style.display = 'block';
            
            let countdown = setInterval(() => {
                state.time--;
                let m = Math.floor(state.time / 60), s = state.time % 60;
                document.getElementById('timer-display').innerText = `${m}:${s < 10 ? '0'+s : s}`;
                if(state.time <= 0) {
                    clearInterval(countdown);
                    tg.HapticFeedback.notificationOccurred('error');
                    tg.showAlert("ВРЕМЯ ВЫШЛО!");
                }
            }, 1000);
        }

        window.onload = () => { 
            tg.ready(); 
            tg.expand();
        };
    </script>
</body>
</html>
