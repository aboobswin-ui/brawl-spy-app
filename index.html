<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BRAWL SPY | Шпионские игры</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* Сброс и база */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0A0A0F;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            position: relative;
            overflow: hidden;
        }

        /* Фоновые эффекты */
        body::before {
            content: '';
            position: absolute;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(circle at 20% 30%, rgba(120, 0, 0, 0.15) 0%, transparent 50%),
                radial-gradient(circle at 80% 70%, rgba(0, 10, 120, 0.1) 0%, transparent 50%);
            z-index: -1;
        }

        .scan-line {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: linear-gradient(90deg, 
                transparent, 
                rgba(0, 245, 255, 0.6), 
                transparent);
            animation: scan 4s linear infinite;
            z-index: -1;
        }

        @keyframes scan {
            0% { top: 0%; }
            100% { top: 100%; }
        }

        /* Основной контейнер */
        .main-container {
            width: 100%;
            max-width: 500px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 35px;
            padding: 30px 20px;
        }

        /* Логотип */
        .logo-container {
            width: 100%;
            display: flex;
            justify-content: center;
            margin-bottom: 10px;
        }

        .logo-img {
            width: 85%;
            max-width: 400px;
            height: auto;
            filter: drop-shadow(0 0 25px rgba(180, 0, 20, 0.7));
            animation: logo-glow 3s ease-in-out infinite alternate;
        }

        @keyframes logo-glow {
            from { filter: drop-shadow(0 0 25px rgba(180, 0, 20, 0.7)); }
            to { filter: drop-shadow(0 0 35px rgba(220, 20, 40, 0.9)); }
        }

        /* ОБЩИЙ СТИЛЬ КНОПОК */
        .menu-btn {
            width: 90%;
            max-width: 380px;
            padding: 22px 25px;
            border: none;
            border-radius: 14px;
            font-size: 1.35rem;
            font-weight: 800;
            letter-spacing: 1.2px;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            position: relative;
            overflow: hidden;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.5);
        }

        .menu-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, 
                transparent, 
                rgba(255, 255, 255, 0.1), 
                transparent);
            transition: left 0.6s;
        }

        .menu-btn:hover::before {
            left: 100%;
        }

        .menu-btn:active {
            transform: scale(0.97);
        }

        /* Конкретные кнопки */
        #btn-create {
            background: linear-gradient(145deg, 
                #8B0000 0%, 
                #B22222 45%, 
                #8B0000 100%);
            color: #FFD700;
            border: 2px solid #FF4500;
            text-shadow: 0 0 10px rgba(255, 215, 0, 0.5);
        }

        #btn-create:hover {
            background: linear-gradient(145deg, 
                #9E0000 0%, 
                #C22 50%, 
                #9E0000 100%);
            box-shadow: 0 0 30px rgba(255, 69, 0, 0.7);
            transform: translateY(-3px);
        }

        #btn-join {
            background: linear-gradient(145deg, 
                #1A1A1A 0%, 
                #2D2D2D 50%, 
                #1A1A1A 100%);
            color: #00E5FF;
            border: 2px solid #008B8B;
            text-shadow: 0 0 8px rgba(0, 229, 255, 0.4);
        }

        #btn-join:hover {
            background: linear-gradient(145deg, 
                #222 0%, 
                #333 50%, 
                #222 100%);
            box-shadow: 0 0 25px rgba(0, 139, 139, 0.6);
            transform: translateY(-3px);
        }

        #btn-exit {
            background: linear-gradient(145deg, 
                #222 0%, 
                #111 100%);
            color: #FF4D4D;
            border: 2px solid #8B0000;
            text-shadow: 0 0 8px rgba(255, 77, 77, 0.4);
        }

        #btn-exit:hover {
            background: linear-gradient(145deg, 
                #2A2A2A 0%, 
                #1A1A1A 100%);
            box-shadow: 0 0 20px rgba(139, 0, 0, 0.6);
            transform: translateY(-3px);
        }

        /* Блок ввода ID */
        .input-container {
            width: 90%;
            max-width: 380px;
            display: none;
            flex-direction: column;
            gap: 18px;
            margin-top: 10px;
            animation: fadeIn 0.4s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .input-container input {
            padding: 18px;
            border-radius: 12px;
            border: 2px solid #008B8B;
            background: rgba(10, 10, 15, 0.8);
            color: #00E5FF;
            font-size: 1.2rem;
            text-align: center;
            outline: none;
            transition: all 0.3s;
        }

        .input-container input:focus {
            border-color: #00E5FF;
            box-shadow: 0 0 15px rgba(0, 229, 255, 0.4);
            background: rgba(15, 15, 25, 0.9);
        }

        .input-container .confirm-btn {
            padding: 18px;
            border-radius: 12px;
            border: none;
            background: linear-gradient(145deg, #006400 0%, #228B22 100%);
            color: white;
            font-weight: bold;
            font-size: 1.1rem;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .input-container .confirm-btn:hover {
            background: linear-gradient(145deg, #228B22 0%, #32CD32 100%);
            box-shadow: 0 0 20px rgba(50, 205, 50, 0.5);
        }

        /* Подсказка */
        .hint {
            color: #666;
            text-align: center;
            font-size: 0.95rem;
            margin-top: 20px;
            padding: 0 20px;
            line-height: 1.5;
        }

        .hint i {
            color: #00E5FF;
            margin-right: 8px;
        }

        /* Адаптив */
        @media (max-width: 600px) {
            .main-container { gap: 28px; }
            .menu-btn { width: 95%; padding: 20px; font-size: 1.2rem; }
            .logo-img { width: 95%; }
        }
    </style>
</head>
<body>
    <div class="scan-line"></div>
    
    <div class="main-container">
        <!-- ЛОГОТИП -->
        <div class="logo-container">
            <img src="https://i.postimg.cc/pXq5NvK9/logo-transparent.png" 
                 alt="BRAWL SPY" 
                 class="logo-img">
        </div>

        <!-- КНОПКА 1: СОЗДАТЬ ЛОББИ -->
        <button class="menu-btn" id="btn-create">
            <i class="fas fa-plus-circle"></i>
            СОЗДАТЬ ЛОББИ
        </button>

        <!-- КНОПКА 2: ВХОД ПО ID -->
        <button class="menu-btn" id="btn-join">
            <i class="fas fa-door-closed"></i>
            ВХОД ПО ID
        </button>

        <!-- БЛОК ВВОДА ID -->
        <div class="input-container" id="input-container">
            <input type="text" id="lobby-id" 
                   placeholder="ВВЕДИТЕ ID ЛОББИ (НАПРИМЕР: X7F9K3)" 
                   maxlength="10">
            <button class="confirm-btn" id="btn-confirm">
                <i class="fas fa-check"></i>
                ПОДТВЕРДИТЬ ВХОД
            </button>
        </div>

        <!-- КНОПКА 3: ВЫХОД -->
        <button class="menu-btn" id="btn-exit">
            <i class="fas fa-sign-out-alt"></i>
            ВЫХОД
        </button>

        <!-- ПОДСКАЗКА -->
        <p class="hint">
            <i class="fas fa-info-circle"></i>
            Создайте лобби для начала игры или войдите по ID к другу
        </p>
    </div>

    <script>
        // Элементы
        const btnJoin = document.getElementById('btn-join');
        const btnCreate = document.getElementById('btn-create');
        const btnExit = document.getElementById('btn-exit');
        const btnConfirm = document.getElementById('btn-confirm');
        const inputContainer = document.getElementById('input-container');
        const inputField = document.getElementById('lobby-id');
        
        // ВХОД ПО ID
        btnJoin.addEventListener('click', () => {
            const isVisible = inputContainer.style.display === 'flex';
            inputContainer.style.display = isVisible ? 'none' : 'flex';
            
            const icon = btnJoin.querySelector('i');
            if (isVisible) {
                icon.className = 'fas fa-door-closed';
                btnJoin.style.border = '2px solid #008B8B';
            } else {
                icon.className = 'fas fa-door-open';
                btnJoin.style.border = '2px solid #00E5FF';
                inputField.focus();
            }
        });
        
        // ПОДТВЕРДИТЬ ВХОД
        btnConfirm.addEventListener('click', () => {
            const id = inputField.value.trim().toUpperCase();
            if (!id || id.length < 3) {
                alert('❌ Ошибка: ID должен содержать минимум 3 символа');
                inputField.focus();
                return;
            }
            alert(`🔍 Поиск лобби...\nID: ${id}`);
            // Здесь логика подключения
        });
        
        // СОЗДАТЬ ЛОББИ
        btnCreate.addEventListener('click', () => {
            alert('🎮 Создание нового лобби...\nНастройки → Выбор карты → Ожидание игроков');
            // Здесь логика создания лобби
        });
        
        // ВЫХОД
        btnExit.addEventListener('click', () => {
            if (confirm('⚠️ Вы уверены, что хотите выйти?')) {
                alert('Выход из игры...');
                // Здесь логика выхода
            }
        });
        
        // Enter в поле ввода
        inputField.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') btnConfirm.click();
        });
        
        // Случайный ID при фокусе (пример)
        inputField.addEventListener('focus', () => {
            if (!inputField.value) {
                const sampleIds = ['X7F9K3', 'ALPHA1', 'SPY007', 'BRAWL22'];
                inputField.placeholder = sampleIds[Math.floor(Math.random() * sampleIds.length)];
            }
        });
    </script>
</body>
</html>
