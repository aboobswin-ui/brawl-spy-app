<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>BRAWL SPY 2026 - ULTIMATE TITAN MONOLITH</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Black+Ops+One&family=Rubik+Mono+One&display=swap" rel="stylesheet">
    
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>
        /* --- ГЛОБАЛЬНЫЕ КОНСТАНТЫ И ПЕРЕМЕННЫЕ --- */
        :root {
            --clr-neon-red: #ff3131;
            --clr-neon-blue: #00d2ff;
            --clr-neon-gold: #ffd700;
            --clr-white: #ffffff;
            --clr-bg-black: #010103;
            
            /* Шрифты */
            --f-spy: 'Rubik Mono One', sans-serif;
            --f-main: 'Black Ops One', cursive;

            /* Глубина объема (3D Shadow Stack) */
            --spy-volume: 
                0 1px 0 #8b0000, 
                0 2px 0 #7b0000, 
                0 3px 0 #6b0000, 
                0 4px 0 #5b0000, 
                0 5px 0 #4b0000, 
                0 6px 0 #3b0000,
                0 10px 15px rgba(0,0,0,0.8);
        }

        /* --- СИСТЕМА СТАБИЛИЗАЦИИ ИНТЕРФЕЙСА --- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            -webkit-user-select: none;
            user-select: none;
            outline: none;
        }

        html, body {
            width: 100vw;
            height: 100vh;
            background-color: var(--clr-bg-black);
            color: var(--clr-white);
            overflow: hidden;
            font-family: var(--f-main);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* ГЛАВНЫЙ КОНТЕЙНЕР ПРИЛОЖЕНИЯ */
        .app-shell {
            width: 100%;
            height: 100%;
            max-width: 440px;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10;
        }

        /* --- СИСТЕМА ЭКРАНОВ --- */
        .screen-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px;
            z-index: 20;
        }

        /* ГЛАВНОЕ МЕНЮ (СПЕЦИАЛЬНЫЙ ФОН) */
        #screen-main-menu {
            background-image: linear-gradient(
                to bottom,
                rgba(0, 0, 0, 0.8) 0%,
                rgba(0, 0, 0, 0.5) 50%,
                rgba(0, 0, 0, 0.9) 100%
            ), url('https://avatars.mds.yandex.net/i?id=bf88c867806a71c96d2d94c597a3c9ea_l-8271622-images-thumbs&n=13');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }

        /* ДРУГИЕ ОКНА (СТРОГИЙ ЧЕРНЫЙ) */
        #screen-lobby-settings, #screen-id-enter {
            background-color: var(--clr-bg-black);
        }

        .screen-layer.active {
            display: flex;
            animation: appFadeIn 0.5s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards;
        }

        /* --- ОБЪЕМНЫЙ ТИТАНОВЫЙ ЛОГОТИП --- */
        .logo-titan-stack {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            margin-bottom: 50px;
            pointer-events: none;
        }

        /* ШПИОН (МАКСИМАЛЬНЫЙ ОБЪЕМ) */
        .spy-vol-text {
            font-family: var(--f-spy);
            font-size: 92px; /* Увеличено до предела */
            color: var(--clr-neon-red);
            text-transform: uppercase;
            letter-spacing: -5px;
            line-height: 0.8;
            transform: scaleY(1.25);
            text-shadow: var(--spy-volume);
            margin-bottom: 25px;
            position: relative;
        }

        /* BRAWL (ПОД ШПИОНОМ) */
        .brawl-vol-text {
            font-size: 38px;
            color: var(--clr-white);
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 0 0 8px rgba(255, 255, 255, 0.3);
            margin-bottom: 4px;
        }

        /* STARS (ПОД БРАВЛОМ) */
        .stars-vol-text {
            font-size: 82px;
            color: var(--clr-neon-red);
            text-transform: uppercase;
            line-height: 0.8;
            text-shadow: 0 4px 0 #7b0000, 0 0 10px rgba(255, 49, 49, 0.3);
            margin-bottom: 15px;
        }

        /* EDITION 2026 (НИЗ) */
        .edition-vol-text {
            font-size: 16px;
            color: var(--clr-white);
            opacity: 0.6;
            letter-spacing: 6px;
            text-transform: uppercase;
        }

        /* --- СИСТЕМА КНОПОК --- */
        .btn-container {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        .btn-titan {
            width: 100%;
            padding: 24px 0;
            background: rgba(0, 0, 0, 0.85);
            border: 3px solid var(--clr-neon-blue);
            box-shadow: 0 0 12px var(--clr-neon-blue);
            border-radius: 22px;
            color: var(--clr-white);
            font-size: 24px;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.19, 1, 0.22, 1);
            position: relative;
            overflow: hidden;
        }

        .btn-titan:active {
            transform: scale(0.94);
            box-shadow: 0 0 25px var(--clr-neon-blue);
            background: var(--clr-neon-blue);
            color: #000;
        }

        /* КНОПКА №6: СОЗДАТЬ КОМНАТУ (БЕЛЫЙ ТЕКСТ + ЗОЛОТО) */
        .btn-titan-gold {
            border-color: var(--clr-neon-gold);
            box-shadow: 0 0 20px var(--clr-neon-gold);
            color: var(--clr-white) !important;
        }

        .btn-titan-gold:active {
            background: var(--clr-neon-gold);
            color: #000 !important;
        }

        .btn-titan-back {
            border-color: #222;
            color: #555;
            box-shadow: none;
            margin-top: 10px;
        }

        /* --- ИНТЕРФЕЙС НАСТРОЕК --- */
        .settings-header {
            font-size: 32px;
            color: var(--clr-white);
            margin-bottom: 45px;
            text-transform: uppercase;
            text-shadow: 0 0 15px rgba(255,255,255,0.2);
        }

        .tab-system {
            display: flex;
            width: 100%;
            gap: 12px;
            margin-bottom: 40px;
        }

        .tab-el {
            flex: 1;
            padding: 18px 0;
            border-radius: 18px;
            border: 3px solid;
            font-size: 14px;
            text-align: center;
            text-transform: uppercase;
            font-weight: bold;
        }

        .tab-el-blue { border-color: var(--clr-neon-blue); color: var(--clr-neon-blue); }
        .tab-el-red { border-color: var(--clr-neon-red); color: var(--clr-neon-red); }

        /* --- ГРИД ВВОДА ID --- */
        .id-input-grid {
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 50px 0;
        }

        .id-char-line {
            width: 35px;
            font-size: 46px;
            border-bottom: 5px solid var(--clr-white);
            color: var(--clr-white);
            text-align: center;
            text-shadow: 0 0 10px var(--clr-white);
        }

        /* --- СИСТЕМНЫЕ АНИМАЦИИ --- */
        @keyframes appFadeIn {
            from { opacity: 0; transform: scale(1.05); }
            to { opacity: 1; transform: scale(1); }
        }

    </style>
</head>
<body>

    <div class="app-shell">
        
        <div id="screen-main-menu" class="screen-layer active">
            <div class="logo-titan-stack">
                <div class="spy-vol-text">ШПИОН</div>
                <div class="brawl-vol-text">BRAWL</div>
                <div class="stars-vol-text">STARS</div>
                <div class="edition-vol-text">EDITION 2026</div>
            </div>
            
            <div class="btn-container">
                <button class="btn-titan" onclick="BrawlSpy.nav('screen-lobby-settings')">СОЗДАТЬ ЛОББИ</button>
                <button class="btn-titan" onclick="BrawlSpy.nav('screen-id-enter')">ВХОД ПО ID</button>
                <button class="btn-titan btn-titan-back" onclick="tg.close()">ВЫХОД</button>
            </div>
        </div>

        <div id="screen-lobby-settings" class="screen-layer">
            <h2 class="settings-header">НАСТРОЙКИ БИТВЫ</h2>
            
            <div class="tab-system">
                <div class="tab-el tab-el-blue">УЧАСТНИКИ</div>
                <div class="tab-el tab-el-red">ШПИОН</div>
            </div>

            <div id="lobby-id-display" style="color:var(--clr-neon-gold); font-size: 28px; margin-bottom: 40px; letter-spacing: 3px;">ID: 0000-0000</div>

            <div class="btn-container">
                <button class="btn-titan btn-titan-gold" onclick="BrawlSpy.createRoom()">СОЗДАТЬ КОМНАТУ</button>
                <button class="btn-titan btn-titan-back" onclick="BrawlSpy.nav('screen-main-menu')">МЕНЮ</button>
            </div>
        </div>

        <div id="screen-id-enter" class="screen-layer">
            <h2 class="settings-header">ID КОМНАТЫ</h2>
            
            <div class="id-input-grid">
                <div class="id-char-line">_</div><div class="id-char-line">_</div><div class="id-char-line">_</div><div class="id-char-line">_</div>
                <div style="font-size: 30px;">-</div>
                <div class="id-char-line">_</div><div class="id-char-line">_</div><div class="id-char-line">_</div><div class="id-char-line">_</div>
            </div>

            <div class="btn-container">
                <button class="btn-titan btn-titan-back" onclick="BrawlSpy.nav('screen-main-menu')">ОТМЕНА</button>
            </div>
        </div>

    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        tg.enableClosingConfirmation();

        /**
         * УЛЬТИМАТИВНЫЙ КОНТРОЛЛЕР ПРИЛОЖЕНИЯ
         */
        const BrawlSpy = {
            currentRoomId: null,

            /**
             * Умная навигация
             */
            nav: function(targetId) {
                // Скрытие всех слоев с задержкой для анимации
                const layers = document.querySelectorAll('.screen-layer');
                layers.forEach(l => l.classList.remove('active'));
                
                const target = document.getElementById(targetId);
                if (target) {
                    target.classList.add('active');
                }

                // Логика для конкретных экранов
                if (targetId === 'screen-lobby-settings') {
                    this.currentRoomId = this.generateSessionId();
                    document.getElementById('lobby-id-display').innerText = "ID: " + this.currentRoomId;
                }

                tg.HapticFeedback.impactOccurred('medium');
            },

            /**
             * Генератор сессионного ключа
             */
            generateSessionId: function() {
                const s1 = Math.floor(1000 + Math.random() * 8999);
                const s2 = Math.floor(1000 + Math.random() * 8999);
                return `${s1}-${s2}`;
            },

            /**
             * Процесс создания комнаты
             */
            createRoom: function() {
                tg.HapticFeedback.notificationOccurred('success');
                tg.showAlert(`БИТВА [${this.currentRoomId}] СФОРМИРОВАНА. ОЖИДАНИЕ ИГРОКОВ...`);
            }
        };

        // Инициализация при загрузке
        window.onload = () => {
            tg.ready();
            console.log("Brawl Spy Titan Edition Loaded Successfully.");
        };

        // Защита от свайпов и багов прокрутки
        document.addEventListener('touchmove', (e) => {
            if (e.touches.length > 1) e.preventDefault();
        }, { passive: false });
    </script>
</body>
</html>
