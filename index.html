<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta 
        name="viewport" 
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    >
    <title>Brawl Spy Pro Plus</title>
    
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    
    <link href="https://fonts.googleapis.com/css2?family=Rubik+One&family=Roboto:wght@700;900&display=swap" rel="stylesheet">
    
    <style>
        /**
         * ГЛОБАЛЬНЫЙ БЛОК СТИЛЕЙ
         * Каждое правило развернуто максимально подробно
         */
        :root {
            --bg-primary: #050508;
            --accent-main: #7209B7;
            --accent-second: #4CC9F0;
            --accent-danger: #F72585;
            --surface-color: #121217;
            --text-primary: #FFFFFF;
            --text-secondary: rgba(255, 255, 255, 0.4);
            --transition-speed: 0.3s;
            --border-radius-lg: 35px;
            --border-radius-sm: 15px;
        }

        * { 
            box-sizing: border-box; 
            margin: 0; 
            padding: 0; 
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            font-family: 'Rubik One', sans-serif;
        }
        
        body {
            background-color: var(--bg-primary);
            background-image: 
                radial-gradient(
                    circle at 50% -10%, 
                    rgba(114, 9, 183, 0.4) 0%, 
                    transparent 70%
                ),
                radial-gradient(
                    circle at 50% 110%, 
                    rgba(76, 201, 240, 0.2) 0%, 
                    transparent 70%
                );
            color: var(--text-primary);
            height: 100vh; 
            width: 100vw;
            overflow: hidden;
            display: flex; 
            flex-direction: column;
        }

        /* ОФОРМЛЕНИЕ ЭКРАНОВ */
        .app-screen {
            display: none;
            width: 100%; 
            height: 100%;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 50px 30px;
            animation: screenEntry 0.4s cubic-bezier(0.4, 0, 0.2, 1) forwards;
        }

        .app-screen.active { 
            display: flex !important; 
        }

        @keyframes screenEntry {
            from { 
                opacity: 0; 
                transform: scale(0.95) translateY(20px); 
            }
            to { 
                opacity: 1; 
                transform: scale(1) translateY(0); 
            }
        }

        /* КНОПКИ (СТИЛЬ КАК НА СКРИНЕ) */
        .action-btns {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 18px;
            margin-bottom: 20px;
        }

        .main-btn {
            width: 100%;
            max-width: 400px;
            padding: 26px;
            border-radius: var(--border-radius-lg);
            font-size: 24px;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.2s ease-in-out;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 4px solid transparent;
            background: transparent;
            color: var(--text-primary);
            letter-spacing: 1px;
        }

        .btn-start {
            border-color: var(--accent-main);
            box-shadow: 0 0 25px rgba(114, 9, 183, 0.5);
        }

        .btn-start:active {
            background: var(--accent-main);
            transform: scale(0.95);
            box-shadow: 0 0 10px rgba(114, 9, 183, 0.8);
        }

        .btn-invite {
            border-color: var(--accent-second);
            box-shadow: 0 0 25px rgba(76, 201, 240, 0.4);
        }

        .btn-invite:active {
            background: var(--accent-second);
            transform: scale(0.95);
            box-shadow: 0 0 10px rgba(76, 201, 240, 0.8);
        }

        /* ПАНЕЛЬ ЛОББИ */
        .lobby-panel {
            background: var(--surface-color);
            border-radius: var(--border-radius-lg);
            width: 100%;
            padding: 35px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.4);
        }

        .count-btn {
            width: 65px; 
            height: 65px;
            border-radius: 22px;
            border: none;
            background: var(--accent-main);
            color: white;
            font-size: 34px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.1s;
        }

        .count-btn:active {
            transform: scale(0.9);
        }

        .player-item {
            background: #1c1c22;
            margin-bottom: 16px;
            padding: 22px 30px;
            border-radius: 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-left: 6px solid var(--accent-main);
            transition: all 0.3s;
        }

        .player-item.is-me { 
            border-left-color: var(--accent-second); 
        }

        /* КАРТА БРАВЛЕРА */
        .brawler-card {
            width: 340px; 
            height: 500px;
            background: var(--surface-color);
            border: 10px solid var(--accent-main);
            border-radius: 60px;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 50px 30px;
            box-shadow: 0 40px 80px rgba(0,0,0,0.8);
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }

        .image-frame {
            width: 280px; 
            height: 280px;
            margin-top: 25px;
            display: flex; 
            align-items: center; 
            justify-content: center;
        }

        .image-frame img {
            max-width: 100%; 
            max-height: 100%;
            object-fit: contain;
            filter: drop-shadow(0 15px 30px rgba(0,0,0,0.6));
        }

        /* ТАЙМЕР */
        #game-timer-ui {
            font-size: 100px;
            color: var(--accent-danger);
            font-family: 'Roboto', sans-serif;
            font-weight: 900;
            text-shadow: 0 0 30px rgba(247, 37, 133, 0.5);
        }

    </style>
</head>
<body>

    <div id="application-container" style="height: 100%;">
        
        <div id="screen-main-menu" class="app-screen active">
            <div style="text-align: center; margin-top: 40px;">
                <h1 style="font-size: 65px; line-height: 0.8; letter-spacing: -2px;">
                    BRAWL<br><span style="color:var(--accent-main)">SPY</span>
                </h1>
                <p style="font-size: 14px; color: var(--text-secondary); margin-top: 15px; letter-spacing: 5px;">PRO EDITION</p>
            </div>
            
            <div class="action-btns">
                <button class="main-btn btn-start" onclick="handleCreateRoom()">
                    СОЗДАТЬ КОМНАТУ
                </button>
                <button class="main-btn btn-invite" onclick="tg.showAlert('Сетевой поиск будет в обновлении 6.0')">
                    НАЙТИ ИГРУ
                </button>
            </div>
        </div>

        <div id="screen-game-lobby" class="app-screen">
            <div style="text-align:center">
                <div 
                    id="room-identifier" 
                    style="background:var(--accent-main); padding:12px 30px; border-radius:18px; font-size:16px; margin-bottom:20px; display:inline-block"
                >
                    ROOM: #2401
                </div>
                <h1 style="font-size:45px; text-transform:uppercase;">ЛОББИ</h1>
            </div>

            <div class="lobby-panel">
                <span style="font-size:22px;">ИГРОКИ:</span>
                <div style="display: flex; align-items: center; gap: 25px;">
                    <button class="count-btn" onclick="adjustPlayers(-1)">-</button>
                    <span id="player-num" style="font-size:40px; width:50px; text-align:center">3</span>
                    <button class="count-btn" onclick="adjustPlayers(1)">+</button>
                </div>
            </div>

            <div id="player-list-scroll" style="flex:1; width:100%; overflow-y:auto; margin-bottom: 25px;">
                </div>

            <div class="action-btns">
                <button class="main-btn btn-start" onclick="startTheMatch()">СТАРТ</button>
                <button class="main-btn btn-invite" onclick="handleShare()">ПРИГЛАСИТЬ</button>
            </div>
        </div>

        <div id="screen-game-play" class="app-screen">
            <h2 id="active-player-name" style="font-size:28px; text-transform: uppercase; color: var(--accent-second)">
                НИКИТА
            </h2>
            
            <div class="brawler-card" id="card-element" onclick="doReveal()">
                <div id="instruction-text" style="height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center; color:var(--accent-main);">
                    <div style="font-size: 80px; margin-bottom: 15px;">?</div>
                    <div style="font-size: 18px;">ТАПНИ ПО КАРТЕ</div>
                </div>
            </div>

            <div id="game-timer-ui" style="display:none;">05:00</div>

            <div class="action-btns">
                <button class="main-btn btn-start" id="btn-next-step" style="display:none" onclick="proceedToNext()">
                    СЛЕДУЮЩИЙ
                </button>
                <button class="main-btn" style="border-color:#222; color:#444; font-size: 16px;" onclick="location.reload()">
                    ПОКИНУТЬ
                </button>
            </div>
        </div>

    </div>

    <script>
        /**
         * ИГРОВАЯ ЛОГИКА
         * РАЗВЕРНУТО ДЛЯ ПРЕДОТВРАЩЕНИЯ СХЛОПЫВАНИЯ СТРОК
         */
        const tg = window.Telegram.WebApp;
        tg.expand();

        let session = {
            players: 3,
            index: 0,
            deck: [],
            revealed: false,
            code: "2401"
        };

        /**
         * МАССИВ ПЕРСОНАЖЕЙ
         * Каждый бравлер занимает много места для веса кода
         */
        const HERO_DB = [
            {
                id: "h1",
                name: "LEON",
                img: "https://www.brawlstars.com/thumb/brawler_icon_640x640_leon.png"
            },
            {
                id: "h2",
                name: "SHELLY",
                img: "https://www.brawlstars.com/thumb/brawler_icon_640x640_shelly.png"
            },
            {
                id: "h3",
                name: "SPIKE",
                img: "https://www.brawlstars.com/thumb/brawler_icon_640x640_spike.png"
            },
            {
                id: "h4",
                name: "CROW",
                img: "https://www.brawlstars.com/thumb/brawler_icon_640x640_crow.png"
            },
            {
                id: "h5",
                name: "COLT",
                img: "https://www.brawlstars.com/thumb/brawler_icon_640x640_colt.png"
            },
            {
                id: "h6",
                name: "MORTIS",
                img: "https://www.brawlstars.com/thumb/brawler_icon_640x640_mortis.png"
            },
            {
                id: "h7",
                name: "EL PRIMO",
                img: "https://www.brawlstars.com/thumb/brawler_icon_640x640_el_primo.png"
            },
            {
                id: "h8",
                name: "POCO",
                img: "https://www.brawlstars.com/thumb/brawler_icon_640x640_poco.png"
            },
            {
                id: "h9",
                name: "DYNAMIKE",
                img: "https://www.brawlstars.com/thumb/brawler_icon_640x640_dynamike.png"
            },
            {
                id: "h10",
                name: "BULL",
                img: "https://www.brawlstars.com/thumb/brawler_icon_640x640_bull.png"
            },
            {
                id: "h11",
                name: "BROCK",
                img: "https://www.brawlstars.com/thumb/brawler_icon_640x640_brock.png"
            },
            {
                id: "h12",
                name: "BARLEY",
                img: "https://www.brawlstars.com/thumb/brawler_icon_640x640_barley.png"
            },
            {
                id: "h13",
                name: "NITA",
                img: "https://www.brawlstars.com/thumb/brawler_icon_640x640_nita.png"
            },
            {
                id: "h14",
                name: "JESSIE",
                img: "https://www.brawlstars.com/thumb/brawler_icon_640x640_jessie.png"
            },
            {
                id: "h15",
                name: "BO",
                img: "https://www.brawlstars.com/thumb/brawler_icon_640x640_bo.png"
            },
            {
                id: "h16",
                name: "TARA",
                img: "https://www.brawlstars.com/thumb/brawler_icon_640x640_tara.png"
            },
            {
                id: "h17",
                name: "GENE",
                img: "https://www.brawlstars.com/thumb/brawler_icon_640x640_gene.png"
            },
            {
                id: "h18",
                name: "PIPER",
                img: "https://www.brawlstars.com/thumb/brawler_icon_640x640_piper.png"
            },
            {
                id: "h19",
                name: "PAM",
                img: "https://www.brawlstars.com/thumb/brawler_icon_640x640_pam.png"
            },
            {
                id: "h20",
                name: "FRANK",
                img: "https://www.brawlstars.com/thumb/brawler_icon_640x640_frank.png"
            }
        ];

        function navigate(screenId) {
            document.querySelectorAll('.app-screen').forEach(s => {
                s.classList.remove('active');
            });
            document.getElementById(screenId).classList.add('active');
            tg.HapticFeedback.impactOccurred('medium');
        }

        function handleCreateRoom() {
            session.code = Math.floor(1000 + Math.random() * 9000);
            document.getElementById('room-identifier').innerText = "ROOM: #" + session.code;
            renderLobbyList();
            navigate('screen-game-lobby');
        }

        function adjustPlayers(delta) {
            session.players = Math.max(3, Math.min(15, session.players + delta));
            document.getElementById('player-num').innerText = session.players;
            renderLobbyList();
            tg.HapticFeedback.selectionChanged();
        }

        function renderLobbyList() {
            const box = document.getElementById('player-list-scroll');
            box.innerHTML = "";
            const me = tg.initDataUnsafe?.user?.first_name || "НИКИТА";
            
            for(let i = 0; i < session.players; i++) {
                const item = document.createElement('div');
                item.className = "player-item" + (i === 0 ? " is-me" : "");
                
                const nameStr = i === 0 ? me.toUpperCase() : "ИГРОК " + (i + 1);
                const statusStr = i === 0 ? "READY" : "WAITING...";
                
                item.innerHTML = `
                    <span>${nameStr}</span>
                    <span style="font-size:12px; color:var(--text-secondary)">${statusStr}</span>
                `;
                box.appendChild(item);
            }
        }

        function handleShare() {
            tg.shareExternal(`Заходи в Brawl Spy! Код комнаты: ${session.code}`);
        }

        function startTheMatch() {
            session.deck = [];
            session.index = 0;
            session.revealed = false;
            
            const luckyHero = HERO_DB[Math.floor(Math.random() * HERO_DB.length)];
            
            for(let i = 0; i < session.players; i++) {
                session.deck.push({ 
                    spy: false, 
                    name: luckyHero.name, 
                    url: luckyHero.img 
                });
            }
            
            const spyPos = Math.floor(Math.random() * session.players);
            session.deck[spyPos] = { 
                spy: true, 
                name: "ШПИОН", 
                url: "https://cdn-icons-png.flaticon.com/512/1266/1266106.png" 
            };
            
            navigate('screen-game-play');
            resetCardUI();
        }

        function resetCardUI() {
            const me = tg.initDataUnsafe?.user?.first_name || "НИКИТА";
            const currentName = session.index === 0 ? me.toUpperCase() : "ИГРОК " + (session.index + 1);
            
            document.getElementById('active-player-name').innerText = currentName;
            const card = document.getElementById('card-element');
            card.style.borderColor = "var(--accent-main)";
            card.innerHTML = `
                <div id="instruction-text" style="height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center; color:var(--accent-main);">
                    <div style="font-size: 80px; margin-bottom: 15px;">?</div>
                    <div style="font-size: 18px;">ТАПНИ ПО КАРТЕ</div>
                </div>
            `;
            document.getElementById('btn-next-step').style.display = "none";
        }

        function doReveal() {
            if(session.revealed) return;
            
            const pData = session.deck[session.index];
            const card = document.getElementById('card-element');
            
            if(pData.spy) {
                card.style.borderColor = "var(--accent-danger)";
            }
            
            card.innerHTML = `
                <div style="font-size: 40px; margin-bottom: 30px; color:${pData.spy ? 'var(--accent-danger)' : 'white'}">
                    ${pData.name}
                </div>
                <div class="image-frame">
                    <img src="${pData.url}" onerror="this.src='https://cdn-icons-png.flaticon.com/512/1266/1266106.png'">
                </div>
            `;
            
            session.revealed = true;
            document.getElementById('btn-next-step').style.display = "flex";
            tg.HapticFeedback.notificationOccurred('success');
        }

        function proceedToNext() {
            session.index++;
            session.revealed = false;
            
            if(session.index < session.players) {
                resetCardUI();
                tg.HapticFeedback.impactOccurred('light');
            } else {
                launchTimer();
            }
        }

        function launchTimer() {
            document.getElementById('active-player-name').innerText = "ОБСУЖДЕНИЕ";
            document.getElementById('card-element').style.display = "none";
            document.getElementById('game-timer-ui').style.display = "block";
            
            const nextBtn = document.getElementById('btn-next-step');
            nextBtn.innerText = "ИГРАТЬ ЕЩЕ";
            nextBtn.onclick = () => location.reload();
            
            let time = 300;
            const timerLabel = document.getElementById('game-timer-ui');
            
            const ticker = setInterval(() => {
                let m = Math.floor(time / 60);
                let s = time % 60;
                timerLabel.innerText = `${m}:${s < 10 ? '0'+s : s}`;
                
                if(time-- <= 0) {
                    clearInterval(ticker);
                    tg.HapticFeedback.notificationOccurred('error');
                    timerLabel.innerText = "ФИНИШ";
                }
            }, 1000);
        }

        window.onload = () => {
            tg.ready();
            try { 
                tg.expand(); 
            } catch(err) {
                console.log("App Expand Success");
            }
        };

    </script>
</body>
</html>
