<!DOCTYPE html>
<html lang="ru">
<head>

    <title>Brawl Spy Dark</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Rubik+One&display=swap" rel="stylesheet">
    <style>
        /* БАЗОВЫЕ НАСТРОЙКИ */
        * { 
            box-sizing: border-box; 
            -webkit-tap-highlight-color: transparent; 
            margin: 0; 
            padding: 0; 
        }
        
        body {
            /* Твой цвет фона */
            background-color: #0A0A0F;
            color: white;
            font-family: 'Rubik One', sans-serif;
            height: 100vh;
            width: 100vw;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow: hidden;
        }

        /* ГЛАВНЫЙ КОНТЕЙНЕР */
        .app-container {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-around; /* Распределяем элементы, чтобы не было пустоты */
            align-items: center;
            padding: 40px 25px;
        }

        /* ЭКРАНЫ */
        .screen {
            display: none;
            width: 100%;
            height: 100%;
            flex-direction: column;
            align-items: center;
            justify-content: space-around;
            animation: fadeIn 0.3s ease-in-out;
        }

        .active { 
            display: flex; 
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* ЗАГОЛОВКИ */
        h1 {
            font-size: 46px;
            text-transform: uppercase;
            text-align: center;
            color: #FFFFFF;
            /* Минимальное фиолетовое свечение */
            text-shadow: 
                0 0 8px rgba(114, 9, 183, 0.4),
                3px 3px 0px #000;
        }

        .menu-title {
            font-size: 56px;
        }

            flex-direction: column;
            align-items: center;
            gap: 12px;
            margin-top: 10px;
        }
