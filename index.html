<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>BRAWL SPY ULTIMATE 2026</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Black+Ops+One&display=swap" rel="stylesheet">
    
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>
        /* --- ГЛОБАЛЬНЫЕ ПЕРЕМЕННЫЕ --- */
        :root {
            --neon-blue: #00d2ff;
            --neon-red: #ff3131;
            --neon-gold: #ffd700;
            --neon-green: #00ff00;
            --white: #ffffff;
            --bg-dark: #010103;
            --font-main: 'Black Ops One', cursive;
        }

        /* --- СИСТЕМА ОБНУЛЕНИЯ --- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            -webkit-user-select: none;
            user-select: none;
            outline: none;
            font-family: var(--font-main);
        }

        /* --- БАЗОВАЯ ГЕОМЕТРИЯ (ИДЕАЛЬНЫЙ ЦЕНТР) --- */
        body {
            background-color: var(--bg-dark);
            color: var(--white);
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        /* ГЛАВНЫЙ СИЛОВОЙ КАРКАС */
        .app-shell {
            width: 100%;
            height: 100%;
            max-width: 420px; /* Жесткий лимит чтобы не выпирало */
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            padding: 25px;
            z-index: 10;
        }

        /* --- EDITION 2026 (БЕЛЫЙ НЕОН) --- */
        .edition-badge {
            position: absolute;
            top: 35px;
            right: 25px;
            font-size: 16px;
            color: var(--white);
            text-shadow: 
                0 0 10px var(--white),
                0 0 20px rgba(255,255,255,0.4);
            z-index: 1000;
            letter-spacing: 1px;
            pointer-events: none;
        }

        /* --- НИЖНИЙ ЛОГОТИП (BRAWL STARS) --- */
        .bottom-brand {
            position: absolute;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 28px;
            color: var(--neon-gold);
            text-shadow: 0 0 15px var(--neon-gold);
            letter-spacing: 3px;
            white-space: nowrap;
            z-index: 5;
        }

        /* --- ЭКРАНЫ --- */
        .screen {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px;
            background: var(--bg-dark);
            z-index: 20;
        }

        .screen.active {
            display: flex;
            animation: fadeInCustom 0.3s ease-out;
        }

        @keyframes fadeInCustom {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }

        /* --- ГЛАВНЫЙ ЗАГОЛОВОК (ШПИОН) --- */
        .main-hero-title {
            font-size: 85px;
            color: var(--neon-red);
            text-shadow: 
                0 0 20px var(--neon-red),
                0 0 40px rgba(255, 49, 49, 0.3);
            margin-bottom: 50px;
            text-align: center;
            line-height: 1;
        }

        /* --- СИСТЕМА КНОПОК --- */
        .btn-stack {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 22px;
        }

        .btn-core {
            width: 100%;
            padding: 24px 0;
            background: rgba(0, 0, 0, 0.8);
            border: 4px solid var(--neon-blue);
            box-shadow: 0 0 15px var(--neon-blue);
            border-radius: 20px;
            color: var(--white);
            font-size: 22px;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            justify-content: center;
            align-items: center;
            letter-spacing: 1px;
        }

        .btn-core:active {
            transform: scale(0.96);
            box-shadow: 0 0 25px var(--neon-blue);
        }

        .btn-secondary {
            border-color: #333333;
            color: #666666;
            box-shadow: none;
            margin-top: 10px;
        }

        /* --- НАСТРОЙКИ ЛОББИ --- */
        .view-title {
            font-size: 28px;
            color: var(--white);
            text-shadow: 0 0 10px var(--white);
            margin-bottom: 40px;
            text-transform: uppercase;
            text-align: center;
        }

        .tab-group {
            display: flex;
            width: 100%;
            gap: 12px;
            margin-bottom: 35px;
        }

        .tab-node {
            flex: 1;
            padding: 16px 0;
            border-radius: 12px;
            border: 2px solid;
            background: #000;
            font-size: 14px;
            text-align: center;
            text-transform: uppercase;
        }

        .tab-node-blue {
            border-color: var(--neon-blue);
            color: var(--neon-blue);
            text-shadow: 0 0 8px var(--neon-blue);
        }

        .tab-node-red {
            border-color: var(--neon-red);
            color: var(--neon-red);
            text-shadow: 0 0 8px var(--neon-red);
        }

        /* КНОПКА №6: СОЗДАТЬ КОМНАТУ (БЕЛЫЙ ТЕКСТ + ЗОЛОТО) */
        .btn-create-gold {
            border-color: var(--neon-gold);
            box-shadow: 0 0 20px var(--neon-gold);
            color: var(--white) !important;
            margin-top: 20px;
        }

        /* --- ВВОД ID (БЕЛЫЙ НЕОН) --- */
        .id-input-container {
            display: flex;
            gap: 12px;
            margin: 40px 0;
        }

        .id-cell {
            font-size: 45px;
            width: 35px;
            border-bottom: 4px solid var(--white);
            color: var(--white);
            text-shadow: 0 0 15px var(--white);
            text-align: center;
        }

        /* --- СПИСОК ИГРОКОВ --- */
        .player-card {
            width: 100%;
            background: #0a0a0f;
            border: 1px solid #1a1a25;
            padding: 18px;
            border-radius: 15px;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* МЕДИА-ЗАПРОСЫ ДЛЯ СТАБИЛЬНОСТИ ЦЕНТРА */
        @media (max-height: 700px) {
            .main-hero-title { font-size: 60px; margin-bottom: 30px; }
            .bottom-brand { bottom: 20px; font-size: 20px; }
            .btn-core { padding: 18px 0; font-size: 18px; }
        }

    </style>
</head>
<body>

    <div class="edition-badge">EDITION 2026</div>

    <div class="bottom-brand">BRAWL STARS</div>

    <div class="app-shell">
        
        <div id="scr-menu" class="screen active">
            <h1 class="main-hero-title">ШПИОН</h1>
            
            <div class="btn-stack">
                <button class="btn-core" onclick="App.nav('scr-setup')">СОЗДАТЬ ЛОББИ</button>
                <button class="btn-core" onclick="App.nav('scr-join')">ВХОД ПО ID</button>
                <button class="btn-core btn-secondary" onclick="tg.close()">ВЫХОД</button>
            </div>
        </div>

        <div id="scr-setup" class="screen">
            <h2 class="view-title">НАСТРОЙКА ЛОББИ</h2>
            
            <div class="tab-group">
                <div class="tab-node tab-node-blue">УЧАСТНИКИ</div>
                <div class="tab-node tab-node-red">ШПИОН</div>
            </div>

            <div id="lobby-id-display" style="color:var(--neon-gold); font-size: 22px; margin-bottom: 30px;">ID: ....-....</div>

            <div class="btn-stack">
                <button class="btn-core btn-create-gold" onclick="App.create()">СОЗДАТЬ КОМНАТУ</button>
                <button class="btn-core btn-secondary" onclick="App.nav('scr-menu')">НАЗАД</button>
            </div>
        </div>

        <div id="scr-join" class="screen">
            <h2 class="view-title">ID КОМНАТЫ</h2>
            
            <div class="id-input-container">
                <div class="id-cell" id="d1">_</div><div class="id-cell" id="d2">_</div><div class="id-cell" id="d3">_</div><div class="id-cell" id="d4">_</div>
                <div style="font-size: 30px;">-</div>
                <div class="id-cell" id="d5">_</div><div class="id-cell" id="d6">_</div><div class="id-cell" id="d7">_</div><div class="id-cell" id="d8">_</div>
            </div>

            <div class="btn-stack">
                <button class="btn-core btn-secondary" onclick="App.nav('scr-menu')">ОТМЕНА</button>
            </div>
        </div>

        <div id="scr-room" class="screen">
            <h2 class="view-title">ЛОББИ БИТВЫ</h2>
            <div id="room-id-label" style="color:var(--neon-gold); margin-bottom: 20px;">ID: ....-....</div>
            
            <div id="player-container" style="width:100%; flex:1; overflow-y:auto;">
                </div>
            
            <div class="btn-stack" style="margin-top: 20px;">
                <button class="btn-core" style="border-color:var(--neon-green)" onclick="App.toggleReady()">ГОТОВ</button>
                <button class="btn-core btn-secondary" onclick="location.reload()">ВЫЙТИ</button>
            </div>
        </div>

    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        const App = {
            currentRoom: "",
            
            nav: function(screenId) {
                document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
                document.getElementById(screenId).classList.add('active');
                
                if(screenId === 'scr-setup') {
                    const r1 = Math.floor(1000 + Math.random() * 8999);
                    const r2 = Math.floor(1000 + Math.random() * 8999);
                    App.currentRoom = r1 + "-" + r2;
                    document.getElementById('lobby-id-display').innerText = "ID: " + App.currentRoom;
                }
            },

            create: function() {
                App.nav('scr-room');
                document.getElementById('room-id-label').innerText = "ID: " + App.currentRoom;
                tg.HapticFeedback.notificationOccurred('success');
            },

            toggleReady: function() {
                tg.HapticFeedback.impactOccurred('medium');
            }
        };

        // Инициализация при загрузке
        window.onload = () => {
            console.log("App Ready");
        };
    </script>
</body>
</html>
