<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>BRAWL SPY | ULTIMATE FIXED</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Black+Ops+One&family=Rubik+One&family=Exo+2:wght@900&display=swap" rel="stylesheet">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    
    <style>
        :root {
            --neon-blue: #00d2ff;
            --neon-red: #ff3131;
            --neon-gold: #ffd700;
            --bg-black: #020205;
            --glow-white: rgba(255, 255, 255, 0.85);
            --btn-dark: #0d0d14;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-user-select: none; outline: none; }
        html, body { 
            width: 100%; height: 100%; background: var(--bg-black); color: #fff; 
            font-family: 'Rubik One', sans-serif; overflow: hidden; 
            display: flex; align-items: center; justify-content: center; 
        }

        /* Оболочка теперь имеет min-height для правильного расположения на ПК */
        .app-shell { 
            width: 100%; height: 100%; max-width: 450px; 
            display: flex; flex-direction: column; position: relative;
            justify-content: space-between; /* Распределяем элементы */
        }

        .screen { 
            position: absolute; inset: 0; display: none; flex-direction: column; 
            align-items: center; padding: 20px 25px; z-index: 10; background: var(--bg-black);
        }
        .screen.active { display: flex; animation: fadeIn 0.2s ease; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        /* ГЛАВНОЕ МЕНЮ (image_a24334.png) */
        .logo-box { text-align: center; margin: 40px 0; }
        .spy-logo { font-size: 90px; color: var(--neon-red); text-shadow: 0 0 30px var(--neon-red); line-height: 0.8; }
        .bs-sub { font-family: 'Black Ops One'; font-size: 32px; color: var(--neon-gold); margin-top: 10px; }
        .ed-tag { font-family: 'Exo 2'; font-size: 16px; color: #fff; opacity: 0.9; margin-top: 5px; font-weight: 400; }

        .btn-main {
            width: 100%; padding: 20px; background: #000; border: 4px solid var(--neon-blue);
            box-shadow: 0 0 18px var(--neon-blue); border-radius: 28px; color: #fff;
            font-family: 'Exo 2'; font-weight: 900; font-size: 20px; text-transform: uppercase;
            margin-bottom: 18px; transition: 0.1s; cursor: pointer; display: flex; align-items: center; justify-content: center;
        }
        .btn-main:active { transform: scale(0.96); }
        .btn-exit { border-color: #222; box-shadow: none; color: #555; background: #080808; border-radius: 35px; }

        /* ВХОД ПО ID (image_a24b88.png + FIX PC) */
        .title-id { 
            font-family: 'Exo 2'; font-size: 32px; color: #fff; 
            text-shadow: 0 0 15px var(--glow-white); margin: 15px 0 25px; text-transform: uppercase; 
        }
        
        /* Черточки строго в одну линию по ТЗ */
        .id-row { 
            display: flex; justify-content: center; width: 100%; margin-bottom: 30px; 
        }
        .id-display { 
            font-family: 'Black Ops One'; font-size: 42px; color: #fff; 
            text-shadow: 0 0 20px var(--glow-white); letter-spacing: 5px; white-space: nowrap;
        }

        .numpad { 
            display: grid; grid-template-columns: repeat(3, 1fr); 
            gap: 15px; margin-bottom: 20px; 
        }
        .n-btn { 
            width: 72px; height: 72px; background: #0d0d14; border: 2px solid #222; 
            border-radius: 18px; font-size: 26px; color: #fff; font-family: 'Black Ops One'; 
        }
        .n-btn:active { background: #1a1a25; }

        /* ЛОББИ */
        .lobby-card {
            width: 100%; background: #0a0a10; border: 3px solid var(--neon-blue);
            box-shadow: 0 0 15px var(--neon-blue); border-radius: 25px; padding: 18px 22px;
            display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;
        }
        .card-red { border-color: var(--neon-red); box-shadow: 0 0 15px var(--neon-red); }
        .adj-btn {
            width: 50px; height: 50px; background: #000; border: 2px solid var(--neon-blue);
            border-radius: 14px; color: var(--neon-blue); font-size: 28px;
            display: flex; align-items: center; justify-content: center;
        }
        .card-red .adj-btn { border-color: var(--neon-red); color: var(--neon-red); }

        /* ФУТЕР ДЛЯ ФИКСА КНОПКИ НАЗАД */
        .footer-fixed {
            width: 100%; padding-top: 10px; margin-top: auto;
        }
    </style>
</head>
<body>

    <div class="app-shell">
        
        <div id="scr-menu" class="screen active">
            <div class="logo-box">
                <div class="spy-logo">SPY</div>
                <div class="bs-sub">BRAWL STARS</div>
                <div class="ed-tag">edition</div>
            </div>
            <button class="btn-main" onclick="App.initLobby(true)">Создать лобби</button>
            <button class="btn-main" onclick="App.nav('scr-join')">Вход по ID</button>
            <div class="footer-fixed">
                <button class="btn-main btn-exit" onclick="tg.close()">Выход</button>
            </div>
        </div>

        <div id="scr-join" class="screen">
            <h2 class="title-id">ID ЛОББИ</h2>
            <div class="id-row">
                <div id="id-display" class="id-display">____-____</div>
            </div>
            <div class="numpad">
                <button class="n-btn" onclick="App.press('1')">1</button>
                <button class="n-btn" onclick="App.press('2')">2</button>
                <button class="n-btn" onclick="App.press('3')">3</button>
                <button class="n-btn" onclick="App.press('4')">4</button>
                <button class="n-btn" onclick="App.press('5')">5</button>
                <button class="n-btn" onclick="App.press('6')">6</button>
                <button class="n-btn" onclick="App.press('7')">7</button>
                <button class="n-btn" onclick="App.press('8')">8</button>
                <button class="n-btn" onclick="App.press('9')">9</button>
                <button class="n-btn" style="color:var(--neon-red)" onclick="App.press('C')">C</button>
                <button class="n-btn" onclick="App.press('0')">0</button>
                <button class="n-btn" style="color:var(--neon-gold)" onclick="App.initLobby(false)">OK</button>
            </div>
            <div class="footer-fixed">
                <button class="btn-main btn-exit" style="color:#fff; border-color:#333; margin-bottom: 0;" onclick="App.nav('scr-menu')">НАЗАД</button>
            </div>
        </div>

        <div id="scr-lobby" class="screen">
            <h2 class="title-id" id="lobby-title-text">НАСТРОЙКА ЛОББИ</h2>
            <div style="color:var(--neon-gold); font-family:'Black Ops One'; margin-bottom:20px; font-size:20px;">
                ID: <span id="lobby-id-val">0000-0000</span>
            </div>

            <div id="admin-view" style="width:100%; display:none;">
                <div class="lobby-card">
                    <span style="font-family:'Exo 2'; font-weight:900;">УЧАСТНИКИ</span>
                    <div style="display:flex; align-items:center; gap:15px;">
                        <button class="adj-btn" onclick="App.adj('p', -1)">-</button>
                        <span id="p-v" style="font-family:'Black Ops One'; font-size:32px;">3</span>
                        <button class="adj-btn" onclick="App.adj('p', 1)">+</button>
                    </div>
                </div>
                <div class="lobby-card card-red">
                    <span style="font-family:'Exo 2'; font-weight:900;">ШПИОН</span>
                    <div style="display:flex; align-items:center; gap:15px;">
                        <button class="adj-btn" onclick="App.adj('s', -1)">-</button>
                        <span id="s-v" style="font-family:'Black Ops One'; font-size:32px;">1</span>
                        <button class="adj-btn" onclick="App.adj('s', 1)">+</button>
                    </div>
                </div>
                <button class="btn-main" style="border-color:var(--neon-gold); color:var(--neon-gold);">НАЧАТЬ ИГРУ</button>
            </div>

            <div id="player-view" style="width:100%; display:none; text-align:center;">
                <div class="lobby-card" style="justify-content:center; border-color:#222; box-shadow:none;">
                    <span style="color:#666; font-family:'Exo 2';">ОЖИДАНИЕ АДМИНА...</span>
                </div>
                <button class="btn-main" id="ready-btn" style="border-color:#00ff00; color:#00ff00; box-shadow:0 0 15px #00ff00;" onclick="App.toggleReady()">ГОТОВ</button>
            </div>

            <div class="footer-fixed">
                <button class="btn-main btn-exit" style="color:#fff; margin-bottom: 0;" onclick="App.nav('scr-menu')">МЕНЮ</button>
            </div>
        </div>

    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        const App = {
            state: { id: "", p: 3, s: 1, isAdmin: false, isReady: false },
            
            nav: id => {
                document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
                document.getElementById(id).classList.add('active');
            },

            press: v => {
                if(v==='C') App.state.id = "";
                else if(App.state.id.length < 8) App.state.id += v;
                let s = App.state.id.padEnd(8, "_");
                document.getElementById('id-display').innerText = s.slice(0,4) + "-" + s.slice(4,8);
            },

            initLobby: (asAdmin) => {
                App.state.isAdmin = asAdmin;
                if(asAdmin) {
                    App.state.id = Math.floor(10000000 + Math.random() * 90000000).toString();
                } else {
                    if(App.state.id.length < 8) return;
                }
                
                document.getElementById('lobby-id-val').innerText = App.state.id.slice(0,4) + "-" + App.state.id.slice(4,8);
                document.getElementById('admin-view').style.display = asAdmin ? 'block' : 'none';
                document.getElementById('player-view').style.display = asAdmin ? 'none' : 'block';
                document.getElementById('lobby-title-text').innerText = asAdmin ? "НАСТРОЙКА ЛОББИ" : "ЛОББИ";
                
                App.nav('scr-lobby');
            },

            adj: (t, v) => {
                if(t==='p') App.state.p = Math.max(2, App.state.p + v);
                else App.state.s = Math.max(1, App.state.s + v);
                document.getElementById('p-v').innerText = App.state.p;
                document.getElementById('s-v').innerText = App.state.s;
            },

            toggleReady: () => {
                App.state.isReady = !App.state.isReady;
                const btn = document.getElementById('ready-btn');
                btn.innerText = App.state.isReady ? "ГОТОВ!" : "ГОТОВ";
                btn.style.opacity = App.state.isReady ? "0.6" : "1";
            }
        };
    </script>
</body>
</html>
