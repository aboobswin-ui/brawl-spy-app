<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>BRAWL SPY | ULTIMATE MONOLITH</title>
    
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Black+Ops+One&family=Rubik+One&family=Exo+2:wght@900&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --neon-blue: #00d2ff;
            --neon-red: #ff3131;
            --neon-gold: #ffd700;
            --bg-black: #020205;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-user-select: none; }

        html, body {
            width: 100%; height: 100%;
            background-color: var(--bg-black);
            color: #fff;
            font-family: 'Rubik One', sans-serif;
            overflow: hidden;
            display: grid;
            place-items: center;
        }

        .app-shell {
            width: 100%; height: 100%;
            max-width: 450px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
        }

        .screen {
            position: absolute;
            inset: 0;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background: var(--bg-black);
            z-index: 10;
        }

        .screen.active { display: flex; animation: fadeIn 0.3s ease; }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        /* [1. ГЛАВНОЕ МЕНЮ ПО ТЗ] */
        .title-main {
            font-size: clamp(70px, 18vw, 95px);
            color: var(--neon-red);
            text-shadow: 0 0 30px var(--neon-red);
            margin-bottom: 50px;
        }

        /* [2. НАСТРОЙКА ЛОББИ ПО ТЗ] */
        .title-white-glow {
            font-family: 'Exo 2';
            font-size: 28px;
            font-weight: 900;
            text-transform: uppercase;
            color: #fff;
            text-shadow: 0 0 15px rgba(255, 255, 255, 0.8);
            margin-bottom: 30px;
            text-align: center;
        }

        .lobby-card {
            width: 100%;
            background: rgba(13, 13, 20, 0.9);
            border: 3px solid var(--neon-blue);
            box-shadow: 0 0 20px var(--neon-blue); /* НЕОН ГОЛУБОЙ */
            border-radius: 25px;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }

        .lobby-card.spy-card {
            border-color: var(--neon-red);
            box-shadow: 0 0 20px var(--neon-red); /* НЕОН КРАСНЫЙ */
        }

        .label-text {
            font-family: 'Exo 2';
            font-size: 18px;
            font-weight: 900;
            letter-spacing: 1px;
            padding-right: 20px; /* Отступ от двоеточия */
        }

        .stepper { display: flex; align-items: center; gap: 15px; }

        .s-btn {
            width: 50px; height: 50px;
            background: #000;
            border: 3px solid var(--neon-blue);
            border-radius: 12px;
            color: var(--neon-blue);
            font-size: 28px;
            display: flex; align-items: center; justify-content: center;
            transition: 0.1s;
        }

        .spy-card .s-btn { border-color: var(--neon-red); color: var(--neon-red); }
        .s-val { font-family: 'Black Ops One'; font-size: 32px; min-width: 40px; text-align: center; }

        /* [3. КНОПКИ] */
        .btn-bs {
            width: 100%;
            padding: 22px;
            background: #000;
            border: 5px solid var(--neon-blue);
            border-radius: 22px;
            color: #fff;
            font-family: 'Exo 2';
            font-weight: 900;
            font-size: 22px;
            text-transform: uppercase;
            margin-bottom: 15px;
            cursor: pointer;
        }

        .btn-neon-gold { 
            border-color: var(--neon-gold); 
            color: var(--neon-gold);
            box-shadow: 0 0 20px var(--neon-gold); /* НЕОН ЖЕЛТЫЙ */
        }

        .btn-gray { border-color: #444; color: #666; }

        /* [4. ВХОД ПО ID] */
        .id-display {
            font-family: 'Black Ops One';
            font-size: 42px;
            color: var(--neon-blue);
            margin-bottom: 30px;
            letter-spacing: 4px;
        }

        .numpad {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-bottom: 30px;
        }

        /* [5. ИГРА] */
        .card-wrap { width: 300px; height: 420px; perspective: 1000px; margin-bottom: 30px; }
        .card-inner { width: 100%; height: 100%; position: relative; transition: transform 0.6s; transform-style: preserve-3d; }
        .card-inner.is-flipped { transform: rotateY(180deg); }
        .face {
            position: absolute; inset: 0; backface-visibility: hidden;
            border-radius: 35px; border: 10px solid var(--neon-blue);
            background: #0d0d14; display: flex; flex-direction: column; align-items: center; justify-content: center;
        }
        .face-back { transform: rotateY(180deg); background: #fff; color: #000; border-color: var(--neon-red); padding: 20px; text-align: center; }
        .b-img { width: 220px; height: 220px; object-fit: contain; margin: 20px 0; }
        
        .timer-txt { font-family: 'Black Ops One'; font-size: 90px; color: var(--neon-red); text-shadow: 0 0 25px var(--neon-red); }

    </style>
</head>
<body>

    <div class="app-shell">
        
        <div id="scr-menu" class="screen active">
            <h1 class="title-main">SPY</h1>
            <button class="btn-bs" onclick="App.createLobby()">Создать лобби</button>
            <button class="btn-bs" onclick="App.nav('scr-join')">Вход по ID</button>
        </div>

        <div id="scr-join" class="screen">
            <h2 class="title-white-glow">ID комнаты</h2>
            <div id="id-input" class="id-display">____-____</div>
            <div class="numpad">
                <button class="s-btn" onclick="App.press('1')">1</button>
                <button class="s-btn" onclick="App.press('2')">2</button>
                <button class="s-btn" onclick="App.press('3')">3</button>
                <button class="s-btn" onclick="App.press('4')">4</button>
                <button class="s-btn" onclick="App.press('5')">5</button>
                <button class="s-btn" onclick="App.press('6')">6</button>
                <button class="s-btn" onclick="App.press('7')">7</button>
                <button class="s-btn" onclick="App.press('8')">8</button>
                <button class="s-btn" onclick="App.press('9')">9</button>
                <button class="s-btn" style="border-color:var(--neon-red); color:var(--neon-red);" onclick="App.press('C')">C</button>
                <button class="s-btn" onclick="App.press('0')">0</button>
                <button class="s-btn" style="border-color:var(--neon-gold); color:var(--neon-gold);" onclick="App.nav('scr-menu')">OK</button>
            </div>
            <button class="btn-bs btn-gray" onclick="App.nav('scr-menu')">Назад</button>
        </div>

        <div id="scr-lobby" class="screen">
            <h2 class="title-white-glow">Настройка лобби</h2>
            <div id="lobby-id-view" style="color:var(--neon-gold); font-family:'Black Ops One'; margin-bottom:20px; font-size:20px;">ID: 4455-9900</div>

            <div class="lobby-card">
                <span class="label-text">УЧАСТНИКИ:</span>
                <div class="stepper">
                    <button class="s-btn" onclick="App.adj('p', -1)">-</button>
                    <span id="p-val" class="s-val">3</span>
                    <button class="s-btn" onclick="App.adj('p', 1)">+</button>
                </div>
            </div>

            <div class="lobby-card spy-card">
                <span class="label-text">ШПИОН:</span>
                <div class="stepper">
                    <button class="s-btn" onclick="App.adj('s', -1)">-</button>
                    <span id="s-val" class="s-val">1</span>
                    <button class="s-btn" onclick="App.adj('s', 1)">+</button>
                </div>
            </div>

            <button class="btn-bs btn-neon-gold" onclick="App.startGame()">Начать игру</button>
            <button class="btn-bs" style="border-color:#444;" onclick="App.nav('scr-menu')">Меню</button>
        </div>

        <div id="scr-game" class="screen">
            <h2 id="p-label" class="title-white-glow">Игрок 1</h2>
            <div class="card-wrap" onclick="App.flip()">
                <div id="card-node" class="card-inner">
                    <div class="face"><span style="font-size: 100px; color: var(--neon-blue);">?</span></div>
                    <div id="card-content" class="face face-back"></div>
                </div>
            </div>
            <button id="btn-next" class="btn-bs" style="visibility: hidden;" onclick="App.next()">Следующий</button>
        </div>

        <div id="scr-timer" class="screen">
            <h2 class="title-white-glow">Обсуждение</h2>
            <div id="timer-val" class="timer-huge timer-txt">10:00</div>
            <button class="btn-bs btn-neon-gold" style="margin-top:40px;" onclick="App.nav('scr-lobby')">Новая битва</button>
        </div>

    </div>

                {n:"MOE", i:"https://vignette.wikia.nocookie.net/brawlstars/images/a/a0/Moe_Portrait.png"},
                {n:"KENJI", i:"https://vignette.wikia.nocookie.net/brawlstars/images/1/1a/Kenji_Portrait.png"}

            state: { p: 3, s: 1, roles: [], cur: 0, flipped: false, id: "" },

            nav: function(id) {
                document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
                document.getElementById(id).classList.add('active');
            },

            createLobby: function() {
                const rid = Math.floor(10000000 + Math.random() * 90000000).toString();
                document.getElementById('lobby-id-view').innerText = "ID: " + rid.slice(0,4) + "-" + rid.slice(4,8);
                this.nav('scr-lobby');
            },

            adj: function(t, v) {
                if(t === 'p') this.state.p = Math.max(2, this.state.p + v);
                else this.state.s = Math.max(1, this.state.s + v); // Без ограничений по ТЗ
                document.getElementById('p-val').innerText = this.state.p;
                document.getElementById('s-val').innerText = this.state.s;
            },

            press: function(v) {
                if(v === 'C') this.state.id = "";
                else if(this.state.id.length < 8) this.state.id += v;
                let s = this.state.id;
                while(s.length < 8) s += "_";
                document.getElementById('id-input').innerText = s.slice(0,4) + "-" + s.slice(4,8);
            },

            startGame: function() {
                this.state.cur = 0;
                this.state.flipped = false;
                const brawler = this.db[Math.floor(Math.random() * this.db.length)];
                let roles = [];
                for(let i=0; i<this.state.s; i++) roles.push({n: "ШПИОН", i: "https://cdn-icons-png.flaticon.com/512/953/953791.png"});
                for(let i=0; i<(this.state.p - this.state.s); i++) roles.push(brawler);
                this.state.roles = roles.sort(() => Math.random() - 0.5);
                this.nav('scr-game');
                this.updateUI();
            },

            flip: function() {
                if(this.state.flipped) return;
                const r = this.state.roles[this.state.cur];
                document.getElementById('card-content').innerHTML = `
                    <h3 style="font-size:32px; font-family:'Exo 2';">${r.n}</h3>
                    <img src="${r.i}" class="b-img">
                    <p style="color:red; font-weight:bold;">НЕ ПОКАЗЫВАЙ!</p>
                `;
                document.getElementById('card-node').classList.add('is-flipped');
                document.getElementById('btn-next').style.visibility = 'visible';
                this.state.flipped = true;
            },

            next: function() {
                this.state.cur++;
                if(this.state.cur < this.state.p) {
                    this.state.flipped = false;
                    document.getElementById('card-node').classList.remove('is-flipped');
                    document.getElementById('btn-next').style.visibility = 'hidden';
                    setTimeout(() => this.updateUI(), 300);
                } else {
                    this.nav('scr-timer');
                }
            },

            updateUI: function() {
                document.getElementById('p-label').innerText = "Игрок " + (this.state.cur + 1);
            }
        };
    </script>
</body>
</html>
