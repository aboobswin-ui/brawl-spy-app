<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>BRAWL SPY 2026 - THE ULTIMATE MONOLITH</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Black+Ops+One&family=Rubik+Mono+One&display=swap" rel="stylesheet">
    
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>
        /* ========================================
           1. CORE SYSTEM VARIABLES (ДИЗАЙН-СИСТЕМА)
           ========================================
        */
        :root {
            --clr-scarlet-red: #ff0000;
            --clr-luxury-gold: #ffcc00;
            --clr-royal-blue: #0077ff;
            --clr-pure-white: #ffffff;
            --clr-void-black: #010103;
            
            --font-spy-special: 'Rubik Mono One', sans-serif;
            --font-main-ops: 'Black Ops One', cursive;

            /* МНОГОСЛОЙНЫЙ 3D СТЕК (ДЛЯ ЭФФЕКТА ОБЪЕМА) */
            --luxury-3d-shadow: 
                0 1px 0 #000, 
                0 2px 0 #000, 
                0 3px 0 #000, 
                0 4px 0 #000, 
                0 5px 0 #000, 
                0 6px 0 #000,
                0 12px 25px rgba(0,0,0,0.9);

            --spy-white-glimmer: 
                0 0 15px rgba(255, 255, 255, 0.4),
                0 0 2px rgba(255, 255, 255, 1);
        }

        /* ========================================
           2. GLOBAL STYLES (СБРОС И СТАБИЛИЗАЦИЯ)
           ========================================
        */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            -webkit-user-select: none;
            outline: none;
        }

        html, body {
            width: 100vw;
            height: 100vh;
            background-color: var(--clr-void-black);
            color: var(--clr-pure-white);
            overflow: hidden;
            font-family: var(--font-main-ops);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .app-monolith {
            width: 100%;
            height: 100%;
            max-width: 440px;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 5;
        }

        /* ========================================
           3. VIEW CONTROLLER (УПРАВЛЕНИЕ ЭКРАНАМИ)
           ========================================
        */
        .viewport-frame {
            position: absolute;
            inset: 0;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 45px;
            z-index: 10;
        }

        /* ЭКСКЛЮЗИВНЫЙ ФОН ГЛАВНОГО МЕНЮ */
        #view-main-menu {
            background-image: linear-gradient(rgba(0,0,0,0.75), rgba(0,0,0,0.75)), 
                              url('https://avatars.mds.yandex.net/i?id=bf88c867806a71c96d2d94c597a3c9ea_l-8271622-images-thumbs&n=13');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }

        .viewport-frame.active {
            display: flex;
            animation: viewTransition 0.5s cubic-bezier(0.2, 1, 0.3, 1) forwards;
        }

        /* ========================================
           4. ТИТАНОВЫЙ ЛОГОТИП (ИЕРАРХИЯ: ШПИОН - ВЕРХ)
           ========================================
        */
        .logo-titan-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            margin-bottom: 60px;
            position: relative;
        }

        /* БЕЛОЕ ОБЛАКО СЗАДИ (HALO EFFECT) */
        .logo-titan-container::before {
            content: '';
            position: absolute;
            top: 55%; left: 50%;
            transform: translate(-50%, -50%);
            width: 340px; height: 300px;
            background: radial-gradient(circle, rgba(255,255,255,0.12) 0%, rgba(255,255,255,0) 75%);
            filter: blur(40px);
            z-index: -1;
        }

        /* [1] ШПИОН - ВЕРШИНА */
        .logo-spy-top {
            font-family: var(--font-spy-special);
            font-size: 74px;
            color: var(--clr-scarlet-red);
            text-transform: uppercase;
            letter-spacing: -3px;
            line-height: 0.9;
            transform: scaleY(1.1);
            text-shadow: var(--spy-white-glimmer), 0 5px 15px rgba(0,0,0,0.6);
            margin-bottom: 12px;
            z-index: 100;
        }

        /* [2] BRAWL - СЕРЕДИНА */
        .logo-brawl-mid {
            font-size: 44px;
            color: var(--clr-pure-white);
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: var(--luxury-3d-shadow);
            margin-bottom: -14px; /* НАПЛЫВ НА STARS */
            z-index: 50;
        }

        /* [3] STARS - ФУНДАМЕНТ */
        .logo-stars-base {
            font-size: 92px;
            color: var(--clr-scarlet-red);
            text-transform: uppercase;
            line-height: 0.8;
            text-shadow: var(--luxury-3d-shadow);
            z-index: 10;
        }

        .logo-year-tag {
            font-size: 14px;
            color: var(--clr-pure-white);
            opacity: 0.5;
            letter-spacing: 6px;
            text-transform: uppercase;
            margin-top: 25px;
        }

        /* ========================================
           5. PREMIUM UI BUTTONS (СТИЛЬ BRAWL)
           ========================================
        */
        .ui-stack-vertical {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .btn-premium {
            width: 100%;
            padding: 24px 0;
            font-family: var(--font-main-ops);
            font-size: 26px;
            font-style: italic; /* ДИНАМИКА */
            text-transform: uppercase;
            border-radius: 15px;
            cursor: pointer;
            border: none;
            position: relative;
            color: var(--clr-pure-white);
            /* ОБВОДКА ТЕКСТА КНОПОК */
            -webkit-text-stroke: 1.4px var(--clr-void-black);
            text-shadow: 2px 2px 0 var(--clr-void-black);
            box-shadow: 0 8px 0 rgba(0,0,0,0.6);
            transition: 0.1s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .btn-premium:active {
            transform: translateY(5px);
            box-shadow: 0 3px 0 rgba(0,0,0,0.6);
        }

        /* СИНЯЯ КНОПКА (ГРАДИЕНТ И ОБВОДКА) */
        .btn-blue-gradient {
            background: linear-gradient(180deg, #00a2ff 0%, #004dff 100%);
            border: 3.5px solid #00d2ff;
        }

        /* КНОПКА №6: ЗОЛОТАЯ КОМНАТА (БЕЛЫЙ ТЕКСТ) */
        .btn-gold-gradient {
            background: linear-gradient(180deg, #ffdb00 0%, #ff8c00 100%);
            border: 3.5px solid var(--clr-luxury-gold);
            color: var(--clr-pure-white) !important;
        }

        /* КНОПКА НАЗАД / МЕНЮ */
        .btn-back-monolith {
            background: linear-gradient(180deg, #555 0%, #222 100%);
            border: 3.5px solid #777;
            font-size: 18px;
            padding: 18px 0;
            margin-top: 10px;
        }

        /* ========================================
           6. SETTINGS UI (НАСТРОЙКИ БИТВЫ)
           ========================================
        */
        .header-title-lux {
            font-size: 32px;
            margin-bottom: 45px;
            text-transform: uppercase;
            text-align: center;
            letter-spacing: 1px;
        }

        .tabs-container {
            display: flex;
            width: 100%;
            gap: 15px;
            margin-bottom: 40px;
        }

        .tab-item-lux {
            flex: 1;
            padding: 20px 0;
            border-radius: 12px;
            border: 3px solid;
            text-align: center;
            font-size: 14px;
            font-style: italic;
        }

        .tab-blue-neon { border-color: #00d2ff; color: #00d2ff; }
        .tab-red-neon { border-color: var(--clr-scarlet-red); color: var(--clr-scarlet-red); }

        /* ========================================
           7. ANIMATIONS (ФИЗИКА ДВИЖЕНИЯ)
           ========================================
        */
        @keyframes viewTransition {
            from { opacity: 0; transform: translateY(15px) scale(0.98); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

    </style>
</head>
<body>

    <div class="app-monolith">
        
        <div id="view-main-menu" class="viewport-frame active">
            
            <div class="logo-titan-container">
                <div class="logo-spy-top">ШПИОН</div>
                <div class="logo-brawl-mid">BRAWL</div>
                <div class="logo-stars-base">STARS</div>
                <div class="logo-year-tag">EDITION 2026</div>
            </div>
            
            <div class="ui-stack-vertical">
                <button class="btn-premium btn-blue-gradient" onclick="Core.nav('view-setup')">СОЗДАТЬ ЛОББИ</button>
                <button class="btn-premium btn-blue-gradient" onclick="Core.nav('view-join')">ВХОД ПО ID</button>
                <button class="btn-premium btn-back-monolith" onclick="tg.close()">ВЫХОД</button>
            </div>
        </div>

        <div id="view-setup" class="viewport-frame">
            <h2 class="header-title-lux">НАСТРОЙКИ БИТВЫ</h2>
            
            <div class="tabs-container">
                <div class="tab-item-lux tab-blue-neon">УЧАСТНИКИ</div>
                <div class="tab-item-lux tab-red-neon">ШПИОН</div>
            </div>

            <div id="display-room-id" style="color:var(--clr-luxury-gold); font-size: 30px; margin-bottom: 45px; letter-spacing: 3px;">ID: 0000-0000</div>

            <div class="ui-stack-vertical">
                <button class="btn-premium btn-gold-gradient" onclick="Core.initBattle()">СОЗДАТЬ КОМНАТУ</button>
                <button class="btn-premium btn-back-monolith" onclick="Core.nav('view-main-menu')">МЕНЮ</button>
            </div>
        </div>

        <div id="view-join" class="viewport-frame">
            <h2 class="header-title-lux">ID КОМНАТЫ</h2>
            <div style="display: flex; gap: 15px; margin: 50px 0;">
                <div style="width:38px; border-bottom:4.5px solid #fff; font-size:42px; text-align:center;">_</div>
                <div style="width:38px; border-bottom:4.5px solid #fff; font-size:42px; text-align:center;">_</div>
                <div style="width:38px; border-bottom:4.5px solid #fff; font-size:42px; text-align:center;">_</div>
                <div style="width:38px; border-bottom:4.5px solid #fff; font-size:42px; text-align:center;">_</div>
            </div>
            <button class="btn-premium btn-back-monolith" onclick="Core.nav('view-main-menu')">ОТМЕНА</button>
        </div>

    </div>

    <script>
        /**
         * УПРАВЛЯЮЩИЙ ДВИЖОК ПРИЛОЖЕНИЯ
         */
        const tg = window.Telegram.WebApp;
        tg.expand();

        const Core = {
            /**
             * Навигация между видами
             */
            nav: function(targetId) {
                // Скрываем все кадры
                const frames = document.querySelectorAll('.viewport-frame');
                frames.forEach(f => f.classList.remove('active'));
                
                // Активируем нужный
                const target = document.getElementById(targetId);
                if (target) {
                    target.classList.add('active');
                }

                // Логика генерации ID для настроек
                if (targetId === 'view-setup') {
                    const part1 = Math.floor(1000 + Math.random() * 8999);
                    const part2 = Math.floor(1000 + Math.random() * 8999);
                    document.getElementById('display-room-id').innerText = `ID: ${part1}-${part2}`;
                }

                // Виброотклик Telegram
                tg.HapticFeedback.impactOccurred('medium');
            },

            /**
             * Финализация комнаты
             */
            initBattle: function() {
                tg.HapticFeedback.notificationOccurred('success');
                tg.showAlert("БИТВА СФОРМИРОВАНА! ПРИГЛАСИТЕ ДРУЗЕЙ.");
            }
        };

        // Полная блокировка системного скролла для эффекта нативного приложения
        document.addEventListener('touchmove', function(e) {
            e.preventDefault();
        }, { passive: false });

        window.onload = () => {
            tg.ready();
            console.log("System: Luxury Monolith Engine Loaded.");
        };
    </script>
</body>
</html>
