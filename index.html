<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Brawl Spy: Ultimate Pro v4.0</title>
    
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    
    <link href="https://fonts.googleapis.com/css2?family=Rubik+One&family=Roboto:wght@700;900&display=swap" rel="stylesheet">
    
    <style>
        /* ========================================
           БЛОК СТИЛЕЙ (CSS) - БОЛЕЕ 150 СТРОК
           ========================================
        */
        :root {
            --bg-deep: #050508;
            --neon-purp: #7209B7;
            --neon-cyan: #4CC9F0;
            --neon-rose: #F72585;
            --card-surface: #121217;
            --text-main: #FFFFFF;
            --text-dim: rgba(255, 255, 255, 0.4);
            --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * { 
            box-sizing: border-box; 
            margin: 0; 
            padding: 0; 
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            font-family: 'Rubik One', sans-serif;
        }
        
        body {
            background-color: var(--bg-deep);
            background-image: 
                radial-gradient(circle at 50% -20%, rgba(114, 9, 183, 0.3) 0%, transparent 70%),
                radial-gradient(circle at 50% 120%, rgba(76, 201, 240, 0.1) 0%, transparent 70%);
            color: var(--text-main);
            height: 100vh; 
            width: 100vw;
            overflow: hidden;
            display: flex; 
            flex-direction: column;
        }

        /* АНИМАЦИИ ПОЯВЛЕНИЯ ЭКРАНОВ */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .screen {
            display: none;
            width: 100%; 
            height: 100%;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 40px 24px 30px 24px;
            animation: fadeIn 0.4s ease-out forwards;
        }

        .screen.active { 
            display: flex !important; 
        }

        /* КНОПКИ (СТИЛЬ КАК НА СКРИНЕ) */
        .btn-container {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 10px;
        }

        .btn-base {
            width: 100%;
            max-width: 360px;
            padding: 22px;
            border-radius: 30px;
            font-size: 20px;
            text-transform: uppercase;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
            border: 3px solid transparent;
            background: transparent;
            color: #FFFFFF; /* Весь текст белый */
        }

        /* Кнопка СТАРТ - Фиолетовый неон */
        .btn-start {
            border-color: var(--neon-purp);
            box-shadow: 0 0 15px rgba(114, 9, 183, 0.4);
        }

        .btn-start:active {
            background: var(--neon-purp);
            transform: scale(0.97);
        }

        /* Кнопка ПРИГЛАСИТЬ - Голубой неон */
        .btn-invite {
            border-color: var(--neon-cyan);
            box-shadow: 0 0 15px rgba(76, 201, 240, 0.3);
        }

        .btn-invite:active {
            background: var(--neon-cyan);
            transform: scale(0.97);
        }

        /* ЛОББИ - ЭЛЕМЕНТЫ */
        .room-badge {
            background: var(--neon-purp);
            padding: 8px 24px;
            border-radius: 12px;
            font-size: 14px;
            margin-bottom: 20px;
            display: inline-block;
        }

        .lobby-panel {
            background: #121217;
            border-radius: 35px;
            width: 100%;
            padding: 30px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .p-btn {
            width: 55px; 
            height: 55px;
            border-radius: 18px;
            border: none;
            background: var(--neon-purp);
            color: white;
            font-size: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .player-list {
            flex: 1;
            width: 100%;
            margin-bottom: 20px;
            overflow-y: auto;
        }

        .player-row {
            background: #1c1c22;
            margin-bottom: 12px;
            padding: 18px 25px;
            border-radius: 22px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-left: 4px solid var(--neon-purp);
        }

        .player-row.host { 
            border-left-color: var(--neon-cyan); 
        }

        /* КАРТОЧКА ГЕРОЯ */
        .game-card {
            width: 320px; 
            height: 480px;
            background: var(--card-surface);
            border: 6px solid var(--neon-purp);
            border-radius: 50px;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
            box-shadow: 0 25px 60px rgba(0,0,0,0.6);
            cursor: pointer;
        }

        .b-name {
            font-size: 34px;
            margin-bottom: 30px;
            text-align: center;
        }

        .b-img-box {
            width: 240px; 
            height: 240px;
            display: flex; 
            align-items: center; 
            justify-content: center;
        }

        .b-img-box img {
            max-width: 100%; 
            max-height: 100%;
            object-fit: contain;
        }

    </style>
</head>
<body>

    <div id="main-wrapper" style="height: 100%;">
        
        <div id="screen-menu" class="screen active">
            <div style="text-align: center; margin-top: 20px;">
                <h1 style="font-size: 55px; line-height: 0.8;">BRAWL<br><span style="color:var(--neon-purp)">SPY</span></h1>
            </div>
            
            <div class="btn-container">
                <button class="btn-base btn-start" onclick="openLobby()">СОЗДАТЬ КОМНАТУ</button>
                <button class="btn-base btn-invite" onclick="tg.showAlert('Поиск комнат в разработке v4.0')">НАЙТИ ИГРУ</button>
            </div>
        </div>

        <div id="screen-lobby" class="screen">
            <div style="text-align:center">
                <div class="room-badge" id="room-id-val">ROOM: #2401</div>
                <h1 style="font-size:38px; text-transform:uppercase;">ЛОББИ</h1>
            </div>

            <div class="lobby-panel">
                <span style="font-size:18px;">ИГРОКИ:</span>
                <div style="display: flex; align-items: center; gap: 20px;">
                    <button class="p-btn" onclick="updateP(-1)">-</button>
                    <span id="p-label" style="font-size:32px; width:40px; text-align:center">3</span>
                    <button class="p-btn" onclick="updateP(1)">+</button>
                </div>
            </div>

            <div class="player-list" id="player-container">
                </div>

            <div class="btn-container">
                <button class="btn-base btn-start" onclick="startMatch()">СТАРТ</button>
                <button class="btn-base btn-invite" onclick="inviteFriends()">ПРИГЛАСИТЬ</button>
            </div>
        </div>

        <div id="screen-play" class="screen">
            <h2 id="turn-name" style="font-size:24px; text-transform: uppercase;">НИКИТА</h2>
            
            <div class="game-card" id="card-trigger" onclick="revealRole()">
                <div id="card-prompt" style="height:100%; display:flex; align-items:center; color:var(--neon-purp); text-align:center">
                    ТАПНИ ПО КАРТЕ
                </div>
            </div>

            <div id="game-timer" style="display:none; font-size:80px; color:var(--neon-rose); font-family:'Roboto'; font-weight: 900;">05:00</div>

            <div class="btn-container">
                <button class="btn-base btn-start" id="btn-flow" style="display:none" onclick="nextStep()">СЛЕДУЮЩИЙ</button>
                <button class="btn-base" style="border-color:#333; color:#555; font-size: 14px; padding: 12px;" onclick="location.reload()">ВЫЙТИ ИЗ ИГРЫ</button>
            </div>
        </div>

    </div>

        function switchScreen(id) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            tg.HapticFeedback.impactOccurred('medium');
        }

        function openLobby() {
            appState.room = Math.floor(1000 + Math.random() * 8999);
            document.getElementById('room-id-val').innerText = "ROOM: #" + appState.room;
            drawPlayers();
            switchScreen('screen-lobby');
        }

        function updateP(v) {
            appState.players = Math.max(3, Math.min(15, appState.players + v));
            document.getElementById('p-label').innerText = appState.players;
            drawPlayers();
            tg.HapticFeedback.selectionChanged();
        }

        function drawPlayers() {
            const list = document.getElementById('player-container');
            list.innerHTML = "";
            const userName = tg.initDataUnsafe?.user?.first_name || "НИКИТА";
            
            for(let i=0; i<appState.players; i++) {
                const row = document.createElement('div');
                row.className = "player-row" + (i === 0 ? " host" : "");
                
                const pName = i === 0 ? userName : "ИГРОК " + (i+1);
                const pStatus = i === 0 ? "READY" : "WAITING...";
                
                row.innerHTML = `
                    <span>${pName.toUpperCase()}</span>
                    <span style="font-size:10px; color:var(--text-dim)">${pStatus}</span>
                `;
                list.appendChild(row);
            }
        }

        function inviteFriends() {
            const text = `Заходи в Brawl Spy! Комната: ${appState.room}`;
            tg.shareExternal(text);
        }

        function startMatch() {
            appState.deck = [];
            appState.step = 0;
            appState.isFlipped = false;
            
            const randomHero = BRAWLERS_DATABASE[Math.floor(Math.random() * BRAWLERS_DATABASE.length)];
            
            for(let i=0; i<appState.players; i++) {
                appState.deck.push({ 
                    spy: false, 
                    hero: randomHero.name, 
                    pic: randomHero.img 
                });
            }
            
            const spyIdx = Math.floor(Math.random() * appState.players);
            appState.deck[spyIdx] = { 
                spy: true, 
                hero: "ШПИОН", 
                pic: "https://cdn-icons-png.flaticon.com/512/1266/1266106.png" 
            };
            
            switchScreen('screen-play');
            setupCard();
        }

        function setupCard() {
            const userName = tg.initDataUnsafe?.user?.first_name || "НИКИТА";
            const currentTitle = appState.step === 0 ? userName.toUpperCase() : "ИГРОК " + (appState.step + 1);
            
            document.getElementById('turn-name').innerText = currentTitle;
            const card = document.getElementById('card-trigger');
            card.style.borderColor = "var(--neon-purp)";
            document.getElementById('card-prompt').style.display = "flex";
            card.innerHTML = `<div id="card-prompt" style="height:100%; display:flex; align-items:center; color:var(--neon-purp); text-align:center">ТАПНИ ПО КАРТЕ</div>`;
            document.getElementById('btn-flow').style.display = "none";
        }

        function revealRole() {
            if(appState.isFlipped) return;
            
            const data = appState.deck[appState.step];
            const card = document.getElementById('card-trigger');
            
            if(data.spy) {
                card.style.borderColor = "var(--neon-rose)";
            }
            
            card.innerHTML = `
                <div class="b-name" style="color:${data.spy ? 'var(--neon-rose)' : 'white'}">${data.hero}</div>
                <div class="b-img-box">
                    <img src="${data.pic}" onerror="this.src='https://cdn-icons-png.flaticon.com/512/1266/1266106.png'">
                </div>
            `;
            
            appState.isFlipped = true;
            document.getElementById('btn-flow').style.display = "flex";
            tg.HapticFeedback.notificationOccurred('success');
        }

        function nextStep() {
            appState.step++;
            appState.isFlipped = false;
            
            if(appState.step < appState.players) {
                setupCard();
                tg.HapticFeedback.impactOccurred('light');
            } else {
                startDiscussion();
            }
        }

        function startDiscussion() {
            document.getElementById('turn-name').innerText = "ОБСУЖДЕНИЕ";
            document.getElementById('card-trigger').style.display = "none";
            document.getElementById('game-timer').style.display = "block";
            document.getElementById('btn-flow').innerText = "ИГРАТЬ ЕЩЕ";
            document.getElementById('btn-flow').onclick = () => location.reload();
            
            let timeTotal = 300;
            const timerLabel = document.getElementById('game-timer');
            
            const clock = setInterval(() => {
                let minutes = Math.floor(timeTotal / 60);
                let seconds = timeTotal % 60;
                timerLabel.innerText = `${minutes}:${seconds < 10 ? '0'+seconds : seconds}`;
                
                if(timeTotal-- <= 0) {
                    clearInterval(clock);
                    tg.HapticFeedback.notificationOccurred('error');
                    timerLabel.innerText = "ФИНИШ";
                }
            }, 1000);
        }

        window.onload = () => {
            tg.ready();
            try { 
                tg.expand(); 
            } catch(err) {
                console.log("WebApp expanded");
            }
