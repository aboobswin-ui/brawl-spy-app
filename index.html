<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>BRAWL SPY ULTIMATE</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Black+Ops+One&family=Rubik+One&family=Exo+2:wght@900&display=swap" rel="stylesheet">
    
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>
        :root {
            --neon-blue: #00d2ff;
            --neon-red: #ff3131;
            --neon-gold: #ffd700;
            --neon-green: #00ff00;
            --bg-black: #020205;
            --glow-white: rgba(255, 255, 255, 0.9);
        }

        /* ГЛОБАЛЬНЫЕ СТИЛИ И ЦЕНТРИРОВАНИЕ */
        * { 
            box-sizing: border-box; 
            margin: 0; padding: 0; 
            -webkit-user-select: none; 
            outline: none; 
            -webkit-tap-highlight-color: transparent;
        }

        body { 
            background: var(--bg-black); 
            color: #fff; 
            font-family: 'Rubik One', sans-serif; 
            height: 100vh; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            overflow: hidden;
        }

        .app-shell { 
            width: 100%; 
            height: 100%; 
            max-width: 450px; 
            position: relative; 
            display: flex; 
            flex-direction: column;
        }

        .screen { 
            position: absolute; 
            inset: 0; 
            display: none; 
            flex-direction: column; 
            align-items: center; 
            padding: 50px 25px 40px; 
            background: var(--bg-black); 
        }

        .screen.active { display: flex; animation: fadeIn 0.3s ease-in-out; }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        /* --- ГЛАВНОЕ МЕНЮ --- */
        .logo-container { text-align: center; margin-bottom: 50px; }
        .spy-title { font-size: 95px; color: var(--neon-red); text-shadow: 0 0 35px var(--neon-red); line-height: 1; }
        .brawl-subtitle { font-family: 'Black Ops One'; font-size: 30px; color: var(--neon-gold); margin-top: -5px; }

        .btn-universal {
            width: 100%;
            padding: 24px;
            background: #000;
            border: 4px solid var(--neon-blue);
            box-shadow: 0 0 15px var(--neon-blue);
            border-radius: 35px;
            color: #fff;
            font-family: 'Exo 2';
            font-weight: 900;
            font-size: 22px;
            text-transform: uppercase;
            margin-bottom: 20px;
            cursor: pointer;
            transition: transform 0.1s;
            text-align: center;
        }
        .btn-universal:active { transform: scale(0.97); }

        /* КНОПКА №6: СОЗДАТЬ КОМНАТУ [cite: 2026-01-04] */
        .btn-special-6 {
            border-color: var(--neon-gold);
            box-shadow: 0 0 18px var(--neon-gold);
            color: #ffffff !important;
            margin-top: 40px;
        }

        /* --- НАСТРОЙКА ЛОББИ [cite: 2026-01-03] --- */
        .lobby-settings-title {
            font-family: 'Exo 2';
            font-size: 30px;
            color: #fff;
            text-shadow: 0 0 15px var(--glow-white);
            text-transform: uppercase;
            margin-bottom: 40px;
        }

        .tabs-container { display: flex; width: 100%; gap: 15px; margin-bottom: 30px; }
        .tab-btn {
            flex: 1;
            padding: 18px;
            border-radius: 20px;
            text-align: center;
            font-family: 'Exo 2';
            font-size: 15px;
            border: 3px solid;
            background: #000;
            text-transform: uppercase;
        }
        .tab-blue { border-color: var(--neon-blue); box-shadow: 0 0 12px var(--neon-blue); color: var(--neon-blue); }
        .tab-red { border-color: var(--neon-red); box-shadow: 0 0 12px var(--neon-red); color: var(--neon-red); }

        .control-group { width: 100%; margin-bottom: 25px; }
        .control-label { 
            font-family: 'Exo 2'; font-size: 14px; color: #888; 
            display: flex; justify-content: space-between; margin-bottom: 12px;
            text-transform: uppercase;
        }
        .control-value { font-family: 'Black Ops One'; color: #fff; font-size: 20px; }

        input[type=range] { width: 100%; -webkit-appearance: none; background: transparent; }
        input[type=range]::-webkit-slider-runnable-track { width: 100%; height: 6px; background: #222; border-radius: 3px; }
        input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; height: 26px; width: 26px; border-radius: 50%; background: #fff; box-shadow: 0 0 10px #fff; margin-top: -10px; }

        /* --- ВХОД ПО ID --- */
        .id-header { font-family: 'Exo 2'; font-size: 32px; color: #fff; margin-bottom: 10px; text-transform: uppercase; }
        .id-input-field { display: flex; align-items: center; gap: 8px; margin: 45px 0; }
        .digit-box { font-family: 'Black Ops One'; font-size: 42px; width: 38px; text-align: center; border-bottom: 4px solid #fff; color: #fff; }
        .id-divider { font-family: 'Black Ops One'; font-size: 42px; color: #fff; transform: translateY(-6px); }

        .numpad-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; width: 100%; }
        .num-btn { 
            padding: 24px; background: #0d0d14; border: 2px solid #1a1a25; border-radius: 25px; 
            font-size: 30px; color: #fff; font-family: 'Black Ops One'; display: flex; 
            justify-content: center; align-items: center;
        }

        /* --- ЛОББИ СПИСОК --- */
        .room-id-header { font-family: 'Black Ops One'; font-size: 24px; color: var(--neon-gold); margin-bottom: 30px; }
        .player-list-container { width: 100%; flex: 1; overflow-y: auto; margin-bottom: 20px; }
        .player-item { 
            width: 100%; background: #0a0a10; border: 2px solid #222; 
            border-radius: 22px; padding: 18px; display: flex; justify-content: space-between; 
            align-items: center; margin-bottom: 15px;
        }
        .status-ready-text { color: var(--neon-green); text-shadow: 0 0 10px var(--neon-green); font-family: 'Exo 2'; font-size: 14px; text-transform: uppercase; }
        .status-wait-text { color: var(--neon-red); text-shadow: 0 0 10px var(--neon-red); font-family: 'Exo 2'; font-size: 14px; text-transform: uppercase; }

    </style>
</head>
<body>
    <div class="app-shell">
        
        <div id="scr-menu" class="screen active">
            <div class="logo-container">
                <div class="spy-title">SPY</div>
                <div class="brawl-subtitle">BRAWL STARS</div>
            </div>
            <button class="btn-universal" onclick="App.nav('scr-setup')">СОЗДАТЬ ЛОББИ</button>
            <button class="btn-universal" onclick="App.nav('scr-join')">ВХОД ПО ID</button>
            <button class="btn-universal" style="border-color: #333; box-shadow: none;" onclick="tg.close()">ВЫХОД</button>
            
            <button class="btn-universal btn-special-6" onclick="App.nav('scr-setup')">СОЗДАТЬ КОМНАТУ</button>
        </div>

        <div id="scr-setup" class="screen">
            <h2 class="lobby-settings-title">НАСТРОЙКА ЛОББИ</h2>
            <div class="tabs-container">
                <div class="tab-btn tab-blue">УЧАСТНИКИ</div>
                <div class="tab-btn tab-red">ШПИОН</div>
            </div>

            <div class="control-group">
                <div class="control-label">УЧАСТНИКИ <span class="control-value" id="disp-p">8</span></div>
                <input type="range" min="3" max="20" value="8" oninput="document.getElementById('disp-p').innerText = this.value">
            </div>

            <div class="control-group">
                <div class="control-label">ШПИОНЫ <span class="control-value" id="disp-s">1</span></div>
                <input type="range" min="1" max="10" value="1" oninput="document.getElementById('disp-s').innerText = this.value">
            </div>

            <div class="control-group">
                <div class="control-label">ВРЕМЯ (МИН) <span class="control-value" id="disp-t">5</span></div>
                <input type="range" min="1" max="15" value="5" oninput="document.getElementById('disp-t').innerText = this.value">
            </div>

            <div id="setup-id-tag" style="font-family:'Black Ops One'; font-size: 24px; color: var(--neon-gold); margin: 25px 0;">ID: ....-....</div>

            <div style="width:100%; margin-top: auto;">
                <button class="btn-universal btn-special-6" onclick="App.createRoom()">СОЗДАТЬ КОМНАТУ</button>
                <button class="btn-universal" style="border-color:#222; box-shadow:none;" onclick="App.nav('scr-menu')">НАЗАД</button>
            </div>
        </div>

        <div id="scr-join" class="screen">
            <h2 class="id-header">ID КОМНАТЫ</h2>
            <div class="id-input-field">
                <div class="digit-box" id="c1">_</div><div class="digit-box" id="c2">_</div><div class="digit-box" id="c3">_</div><div class="digit-box" id="c4">_</div>
                <div class="id-divider">-</div>
                <div class="digit-box" id="c5">_</div><div class="digit-box" id="c6">_</div><div class="digit-box" id="c7">_</div><div class="digit-box" id="c8">_</div>
            </div>
            
            <div class="numpad-grid">
                <script>for(let i=1; i<=9; i++) document.write(`<div class="num-btn" onclick="App.press('${i}')">${i}</div>`);</script>
                <div class="num-btn" style="color:var(--neon-red)" onclick="App.press('C')">C</div>
                <div class="num-btn" onclick="App.press('0')">0</div>
                <div class="num-btn" style="color:var(--neon-gold)" onclick="App.joinRoom()">OK</div>
            </div>
            <button class="btn-universal" style="margin-top:40px; border-color:#222; box-shadow:none;" onclick="App.nav('scr-menu')">НАЗАД</button>
        </div>

        <div id="scr-room" class="screen">
            <h2 class="lobby-settings-title">ЛОББИ БИТВЫ</h2>
            <div id="active-id-display" class="room-id-header">ID: ....-....</div>
            
            <div class="player-list-container" id="player-list-ui"></div>
            
            <div style="width:100%; margin-top: auto;">
                <button class="btn-universal" id="ready-btn" style="border-color:var(--neon-green); box-shadow: 0 0 15px var(--neon-green);" onclick="App.toggleReady()">ГОТОВ</button>
                <button class="btn-universal btn-special-6" id="start-game-btn" style="display:none">НАЧАТЬ ИГРУ</button>
                <button class="btn-universal" style="border-color:var(--neon-red); box-shadow:none;" onclick="App.leave()">ВЫЙТИ</button>
            </div>
        </div>

    </div>

    <script>
        // FIREBASE CONFIG
        const firebaseConfig = {
            apiKey: "AIzaSyDbopGDAnN6RxiXoAk_Il90WZBCW0bVBvg",
            authDomain: "brawlspy.firebaseapp.com",
            databaseURL: "https://brawlspy-default-rtdb.firebaseio.com",
            projectId: "brawlspy",
            storageBucket: "brawlspy.firebasestorage.app",
            messagingSenderId: "803859610634",
            appId: "1:803859610634:web:2310aa16bb6e61049833f3"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        const tg = window.Telegram.WebApp;
        tg.expand();

        const user = tg.initDataUnsafe.user || { id: Date.now(), username: "Player_" + Math.floor(Math.random()*99) };

        const App = {
            room: null,
            input: "",
            ready: false,

            nav: (id) => {
                document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
                document.getElementById(id).classList.add('active');
                if(id === 'scr-setup') {
                    const c = Math.floor(1000+Math.random()*8999) + "-" + Math.floor(1000+Math.random()*8999);
                    App.room = c;
                    document.getElementById('setup-id-tag').innerText = "ID: " + c;
                }
            },

            press: (v) => {
                if(v === 'C') App.input = "";
                else if(App.input.length < 8) App.input += v;
                for(let i=1; i<=8; i++) document.getElementById('c'+i).innerText = App.input[i-1] || "_";
                tg.HapticFeedback.impactOccurred('medium');
            },

            createRoom: () => { App.nav('scr-room'); App.connect(); },
            joinRoom: () => {
                if(App.input.length === 8) {
                    App.room = App.input.slice(0,4) + "-" + App.input.slice(4,8);
                    App.nav('scr-room'); App.connect();
                }
            },

            connect: () => {
                document.getElementById('active-id-display').innerText = "ID: " + App.room;
                db.ref('rooms/' + App.room + '/players/' + user.id).set({ 
                    name: "@" + (user.username || "guest"), 
                    ready: false 
                });

                db.ref('rooms/' + App.room + '/players').on('value', snap => {
                    const players = snap.val();
                    const ui = document.getElementById('player-list-ui');
                    ui.innerHTML = "";
                    if(players) {
                        Object.keys(players).forEach(uid => {
                            const p = players[uid];
                            ui.innerHTML += `
                                <div class="player-item">
                                    <span style="font-family:'Exo 2'; font-size:18px;">${p.name}</span>
                                    <span class="${p.ready ? 'status-ready-text' : 'status-wait-text'}">${p.ready ? 'ГОТОВ' : 'ЖДЕМ'}</span>
                                </div>`;
                        });
                    }
                });
            },

            toggleReady: () => {
                App.ready = !App.ready;
                db.ref('rooms/' + App.room + '/players/' + user.id).update({ ready: App.ready });
                document.getElementById('ready-btn').innerText = App.ready ? "ОТМЕНА" : "ГОТОВ";
                tg.HapticFeedback.notificationOccurred('success');
            },

            leave: () => {
                if(App.room) db.ref('rooms/' + App.room + '/players/' + user.id).remove();
                location.reload();
            }
        };
    </script>
</body>
</html>
