<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>BRAWL SPY ULTIMATE</title>
    <link href="https://fonts.googleapis.com/css2?family=Black+Ops+One&family=Rubik+One&family=Exo+2:wght@900&display=swap" rel="stylesheet">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --neon-blue: #00d2ff; --neon-red: #ff3131; --neon-gold: #ffd700; --neon-green: #00ff00;
            --bg-black: #020205; --glow-white: rgba(255, 255, 255, 0.9);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-user-select: none; outline: none; }
        
        body { 
            background: var(--bg-black); color: #fff; font-family: 'Rubik One', sans-serif; 
            height: 100vh; display: flex; justify-content: center; overflow: hidden;
        }

        .app-shell { width: 100%; height: 100%; max-width: 450px; position: relative; display: flex; flex-direction: column; }

        /* СИСТЕМА ЭКРАНОВ */
        .screen { 
            position: absolute; inset: 0; display: none; flex-direction: column; align-items: center; 
            padding: 40px 25px 30px; background: var(--bg-black); 
        }
        .screen.active { display: flex; }

        /* ТЕКСТОВЫЕ СТИЛИ */
        .title-neon { font-family: 'Exo 2'; font-size: 32px; color: #fff; text-shadow: 0 0 20px var(--glow-white); text-transform: uppercase; text-align: center; }
        .id-label { font-family: 'Black Ops One'; font-size: 20px; color: #fff; margin-top: 10px; margin-bottom: 20px; }

        /* ГЛАВНОЕ МЕНЮ */
        .logo-spy { font-size: 90px; color: var(--neon-red); text-shadow: 0 0 35px var(--neon-red); margin-top: 50px; }
        .logo-sub { font-family: 'Black Ops One'; font-size: 30px; color: var(--neon-gold); margin-bottom: 60px; }

        /* КНОПКИ */
        .btn-main { 
            width: 100%; padding: 22px; background: #000; border: 4px solid var(--neon-blue); 
            box-shadow: 0 0 15px var(--neon-blue); border-radius: 30px; color: #fff; 
            font-family: 'Exo 2'; font-weight: 900; font-size: 22px; text-transform: uppercase; margin-bottom: 20px;
        }
        .btn-create { border-color: var(--neon-gold); box-shadow: 0 0 15px var(--neon-gold); color: #fff !important; } /* Текст белый по ТЗ */
        .btn-back { background: #080808; border: 3px solid #222; border-radius: 40px; color: #fff; margin-top: auto; padding: 18px; width: 100%; font-family: 'Exo 2'; font-size: 18px; }

        /* ВВОД ID (image_a48663.png) */
        .id-input-row { display: flex; align-items: center; gap: 8px; margin: 40px 0; }
        .id-cell { font-family: 'Black Ops One'; font-size: 40px; width: 35px; text-align: center; border-bottom: 4px solid #fff; }
        .id-dash { font-family: 'Black Ops One'; font-size: 35px; height: 40px; display: flex; align-items: center; } 

        .numpad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; }
        .key { 
            width: 85px; height: 85px; background: #0d0d14; border: 2px solid #222; border-radius: 20px; 
            font-size: 30px; color: #fff; font-family: 'Black Ops One'; display: flex; align-items: center; justify-content: center;
        }

        /* ЛОББИ (image_a3afaa.png) */
        .tg-block { display: flex; align-items: center; gap: 12px; margin-bottom: 30px; }
        .tg-ava { width: 55px; height: 55px; border-radius: 50%; border: 2px solid #fff; box-shadow: 0 0 15px #fff; background: #222 center/cover; }
        
        .card-row { 
            width: 100%; background: #0a0a10; border: 3px solid var(--neon-blue); box-shadow: 0 0 15px var(--neon-blue);
            border-radius: 25px; padding: 15px 25px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;
        }
        .adj-box { display: flex; align-items: center; gap: 15px; }
        .adj-btn { 
            width: 45px; height: 45px; background: none; border: 2px solid var(--neon-blue); border-radius: 12px; 
            color: var(--neon-blue); font-size: 30px; display: flex; align-items: center; justify-content: center;
        }

        /* СПИСОК ИГРОКОВ В КОМНАТЕ */
        .player-list { width: 100%; display: flex; flex-direction: column; gap: 12px; overflow-y: auto; margin-bottom: 20px; }
        .player-slot { 
            width: 100%; background: #0a0a10; border: 2px solid #333; border-radius: 20px; 
            padding: 12px 15px; display: flex; justify-content: space-between; align-items: center;
        }
        .status-tag { 
            padding: 6px 12px; border-radius: 10px; font-family: 'Exo 2'; font-size: 12px; border: 2px solid; 
            box-shadow: 0 0 10px currentColor; text-transform: uppercase;
        }
    </style>
</head>
<body>
    <div class="app-shell">
        
        <div id="scr-menu" class="screen active">
            <h1 class="logo-spy">SPY</h1>
            <div class="logo-sub">BRAWL STARS</div>
            <button class="btn-main" onclick="App.nav('scr-lobby')">Создать лобби</button>
            <button class="btn-main" onclick="App.nav('scr-join')">Вход по ID</button>
            <button class="btn-back" onclick="tg.close()">ВЫХОД</button>
        </div>

        <div id="scr-join" class="screen">
            <h2 class="title-neon">ВВЕДИТЕ КОД</h2>
            <div class="id-input-row">
                <div class="id-cell" id="c1">_</div><div class="id-cell" id="c2">_</div><div class="id-cell" id="c3">_</div><div class="id-cell" id="c4">_</div>
                <div class="id-dash">-</div>
                <div class="id-cell" id="c5">_</div><div class="id-cell" id="c6">_</div><div class="id-cell" id="c7">_</div><div class="id-cell" id="c8">_</div>
            </div>
            <div class="numpad">
                <button class="key" onclick="App.key('1')">1</button><button class="key" onclick="App.key('2')">2</button><button class="key" onclick="App.key('3')">3</button>
                <button class="key" onclick="App.key('4')">4</button><button class="key" onclick="App.key('5')">5</button><button class="key" onclick="App.key('6')">6</button>
                <button class="key" onclick="App.key('7')">7</button><button class="key" onclick="App.key('8')">8</button><button class="key" onclick="App.key('9')">9</button>
                <button class="key" style="color:var(--neon-red)" onclick="App.key('C')">C</button>
                <button class="key" onclick="App.key('0')">0</button>
                <button class="key" style="color:var(--neon-gold)" onclick="App.connect()">OK</button>
            </div>
            <button class="btn-back" onclick="App.nav('scr-menu')">НАЗАД</button>
        </div>

        <div id="scr-lobby" class="screen">
            <h2 class="title-neon">НАСТРОЙКА ЛОББИ</h2>
            <div class="id-label">ID: 9574-3718</div>
            <div class="tg-block">
                <div class="tg-ava" id="my-ava-lobby"></div>
                <div class="title-neon" style="font-size:18px; text-shadow:none;" id="my-name-lobby">@player</div>
            </div>
            <div class="card-row">
                <span style="font-family:'Exo 2'">УЧАСТНИКИ</span>
                <div class="adj-box">
                    <button class="adj-btn" onclick="App.adj('p',-1)">-</button>
                    <span id="p-val" style="font-family:'Black Ops One'; font-size:30px;">2</span>
                    <button class="adj-btn" onclick="App.adj('p',1)">+</button>
                </div>
            </div>
            <div class="card-row" style="border-color:var(--neon-red); box-shadow: 0 0 15px var(--neon-red);">
                <span style="font-family:'Exo 2'">ШПИОН</span>
                <div class="adj-box">
                    <button class="adj-btn" style="border-color:var(--neon-red); color:var(--neon-red);" onclick="App.adj('s',-1)">-</button>
                    <span id="s-val" style="font-family:'Black Ops One'; font-size:30px;">2</span>
                    <button class="adj-btn" style="border-color:var(--neon-red); color:var(--neon-red);" onclick="App.adj('s',1)">+</button>
                </div>
            </div>
            <button class="btn-main btn-create" onclick="App.nav('scr-room')">СОЗДАТЬ КОМНАТУ</button>
            <button class="btn-back" onclick="App.nav('scr-menu')">НАЗАД</button>
        </div>

        <div id="scr-room" class="screen">
            <h2 class="title-neon">КОМНАТА ИГРЫ</h2>
            <div class="id-label" id="room-id-title">ID: 9574-3718</div>
            <div class="player-list" id="p-list"></div>
            <button class="btn-main" style="border-color:var(--neon-green); box-shadow:0 0 15px var(--neon-green);" id="ready-btn" onclick="App.toggleReady()">ГОТОВ</button>
            <button class="btn-main btn-create" id="start-btn" style="display:none" onclick="tg.showAlert('ИГРА НАЧИНАЕТСЯ!')">НАЧАТЬ ИГРУ</button>
            <button class="btn-back" onclick="App.nav('scr-menu')">ПОКИНУТЬ</button>
        </div>

    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        const App = {
            state: { p: 2, s: 2, id: "", isReady: false, isAdmin: true },
            
            nav: (id) => {
                document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
                document.getElementById(id).classList.add('active');
                if(id === 'scr-room') App.renderRoom();
                tg.HapticFeedback.impactOccurred('light');
            },

            key: (v) => {
                if(v === 'C') App.state.id = "";
                else if(App.state.id.length < 8) App.state.id += v;
                for(let i=1; i<=8; i++) {
                    document.getElementById('c'+i).innerText = App.state.id[i-1] || "_";
                }
            },

            connect: () => {
                if(App.state.id.length === 8) {
                    App.state.isAdmin = false;
                    App.nav('scr-room');
                }
            },

            adj: (t, v) => {
                if(t === 'p') App.state.p = Math.max(2, App.state.p + v);
                else App.state.s = Math.max(1, App.state.s + v);
                document.getElementById('p-val').innerText = App.state.p;
                document.getElementById('s-val').innerText = App.state.s;
            },

            renderRoom: () => {
                const list = document.getElementById('p-list');
                list.innerHTML = "";
                for(let i=0; i<App.state.p; i++) {
                    const isMe = i === 0;
                    list.innerHTML += `
                        <div class="player-slot">
                            <div style="display:flex; align-items:center; gap:12px;">
                                <div class="tg-ava" style="width:40px; height:40px; ${isMe ? 'background-image:url('+tg.initDataUnsafe.user?.photo_url+')' : ''}"></div>
                                <span style="font-family:'Exo 2'; font-size:16px;">${isMe ? '@Вы' : 'ОЖИДАНИЕ...'}</span>
                            </div>
                            <div class="status-tag ${isMe && App.state.isReady ? 'status-ready' : 'status-wait'}" 
                                 style="color:${isMe && App.state.isReady ? 'var(--neon-green)' : 'var(--neon-red)'}">
                                ${isMe && App.state.isReady ? 'ГОТОВ' : 'НЕ ГОТОВ'}
                            </div>
                        </div>`;
                }
                document.getElementById('start-btn').style.display = (App.state.isAdmin && App.state.isReady) ? 'block' : 'none';
            },

            toggleReady: () => {
                App.state.isReady = !App.state.isReady;
                const btn = document.getElementById('ready-btn');
                btn.innerText = App.state.isReady ? 'ОТМЕНА' : 'ГОТОВ';
                btn.style.borderColor = App.state.isReady ? 'var(--neon-red)' : 'var(--neon-green)';
                btn.style.boxShadow = `0 0 15px ${App.state.isReady ? 'var(--neon-red)' : 'var(--neon-green)'}`;
                App.renderRoom();
            }
        };

        // Загрузка ника
        const name = tg.initDataUnsafe.user?.username || "player";
        document.getElementById('my-name-lobby').innerText = "@" + name;
        if(tg.initDataUnsafe.user?.photo_url) document.getElementById('my-ava-lobby').style.backgroundImage = `url(${tg.initDataUnsafe.user.photo_url})`;
    </script>
</body>
</html>
