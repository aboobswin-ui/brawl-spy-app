<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    
    <title>BRAWL STARS SPY | NEON MONOLITH</title>
    
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Black+Ops+One&family=Rubik+One&family=Exo+2:wght@900&display=swap" rel="stylesheet">
    
    <style>
        /* ЦВЕТОВАЯ СХЕМА И ПЕРЕМЕННЫЕ
           Здесь задаются основные параметры неона и фона
        */
        :root {
            --base-bg: #050508;
            --secondary-bg: #0c0c0f;
            --neon-blue-main: #4CC9F0;
            --neon-red-alert: #FF0000;
            --text-pure-white: #FFFFFF;
            --accent-gold: #ffcc00;
            --shadow-intensity: 20px;
            --border-radius-large: 45px;
            --transition-speed: 0.6s;
        }

        /* ГЛОБАЛЬНЫЙ СБРОС (RESET)
           Убираем все лишние отступы для идеального полноэкранного режима
        */
        * { 
            box-sizing: border-box; 
            margin-top: 0px;
            margin-bottom: 0px;
            margin-left: 0px;
            margin-right: 0px;
            padding-top: 0px;
            padding-bottom: 0px;
            padding-left: 0px;
            padding-right: 0px;
            user-select: none; 
            -webkit-tap-highlight-color: transparent; 
            outline: none;
            -webkit-font-smoothing: antialiased;
        }
        
        body { 
            background-color: var(--base-bg); 
            color: var(--text-pure-white); 
            height: 100vh; 
            width: 100vw;
            overflow: hidden; 
            font-family: 'Rubik One', sans-serif;
            display: flex; 
            flex-direction: column; 
            align-items: center;
            justify-content: flex-start;
        }

        /* СИСТЕМА ЭКРАНОВ (SCREENS)
           Каждый экран — это отдельный слой с плавной анимацией появления
        */
        .application-layer { 
            display: none; 
            width: 100%; 
            height: 100%; 
            flex-direction: column; 
            align-items: center; 
            padding-top: 25px;
            padding-bottom: 25px;
            padding-left: 30px;
            padding-right: 30px;
            position: absolute; 
            top: 0; 
            left: 0;
            background-color: var(--base-bg); 
            z-index: 10;
        }

        .layer-active { 
            display: flex; 
            animation-name: layerEntrance;
            animation-duration: 0.45s;
            animation-timing-function: cubic-bezier(0.25, 0.46, 0.45, 0.94);
            animation-fill-mode: forwards;
        }

        @keyframes layerEntrance { 
            from { 
                opacity: 0; 
                transform: scale(0.98) translateY(10px); 
            } 
            to { 
                opacity: 1; 
                transform: scale(1) translateY(0); 
            } 
        }

        /* ЛОГОТИП И ШРИФТЫ
        */
        .branding-title { 
            font-size: 19vw; 
            color: var(--text-pure-white); 
            text-transform: uppercase;
            text-shadow: 0 0 12px var(--neon-red-alert), 0 0 25px var(--neon-red-alert);
            transform: scaleX(1.3); 
            margin-top: 20px;
            margin-bottom: 5px;
            font-weight: 900;
            letter-spacing: -2px;
        }

        .branding-subtitle {
            font-family: 'Black Ops One', cursive;
            font-size: 36px;
            color: var(--accent-gold);
            margin-top: 15px;
            text-shadow: 4px 4px 0px #000;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* ИНТЕРФЕЙС ИГРОКА (ПОДНЯТ ВВЕРХ)
        */
        .player-status-header { 
            color: #FFFFFF !important; 
            font-family: 'Exo 2', sans-serif; 
            font-size: 34px; 
            font-weight: 900;
            margin-top: 15px; 
            margin-bottom: 55px; 
            text-transform: uppercase;
            text-shadow: 0 0 15px rgba(255,255,255,0.25);
            letter-spacing: 2px;
        }

        /* НЕОНОВЫЕ КНОПКИ
        */
        .neon-action-button {
            width: 100%; 
            max-width: 350px; 
            padding-top: 22px;
            padding-bottom: 22px;
            padding-left: 15px;
            padding-right: 15px;
            border-radius: 24px;
            background-color: #000000; 
            border-width: 3px;
            border-style: solid;
            border-color: var(--neon-blue-main);
            color: var(--text-pure-white); 
            font-size: 21px; 
            text-transform: uppercase;
            font-family: 'Exo 2', sans-serif; 
            font-weight: 900; 
            margin-top: 18px;
            box-shadow: 0 0 15px var(--neon-blue-main), inset 0 0 10px rgba(76, 201, 240, 0.4);
            cursor: pointer;
            transition: all 0.25s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .neon-action-button:active {
            transform: scale(0.94);
            box-shadow: 0 0 5px var(--neon-blue-main);
            background-color: #080808;
        }

        /* ПАНЕЛЬ НАСТРОЕК ЛОББИ
        */
        .settings-card {
            width: 100%;
            max-width: 360px;
            background: rgba(12, 12, 15, 0.95);
            border-radius: 35px;
            padding-top: 30px;
            padding-bottom: 30px;
            padding-left: 25px;
            padding-right: 25px;
            margin-top: 35px;
            border: 2px solid var(--neon-blue-main);
            box-shadow: 0 0 25px rgba(76, 201, 240, 0.15);
        }

        .setting-control-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 28px;
        }

        .setting-control-row:last-child {
            margin-bottom: 0px;
        }

        .setting-label-text {
            font-family: 'Exo 2', sans-serif;
            font-size: 20px;
            color: var(--text-pure-white);
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .counter-group-wrapper {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .counter-btn-style {
            width: 48px;
            height: 48px;
            border-radius: 14px;
            background: #000;
            border: 2px solid var(--neon-blue-main);
            color: var(--neon-blue-main);
            font-size: 28px;
            font-family: 'Rubik One', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 12px rgba(76, 201, 240, 0.3);
            transition: 0.2s;
        }

        .counter-btn-style:active {
            background: var(--neon-blue-main);
            color: #000;
        }

        .counter-value-display {
            font-size: 32px;
            font-family: 'Black Ops One', cursive;
            min-width: 40px;
            text-align: center;
            color: var(--text-pure-white);
        }

        /* ИГРОВАЯ КАРТА (FLIP ENGINE)
        */
        .card-view-port { 
            width: 320px; 
            height: 440px; 
            perspective: 1500px; 
            position: relative;
        }

        .card-rotator-engine { 
            position: relative; 
            width: 100%; 
            height: 100%; 
            transition: transform var(--transition-speed) cubic-bezier(0.175, 0.885, 0.32, 1.275); 
            transform-style: preserve-3d; 
        }

        .card-rotator-engine.state-flipped { 
            transform: rotateY(180deg); 
        }

        .card-surface { 
            position: absolute; 
            width: 100%; 
            height: 100%; 
            backface-visibility: hidden; 
            border-radius: var(--border-radius-large); 
            border-width: 8px;
            border-style: solid;
            border-color: var(--neon-blue-main); 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            background-color: var(--secondary-bg); 
            box-shadow: 0 0 35px var(--neon-blue-main);
        }

        .card-surface-front { 
            transform: rotateY(180deg); 
            background-color: #FFFFFF; 
            color: #000000; 
            border-color: var(--neon-red-alert); 
            box-shadow: 0 0 55px var(--neon-red-alert); 
        }

        .character-portrait-img { 
            width: 250px; 
            height: 250px; 
            object-fit: contain; 
            margin-top: 15px;
            margin-bottom: 15px;
        }

        /* ТАЙМЕР И КОДЫ
        */
        .lobby-code-badge { 
            font-size: 55px; 
            color: var(--neon-blue-main); 
            border-width: 3px;
            border-style: solid;
            border-color: var(--neon-blue-main); 
            padding-top: 15px;
            padding-bottom: 15px;
            padding-left: 50px;
            padding-right: 50px;
            border-radius: 25px; 
            margin-top: 25px;
            margin-bottom: 25px;
            font-family: 'Black Ops One'; 
            box-shadow: 0 0 20px rgba(76, 201, 240, 0.4);
            background-color: rgba(0,0,0,0.6);
            text-align: center;
        }

        .timer-countdown-digits { 
            font-size: 100px; 
            color: var(--neon-red-alert); 
            font-family: 'Black Ops One'; 
            margin-top: 25px; 
            text-shadow: 0 0 30px var(--neon-red-alert);
        }

        .back-button-minimal {
            position: absolute;
            top: 30px;
            left: 20px;
            background: none;
            border: none;
            color: #fff;
            font-family: 'Exo 2';
            font-weight: 900;
            font-size: 18px;
            cursor: pointer;
            z-index: 100;
        }

    </style>
</head>
<body>

    <div id="screen-main-menu" class="application-layer layer-active">
        <div style="text-align: center;">
            <span class="branding-title">ШПИОН</span>
            <div class="branding-subtitle">Brawl Stars</div>
        </div>
        
        <div style="width: 100%; max-width: 350px; margin-top: 90px; display: flex; flex-direction: column; align-items: center;">
            <button class="neon-action-button" onclick="uiNavigateTo('screen-lobby-config', true)">Создать комнату</button>
            <button class="neon-action-button" onclick="uiNavigateTo('screen-join-find')">Поиск по коду</button>
        </div>
    </div>

    <div id="screen-lobby-config" class="application-layer">
        <button class="back-button-minimal" onclick="uiNavigateTo('screen-main-menu')">← НАЗАД</button>
        
        <p style="margin-top:90px; opacity:0.6; font-family:'Exo 2'; text-transform:uppercase; letter-spacing: 2px;">ВАШ КОД ЛОББИ:</p>
        <div id="lobby-code-output" class="lobby-code-badge">0000</div>

        <div class="settings-card">
            <div class="setting-control-row">
                <span class="setting-label-text">Игроки:</span>
                <div class="counter-group-wrapper">
                    <button class="counter-btn-style" onclick="configAdjust('p', -1)">-</button>
                    <span id="player-count-val" class="counter-value-display">3</span>
                    <button class="counter-btn-style" onclick="configAdjust('p', 1)">+</button>
                </div>
            </div>
            <div class="setting-control-row">
                <span class="setting-label-text">Шпионы:</span>
                <div class="counter-group-wrapper">
                    <button class="counter-btn-style" onclick="configAdjust('s', -1)">-</button>
                    <span id="spy-count-val" class="counter-value-display">1</span>
                    <button class="counter-btn-style" onclick="configAdjust('s', 1)">+</button>
                </div>
            </div>
        </div>

        <button class="neon-action-button" style="margin-top: 45px; border-color: var(--accent-gold); box-shadow: 0 0 20px var(--accent-gold);" onclick="gameCoreInitialize()">Начать игру</button>
    </div>

    <div id="screen-join-find" class="application-layer">
        <button class="back-button-minimal" onclick="uiNavigateTo('screen-main-menu')">← НАЗАД</button>
        <h2 style="margin-top:110px; font-family:'Exo 2'; color:#FFFFFF; font-size:34px; text-transform:uppercase;">Введите ID</h2>
        <input type="number" class="lobby-code-badge" style="background:none; width:280px; border-color:var(--neon-blue-main); color:#fff;" placeholder="0000">
        <button class="neon-action-button">ПОДКЛЮЧИТЬСЯ</button>
    </div>

    <div id="screen-game-play" class="application-layer">
        <h3 id="current-player-tag" class="player-status-header">ИГРОК 1</h3>
        
        <div class="card-view-port" id="game-card-area" onclick="gameCoreFlip()">
            <div id="card-rotator-obj" class="card-rotator-engine">
                <div class="card-surface">
                    <h1 style="font-size:165px; color:var(--neon-blue-main); text-shadow:0 0 25px var(--neon-blue-main);">?</h1>
                </div>
                <div id="card-dynamic-face" class="card-surface card-surface-front">
                    </div>
            </div>
        </div>

        <div id="discussion-panel" style="display:none; text-align:center;">
            <div id="timer-digits-display" class="timer-countdown-digits">10:00</div>
            <p style="color:#FFFFFF; font-family:'Exo 2'; letter-spacing:5px; font-size:24px; font-weight:900; text-transform:uppercase; margin-top:15px;">КТО ШПИОН?</p>
            <button class="neon-action-button" style="border-color:var(--neon-red-alert); margin-top:50px; box-shadow: 0 0 20px var(--neon-red-alert);" onclick="gameCoreInitialize()">ИГРАТЬ ЕЩЁ РАЗ</button>
        </div>

        <button id="btn-next-step" class="neon-action-button" style="visibility:hidden; margin-top:auto; margin-bottom:40px;" onclick="gameCoreNext()">СЛЕДУЮЩИЙ ИГРОК</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        /*
           БАЗА ПЕРСОНАЖЕЙ (SYNCED DB)
        */
        const CHAR_COLLECTION = [
            { name: "ТАРА", img: "https://cdn.brawlstats.com/character-arts/16000018.png" },
            { name: "ЛЕОН", img: "https://cdn.brawlstats.com/character-arts/16000017.png" },
            { name: "СПАЙК", img: "https://cdn.brawlstats.com/character-arts/16000007.png" },
            { name: "МОРТИС", img: "https://cdn.brawlstats.com/character-arts/16000014.png" },
            { name: "КРОУ", img: "https://cdn.brawlstats.com/character-arts/16000008.png" },
            { name: "ШЕЛЛИ", img: "https://cdn.brawlstats.com/character-arts/16000000.png" },
            { name: "ЭДГАР", img: "https://cdn.brawlstats.com/character-arts/16000042.png" },
            { name: "ФРЭНК", img: "https://cdn.brawlstats.com/character-arts/16000020.png" },
            { name: "ЭЛЬ ПРИМО", img: "https://cdn.brawlstats.com/character-arts/16000012.png" },
            { name: "КОЛЬТ", img: "https://cdn.brawlstats.com/character-arts/16000001.png" }
        ];

        /*
           ИГРОВОЕ СОСТОЯНИЕ (STATE)
        */
        let lobbySettings = { players: 3, spies: 1 };
        let activeGame = {
            currentIdx: 0,
            rolesPool: [],
            isCardFlipped: false,
            remainingTime: 600,
            intervalPtr: null
        };

        /*
           УПРАВЛЕНИЕ НАВИГАЦИЕЙ
        */
        function uiNavigateTo(layerId, isLobbyGen = false) {
            console.log("System: Moving to layer " + layerId);
            
            const layers = document.querySelectorAll('.application-layer');
            layers.forEach(l => l.classList.remove('layer-active'));
            
            const target = document.getElementById(layerId);
            if(target) target.classList.add('layer-active');

            if(isLobbyGen) {
                const randomId = Math.floor(1000 + Math.random() * 8999);
                document.getElementById('lobby-code-output').innerText = randomId;
            }

            if(activeGame.intervalPtr) clearInterval(activeGame.intervalPtr);
        }

        /*
           РЕГУЛИРОВКА ЛОББИ
        */
        function configAdjust(key, delta) {
            if(key === 'p') {
                lobbySettings.players = Math.max(2, Math.min(12, lobbySettings.players + delta));
                // Авто-коррекция шпионов
                if(lobbySettings.spies > lobbySettings.players) {
                    lobbySettings.spies = lobbySettings.players;
                }
            } else if(key === 's') {
                lobbySettings.spies = Math.max(1, Math.min(lobbySettings.players, lobbySettings.spies + delta));
            }

            document.getElementById('player-count-val').innerText = lobbySettings.players;
            document.getElementById('spy-count-val').innerText = lobbySettings.spies;
            
            tg.HapticFeedback.impactOccurred('medium');
        }

        /*
           ЯДРО ИГРЫ: ИНИЦИАЛИЗАЦИЯ
        */
        function gameCoreInitialize() {
            activeGame.currentIdx = 0;
            activeGame.rolesPool = [];
            activeGame.isCardFlipped = false;
            activeGame.remainingTime = 600;

            if(activeGame.intervalPtr) clearInterval(activeGame.intervalPtr);

            // Выбор случайного героя (локации)
            const randomHero = CHAR_COLLECTION[Math.floor(Math.random() * CHAR_COLLECTION.length)];
            
            // Сборка ролей
            let tempPool = [];
            for(let i=0; i < lobbySettings.spies; i++) {
                tempPool.push({
                    name: "ШПИОН", 
                    img: "https://cdn-icons-png.flaticon.com/512/953/953791.png"
                });
            }
            for(let i=0; i < (lobbySettings.players - lobbySettings.spies); i++) {
                tempPool.push(randomHero);
            }
            
            // Фишер-Йейтс перемешивание (Fisher-Yates Shuffle)
            for (let i = tempPool.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [tempPool[i], tempPool[j]] = [tempPool[j], tempPool[i]];
            }
            activeGame.rolesPool = tempPool;

            uiNavigateTo('screen-game-play');
            
            // Сброс визуальных элементов геймплея
            document.getElementById('game-card-area').style.display = 'block';
            document.getElementById('discussion-panel').style.display = 'none';
            document.getElementById('btn-next-step').style.display = 'block';
            document.getElementById('btn-next-step').style.visibility = 'hidden';
            document.getElementById('card-rotator-obj').classList.remove('state-flipped');
            
            gameCoreUpdateLabel();
        }

        /*
           ЯДРО ИГРЫ: ПЕРЕВОРОТ КАРТЫ
        */
        function gameCoreFlip() {
            if(activeGame.isCardFlipped) return;

            const playerRole = activeGame.rolesPool[activeGame.currentIdx];
            const faceContainer = document.getElementById('card-dynamic-face');
            
            faceContainer.innerHTML = `
                <h2 style="font-size:45px; font-family:'Exo 2'; margin-bottom:15px; color:#000; font-weight:900;">${playerRole.name}</h2>
                <img src="${playerRole.img}" class="character-portrait-img">
                <p style="color:red; font-family:'Exo 2'; font-weight:900; font-size:22px; text-transform:uppercase;">НЕ ПОКАЗЫВАЙ!</p>
            `;

            document.getElementById('card-rotator-obj').classList.add('state-flipped');
            document.getElementById('btn-next-step').style.visibility = 'visible';
            activeGame.isCardFlipped = true;

            tg.HapticFeedback.impactOccurred('heavy');
        }

        /*
           ЯДРО ИГРЫ: СЛЕДУЮЩИЙ
        */
        function gameCoreNext() {
            activeGame.currentIdx++;

            if(activeGame.currentIdx < lobbySettings.players) {
                activeGame.isCardFlipped = false;
                document.getElementById('card-rotator-obj').classList.remove('state-flipped');
                document.getElementById('btn-next-step').style.visibility = 'hidden';
                
                setTimeout(() => {
                    gameCoreUpdateLabel();
                }, 350);
                
                tg.HapticFeedback.impactOccurred('medium');
            } else {
                gameCoreStartDiscussion();
            }
        }

        function gameCoreUpdateLabel() {
            document.getElementById('current-player-tag').innerText = "ИГРОК " + (activeGame.currentIdx + 1);
        }

        /*
           ЯДРО ИГРЫ: ТАЙМЕР
        */
        function gameCoreStartDiscussion() {
            document.getElementById('game-card-area').style.display = 'none';
            document.getElementById('btn-next-step').style.display = 'none';
            document.getElementById('discussion-panel').style.display = 'block';
            document.getElementById('current-player-tag').innerText = "ОБСУЖДЕНИЕ";
            
            activeGame.intervalPtr = setInterval(() => {
                activeGame.remainingTime--;
                
                let minutes = Math.floor(activeGame.remainingTime / 60);
                let seconds = activeGame.remainingTime % 60;
                
                document.getElementById('timer-digits-display').innerText = 
                    (minutes < 10 ? "0" + minutes : minutes) + ":" + (seconds < 10 ? "0" + seconds : seconds);

                if(activeGame.remainingTime <= 0) {
                    clearInterval(activeGame.intervalPtr);
                    tg.HapticFeedback.notificationOccurred('error');
                    console.warn("Time's up!");
                }
                
                if(activeGame.remainingTime <= 10 && activeGame.remainingTime > 0) {
                    tg.HapticFeedback.impactOccurred('light');
                }
            }, 1000);
        }

        // Завершение инициализации приложения
        window.addEventListener('load', () => {
            console.log("Application Monolith Build 5.0 Ready.");
            tg.ready();
        });

    </script>
</body>
</html>
