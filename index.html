<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Brawl Spy Full Game</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Rubik+One&display=swap" rel="stylesheet">
    
    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; margin: 0; padding: 0; }
        
        body {
            background-color: #0A0A0F;
            background-image: radial-gradient(circle at 50% 50%, #1a0b2e 0%, #0A0A0F 100%);
            color: white;
            font-family: 'Rubik One', sans-serif;
            height: 100vh;
            width: 100vw;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .app-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .screen {
            display: none;
            width: 100%;
            height: 100%;
            flex-direction: column;
            align-items: center;
            justify-content: space-around;
            padding: 30px 0;
        }

        .active { display: flex !important; }

        h1 {
            font-size: 38px;
            text-transform: uppercase;
            text-align: center;
            text-shadow: 0 0 15px rgba(114, 9, 183, 0.6);
        }

        /* ПАНЕЛЬ ИГРОКА */
        .user-info {
            background: rgba(114, 9, 183, 0.15);
            border: 2px solid #7209B7;
            border-radius: 50px;
            padding: 8px 20px;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: 2px solid white;
        }

        /* ТВОИ МАТОВЫЕ КНОПКИ */
        .btn-main {
            background-color: #1c1c1f; /* Темно-серый матовый */
            border: 3px solid #7209B7;
            border-radius: 20px;
            color: white;
            font-family: 'Rubik One', sans-serif;
            font-size: 18px;
            padding: 22px;
            width: 100%;
            max-width: 300px;
            text-transform: uppercase;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.5);
            transition: 0.1s;
        }

        .btn-main:active { transform: scale(0.95); background-color: #252529; }

        /* НАСТРОЙКИ */
        .settings-card {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 25px;
            padding: 20px;
            width: 100%;
            max-width: 320px;
            border: 1px solid rgba(114, 9, 183, 0.3);
        }

        .row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 15px 0;
        }

        .ctrl-btn {
            width: 45px;
            height: 45px;
            background: #560bad;
            border: none;
            border-radius: 12px;
            color: white;
            font-family: 'Rubik One', sans-serif;
            font-size: 20px;
        }

        /* ИГРОВАЯ КАРТОЧКА */
        .role-card {
            background: #1c1c1f;
            border: 4px solid #7209B7;
            border-radius: 30px;
            width: 280px;
            height: 380px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px;
        }

        .hidden { filter: blur(10px); }

        .timer {
            font-size: 40px;
            color: #f72585;
            margin-top: 10px;
        }

        .back-text {
            color: #555;
            text-transform: uppercase;
            font-size: 12px;
            margin-top: 15px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="app-container">
        
        <div id="screen-start" class="screen active">
            <h1>BRAWL SPY</h1>
            <div class="user-info">
                <img id="u-ava" src="https://cdn-icons-png.flaticon.com/512/847/847969.png" class="avatar">
                <span id="u-name">PLAYER</span>
            </div>
            <button class="btn-main" onclick="show('screen-menu')">ИГРАТЬ</button>
        </div>

        <div id="screen-menu" class="screen">
            <h1>МЕНЮ</h1>
            <button class="btn-main" onclick="show('screen-settings')">Создать комнату</button>
            <button class="btn-main" onclick="tgInvite()">Пригласить друга</button>
            <div class="back-text" onclick="show('screen-start')">назад</div>
        </div>

        <div id="screen-settings" class="screen">
            <h1>КОМНАТА</h1>
            <div class="settings-card">
                <div class="row">
                    <span>ИГРОКИ</span>
                    <div>
                        <button class="ctrl-btn" onclick="set('p',-1)">-</button>
                        <span id="v-p" style="margin:0 15px">4</span>
                        <button class="ctrl-btn" onclick="set('p',1)">+</button>
                    </div>
                </div>
                <div class="row">
                    <span>ШПИОНЫ</span>
                    <div>
                        <button class="ctrl-btn" onclick="set('s',-1)">-</button>
                        <span id="v-s" style="margin:0 15px">1</span>
                        <button class="ctrl-btn" onclick="set('s',1)">+</button>
                    </div>
                </div>
            </div>
            <button class="btn-main" onclick="startGame()">СТАРТ</button>
            <div class="back-text" onclick="show('screen-menu')">назад</div>
        </div>

        <div id="screen-game" class="screen">
            <h1 id="game-status">КТО ТЫ?</h1>
            <div id="card" class="role-card" onclick="revealCard()">
                <div id="card-inner">
                    <p style="font-size: 14px; color: #7209B7;">НАЖМИ ЧТОБЫ УЗНАТЬ</p>
                </div>
            </div>
            <div id="timer" class="timer">05:00</div>
            <button class="btn-main" id="next-btn" style="display:none;" onclick="nextPlayer()">СЛЕД. ИГРОК</button>
        </div>

    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        let players = 4, spies = 1, currentPlayer = 0;
        let roles = [], locations = ["ШКОЛА", "БОЛЬНИЦА", "БАЗАР", "КОСМОС", "ЦИРК", "БАНК"];
        let gameActive = false;

        function show(id) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            tg.HapticFeedback.impactOccurred('medium');
        }

        function set(t, v) {
            if(t==='p') { players = Math.max(3, Math.min(15, players+v)); document.getElementById('v-p').innerText = players; }
            else { spies = Math.max(1, Math.min(players-1, spies+v)); document.getElementById('v-s').innerText = spies; }
            tg.HapticFeedback.selectionChanged();
        }

        function startGame() {
            roles = [];
            let loc = locations[Math.floor(Math.random()*locations.length)];
            for(let i=0; i<players; i++) roles.push(loc);
            for(let i=0; i<spies; i++) roles[i] = "ШПИОН 🕵️";
            roles.sort(() => Math.random() - 0.5);
            
            currentPlayer = 0;
            show('screen-game');
            updateCardDisplay(true);
        }

        function updateCardDisplay(isLocked) {
            const inner = document.getElementById('card-inner');
            if(isLocked) {
                inner.innerHTML = '<p style="font-size: 20px;">КЛАТЦ!</p>';
                document.getElementById('next-btn').style.display = 'none';
            } else {
                inner.innerHTML = `<h2>${roles[currentPlayer]}</h2>`;
                document.getElementById('next-btn').style.display = 'block';
            }
        }

        function revealCard() {
            updateCardDisplay(false);
            tg.HapticFeedback.notificationOccurred('success');
        }

        function nextPlayer() {
            currentPlayer++;
            if(currentPlayer >= players) {
                document.getElementById('game-status').innerText = "ИГРА ИДЕТ!";
                document.getElementById('card').style.display = 'none';
                document.getElementById('next-btn').innerText = "ЗАКОНЧИТЬ";
                document.getElementById('next-btn').onclick = () => location.reload();
                startTimer(300);
            } else {
                updateCardDisplay(true);
            }
        }

        function startTimer(duration) {
            let timer = duration, min, sec;
            setInterval(() => {
                min = parseInt(timer / 60, 10);
                sec = parseInt(timer % 60, 10);
                document.getElementById('timer').innerText = `${min < 10 ? "0" + min : min}:${sec < 10 ? "0" + sec : sec}`;
                if (--timer < 0) timer = 0;
            }, 1000);
        }

        function tgInvite() { tg.switchInlineQuery("Го в Brawl Spy!"); }

        // Инициализация юзера
        const u = tg.initDataUnsafe?.user;
        if(u) {
            document.getElementById('u-name').innerText = u.first_name.toUpperCase();
            if(u.photo_url) document.getElementById('u-ava').src = u.photo_url;
        }
    </script>
</body>
</html>
