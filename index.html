<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>BRAWL SPY ULTIMATE EDITION</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Black+Ops+One&family=Rubik+One&family=Exo+2:wght@900&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>
        :root {
            --neon-blue: #00d2ff;
            --neon-red: #ff3131;
            --neon-gold: #ffd700;
            --neon-green: #00ff00;
            --bg-black: #020205;
            --glow-white: rgba(255, 255, 255, 0.9);
        }

        /* БАЗОВЫЕ СТИЛИ */
        * { 
            box-sizing: border-box; 
            margin: 0; padding: 0; 
            -webkit-user-select: none; 
            -webkit-tap-highlight-color: transparent;
            outline: none; 
        }

        body { 
            background: var(--bg-black); 
            color: #fff; 
            font-family: 'Rubik One', sans-serif; 
            height: 100vh; 
            overflow: hidden; 
            display: flex; 
            justify-content: center;
        }

        .app-container {
            width: 100%;
            height: 100%;
            max-width: 500px;
            position: relative;
            display: flex;
            flex-direction: column;
        }

        .screen {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            display: none;
            flex-direction: column;
            align-items: center;
            padding: 50px 30px;
            background: var(--bg-black);
            z-index: 10;
        }

        .screen.active { display: flex; animation: screenIn 0.3s ease-out; }

        @keyframes screenIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* --- ГЛАВНОЕ МЕНЮ --- */
        .main-logo-container { text-align: center; margin-bottom: 50px; margin-top: 30px; }
        .logo-main { font-size: 100px; color: var(--neon-red); text-shadow: 0 0 30px var(--neon-red); line-height: 0.9; }
        .logo-sub { font-family: 'Black Ops One'; font-size: 28px; color: var(--neon-gold); letter-spacing: 2px; }

        .menu-list { width: 100%; display: flex; flex-direction: column; gap: 18px; }

        .btn-universal {
            width: 100%;
            padding: 24px;
            background: #000;
            border: 4px solid var(--neon-blue);
            box-shadow: 0 0 15px var(--neon-blue);
            border-radius: 35px;
            color: #fff;
            font-family: 'Exo 2';
            font-weight: 900;
            font-size: 22px;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.2s active;
        }

        .btn-universal:active { transform: scale(0.96); filter: brightness(1.2); }

        /* СПЕЦИАЛЬНАЯ КНОПКА №6 [cite: 2026-01-04] */
        .btn-create-room {
            border-color: var(--neon-gold);
            box-shadow: 0 0 20px var(--neon-gold);
            color: #ffffff !important; /* Белый текст */
        }

        /* --- НАСТРОЙКИ ЛОББИ [cite: 2026-01-03] --- */
        .setup-header { 
            font-family: 'Exo 2'; 
            font-size: 30px; 
            color: #fff; 
            text-shadow: 0 0 15px var(--glow-white); 
            margin-bottom: 40px; 
            text-align: center;
        }

        .tabs-wrapper { display: flex; width: 100%; gap: 15px; margin-bottom: 35px; }
        .tab-item { 
            flex: 1; padding: 20px; border-radius: 20px; text-align: center; 
            font-family: 'Exo 2'; font-size: 15px; border: 3px solid; background: #000; 
            text-transform: uppercase;
        }
        .tab-participants { border-color: var(--neon-blue); box-shadow: 0 0 15px var(--neon-blue); color: var(--neon-blue); }
        .tab-spy-mode { border-color: var(--neon-red); box-shadow: 0 0 15px var(--neon-red); color: var(--neon-red); }

        .setting-box { width: 100%; margin-bottom: 30px; }
        .setting-label { font-family: 'Exo 2'; font-size: 14px; margin-bottom: 15px; color: #aaa; display: flex; justify-content: space-between; }
        .setting-value { color: #fff; font-family: 'Black Ops One'; font-size: 20px; }

        input[type=range] {
            width: 100%; -webkit-appearance: none; background: transparent;
        }
        input[type=range]::-webkit-slider-runnable-track {
            width: 100%; height: 8px; background: #222; border-radius: 4px;
        }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none; height: 24px; width: 24px; border-radius: 50%;
            background: #fff; box-shadow: 0 0 10px #fff; margin-top: -8px;
        }

        /* --- ЭКРАН ВВОДА ID --- */
        .id-input-title { font-family: 'Exo 2'; font-size: 32px; color: #fff; margin-bottom: 20px; }
        .id-display-container { display: flex; align-items: center; gap: 10px; margin: 40px 0; }
        .id-digit-cell { 
            font-family: 'Black Ops One'; font-size: 45px; width: 40px; text-align: center; 
            border-bottom: 4px solid #fff; color: #fff; text-shadow: 0 0 10px #fff;
        }
        .id-separator { font-family: 'Black Ops One'; font-size: 40px; color: #fff; transform: translateY(-5px); }

        .keypad-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; width: 100%; }
        .keypad-btn { 
            aspect-ratio: 1/1; background: #0d0d14; border: 2px solid #1a1a25; border-radius: 25px; 
            font-size: 32px; color: #fff; font-family: 'Black Ops One'; display: flex; 
            justify-content: center; align-items: center; transition: background 0.1s;
        }
        .keypad-btn:active { background: #222; }

        /* --- ЛОББИ ОНЛАЙН --- */
        .lobby-id-tag { font-family: 'Black Ops One'; font-size: 26px; color: var(--neon-gold); margin-bottom: 30px; }
        .players-scroll-area { width: 100%; flex: 1; overflow-y: auto; padding-right: 5px; margin-bottom: 20px; }
        .player-row { 
            width: 100%; background: rgba(255,255,255,0.05); border: 2px solid #222; 
            border-radius: 22px; padding: 18px; display: flex; justify-content: space-between; 
            align-items: center; margin-bottom: 12px;
        }
        .tag-ready { color: var(--neon-green); text-shadow: 0 0 10px var(--neon-green); font-family: 'Exo 2'; font-size: 14px; text-transform: uppercase; }
        .tag-wait { color: var(--neon-red); text-shadow: 0 0 10px var(--neon-red); font-family: 'Exo 2'; font-size: 14px; text-transform: uppercase; }

        .bottom-actions { margin-top: auto; width: 100%; display: flex; flex-direction: column; gap: 15px; }

    </style>
</head>
<body>
    <div class="app-container">
        
        <div id="scr-menu" class="screen active">
            <div class="main-logo-container">
                <div class="logo-main">SPY</div>
                <div class="logo-sub">BRAWL STARS</div>
            </div>
            <div class="menu-list">
                <button class="btn-universal" onclick="App.nav('scr-setup')">НАСТРОЙКИ БИТВЫ</button>
                <button class="btn-universal" onclick="App.nav('scr-join')">ВХОД ПО ID</button>
                <div style="height: 120px;"></div> <button class="btn-universal btn-create-room" onclick="App.nav('scr-setup')">СОЗДАТЬ КОМНАТУ</button>
            </div>
        </div>

        <div id="scr-setup" class="screen">
            <h2 class="setup-header">НАСТРОЙКА ЛОББИ</h2>
            <div class="tabs-wrapper">
                <div class="tab-item tab-participants">УЧАСТНИКИ</div>
                <div class="tab-item tab-spy-mode">ШПИОН</div>
            </div>

            <div class="setting-box">
                <div class="setting-label">УЧАСТНИКИ <span class="setting-value" id="val-p">8</span></div>
                <input type="range" min="3" max="20" value="8" oninput="document.getElementById('val-p').innerText = this.value">
            </div>

            <div class="setting-box">
                <div class="setting-label">ШПИОНЫ <span class="setting-value" id="val-s">1</span></div>
                <input type="range" min="1" max="5" value="1" oninput="document.getElementById('val-s').innerText = this.value">
            </div>

            <div class="setting-box">
                <div class="setting-label">ВРЕМЯ (МИН) <span class="setting-value" id="val-t">5</span></div>
                <input type="range" min="1" max="15" value="5" oninput="document.getElementById('val-t').innerText = this.value">
            </div>

            <div id="setup-id-display" style="font-family:'Black Ops One'; color:var(--neon-gold); margin: 20px 0; font-size: 24px;">ID: ....-....</div>

            <div class="bottom-actions">
                <button class="btn-universal btn-create-room" onclick="App.createRoom()">СОЗДАТЬ КОМНАТУ</button>
                <button class="btn-universal" style="border-color:#333; box-shadow:none;" onclick="App.nav('scr-menu')">МЕНЮ</button>
            </div>
        </div>

        <div id="scr-join" class="screen">
            <h2 class="id-input-title">ID КОМНАТЫ</h2>
            <div class="id-display-container">
                <div class="id-digit-cell" id="c1">_</div><div class="id-digit-cell" id="c2">_</div><div class="id-digit-cell" id="c3">_</div><div class="id-digit-cell" id="c4">_</div>
                <div class="id-separator">-</div>
                <div class="id-digit-cell" id="c5">_</div><div class="id-digit-cell" id="c6">_</div><div class="id-digit-cell" id="c7">_</div><div class="id-digit-cell" id="c8">_</div>
            </div>
            
            <div class="keypad-grid">
                <script>
                    for(let i=1; i<=9; i++) document.write(`<div class="keypad-btn" onclick="App.press('${i}')">${i}</div>`);
                </script>
                <div class="keypad-btn" style="color:var(--neon-red)" onclick="App.press('C')">C</div>
                <div class="keypad-btn" onclick="App.press('0')">0</div>
                <div class="keypad-btn" style="color:var(--neon-gold)" onclick="App.joinRoom()">OK</div>
            </div>
            <button class="btn-universal" style="margin-top:40px; border-color:#222; box-shadow:none;" onclick="App.nav('scr-menu')">НАЗАД</button>
        </div>

        <div id="scr-room" class="screen">
            <h2 class="setup-header">ЛОББИ БИТВЫ</h2>
            <div id="lobby-id-active" class="lobby-id-tag">ID: ....-....</div>
            <div class="players-scroll-area" id="player-list-ui"></div>
            
            <div class="bottom-actions">
                <button class="btn-universal" id="ready-btn" style="border-color:var(--neon-green); box-shadow: 0 0 15px var(--neon-green);" onclick="App.toggleReady()">ГОТОВ</button>
                <button class="btn-universal btn-create-room" id="start-game-btn" style="display:none">НАЧАТЬ ИГРУ</button>
                <button class="btn-universal" style="border-color:var(--neon-red); box-shadow:none;" onclick="App.leaveRoom()">ВЫЙТИ</button>
            </div>
        </div>

    </div>

    <script>
        // Конфигурация Firebase
        const firebaseConfig = {
            apiKey: "AIzaSyDbopGDAnN6RxiXoAk_Il90WZBCW0bVBvg",
            authDomain: "brawlspy.firebaseapp.com",
            databaseURL: "https://brawlspy-default-rtdb.firebaseio.com",
            projectId: "brawlspy",
            storageBucket: "brawlspy.firebasestorage.app",
            messagingSenderId: "803859610634",
            appId: "1:803859610634:web:2310aa16bb6e61049833f3"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        const tg = window.Telegram.WebApp;
        tg.expand();

        const user = tg.initDataUnsafe.user || { id: Date.now(), username: "Guest" };

        const App = {
            room: null,
            codeBuffer: "",
            readyStatus: false,

            nav: (id) => {
                document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
                document.getElementById(id).classList.add('active');
                if(id === 'scr-setup') {
                    const id1 = Math.floor(1000 + Math.random() * 8999);
                    const id2 = Math.floor(1000 + Math.random() * 8999);
                    App.room = id1 + "-" + id2;
                    document.getElementById('setup-id-display').innerText = "ID: " + App.room;
                }
            },

            press: (val) => {
                if(val === 'C') App.codeBuffer = "";
                else if(App.codeBuffer.length < 8) App.codeBuffer += val;
                for(let i=1; i<=8; i++) document.getElementById('c'+i).innerText = App.codeBuffer[i-1] || "_";
                tg.HapticFeedback.impactOccurred('medium');
            },

            createRoom: () => { App.nav('scr-room'); App.sync(); },
            joinRoom: () => {
                if(App.codeBuffer.length === 8) {
                    App.room = App.codeBuffer.slice(0,4) + "-" + App.codeBuffer.slice(4,8);
                    App.nav('scr-room'); App.sync();
                }
            },

            sync: () => {
                document.getElementById('lobby-id-active').innerText = "ID: " + App.room;
                const pRef = db.ref('rooms/' + App.room + '/players/' + user.id);
                pRef.set({ name: "@" + (user.username || "player"), ready: false });

                db.ref('rooms/' + App.room + '/players').on('value', (snap) => {
                    const data = snap.val();
                    const container = document.getElementById('player-list-ui');
                    container.innerHTML = "";
                    if(data) {
                        Object.keys(data).forEach(uid => {
                            const p = data[uid];
                            container.innerHTML += `
                                <div class="player-row">
                                    <span style="font-family:'Exo 2'; font-size:18px;">${p.name}</span>
                                    <span class="${p.ready ? 'tag-ready' : 'tag-wait'}">${p.ready ? 'ГОТОВ' : 'ЖДЕМ'}</span>
                                </div>`;
                        });
                    }
                });
            },

            toggleReady: () => {
                App.readyStatus = !App.readyStatus;
                db.ref('rooms/' + App.room + '/players/' + user.id).update({ ready: App.readyStatus });
                const btn = document.getElementById('ready-btn');
                btn.innerText = App.readyStatus ? "ОТМЕНА" : "ГОТОВ";
                btn.style.borderColor = App.readyStatus ? "var(--neon-red)" : "var(--neon-green)";
                tg.HapticFeedback.notificationOccurred('success');
            },

            leaveRoom: () => {
                if(App.room) db.ref('rooms/' + App.room + '/players/' + user.id).remove();
                location.reload();
            }
        };
    </script>
</body>
</html>
