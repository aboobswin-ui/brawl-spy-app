<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Brawl Spy Full Matte</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@500&display=swap" rel="stylesheet">
    
    <style>
        /* БАЗОВЫЕ СТИЛИ */
        * { 
            box-sizing: border-box; 
            -webkit-tap-highlight-color: transparent; 
            margin: 0; 
            padding: 0; 
        }
        
        body {
            background-color: #0A0A0F;
            background-image: radial-gradient(circle at 50% 50%, #1a0b2e 0%, #0A0A0F 100%);
            color: white;
            font-family: 'Rubik', sans-serif; /* Измененный шрифт */
            height: 100vh;
            width: 100vw;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            user-select: none;
        }

        .app-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        /* ЭКРАНЫ */
        .screen {
            display: none;
            width: 100%;
            height: 100%;
            flex-direction: column;
            align-items: center;
            justify-content: space-around;
            padding: 40px 0;
        }

        .active { 
            display: flex !important; 
        }

        /* ЗАГОЛОВКИ */
        h1 {
            font-size: 42px;
            text-transform: uppercase;
            text-align: center;
            color: #FFFFFF;
            text-shadow: 0 0 10px rgba(114, 9, 183, 0.4);
            font-weight: 500;
        }

        /* ПРОФИЛЬ ЮЗЕРА */
        .user-card {
            background: rgba(114, 9, 183, 0.1);
            border: 2px solid #7209B7;
            border-radius: 50px;
            padding: 10px 25px;
            display: flex;
            align-items: center;
            margin-top: 15px;
        }

        .user-avatar {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            border: 2px solid #FFFFFF;
            margin-right: 15px;
            object-fit: cover;
        }

        /* ТОТ САМЫЙ ЧЕРНЫЙ МАТОВЫЙ СТИЛЬ КНОПОК */
        .btn-action {
            background-color: #000000; /* Глубокий черный матовый */
            border: 2px solid #7209B7; /* Фиолетовая рамка */
            border-radius: 20px;
            color: white;
            font-family: 'Rubik', sans-serif;
            font-weight: 500; /* Не жирный шрифт */
            font-size: 20px;
            padding: 20px;
            width: 100%;
            max-width: 300px;
            text-transform: uppercase;
            cursor: pointer;
            text-align: center;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.5);
            transition: transform 0.1s;
            letter-spacing: 1px;
        }

        .btn-action:active {
            transform: scale(0.96);
            background-color: #080808;
        }

        /* НАСТРОЙКИ КОМНАТЫ */
        .settings-box {
            background: rgba(255, 255, 255, 0.03);
            border-radius: 25px;
            width: 100%;
            max-width: 320px;
            padding: 15px;
            border: 1px solid rgba(114, 9, 183, 0.2);
        }

        .setting-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 5px;
        }

        .counter-btn {
            width: 44px;
            height: 44px;
            background: #560bad;
            border: none;
            border-radius: 12px;
            color: white;
            font-size: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .counter-value {
            font-size: 26px;
            min-width: 35px;
            text-align: center;
            margin: 0 10px;
        }

        .btn-back {
            color: #666;
            text-transform: uppercase;
            font-size: 14px;
            margin-top: 10px;
            cursor: pointer;
            letter-spacing: 2px;
        }
    </style>
</head>
<body>

    <div class="app-container">
        
        <div id="main-screen" class="screen active">
            <div style="text-align: center;">
                <h1>BRAWL SPY</h1>
                <div class="user-card">
                    <img id="player-avatar" src="https://cdn-icons-png.flaticon.com/512/847/847969.png" class="user-avatar">
                    <span id="player-name">ИГРОК</span>
                </div>
            </div>
            <button class="btn-action" onclick="navigateTo('menu-screen')">ИГРАТЬ</button>
        </div>

        <div id="menu-screen" class="screen">
            <h1>МЕНЮ</h1>
            <div style="width: 100%; display: flex; flex-direction: column; align-items: center; gap: 20px;">
                <button class="btn-action" onclick="navigateTo('room-screen')">Создать комнату</button>
                <button class="btn-action" onclick="sendInvite()">Пригласить друга</button>
            </div>
            <div class="btn-back" onclick="navigateTo('main-screen')">назад</div>
        </div>

        <div id="room-screen" class="screen">
            <h1>КОМНАТА</h1>
            <div class="settings-box">
                <div class="setting-row">
                    <span>ИГРОКОВ</span>
                    <div style="display: flex; align-items: center;">
                        <button class="counter-btn" onclick="updateValue('players', -1)">-</button>
                        <span id="players-count" class="counter-value">4</span>
                        <button class="counter-btn" onclick="updateValue('players', 1)">+</button>
                    </div>
                </div>
                <div class="setting-row">
                    <span>ШПИОНОВ</span>
                    <div style="display: flex; align-items: center;">
                        <button class="counter-btn" onclick="updateValue('spies', -1)">-</button>
                        <span id="spies-count" class="counter-value">1</span>
                        <button class="counter-btn" onclick="updateValue('spies', 1)">+</button>
                    </div>
                </div>
            </div>
            <button class="btn-action" onclick="sendInvite()">ПОЗВАТЬ ДРУЗЕЙ</button>
            <div class="btn-back" onclick="navigateTo('menu-screen')">назад</div>
        </div>

    </div>

    <script>
        const webApp = window.Telegram.WebApp;
        webApp.expand();
        webApp.ready();

        // Данные юзера
        function setupUser() {
            const userData = webApp.initDataUnsafe?.user;
            if (userData) {
                document.getElementById('player-name').innerText = (userData.first_name || "ИГРОК").toUpperCase();
                if (userData.photo_url) document.getElementById('player-avatar').src = userData.photo_url;
            }
        }

        // Навигация
        function navigateTo(screenId) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(screenId).classList.add('active');
            webApp.HapticFeedback.impactOccurred('medium');
        }

        // Логика цифр
        function updateValue(type, change) {
            const pEl = document.getElementById('players-count');
            const sEl = document.getElementById('spies-count');
            let p = parseInt(pEl.innerText);
            let s = parseInt(sEl.innerText);

            if (type === 'players') {
                p += change;
                if (p < 3) p = 3; if (p > 15) p = 15;
                pEl.innerText = p;
                if (s >= p) sEl.innerText = p - 1;
            } else {
                s += change;
                if (s < 1) s = 1; if (s >= p) s = p - 1;
                sEl.innerText = s;
            }
            webApp.HapticFeedback.selectionChanged();
        }

        function sendInvite() {
            webApp.switchInlineQuery("Го в Brawl Spy!");
        }

        window.onload = setupUser;
    </script>
</body>
</html>
