<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>BRAWL SPY ULTIMATE EDITION 2026</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Black+Ops+One&family=Rubik+One&family=Exo+2:wght@700;900&display=swap" rel="stylesheet">
    
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    
    <style>
        /* --- ГЛОБАЛЬНЫЕ ПЕРЕМЕННЫЕ ЦВЕТОВ --- */
        :root {
            --neon-blue: #00d2ff;
            --neon-red: #ff3131;
            --neon-gold: #ffd700;
            --neon-green: #00ff00;
            --bg-black: #020205;
            --card-bg: #0a0a10;
            --glow-white: rgba(255, 255, 255, 0.9);
            --transition-speed: 0.25s;
        }

        /* --- СБРОС СТИЛЕЙ И БАЗА --- */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
            outline: none;
        }

        html, body {
            width: 100%;
            height: 100%;
            background-color: var(--bg-black);
            color: #ffffff;
            font-family: 'Rubik One', sans-serif;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* --- ОСНОВНАЯ ОБОЛОЧКА ПРИЛОЖЕНИЯ --- */
        .app-shell {
            width: 100%;
            height: 100%;
            max-width: 450px;
            background: radial-gradient(circle at center, #0a0a1a 0%, #020205 100%);
            position: relative;
            display: flex;
            flex-direction: column;
            box-shadow: 0 0 50px rgba(0,0,0,1);
            overflow: hidden;
        }

        /* --- СИСТЕМА ЭКРАНОВ --- */
        .screen {
            position: absolute;
            inset: 0;
            display: none;
            flex-direction: column;
            align-items: center;
            padding: 25px 20px;
            z-index: 10;
            opacity: 0;
            transform: scale(1.05);
            transition: opacity var(--transition-speed), transform var(--transition-speed);
            overflow-y: auto;
            overflow-x: hidden;
        }

        .screen.active {
            display: flex;
            opacity: 1;
            transform: scale(1);
        }

        /* --- МОДАЛЬНЫЕ ОКНА (ИГРОВЫЕ) --- */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            backdrop-filter: blur(5px);
        }

        .modal-overlay.active {
            display: flex;
            animation: fadeIn 0.3s ease;
        }

        .modal-container {
            background: var(--card-bg);
            border: 4px solid var(--neon-blue);
            border-radius: 25px;
            padding: 30px;
            width: 90%;
            max-width: 380px;
            text-align: center;
            box-shadow: 0 0 40px rgba(0, 210, 255, 0.5);
            animation: modalAppear 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .modal-container.red-border {
            border-color: var(--neon-red);
            box-shadow: 0 0 40px rgba(255, 49, 49, 0.5);
        }

        .modal-container.gold-border {
            border-color: var(--neon-gold);
            box-shadow: 0 0 40px rgba(255, 215, 0, 0.5);
        }

        .modal-title {
            font-family: 'Exo 2';
            font-size: 28px;
            color: #ffffff;
            margin-bottom: 20px;
            text-transform: uppercase;
            text-shadow: 0 0 15px var(--glow-white);
        }

        .modal-message {
            font-family: 'Exo 2';
            font-size: 18px;
            color: #cccccc;
            margin-bottom: 30px;
            line-height: 1.5;
        }

        .modal-buttons {
            display: flex;
            gap: 15px;
            justify-content: center;
        }

        .modal-btn {
            flex: 1;
            padding: 16px;
            border: none;
            border-radius: 18px;
            font-family: 'Exo 2';
            font-weight: 900;
            font-size: 18px;
            cursor: pointer;
            transition: all 0.2s;
            text-transform: uppercase;
        }

        .modal-btn:active {
            transform: scale(0.95);
        }

        .modal-btn-confirm {
            background: #000;
            border: 3px solid var(--neon-green);
            color: var(--neon-green);
            box-shadow: 0 0 15px rgba(0, 255, 0, 0.3);
        }

        .modal-btn-cancel {
            background: #000;
            border: 3px solid var(--neon-red);
            color: var(--neon-red);
            box-shadow: 0 0 15px rgba(255, 49, 49, 0.3);
        }

        /* АНИМАЦИИ */
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes modalAppear {
            from { transform: scale(0.8) rotate(-5deg); opacity: 0; }
            to { transform: scale(1) rotate(0); opacity: 1; }
        }

        /* --- ЭКРАН 1: ГЛАВНОЕ МЕНЮ --- */
        .main-menu-header {
            text-align: center;
            margin-top: 40px;
            margin-bottom: 50px;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .main-logo-text {
            font-size: 100px;
            color: var(--neon-red);
            text-shadow: 0 0 40px var(--neon-red), 0 0 10px rgba(0,0,0,0.5);
            line-height: 0.8;
            letter-spacing: -2px;
            margin-bottom: 5px;
        }

        .sub-logo-text {
            font-family: 'Black Ops One';
            font-size: 32px;
            color: var(--neon-gold);
            margin-top: 15px;
            text-shadow: 0 0 15px rgba(255, 215, 0, 0.4);
        }

        .edition-label {
            font-family: 'Exo 2';
            font-size: 16px;
            font-weight: 400;
            color: #ffffff;
            opacity: 0.7;
            margin-top: 8px;
            letter-spacing: 3px;
            text-transform: uppercase;
        }

        /* --- УНИВЕРСАЛЬНЫЕ КНОПКИ (БЕЗ ОБВОДКИ, С СВЕЧЕНИЕМ) --- */
        .btn-action {
            width: 100%;
            max-width: 320px;
            padding: 18px;
            background: rgba(0, 0, 0, 0.8);
            border: none; /* УБИРАЕМ ОБВОДКУ */
            border-radius: 20px;
            color: #ffffff;
            font-family: 'Exo 2';
            font-weight: 900;
            font-size: 20px;
            text-transform: uppercase;
            margin: 0 auto 15px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.15s ease;
            /* ЛЕГКОЕ СВЕЧЕНИЕ БЕЗ ОБВОДКИ */
            box-shadow: 0 0 15px rgba(0, 210, 255, 0.3),
                        0 0 30px rgba(0, 210, 255, 0.1) inset;
        }

        .btn-action:active {
            transform: scale(0.96);
            box-shadow: 0 0 25px rgba(0, 210, 255, 0.5),
                        0 0 40px rgba(0, 210, 255, 0.2) inset;
        }

        .btn-secondary {
            background: rgba(30, 30, 30, 0.8);
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.1),
                        0 0 20px rgba(255, 255, 255, 0.05) inset;
            color: #aaaaaa;
            margin-top: auto;
            font-size: 18px;
            border-radius: 20px;
            max-width: 320px;
        }

        /* --- ЭКРАН 2: ВВОД ID --- */
        .title-neon-white {
            font-family: 'Exo 2';
            font-size: 28px;
            color: #ffffff;
            text-shadow: 0 0 20px var(--glow-white);
            margin-bottom: 30px;
            text-transform: uppercase;
            text-align: center;
            width: 100%;
        }

        .id-input-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            margin-bottom: 35px;
            height: 60px;
        }

        .id-digit-box {
            font-family: 'Black Ops One';
            font-size: 32px;
            color: #ffffff;
            text-shadow: 0 0 10px var(--glow-white);
            width: 30px;
            text-align: center;
            border-bottom: 3px solid #ffffff;
            padding-bottom: 3px;
            height: 50px;
            display: flex;
            align-items: flex-end;
            justify-content: center;
        }

        .id-hyphen {
            font-family: 'Black Ops One';
            font-size: 28px;
            color: #ffffff;
            text-shadow: 0 0 10px var(--glow-white);
            margin: 0 6px;
            display: flex;
            align-items: center;
            height: 100%;
        }

        /* ЦИФРОВАЯ КЛАВИАТУРА */
        .numpad-container {
            width: 100%;
            display: flex;
            justify-content: center;
            margin-bottom: 25px;
        }

        .numpad-grid {
            display: grid;
            grid-template-columns: repeat(3, 70px);
            gap: 12px;
            justify-content: center;
        }

        .n-key {
            width: 70px;
            height: 70px;
            background: rgba(20, 20, 30, 0.8);
            border: none;
            border-radius: 16px;
            font-size: 28px;
            color: #ffffff;
            font-family: 'Black Ops One';
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.1s;
            box-shadow: 0 0 10px rgba(0, 210, 255, 0.1),
                        0 0 15px rgba(0, 210, 255, 0.05) inset;
        }

        .n-key:active {
            background: rgba(40, 40, 60, 0.8);
            transform: scale(0.9);
            box-shadow: 0 0 15px rgba(0, 210, 255, 0.2),
                        0 0 25px rgba(0, 210, 255, 0.1) inset;
        }

        /* --- ЭКРАН 3: НАСТРОЙКА ЛОББИ --- */
        .id-display-white {
            color: #ffffff;
            font-family: 'Black Ops One';
            font-size: 18px;
            letter-spacing: 1px;
            margin-bottom: 20px;
            text-align: center;
            width: 100%;
            opacity: 0.8;
        }

        .user-identity-card {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin: 0 auto 25px;
            width: 100%;
            max-width: 320px;
        }

        .avatar-frame {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            border: 2px solid #ffffff;
            box-shadow: 0 0 10px var(--glow-white);
            background: #222 center/cover;
        }

        .username-label {
            font-family: 'Exo 2';
            font-size: 16px;
            color: #ffffff;
            text-shadow: 0 0 8px #ffffff;
        }

        /* НОВЫЙ СТИЛЬ НАСТРОЕК (БЕЗ ОБВОДКИ, КОМПАКТНЫЙ) */
        .settings-row {
            width: 100%;
            max-width: 320px;
            background: rgba(15, 15, 25, 0.6);
            border: none; /* УБИРАЕМ ОБВОДКУ */
            border-radius: 18px;
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 0 auto 12px;
            /* ЛЕГКОЕ СВЕЧЕНИЕ */
            box-shadow: 0 0 12px rgba(0, 210, 255, 0.15),
                        0 0 20px rgba(0, 210, 255, 0.05) inset;
        }

        .settings-row.red-theme {
            box-shadow: 0 0 12px rgba(255, 49, 49, 0.15),
                        0 0 20px rgba(255, 49, 49, 0.05) inset;
        }

        .control-group {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .circle-btn {
            width: 38px;
            height: 38px;
            background: rgba(0, 0, 0, 0.7);
            border: none; /* УБИРАЕМ ОБВОДКУ */
            border-radius: 10px;
            color: var(--neon-blue);
            font-size: 26px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Rubik One';
            cursor: pointer;
            /* СВЕЧЕНИЕ */
            box-shadow: 0 0 8px rgba(0, 210, 255, 0.2),
                        0 0 12px rgba(0, 210, 255, 0.1) inset;
        }

        .circle-btn.red-btn {
            color: var(--neon-red);
            box-shadow: 0 0 8px rgba(255, 49, 49, 0.2),
                        0 0 12px rgba(255, 49, 49, 0.1) inset;
        }

        .circle-btn:active {
            transform: scale(0.9);
            box-shadow: 0 0 12px rgba(0, 210, 255, 0.3),
                        0 0 18px rgba(0, 210, 255, 0.15) inset;
        }

        .circle-btn.red-btn:active {
            box-shadow: 0 0 12px rgba(255, 49, 49, 0.3),
                        0 0 18px rgba(255, 49, 49, 0.15) inset;
        }

        .value-display {
            font-family: 'Black Ops One';
            font-size: 26px;
            min-width: 26px;
            text-align: center;
            color: #ffffff;
            text-shadow: 0 0 10px var(--glow-white);
        }

        /* КНОПКА СОЗДАТЬ КОМНАТУ */
        .btn-create-lobby {
            width: 100%;
            max-width: 320px;
            padding: 18px;
            background: rgba(0, 0, 0, 0.8);
            border: none; /* УБИРАЕМ ОБВОДКУ */
            box-shadow: 0 0 15px rgba(255, 215, 0, 0.3),
                        0 0 30px rgba(255, 215, 0, 0.1) inset;
            border-radius: 20px;
            color: #ffffff;
            font-family: 'Exo 2';
            font-weight: 900;
            font-size: 20px;
            text-transform: uppercase;
            margin: 15px auto 0;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.15s ease;
        }

        .btn-create-lobby:active {
            transform: scale(0.96);
            box-shadow: 0 0 25px rgba(255, 215, 0, 0.5),
                        0 0 40px rgba(255, 215, 0, 0.2) inset;
        }

        /* --- ЭКРАН 4: АКТИВНАЯ КОМНАТА --- */
        .players-scroll-area {
            width: 100%;
            max-width: 320px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin: 0 auto 20px;
            overflow-y: auto;
            padding-right: 5px;
            max-height: 220px;
        }

        .player-slot-card {
            width: 100%;
            background: rgba(10, 10, 16, 0.8);
            border: 2px solid #222;
            border-radius: 16px;
            padding: 12px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: border-color 0.3s;
        }

        .player-slot-card.occupied {
            border-color: #444;
        }

        .slot-info {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .slot-ava {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            border: 1px solid rgba(255,255,255,0.3);
            background: #111 center/cover;
        }

        .slot-name {
            font-family: 'Exo 2';
            font-size: 14px;
            color: #ffffff;
        }

        .status-indicator {
            padding: 5px 12px;
            border-radius: 10px;
            font-family: 'Exo 2';
            font-size: 12px;
            font-weight: 900;
            text-transform: uppercase;
            border: 2px solid;
            white-space: nowrap;
        }

        .status-ready {
            border-color: var(--neon-green);
            color: var(--neon-green);
            box-shadow: 0 0 8px var(--neon-green);
        }

        .status-not-ready {
            border-color: var(--neon-red);
            color: var(--neon-red);
            box-shadow: 0 0 8px var(--neon-red);
        }

        .status-empty {
            border-color: #333;
            color: #333;
        }

        /* КНОПКИ УПРАВЛЕНИЯ В КОМНАТЕ */
        .room-controls-box {
            width: 100%;
            max-width: 320px;
            display: flex;
            flex-direction: column;
            margin: 15px auto 0;
        }

        .btn-ready-toggle {
            box-shadow: 0 0 12px rgba(0, 255, 0, 0.2),
                        0 0 20px rgba(0, 255, 0, 0.1) inset;
        }

        .btn-ready-toggle.active-ready {
            box-shadow: 0 0 12px rgba(255, 49, 49, 0.2),
                        0 0 20px rgba(255, 49, 49, 0.1) inset;
        }

        #start-btn {
            box-shadow: 0 0 12px rgba(255, 215, 0, 0.2),
                        0 0 20px rgba(255, 215, 0, 0.1) inset;
            color: var(--neon-gold);
            display: none;
        }

        /* СКРОЛЛБАР */
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #333; border-radius: 10px; }
        
        /* ХОВЕР ЭФФЕКТЫ ДЛЯ ДЕСКТОПА */
        @media (hover: hover) {
            .btn-action:hover, .btn-create-lobby:hover {
                transform: translateY(-2px);
            }
            .n-key:hover {
                box-shadow: 0 0 15px rgba(0, 210, 255, 0.2),
                            0 0 25px rgba(0, 210, 255, 0.1) inset;
            }
        }
    </style>
</head>
<body>

    <!-- МОДАЛЬНЫЕ ОКНА (ИГРОВЫЕ) -->
    <div class="modal-overlay" id="confirm-modal">
        <div class="modal-container red-border">
            <div class="modal-title">ПОДТВЕРЖДЕНИЕ</div>
            <div class="modal-message" id="confirm-message">Вы уверены?</div>
            <div class="modal-buttons">
                <button class="modal-btn modal-btn-cancel" onclick="Modal.hide()">ОТМЕНА</button>
                <button class="modal-btn modal-btn-confirm" onclick="Modal.confirmAction()">ДА</button>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="alert-modal">
        <div class="modal-container gold-border">
            <div class="modal-title" id="alert-title">УВЕДОМЛЕНИЕ</div>
            <div class="modal-message" id="alert-message">Сообщение</div>
            <div class="modal-buttons">
                <button class="modal-btn modal-btn-confirm" onclick="Modal.hide()">ОК</button>
            </div>
        </div>
    </div>

    <!-- ОСНОВНОЙ ИНТЕРФЕЙС -->
    <div class="app-shell">
        
        <div id="scr-menu" class="screen active">
            <div class="main-menu-header">
                <div class="main-logo-text">SPY</div>
                <div class="sub-logo-text">BRAWL STARS</div>
                <div class="edition-label">edition 2026</div>
            </div>
            
            <button class="btn-action" onclick="App.navigate('scr-lobby')">СОЗДАТЬ ЛОББИ</button>
            <button class="btn-action" onclick="App.navigate('scr-join')">ВХОД ПО ID</button>
            
            <button class="btn-action btn-secondary" onclick="App.showExitConfirm()">ВЫХОД</button>
        </div>

        <div id="scr-join" class="screen">
            <h2 class="title-neon-white">ВВЕДИТЕ ID</h2> <!-- ИЗМЕНИЛ НАЗВАНИЕ -->
            
            <div class="id-input-container">
                <div class="id-digit-box" id="d1">_</div>
                <div class="id-digit-box" id="d2">_</div>
                <div class="id-digit-box" id="d3">_</div>
                <div class="id-digit-box" id="d4">_</div>
                <div class="id-hyphen">-</div>
                <div class="id-digit-box" id="d5">_</div>
                <div class="id-digit-box" id="d6">_</div>
                <div class="id-digit-box" id="d7">_</div>
                <div class="id-digit-box" id="d8">_</div>
            </div>

            <div class="numpad-container">
                <div class="numpad-grid">
                    <button class="n-key" onclick="App.pressKey('1')">1</button>
                    <button class="n-key" onclick="App.pressKey('2')">2</button>
                    <button class="n-key" onclick="App.pressKey('3')">3</button>
                    <button class="n-key" onclick="App.pressKey('4')">4</button>
                    <button class="n-key" onclick="App.pressKey('5')">5</button>
                    <button class="n-key" onclick="App.pressKey('6')">6</button>
                    <button class="n-key" onclick="App.pressKey('7')">7</button>
                    <button class="n-key" onclick="App.pressKey('8')">8</button>
                    <button class="n-key" onclick="App.pressKey('9')">9</button>
                    <button class="n-key" style="color:var(--neon-red)" onclick="App.pressKey('C')">C</button>
                    <button class="n-key" onclick="App.pressKey('0')">0</button>
                    <button class="n-key" style="color:var(--neon-gold)" onclick="App.joinByCode()">OK</button>
                </div>
            </div>

            <button class="btn-action btn-secondary" onclick="App.navigate('scr-menu')">НАЗАД</button>
        </div>

        <div id="scr-lobby" class="screen">
            <h2 class="title-neon-white" style="margin-bottom:0">НАСТРОЙКА ЛОББИ</h2> <!-- ПОДНЯЛ ВЫШЕ -->
            <div class="id-display-white" id="lobby-id-val">ID: 0000-0000</div>

            <div class="user-identity-card">
                <div class="avatar-frame" id="my-ava"></div>
                <div class="username-label" id="my-tag">@player</div>
            </div>

            <div class="settings-row">
                <span style="font-family:'Exo 2'; font-size:16px; color:#fff">УЧАСТНИКИ</span>
                <div class="control-group">
                    <button class="circle-btn" onclick="App.updateSettings('p', -1)">-</button>
                    <span class="value-display" id="p-count">4</span>
                    <button class="circle-btn" onclick="App.updateSettings('p', 1)">+</button>
                </div>
            </div>

            <div class="settings-row red-theme">
                <span style="font-family:'Exo 2'; font-size:16px; color:#fff">ШПИОН</span>
                <div class="control-group">
                    <button class="circle-btn red-btn" onclick="App.updateSettings('s', -1)">-</button>
                    <span class="value-display" id="s-count">1</span>
                    <button class="circle-btn red-btn" onclick="App.updateSettings('s', 1)">+</button>
                </div>
            </div>

            <button class="btn-create-lobby" onclick="App.createFinalRoom()">СОЗДАТЬ КОМНАТУ</button>
            
            <button class="btn-action btn-secondary" onclick="App.navigate('scr-menu')">НАЗАД</button>
        </div>

        <div id="scr-room" class="screen">
            <h2 class="title-neon-white" style="margin-bottom:0">КОМНАТА ИГРЫ</h2>
            <div class="id-display-white" id="room-id-val">ID: 0000-0000</div>

            <div class="players-scroll-area" id="room-slots">
                <!-- Слоты игроков будут здесь -->
            </div>

            <div class="room-controls-box">
                <button class="btn-action btn-ready-toggle" id="ready-btn" onclick="App.toggleReady()">ГОТОВ</button>
                <button class="btn-action" id="start-btn" onclick="App.startGame()">НАЧАТЬ ИГРУ</button>
                <button class="btn-action btn-secondary" style="margin-top:10px" onclick="App.showLeaveConfirm()">ПОКИНУТЬ</button>
            </div>
        </div>

    </div>

    <script>
        // ИНИЦИАЛИЗАЦИЯ TELEGRAM (только для вибрации и данных)
        const tg = window.Telegram.WebApp;
        tg.expand();
        tg.enableClosingConfirmation();

        // СИСТЕМА МОДАЛЬНЫХ ОКОН
        const Modal = {
            currentAction: null,
            
            showConfirm: (message, callback) => {
                document.getElementById('confirm-message').innerText = message;
                Modal.currentAction = callback;
                document.getElementById('confirm-modal').classList.add('active');
                tg.HapticFeedback.impactOccurred('medium');
            },
            
            showAlert: (title, message) => {
                document.getElementById('alert-title').innerText = title;
                document.getElementById('alert-message').innerText = message;
                document.getElementById('alert-modal').classList.add('active');
                tg.HapticFeedback.impactOccurred('light');
            },
            
            hide: () => {
                document.getElementById('confirm-modal').classList.remove('active');
                document.getElementById('alert-modal').classList.remove('active');
                Modal.currentAction = null;
                tg.HapticFeedback.selectionChanged();
            },
            
            confirmAction: () => {
                if (Modal.currentAction) {
                    Modal.currentAction();
                }
                Modal.hide();
            }
        };

        // ГЕНЕРАЦИЯ РАНДОМНОГО ID
        function generateRandomId() {
            const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ0123456789';
            let result = '';
            for (let i = 0; i < 8; i++) {
                result += chars.charAt(Math.floor(Math.random() * chars.length));
                if (i === 3) result += '-';
            }
            return result;
        }

        // ОСНОВНОЕ ПРИЛОЖЕНИЕ
        const App = {
            state: {
                currentScreen: 'scr-menu',
                inputCode: '',
                participants: 4,
                spies: 1,
                lobbyId: generateRandomId(),
                isReady: false,
                isAdmin: true,
                players: []
            },

            // Навигация
            navigate: (screenId) => {
                document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
                const target = document.getElementById(screenId);
                target.classList.add('active');
                App.state.currentScreen = screenId;
                
                if(screenId === 'scr-lobby') {
                    document.getElementById('lobby-id-val').innerText = "ID: " + App.state.lobbyId;
                }
                if(screenId === 'scr-room') {
                    App.buildRoom();
                }
                
                // Обновляем кнопку "Начать игру"
                const startBtn = document.getElementById('start-btn');
                if (screenId === 'scr-room') {
                    startBtn.style.display = App.state.isAdmin ? 'block' : 'none';
                } else {
                    startBtn.style.display = 'none';
                }
                
                tg.HapticFeedback.impactOccurred('light');
            },

            // Подтверждение выхода
            showExitConfirm: () => {
                Modal.showConfirm(
                    "Вы уверены, что хотите выйти из игры?",
                    () => {
                        tg.close();
                    }
                );
            },

            // Подтверждение выхода из комнаты
            showLeaveConfirm: () => {
                Modal.showConfirm(
                    "Вы уверены, что хотите покинуть комнату?",
                    () => {
                        App.navigate('scr-menu');
                        Modal.showAlert("ВЫХОД", "Вы покинули комнату");
                    }
                );
            },

            // Ввод кода
            pressKey: (key) => {
                if(key === 'C') {
                    App.state.inputCode = '';
                } else if(App.state.inputCode.length < 8 && /^[0-9]$/.test(key)) {
                    App.state.inputCode += key;
                }
                
                for(let i = 1; i <= 8; i++) {
                    const char = App.state.inputCode[i-1] || "_";
                    const el = document.getElementById('d' + i);
                    el.innerText = char;
                    el.style.opacity = char === "_" ? "0.3" : "1";
                    el.style.color = char === "_" ? "#666" : "#ffffff";
                }
                tg.HapticFeedback.selectionChanged();
            },

            // Подключение по коду
            joinByCode: () => {
                if(App.state.inputCode.length === 8 && /^\d+$/.test(App.state.inputCode)) {
                    App.state.lobbyId = App.state.inputCode.slice(0,4) + "-" + App.state.inputCode.slice(4,8);
                    App.state.isAdmin = false;
                    App.navigate('scr-room');
                    Modal.showAlert("ПОДКЛЮЧЕНИЕ", "Подключение к комнате...");
                } else {
                    Modal.showAlert("ОШИБКА", "Введите 8 цифр");
                    tg.HapticFeedback.notificationOccurred('error');
                }
            },

            // Настройки лобби
            updateSettings: (type, delta) => {
                if(type === 'p') {
                    const newVal = App.state.participants + delta;
                    if (newVal >= 2 && newVal <= 12) {
                        App.state.participants = newVal;
                        document.getElementById('p-count').innerText = App.state.participants;
                        
                        // Автоматически корректируем шпионов
                        if (App.state.spies > App.state.participants - 1) {
                            App.state.spies = Math.max(1, App.state.participants - 1);
                            document.getElementById('s-count').innerText = App.state.spies;
                        }
                    }
                } else {
                    const newVal = App.state.spies + delta;
                    const maxSpies = App.state.participants - 1;
                    if (newVal >= 1 && newVal <= maxSpies) {
                        App.state.spies = newVal;
                        document.getElementById('s-count').innerText = App.state.spies;
                    }
                }
                tg.HapticFeedback.selectionChanged();
            },

            // Создание финальной комнаты
            createFinalRoom: () => {
                if (App.state.spies >= App.state.participants) {
                    Modal.showAlert("ОШИБКА", "Шпионов должно быть меньше чем участников");
                    tg.HapticFeedback.notificationOccurred('error');
                    return;
                }
                
                App.state.isAdmin = true;
                App.state.lobbyId = generateRandomId();
                App.navigate('scr-room');
                Modal.showAlert("УСПЕХ", "Комната создана! ID: " + App.state.lobbyId);
            },

            // Логика комнаты
            buildRoom: () => {
                document.getElementById('room-id-val').innerText = "ID: " + App.state.lobbyId;
                const container = document.getElementById('room-slots');
                container.innerHTML = '';

                for(let i = 0; i < App.state.participants; i++) {
                    const isMe = i === 0;
                    const card = document.createElement('div');
                    card.className = `player-slot-card ${isMe ? 'occupied' : ''}`;
                    
                    card.innerHTML = `
                        <div class="slot-info">
                            <div class="slot-ava" style="${isMe && tg.initDataUnsafe.user?.photo_url ? 'background-image:url('+tg.initDataUnsafe.user.photo_url+')' : ''}"></div>
                            <div class="slot-name">${isMe ? '@' + (tg.initDataUnsafe.user?.username || 'Вы') : 'ОЖИДАНИЕ...'}</div>
                        </div>
                        <div class="status-indicator ${isMe ? (App.state.isReady ? 'status-ready' : 'status-not-ready') : 'status-empty'}">
                            ${isMe ? (App.state.isReady ? 'ГОТОВ' : 'НЕ ГОТОВ') : 'ПУСТО'}
                        </div>
                    `;
                    container.appendChild(card);
                }
            },

            // Переключение готовности
            toggleReady: () => {
                App.state.isReady = !App.state.isReady;
                const btn = document.getElementById('ready-btn');
                btn.innerText = App.state.isReady ? 'ОТМЕНА' : 'ГОТОВ';
                btn.classList.toggle('active-ready', App.state.isReady);
                
                App.buildRoom();
                tg.HapticFeedback.notificationOccurred('success');
                Modal.showAlert("СТАТУС", App.state.isReady ? "Вы готовы к игре!" : "Вы не готовы");
            },

            // Начать игру
            startGame: () => {
                if (!App.state.isReady) {
                    Modal.showAlert("ОШИБКА", "Вы должны быть готовы!");
                    tg.HapticFeedback.notificationOccurred('error');
                    return;
                }
                
                Modal.showAlert("СТАРТ", "Игра начинается! Шпионов: " + App.state.spies);
                tg.HapticFeedback.notificationOccurred('success');
                // Здесь будет переход на экран игры
            }
        };

        // Подгрузка данных профиля
        if(tg.initDataUnsafe.user) {
            const user = tg.initDataUnsafe.user;
            document.getElementById('my-tag').innerText = "@" + (user.username || "player");
            if(user.photo_url) {
                document.getElementById('my-ava').style.backgroundImage = `url(${user.photo_url})`;
            }
        }

        // Инициализация при загрузке
        document.addEventListener('DOMContentLoaded', () => {
            App.navigate('scr-menu');
        });
    </script>
</body>
</html>
