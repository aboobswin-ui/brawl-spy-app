<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>BRAWL SPY ULTIMATE ONLINE</title>
    <link href="https://fonts.googleapis.com/css2?family=Black+Ops+One&family=Rubik+One&family=Exo+2:wght@900&display=swap" rel="stylesheet">
    
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>
        :root {
            --neon-blue: #00d2ff; --neon-red: #ff3131; --neon-gold: #ffd700; --neon-green: #00ff00;
            --bg-black: #020205; --glow-white: rgba(255, 255, 255, 0.9);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-user-select: none; outline: none; transition: all 0.3s ease; }
        
        body { 
            background: var(--bg-black); color: #fff; font-family: 'Rubik One', sans-serif; 
            height: 100vh; overflow: hidden; display: flex; justify-content: center;
        }

        .app-shell { width: 100%; height: 100%; max-width: 450px; position: relative; }

        .screen { 
            position: absolute; inset: 0; display: none; flex-direction: column; 
            align-items: center; padding: 40px 25px 30px; background: var(--bg-black); 
        }
        .screen.active { display: flex; animation: fadeIn 0.4s ease; }

        @keyframes fadeIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }

        /* --- ГЛАВНОЕ МЕНЮ --- */
        .logo-spy { font-size: 90px; color: var(--neon-red); text-shadow: 0 0 35px var(--neon-red); margin-top: 40px; }
        .logo-sub { font-family: 'Black Ops One'; font-size: 30px; color: var(--neon-gold); margin-bottom: 40px; }

        .btn-main { 
            width: 100%; padding: 20px; background: rgba(0,0,0,0.6); border: 4px solid var(--neon-blue); 
            box-shadow: 0 0 15px var(--neon-blue); border-radius: 25px; color: #fff; 
            font-family: 'Exo 2'; font-weight: 900; font-size: 20px; text-transform: uppercase; 
            margin-bottom: 15px; cursor: pointer; position: relative; overflow: hidden;
        }

        /* КНОПКА №6: СОЗДАТЬ КОМНАТУ [cite: 2026-01-04] */
        .btn-create-special { 
            border-color: var(--neon-gold); box-shadow: 0 0 15px var(--neon-gold); 
            color: #ffffff !important; /* Текст белый по требованию [cite: 2026-01-04] */
        }

        /* --- НАСТРОЙКИ ЛОББИ [cite: 2026-01-03] --- */
        .header-white { font-family: 'Exo 2'; font-size: 28px; color: #fff; text-shadow: 0 0 15px var(--glow-white); margin-bottom: 25px; text-transform: uppercase; }
        
        .tab-container { display: flex; width: 100%; gap: 12px; margin-bottom: 25px; }
        .tab { 
            flex: 1; padding: 15px; border-radius: 15px; text-align: center; 
            font-family: 'Exo 2'; font-size: 14px; border: 2px solid; background: #000;
            text-transform: uppercase;
        }
        .tab-participants { border-color: var(--neon-blue); box-shadow: 0 0 12px var(--neon-blue); color: var(--neon-blue); }
        .tab-spy { border-color: var(--neon-red); box-shadow: 0 0 12px var(--neon-red); color: var(--neon-red); }

        /* --- ВВОД ID --- */
        .id-display-row { display: flex; align-items: center; gap: 10px; margin: 35px 0; }
        .id-box { 
            font-family: 'Black Ops One'; font-size: 42px; width: 38px; text-align: center; 
            border-bottom: 4px solid #fff; color: #fff; text-shadow: 0 0 10px #fff;
        }
        .dash { font-family: 'Black Ops One'; font-size: 38px; padding-bottom: 10px; color: #fff; }

        .numpad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; width: 100%; }
        .num-key { 
            padding: 22px; background: #0d0d14; border: 2px solid #222; border-radius: 20px; 
            font-size: 28px; color: #fff; font-family: 'Black Ops One'; display: flex; 
            justify-content: center; align-items: center;
        }

        /* --- СПИСОК ИГРОКОВ --- */
        .player-card { 
            width: 100%; background: rgba(255,255,255,0.03); border: 2px solid #333; 
            border-radius: 20px; padding: 15px; display: flex; justify-content: space-between; 
            align-items: center; margin-bottom: 12px;
        }
        .status-ready { color: var(--neon-green); text-shadow: 0 0 10px var(--neon-green); font-family: 'Exo 2'; font-size: 14px; }
        .status-wait { color: var(--neon-red); text-shadow: 0 0 10px var(--neon-red); font-family: 'Exo 2'; font-size: 14px; }

        .footer-btn { margin-top: auto; width: 100%; }
    </style>
</head>
<body>
    <div class="app-shell">
        
        <div id="scr-menu" class="screen active">
            <h1 class="logo-spy">SPY</h1>
            <div class="logo-sub">BRAWL STARS</div>
            <button class="btn-main" onclick="App.nav('scr-setup')">НАСТРОЙКИ БИТВЫ</button>
            <button class="btn-main" onclick="App.nav('scr-join')">ВХОД ПО ID</button>
            <button class="btn-main" style="opacity:0.5">СТАТИСТИКА</button>
            <button class="btn-main" style="opacity:0.5">МАГАЗИН</button>
            <button class="btn-main" style="opacity:0.5">ПРОФИЛЬ</button>
            <button class="btn-main btn-create-special" onclick="App.nav('scr-setup')">СОЗДАТЬ КОМНАТУ</button>
        </div>

        <div id="scr-setup" class="screen">
            <h2 class="header-white">НАСТРОЙКА ЛОББИ</h2>
            <div class="tab-container">
                <div class="tab tab-participants">УЧАСТНИКИ</div>
                <div class="tab tab-spy">ШПИОН</div>
            </div>
            
            <div style="flex:1; width:100%; display:flex; flex-direction:column; gap:20px; align-items:center;">
                <div id="setup-id-preview" style="font-family:'Black Ops One'; font-size:24px; color:var(--neon-gold);">ID: ГЕНЕРАЦИЯ...</div>
                <div style="color:#555; font-size:12px; text-align:center;">НАСТРОЙКИ БИТВЫ АКТИВНЫ</div>
            </div>

            <div class="footer-btn">
                <button class="btn-main btn-create-special" onclick="App.createRoom()">СОЗДАТЬ ЛОББИ</button>
                <button class="btn-main" style="border-color:#444; box-shadow:none;" onclick="App.nav('scr-menu')">В МЕНЮ</button>
            </div>
        </div>

        <div id="scr-join" class="screen">
            <h2 class="header-white">ID КОМНАТЫ</h2>
            <div class="id-display-row">
                <div class="id-box" id="c1">_</div><div class="id-box" id="c2">_</div><div class="id-box" id="c3">_</div><div class="id-box" id="c4">_</div>
                <div class="dash">-</div>
                <div class="id-box" id="c5">_</div><div class="id-box" id="c6">_</div><div class="id-box" id="c7">_</div><div class="id-box" id="c8">_</div>
            </div>
            
            <div class="numpad">
                <script>
                    for(let i=1; i<=9; i++) document.write(`<div class="num-key" onclick="App.key('${i}')">${i}</div>`);
                </script>
                <div class="num-key" style="color:var(--neon-red)" onclick="App.key('C')">C</div>
                <div class="num-key" onclick="App.key('0')">0</div>
                <div class="num-key" style="color:var(--neon-gold)" onclick="App.joinRoom()">OK</div>
            </div>
            <button class="btn-main" style="margin-top:30px; border-color:#444;" onclick="App.nav('scr-menu')">НАЗАД</button>
        </div>

        <div id="scr-room" class="screen">
            <h2 class="header-white">ЛОББИ БИТВЫ</h2>
            <div id="room-id-tag" style="font-family:'Black Ops One'; font-size:22px; margin-bottom:25px;">ID: ....-....</div>
            
            <div id="player-list-area" style="width:100%; flex:1; overflow-y:auto; padding-right:5px;">
                </div>

            <div class="footer-btn">
                <button class="btn-main" id="ready-btn" onclick="App.toggleReady()">ГОТОВ</button>
                <button class="btn-main btn-create-special" id="start-btn" style="display:none">НАЧАТЬ ИГРУ</button>
                <button class="btn-main" style="border-color:var(--neon-red); box-shadow:none;" onclick="App.leave()">ВЫЙТИ</button>
            </div>
        </div>

    </div>

    <script>
        // Твои реальные ключи
        const firebaseConfig = {
            apiKey: "AIzaSyDbopGDAnN6RxiXoAk_Il90WZBCW0bVBvg",
            authDomain: "brawlspy.firebaseapp.com",
            databaseURL: "https://brawlspy-default-rtdb.firebaseio.com",
            projectId: "brawlspy",
            storageBucket: "brawlspy.firebasestorage.app",
            messagingSenderId: "803859610634",
            appId: "1:803859610634:web:2310aa16bb6e61049833f3"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        const tg = window.Telegram.WebApp;
        tg.expand();
        
        const user = tg.initDataUnsafe.user || { id: Date.now(), username: "Player_" + Math.floor(Math.random()*99) };

        const App = {
            roomId: null,
            inputStr: "",
            isReady: false,

            nav: (id) => {
                document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
                document.getElementById(id).classList.add('active');
                if(id === 'scr-setup') {
                    const code = Math.floor(1000+Math.random()*9000) + "-" + Math.floor(1000+Math.random()*9000);
                    document.getElementById('setup-id-preview').innerText = "ID: " + code;
                    App.roomId = code;
                }
            },

            key: (v) => {
                if(v === 'C') App.inputStr = "";
                else if(App.inputStr.length < 8) App.inputStr += v;
                for(let i=1; i<=8; i++) document.getElementById('c'+i).innerText = App.inputStr[i-1] || "_";
                tg.HapticFeedback.impactOccurred('medium');
            },

            createRoom: () => { App.nav('scr-room'); App.connect(); },

            joinRoom: () => {
                if(App.inputStr.length === 8) {
                    App.roomId = App.inputStr.slice(0,4) + "-" + App.inputStr.slice(4,8);
                    App.nav('scr-room');
                    App.connect();
                }
            },

            connect: () => {
                document.getElementById('room-id-tag').innerText = "ID: " + App.roomId;
                const ref = db.ref('rooms/' + App.roomId + '/players/' + user.id);
                ref.set({ name: "@" + (user.username || "spy_player"), ready: false });
                
                // Слушаем список игроков
                db.ref('rooms/' + App.roomId + '/players').on('value', (snap) => {
                    const players = snap.val();
                    const list = document.getElementById('player-list-area');
                    list.innerHTML = "";
                    if(players) {
                        Object.keys(players).forEach(id => {
                            const p = players[id];
                            list.innerHTML += `
                                <div class="player-card">
                                    <span style="font-family:'Exo 2'; font-size:18px;">${p.name}</span>
                                    <span class="${p.ready ? 'status-ready' : 'status-wait'}">${p.ready ? 'ГОТОВ' : 'НЕ ГОТОВ'}</span>
                                </div>`;
                        });
                    }
                });
            },

            toggleReady: () => {
                App.isReady = !App.isReady;
                db.ref('rooms/' + App.roomId + '/players/' + user.id).update({ ready: App.isReady });
                document.getElementById('ready-btn').innerText = App.isReady ? "ОТМЕНА" : "ГОТОВ";
                tg.HapticFeedback.notificationOccurred('success');
            },

            leave: () => {
                if(App.roomId) db.ref('rooms/' + App.roomId + '/players/' + user.id).remove();
                location.reload();
            }
        };
    </script>
</body>
</html>
