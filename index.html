<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>BRAWL SPY | SUPREME MONOLITH</title>
    
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Black+Ops+One&family=Rubik+One&family=Exo+2:wght@900&display=swap" rel="stylesheet">
    
    <style>
        /* [БЛОК 1: МОЩНЫЙ ГЛОБАЛЬНЫЙ CSS] */
        :root {
            --bs-blue: #00d2ff;
            --bs-red: #ff3131;
            --bs-gold: #ffd700;
            --bs-black: #020205;
            --bs-gray: #0d0d14;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-user-select: none;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bs-black);
            color: #fff;
            font-family: 'Rubik One', sans-serif;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .master-wrapper {
            width: 100%;
            height: 100%;
            max-width: 500px;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        /* [БЛОК 2: СИСТЕМА ЭКРАНОВ] */
        .screen {
            position: absolute;
            inset: 0;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 30px;
            background: radial-gradient(circle at center, #11111d 0%, #020205 100%);
            z-index: 10;
        }

        .screen.active {
            display: flex;
            animation: appAppear 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes appAppear {
            from { opacity: 0; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1); }
        }

        /* [БЛОК 3: ТЕКСТ И ЮЗЕР] */
        .tg-badge {
            background: rgba(0, 210, 255, 0.15);
            border: 2px solid var(--bs-blue);
            padding: 6px 16px;
            border-radius: 50px;
            font-size: 14px;
            color: var(--bs-blue);
            margin-bottom: 25px;
            text-transform: uppercase;
            box-shadow: 0 0 10px rgba(0, 210, 255, 0.2);
        }

        .white-title {
            font-family: 'Exo 2';
            font-size: 32px;
            font-weight: 900;
            text-transform: uppercase;
            margin-bottom: 40px;
            text-shadow: 0 0 15px rgba(255,255,255,0.4);
            text-align: center;
        }

        /* [БЛОК 4: ЛОББИ - ТВОЙ ЗАПРОС] */
        .lobby-panel {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 20px;
            margin-bottom: 40px;
        }

        .lobby-item {
            background: var(--bs-gray);
            border: 4px solid var(--bs-blue);
            border-radius: 25px;
            padding: 20px 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 0 15px rgba(0, 210, 255, 0.2);
        }

        .lobby-item.spy-item {
            border-color: var(--bs-red);
            box-shadow: 0 0 15px rgba(255, 49, 49, 0.2);
        }

        .lobby-label {
            font-family: 'Exo 2';
            font-size: 20px;
            font-weight: 900;
        }

        .stepper {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .step-btn {
            width: 48px;
            height: 48px;
            background: #000;
            border: 3px solid var(--bs-blue);
            border-radius: 12px;
            color: var(--bs-blue);
            font-size: 26px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        .spy-item .step-btn { border-color: var(--bs-red); color: var(--bs-red); }

        .step-val {
            font-family: 'Black Ops One';
            font-size: 30px;
            min-width: 40px;
            text-align: center;
        }

        /* [БЛОК 5: КНОПКИ] */
        .btn-bs {
            width: 100%;
            max-width: 340px;
            padding: 22px;
            background: #000;
            border: 4px solid var(--bs-blue);
            border-radius: 20px;
            color: #fff;
            font-family: 'Exo 2';
            font-weight: 900;
            font-size: 22px;
            text-transform: uppercase;
            margin-bottom: 15px;
            transition: 0.1s;
        }

        .btn-bs:active { transform: scale(0.95); }
        .btn-bs.gold { border-color: var(--bs-gold); color: var(--bs-gold); }
        .btn-bs.red { border-color: var(--bs-red); color: var(--bs-red); }

        /* [БЛОК 6: ВХОД ПО КОДУ] */
        .code-display {
            font-family: 'Black Ops One';
            font-size: 44px;
            color: var(--bs-blue);
            letter-spacing: 5px;
            margin-bottom: 30px;
            text-shadow: 0 0 10px var(--bs-blue);
        }

        .numpad {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            width: 100%;
            max-width: 300px;
            margin-bottom: 30px;
        }

        /* [БЛОК 7: ИГРОВАЯ КАРТА] */
        .card-container {
            width: 290px;
            height: 400px;
            perspective: 1000px;
            margin-bottom: 30px;
        }

        .card-inner {
            position: relative;
            width: 100%;
            height: 100%;
            transition: transform 0.6s;
            transform-style: preserve-3d;
        }

        .card-inner.is-flipped { transform: rotateY(180deg); }

        .card-face {
            position: absolute;
            inset: 0;
            backface-visibility: hidden;
            border-radius: 35px;
            border: 10px solid var(--bs-blue);
            background: var(--bs-gray);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .card-back {
            transform: rotateY(180deg);
            background: #fff;
            color: #000;
            border-color: var(--bs-red);
        }

        .brawler-img {
            width: 200px;
            height: 200px;
            object-fit: contain;
            margin: 15px 0;
        }

        /* [БЛОК 8: ГОЛОСОВАНИЕ И ТАЙМЕР] */
        .timer-huge {
            font-family: 'Black Ops One';
            font-size: 90px;
            color: var(--bs-red);
            text-shadow: 0 0 20px var(--bs-red);
        }

        .vote-grid {
            width: 100%;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-top: 20px;
            max-height: 300px;
            overflow-y: auto;
        }

        .vote-item {
            background: rgba(255,255,255,0.1);
            border: 2px solid var(--bs-blue);
            padding: 15px;
            border-radius: 15px;
            font-family: 'Exo 2';
            font-weight: 900;
        }
    </style>
</head>
<body>

    <div class="master-wrapper">
        
        <div id="scr-menu" class="screen active">
            <h1 style="font-size: 90px; color: var(--bs-red); text-shadow: 0 0 30px var(--bs-red);">SPY</h1>
            <div id="user-tag-1" class="tg-badge">@LOADING...</div>
            <button class="btn-bs" onclick="App.nav('scr-lobby')">Создать лобби</button>
            <button class="btn-bs" onclick="App.nav('scr-join')">Вход по коду</button>
            <button class="btn-bs" style="border-color: #444; color: #666;" onclick="tg.close()">Выход</button>
        </div>

        <div id="scr-join" class="screen">
            <h2 class="white-title">Введите код</h2>
            <div id="join-code" class="code-display">____-____</div>
            <div class="numpad">
                <button class="step-btn" onclick="App.codeIn('1')">1</button>
                <button class="step-btn" onclick="App.codeIn('2')">2</button>
                <button class="step-btn" onclick="App.codeIn('3')">3</button>
                <button class="step-btn" onclick="App.codeIn('4')">4</button>
                <button class="step-btn" onclick="App.codeIn('5')">5</button>
                <button class="step-btn" onclick="App.codeIn('6')">6</button>
                <button class="step-btn" onclick="App.codeIn('7')">7</button>
                <button class="step-btn" onclick="App.codeIn('8')">8</button>
                <button class="step-btn" onclick="App.codeIn('9')">9</button>
                <button class="step-btn" style="border-color: var(--bs-red);" onclick="App.codeIn('C')">C</button>
                <button class="step-btn" onclick="App.codeIn('0')">0</button>
                <button class="step-btn" style="border-color: var(--bs-gold);" onclick="App.codeConfirm()">OK</button>
            </div>
            <button class="btn-bs" style="border-color: #555;" onclick="App.nav('scr-menu')">Назад</button>
        </div>

        <div id="scr-lobby" class="screen">
            <div id="user-tag-2" class="tg-badge">@PLAYER</div>
            <h2 class="white-title">Настройки битвы</h2>
            
            <div class="lobby-panel">
                <div class="lobby-item">
                    <span class="lobby-label">УЧАСТНИКИ:</span>
                    <div class="stepper">
                        <button class="step-btn" onclick="App.adj('p', -1)">-</button>
                        <span id="p-val" class="step-val">3</span>
                        <button class="step-btn" onclick="App.adj('p', 1)">+</button>
                    </div>
                </div>
                <div class="lobby-item spy-item">
                    <span class="lobby-label">ШПИОН:</span>
                    <div class="stepper">
                        <button class="step-btn" onclick="App.adj('s', -1)">-</button>
                        <span id="s-val" class="step-val">1</span>
                        <button class="step-btn" onclick="App.adj('s', 1)">+</button>
                    </div>
                </div>
            </div>

            <button class="btn-bs gold" onclick="App.startGame()">Начать игру</button>
            <button class="btn-bs" style="border-color: #555;" onclick="App.nav('scr-menu')">Меню</button>
        </div>

        <div id="scr-game" class="screen">
            <h2 id="turn-label" class="white-title">Игрок 1</h2>
            <div class="card-container" onclick="App.flipCard()">
                <div id="card-inner" class="card-inner">
                    <div class="card-face"><span style="font-size: 120px; color: var(--bs-blue);">?</span></div>
                    <div id="card-back-side" class="card-face card-back"></div>
                </div>
            </div>
            <button id="btn-next" class="btn-bs" style="visibility: hidden;" onclick="App.nextPlayer()">Следующий игрок</button>
        </div>

        <div id="scr-timer" class="screen">
            <h2 class="white-title">Обсуждение</h2>
            <div id="timer-val" class="timer-huge">10:00</div>
            <button class="btn-bs gold" style="margin-top: 30px;" onclick="App.nav('scr-lobby')">Новая битва</button>
            <button class="btn-bs red" onclick="App.startGame()">Сброс раунда</button>
        </div>

    </div>

            state: { p:3, s:1, roles:[], curIdx:0, flipped:false, code:"" },

            init: function() {
                const nick = tg.initDataUnsafe?.user?.username || "GUEST";
                document.getElementById('user-tag-1').innerText = "@" + nick;
                document.getElementById('user-tag-2').innerText = "@" + nick;
            },

            nav: function(id) {
                document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
                document.getElementById(id).classList.add('active');
            },

            adj: function(t, v) {
                if(t === 'p') this.state.p = Math.max(2, Math.min(20, this.state.p + v));
                else this.state.s = Math.max(1, Math.min(this.state.p - 1, this.state.s + v));
                document.getElementById('p-val').innerText = this.state.p;
                document.getElementById('s-val').innerText = this.state.s;
            },

            codeIn: function(v) {
                if(v === 'C') this.state.code = "";
                else if(this.state.code.length < 8) this.state.code += v;
                let s = this.state.code;
                while(s.length < 8) s += "_";
                document.getElementById('join-code').innerText = s.slice(0,4) + "-" + s.slice(4,8);
            },

            codeConfirm: function() {
                if(this.state.code.length === 8) alert("Комната #" + this.state.code);
            },

            startGame: function() {
                this.state.curIdx = 0;
                this.state.flipped = false;
                const brawler = this.db[Math.floor(Math.random() * this.db.length)];
                let roles = [];
                for(let i=0; i<this.state.s; i++) {
                    roles.push({n: "ШПИОН", i: "https://cdn-icons-png.flaticon.com/512/953/953791.png"});
                }
                for(let i=0; i<(this.state.p - this.state.s); i++) {
                    roles.push(brawler);
                }
                this.state.roles = roles.sort(() => Math.random() - 0.5);
                this.nav('scr-game');
                this.updateUI();
            },

            flipCard: function() {
                if(this.state.flipped) return;
                const r = this.state.roles[this.state.curIdx];
                document.getElementById('card-back-side').innerHTML = `
                    <h3 style="font-size:32px; font-family:'Exo 2';">${r.n}</h3>
                    <img src="${r.i}" class="brawler-img" onerror="this.src='https://cdn-icons-png.flaticon.com/512/1178/1178479.png'">
                    <p style="color:red; font-weight:bold; letter-spacing:1px;">НЕ ПАЛИСЬ!</p>
                `;
                document.getElementById('card-inner').classList.add('is-flipped');
                document.getElementById('btn-next').style.visibility = 'visible';
                this.state.flipped = true;
            },

            nextPlayer: function() {
                this.state.curIdx++;
                if(this.state.curIdx < this.state.p) {
                    this.state.flipped = false;
                    document.getElementById('card-inner').classList.remove('is-flipped');
                    document.getElementById('btn-next').style.visibility = 'hidden';
                    setTimeout(() => this.updateUI(), 300);
                } else {
                    this.nav('scr-timer');
                }
            },

            updateUI: function() {
                document.getElementById('turn-label').innerText = "ИГРОК " + (this.state.curIdx + 1);
            }
        };

        App.init();
    </script>
</body>
</html>
