<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>BRAWL SPY PREMIER - CORE ENGINE 2026</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Black+Ops+One&family=Rubik:wght@700;900&family=Orbitron:wght@500;700;900&family=Exo+2:wght@300;800&display=swap" rel="stylesheet">
    
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>
        /* =========================================
           МОДУЛЬ 1: ГЛОБАЛЬНЫЕ ПЕРЕМЕННЫЕ И ЦВЕТА
           =========================================
        */
        :root {
            --primary-black: #020305;
            --deep-space: #05080a;
            --white-pure: #ffffff;
            --gold-top: #ffde59;
            --gold-bottom: #ff914d;
            --neon-blue: #00d2ff;
            --neon-red: #ff3131;
            --neon-yellow: #ffff00;
            --text-shadow-glow: 0 0 15px rgba(255, 255, 255, 0.4);
            --font-army: 'Black Ops One', cursive;
            --font-main: 'Rubik', sans-serif;
            --font-tech: 'Orbitron', sans-serif;
            --transition-smooth: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* =========================================
           МОДУЛЬ 2: СБРОС И БАЗОВЫЕ КОНТЕЙНЕРЫ
           =========================================
        */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            outline: none;
        }

        body {
            background-color: var(--primary-black);
            color: var(--white-pure);
            height: 100vh;
            width: 100vw;
            font-family: var(--font-main);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            /* Фон с эффектом виньетки и свечения */
            background: radial-gradient(circle at 50% 30%, rgba(255,255,255,0.08) 0%, rgba(0,0,0,0) 75%), var(--primary-black);
        }

        /* Анимированная подложка (Звездная пыль) */
        body::before {
            content: "";
            position: absolute;
            top: 0; left: 0; width: 200%; height: 200%;
            background-image: url('https://www.transparenttextures.com/patterns/stardust.png');
            opacity: 0.1;
            animation: backgroundMove 60s linear infinite;
            pointer-events: none;
        }

        @keyframes backgroundMove {
            from { transform: translate(0, 0); }
            to { transform: translate(-50%, -50%); }
        }

        /* =========================================
           МОДУЛЬ 3: ВЕРХНИЙ СТАТУС (HEADER)
           =========================================
        */
        .header-interface {
            width: 100%;
            padding: 25px 35px 5px;
            display: flex;
            justify-content: flex-end;
            z-index: 999;
        }

        .online-indicator {
            background: rgba(0, 255, 0, 0.05);
            border: 1px solid rgba(0, 255, 0, 0.2);
            padding: 6px 14px;
            border-radius: 100px;
            display: flex;
            align-items: center;
            gap: 10px;
            box-shadow: 0 0 20px rgba(0, 255, 0, 0.1);
        }

        .pulse-circle {
            width: 8px;
            height: 8px;
            background: #00ff00;
            border-radius: 50%;
            box-shadow: 0 0 10px #00ff00;
            animation: circleGlow 2s infinite;
        }

        @keyframes circleGlow {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.4); opacity: 0.4; }
            100% { transform: scale(1); opacity: 1; }
        }

        .online-label {
            color: #00ff00;
            font-size: 11px;
            font-weight: 900;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        /* =========================================
           МОДУЛЬ 4: ЛОГОТИП (ПРЕМИУМ PNG)
           =========================================
        */
        .branding-container {
            width: 100%;
            padding: 10px 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 500;
            margin-bottom: 10px;
        }

        .branding-container img {
            width: 125%;
            max-width: 580px;
            filter: drop-shadow(0 0 35px rgba(255, 255, 255, 0.25));
            animation: brandingFloat 6s infinite ease-in-out;
            transition: var(--transition-smooth);
        }

        @keyframes brandingFloat {
            0%, 100% { transform: translateY(0) rotate(0deg) scale(1); }
            50% { transform: translateY(-15px) rotate(1deg) scale(1.05); }
        }

        /* =========================================
           МОДУЛЬ 5: СИСТЕМА ЭКРАНОВ И ПЕРЕХОДОВ
           =========================================
        */
        .view-port {
            width: 100%;
            max-width: 440px;
            flex-grow: 1;
            padding: 0 40px;
            position: relative;
            z-index: 800;
        }

        .scene {
            display: none;
            width: 100%;
            flex-direction: column;
            animation: sceneEnter 0.5s cubic-bezier(0.19, 1, 0.22, 1) forwards;
        }

        .scene.active-scene {
            display: flex;
        }

        @keyframes sceneEnter {
            from { opacity: 0; transform: translateY(50px) scale(0.9); filter: blur(10px); }
            to { opacity: 1; transform: translateY(0) scale(1); filter: blur(0); }
        }

        /* =========================================
           МОДУЛЬ 6: КОМПОНЕНТЫ КНОПОК
           =========================================
        */
        .ui-stack {
            display: flex;
            flex-direction: column;
            gap: 20px;
            width: 100%;
        }

        .base-btn {
            width: 100%;
            padding: 24px 0;
            font-family: var(--font-army);
            font-size: 26px;
            text-transform: uppercase;
            border-radius: 22px;
            border: none;
            cursor: pointer;
            position: relative;
            box-shadow: 0 8px 0 rgba(0,0,0,0.6);
            transition: all 0.1s ease;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .base-btn:active {
            transform: translateY(4px);
            box-shadow: 0 4px 0 rgba(0,0,0,0.6);
        }

        /* Эффект глянца */
        .base-btn::after {
            content: "";
            position: absolute;
            top: 0; left: -100%; width: 50%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
            transform: skewX(-30deg);
        }

        .base-btn:hover::after {
            left: 150%;
            transition: 0.6s;
        }

        /* ЦВЕТА КНОПОК */
        .btn-gold-main {
            background: linear-gradient(180deg, var(--gold-top) 0%, var(--gold-bottom) 100%);
            color: var(--white-pure) !important; /* Текст белый по ТЗ */
            border: 2px solid rgba(255, 255, 255, 0.4);
            text-shadow: 0 2px 4px rgba(0,0,0,0.3);
        }

        .btn-blue-alt {
            background: linear-gradient(180deg, #00a2ff 0%, #004dff 100%);
            color: var(--white-pure);
        }

        .btn-utility {
            background: #1a1c20;
            color: #5d646d;
            font-size: 18px;
            margin-top: 10px;
        }

        /* =========================================
           МОДУЛЬ 7: ЛОББИ И НАСТРОЙКИ (CORE UI)
           =========================================
        */
        .lobby-title {
            font-family: var(--font-army);
            font-size: 30px;
            text-align: center;
            margin-bottom: 25px;
            text-transform: uppercase;
            letter-spacing: 1px;
            text-shadow: var(--text-shadow-glow);
        }

        .premium-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--glass-border);
            border-radius: 32px;
            padding: 25px;
            backdrop-filter: blur(20px);
            margin-bottom: 25px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
        }

        /* ТАБЫ */
        .tab-controller {
            display: flex;
            gap: 12px;
            margin-bottom: 25px;
        }

        .tab-trigger {
            flex: 1;
            padding: 18px 0;
            border-radius: 18px;
            border: 4px solid;
            text-align: center;
            font-weight: 900;
            font-size: 12px;
            text-transform: uppercase;
            transition: var(--transition-smooth);
        }

        .trigger-players {
            border-color: var(--neon-blue);
            color: var(--neon-blue);
        }
        .trigger-players.is-active {
            background: rgba(0, 210, 255, 0.15);
            box-shadow: 0 0 20px var(--neon-blue);
        }

        .trigger-spy {
            border-color: var(--neon-red);
            color: var(--neon-red);
        }
        .trigger-spy.is-active {
            background: rgba(255, 49, 49, 0.15);
            box-shadow: 0 0 20px var(--neon-red);
        }

        /* КОНТРОЛЛЕР ВЫБОРА (DIGITAL SELECTOR) */
        .digital-selector {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            background: rgba(0,0,0,0.3);
            border-radius: 20px;
            padding: 10px;
        }

        .control-node {
            width: 55px;
            height: 55px;
            border-radius: 15px;
            border: 2px solid rgba(255,255,255,0.2);
            background: rgba(255,255,255,0.05);
            color: #fff;
            font-size: 28px;
            font-weight: 900;
            cursor: pointer;
        }

        .value-node {
            font-family: var(--font-tech);
            font-size: 52px;
            font-weight: 900;
            color: var(--white-pure);
            text-shadow: 0 0 15px rgba(255,255,255,0.3);
        }

        /* ID БЛОК */
        .room-meta {
            text-align: center;
            border-top: 1px solid rgba(255,255,255,0.08);
            padding-top: 20px;
        }

        .meta-label {
            font-size: 14px;
            color: #666;
            margin-bottom: 8px;
            letter-spacing: 2px;
        }

        .meta-id {
            font-family: var(--font-tech);
            font-size: 36px;
            color: var(--neon-yellow);
            letter-spacing: 6px;
        }

        .btn-start-neon {
            background: var(--neon-yellow);
            color: #000;
            font-weight: 900;
            box-shadow: 0 0 35px var(--neon-yellow), 0 8px 0 #b1b100;
        }

    </style>
</head>
<body>

    <div class="header-interface">
        <div class="online-indicator">
            <div class="pulse-circle"></div>
            <span class="online-label">NETWORK: ACTIVE</span>
        </div>
    </div>

    <div class="branding-container">
        <img src="https://i.postimg.cc/1X6p4hZ8/Gemini-Generated-Image-sdde75sdde75sdde.png" alt="BRAWL SPY LOGO">
    </div>

    <div class="view-port">
        
        <div id="scene-main" class="scene active-scene">
            <div class="ui-stack">
                <button class="base-btn btn-gold-main" onclick="BrawlSpyApp.navigate('scene-lobby')">СОЗДАТЬ КОМНАТУ</button>
                <button class="base-btn btn-blue-alt" onclick="BrawlSpyApp.navigate('scene-join')">ВХОД ПО ID</button>
                <button class="base-btn btn-utility" onclick="BrawlSpyApp.close()">ВЫХОД</button>
            </div>
        </div>

        <div id="scene-lobby" class="scene">
            <h2 class="lobby-title">НАСТРОЙКА ЛОББИ</h2>
            
            <div class="premium-card">
                <div class="tab-controller">
                    <div id="tab-p" class="tab-trigger trigger-players is-active" onclick="BrawlSpyApp.setTab('players')">Участники</div>
                    <div id="tab-s" class="tab-trigger trigger-spy" onclick="BrawlSpyApp.setTab('spies')">Шпион</div>
                </div>

                <div class="digital-selector">
                    <button class="control-node" onclick="BrawlSpyApp.adjustValue(-1)">-</button>
                    <div id="display-value" class="value-node">8</div>
                    <button class="control-node" onclick="BrawlSpyApp.adjustValue(1)">+</button>
                </div>

                <div class="room-meta">
                    <p class="meta-label">ID КОМНАТЫ</p>
                    <h3 id="room-id-label" class="meta-id">000-000</h3>
                </div>
            </div>

            <div class="ui-stack">
                <button class="base-btn btn-start-neon" onclick="tg.showAlert('БИТВА НАЧИНАЕТСЯ!')">НАЧАТЬ ИГРУ</button>
                <button class="base-btn btn-utility" onclick="BrawlSpyApp.navigate('scene-main')">В МЕНЮ</button>
            </div>
        </div>

        <div id="scene-join" class="scene">
            <h2 class="lobby-title">ПОДКЛЮЧЕНИЕ</h2>
            <div class="premium-card" style="padding: 60px 20px; text-align: center;">
                <p class="meta-label">ВВЕДИТЕ КОД ДОСТУПА</p>
                <div style="font-family: 'Orbitron'; font-size: 45px; border-bottom: 4px solid #fff; width: 220px; margin: 20px auto; letter-spacing: 12px; color: #fff; text-shadow: 0 0 15px #fff;">____</div>
            </div>
            <button class="base-btn btn-utility" onclick="BrawlSpyApp.navigate('scene-main')">ОТМЕНА</button>
        </div>

    </div>

    <script>
        const tg = window.Telegram.WebApp;

        /**
         * ГЛАВНЫЙ ОБЪЕКТ ПРИЛОЖЕНИЯ
         * Управляет всей логикой, состояниями и навигацией
         */
        const BrawlSpyApp = {
            state: {
                activeTab: 'players',
                players: 8,
                spies: 1,
                isInitialized: false
            },

            /**
             * Инициализация базовых параметров
             */
            init() {
                tg.expand();
                tg.ready();
                tg.enableClosingConfirmation();
                tg.headerColor = "#020305";
                
                this.updateUI();
                console.log("Brawl Spy Core Engine Loaded.");
                this.state.isInitialized = true;
            },

            /**
             * Навигация между сценами
             */
            navigate(sceneId) {
                const scenes = document.querySelectorAll('.scene');
                scenes.forEach(s => s.classList.remove('active-scene'));
                
                const target = document.getElementById(sceneId);
                if (target) {
                    target.classList.add('active-scene');
                }

                if (sceneId === 'scene-lobby') {
                    this.generateRoomID();
                }

                this.haptic('medium');
            },

            /**
             * Переключение вкладок (Участники/Шпионы)
             */
            setTab(tabType) {
                this.state.activeTab = tabType;
                
                // Визуальное обновление табов
                document.getElementById('tab-p').classList.toggle('is-active', tabType === 'players');
                document.getElementById('tab-s').classList.toggle('is-active', tabType === 'spies');
                
                this.updateUI();
                this.haptic('light');
            },

            /**
             * Изменение значений счетчика
             */
            adjustValue(delta) {
                if (this.state.activeTab === 'players') {
                    this.state.players = Math.max(3, this.state.players + delta);
                } else {
                    this.state.spies = Math.max(1, this.state.spies + delta);
                }
                
                this.updateUI();
                this.haptic('selection');
            },

            /**
             * Обновление текстовых значений в интерфейсе
             */
            updateUI() {
                const display = document.getElementById('display-value');
                const isPlayers = this.state.activeTab === 'players';
                
                display.innerText = isPlayers ? this.state.players : this.state.spies;
                display.style.color = isPlayers ? 'var(--neon-blue)' : 'var(--neon-red)';
                display.style.textShadow = isPlayers ? '0 0 20px var(--neon-blue)' : '0 0 20px var(--neon-red)';
            },

            /**
             * Генерация случайного ID комнаты
             */
            generateRoomID() {
                const part1 = Math.floor(100 + Math.random() * 899);
                const part2 = Math.floor(100 + Math.random() * 899);
                document.getElementById('room-id-label').innerText = `${part1}-${part2}`;
            },

            /**
             * Виброотклик через Telegram SDK
             */
            haptic(style) {
                if (!tg.HapticFeedback) return;
                
                switch(style) {
                    case 'light': tg.HapticFeedback.impactOccurred('light'); break;
                    case 'medium': tg.HapticFeedback.impactOccurred('medium'); break;
                    case 'selection': tg.HapticFeedback.selectionChanged(); break;
                }
            },

            close() {
                tg.close();
            }
        };

        // Запуск при загрузке
        window.addEventListener('DOMContentLoaded', () => BrawlSpyApp.init());
        
        // Блокировка стандартного меню браузера
        window.oncontextmenu = (e) => { e.preventDefault(); e.stopPropagation(); return false; };
    </script>
</body>
</html>
