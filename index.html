<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Brawl Spy: Final Edition</title>
    
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    
    <link href="https://fonts.googleapis.com/css2?family=Rubik+One&family=Roboto:wght@700;900&display=swap" rel="stylesheet">
    
    <style>
        /* БЛОК СТИЛЕЙ (CSS)
           Каждое свойство на отдельной строке для объема
        */
        :root {
            --bg: #050508;
            --purp: #7209B7;
            --blue: #4CC9F0;
            --pink: #F72585;
            --card: #121217;
            --white: #FFFFFF;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg);
            color: var(--white);
            font-family: 'Rubik One', sans-serif;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .container {
            display: none;
            width: 100%;
            height: 100%;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 30px 20px;
        }

        .container.active {
            display: flex;
        }

        /* Лобби элементы */
        .room-label {
            background: var(--purp);
            padding: 6px 15px;
            border-radius: 10px;
            font-size: 12px;
            margin-bottom: 10px;
        }

        .header-title {
            font-size: 32px;
            margin-bottom: 20px;
        }

        .lobby-panel {
            background: var(--card);
            width: 100%;
            max-width: 340px;
            border-radius: 25px;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .players-count {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .circle-btn {
            width: 45px;
            height: 45px;
            background: var(--purp);
            border: none;
            border-radius: 12px;
            color: white;
            font-size: 24px;
            cursor: pointer;
        }

        .player-row {
            width: 100%;
            max-width: 340px;
            background: #1c1c22;
            padding: 15px 20px;
            border-radius: 20px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-left: 4px solid var(--purp);
        }

        .player-row.me {
            border-left-color: var(--blue);
        }

        /* Кнопки как на скрине */
        .btn-box {
            width: 100%;
            max-width: 340px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .action-btn {
            width: 100%;
            padding: 18px;
            border-radius: 25px;
            font-size: 18px;
            background: transparent;
            color: white;
            text-transform: uppercase;
            border: 3px solid transparent;
            cursor: pointer;
        }

        .btn-start {
            border-color: var(--purp);
            box-shadow: 0 0 10px rgba(114, 9, 183, 0.3);
        }

        .btn-invite {
            border-color: var(--blue);
            box-shadow: 0 0 10px rgba(76, 201, 240, 0.2);
        }

        /* Игровая карта */
        .game-card {
            width: 300px;
            height: 420px;
            background: var(--card);
            border: 6px solid var(--purp);
            border-radius: 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            text-align: center;
        }

        .b-img {
            max-width: 100%;
            max-height: 200px;
            object-fit: contain;
            margin: 20px 0;
        }

        #timer-val {
            font-size: 70px;
            color: var(--pink);
            font-family: 'Roboto', sans-serif;
        }
    </style>
</head>
<body>

    <div id="m-menu" class="container active">
        <div style="margin-top: 50px; text-align: center;">
            <h1 style="font-size: 50px;">BRAWL<br><span style="color:var(--purp)">SPY</span></h1>
        </div>
        <div class="btn-box">
            <button class="action-btn btn-start" onclick="openLobby()">СОЗДАТЬ КОМНАТУ</button>
            <button class="action-btn btn-invite" onclick="tg.showAlert('Поиск комнат...')">НАЙТИ ИГРУ</button>
        </div>
    </div>

    <div id="m-lobby" class="container">
        <div style="text-align: center;">
            <div class="room-label" id="room-id">ROOM: #0000</div>
            <h2 class="header-title">ЛОББИ</h2>
        </div>

        <div class="lobby-panel">
            <span>ИГРОКИ:</span>
            <div class="players-count">
                <button class="circle-btn" onclick="changeP(-1)">-</button>
                <span id="p-num" style="font-size: 28px;">3</span>
                <button class="circle-btn" onclick="changeP(1)">+</button>
            </div>
        </div>

        <div id="p-list" style="width: 100%; display: flex; flex-direction: column; align-items: center; flex: 1; overflow-y: auto;">
            </div>

        <div class="btn-box">
            <button class="action-btn btn-start" onclick="startGame()">СТАРТ</button>
            <button class="action-btn btn-invite" onclick="invite()">ПРИГЛАСИТЬ</button>
        </div>
    </div>

    <div id="m-game" class="container">
        <h3 id="p-turn" style="color: var(--blue); font-size: 20px;">НИКИТА</h3>
        
        <div class="game-card" id="card-main" onclick="reveal()">
            <div id="card-back">
                <div style="font-size: 60px;">?</div>
                <div>ТАПНИ</div>
            </div>
        </div>

        <div id="timer-box" style="display: none;">
            <div id="timer-val">05:00</div>
        </div>

        <div class="btn-box">
            <button class="action-btn btn-start" id="next-btn" style="display: none;" onclick="nextStep()">СЛЕДУЮЩИЙ</button>
            <button class="action-btn" style="border-color: #222; font-size: 14px;" onclick="location.reload()">ВЫХОД</button>
        </div>
    </div>

        function show(id) {
            document.querySelectorAll('.container').forEach(c => c.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            tg.HapticFeedback.impactOccurred('medium');
        }

        function openLobby() {
            state.room = Math.floor(1000 + Math.random() * 9000);
            document.getElementById('room-id').innerText = "ROOM: #" + state.room;
            updateList();
            show('m-lobby');
        }

        function changeP(v) {
            state.p = Math.max(3, Math.min(15, state.p + v));
            document.getElementById('p-num').innerText = state.p;
            updateList();
            tg.HapticFeedback.selectionChanged();
        }

        function updateList() {
            const list = document.getElementById('p-list');
            list.innerHTML = "";
            const me = tg.initDataUnsafe?.user?.first_name || "НИКИТА";
            for(let i=0; i<state.p; i++) {
                const row = document.createElement('div');
                row.className = "player-row" + (i===0 ? " me" : "");
                row.innerHTML = `<span>${i===0 ? me : 'ИГРОК '+(i+1)}</span><span style="font-size:10px; color:#666">${i===0 ? 'READY' : 'WAITING'}</span>`;
                list.appendChild(row);
            }
        }

        function startGame() {
            state.deck = [];
            state.idx = 0;
            state.flip = false;
            const hero = DATA[Math.floor(Math.random() * DATA.length)];
            for(let i=0; i<state.p; i++) state.deck.push({ s: false, n: hero.n, u: hero.u });
            state.deck[Math.floor(Math.random() * state.p)] = { s: true, n: "ШПИОН", u: "https://cdn-icons-png.flaticon.com/512/1266/1266106.png" };
            show('m-game');
            resetCard();
        }

        function resetCard() {
            const me = tg.initDataUnsafe?.user?.first_name || "НИКИТА";
            document.getElementById('p-turn').innerText = state.idx === 0 ? me : "ИГРОК " + (state.idx + 1);
            document.getElementById('card-main').innerHTML = '<div style="font-size: 60px;">?</div><div>ТАПНИ ПО КАРТЕ</div>';
            document.getElementById('card-main').style.borderColor = "var(--purp)";
            document.getElementById('next-btn').style.display = "none";
        }

        function reveal() {
            if(state.flip) return;
            const item = state.deck[state.idx];
            const card = document.getElementById('card-main');
            if(item.s) card.style.borderColor = "var(--pink)";
            card.innerHTML = `<h2 style="color:${item.s ? 'var(--pink)' : 'white'}">${item.n}</h2><img class="b-img" src="${item.u}">`;
            state.flip = true;
            document.getElementById('next-btn').style.display = "block";
            tg.HapticFeedback.notificationOccurred('success');
        }

        function nextStep() {
            state.idx++;
            state.flip = false;
            if(state.idx < state.p) {
                resetCard();
            } else {
                startTimer();
            }
        }

        function startTimer() {
            document.getElementById('p-turn').innerText = "ОБСУЖДЕНИЕ";
            document.getElementById('card-main').style.display = "none";
            document.getElementById('timer-box').style.display = "block";
            let t = 300;
            const iv = setInterval(() => {
                let m = Math.floor(t / 60);
                let s = t % 60;
                document.getElementById('timer-val').innerText = `${m}:${s < 10 ? '0'+s : s}`;
                if(t-- <= 0) {
                    clearInterval(iv);
                    tg.HapticFeedback.notificationOccurred('error');
                }
            }, 1000);
            document.getElementById('next-btn').innerText = "ЗАНОВО";
            document.getElementById('next-btn').onclick = () => location.reload();
        }

        function invite() {
            tg.shareExternal("Врывайся в Brawl Spy! Код: " + state.room);
        }

        window.onload = () => {
            tg.ready();
            tg.expand();
