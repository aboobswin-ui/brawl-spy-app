<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>BRAWL SPY | GIGA MONOLITH</title>
    
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Black+Ops+One&family=Rubik+One&family=Exo+2:wght@900&family=Orbitron:wght@900&display=swap" rel="stylesheet">
    
    <style>
        /* [РАЗДЕЛ 1: ГЛОБАЛЬНЫЕ ГИПЕР-СТИЛИ] */
        :root {
            --bs-core-black: #010103;
            --bs-panel-bg: #08080c;
            --bs-neon-cyan: #00d2ff;
            --bs-neon-crimson: #ff3131;
            --bs-neon-gold: #ffd700;
            --bs-pure-white: #ffffff;
            --bs-blur-blue: rgba(0, 210, 255, 0.4);
            --bs-blur-red: rgba(255, 49, 49, 0.4);
        }

        /* Полный сброс всех стандартных стилей для контроля каждого пикселя */
        html, body, div, span, h1, h2, h3, p, img, button, input {
            margin: 0; padding: 0; border: 0; font-size: 100%; font: inherit; vertical-align: baseline;
        }

        body {
            background-color: var(--bs-core-black);
            color: var(--bs-pure-white);
            font-family: 'Rubik One', sans-serif;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            -webkit-font-smoothing: antialiased;
        }

        /* [РАЗДЕЛ 2: СИСТЕМА ПЕРЕКЛЮЧЕНИЯ ЭКРАНОВ] */
        .master-container {
            position: relative;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        .view-layer {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            display: none;
            flex-direction: column;
            align-items: center;
            padding: 40px 25px;
            background: linear-gradient(180deg, #050508 0%, #010103 100%);
            z-index: 100;
        }

        .view-layer.active {
            display: flex;
            animation: slideInUp 0.6s cubic-bezier(0.23, 1, 0.32, 1) forwards;
        }

        @keyframes slideInUp {
            from { opacity: 0; transform: translateY(50px) scale(0.9); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        /* [РАЗДЕЛ 3: ВЕРХНИЕ БЕЛЫЕ ЗАГОЛОВКИ] */
        .white-title-top {
            color: var(--bs-pure-white);
            font-family: 'Exo 2', sans-serif;
            font-weight: 900;
            font-size: 38px;
            text-transform: uppercase;
            letter-spacing: 3px;
            text-shadow: 0 0 20px rgba(255,255,255,0.5);
            margin-bottom: 50px;
            text-align: center;
            width: 100%;
        }

        /* [РАЗДЕЛ 4: БЛОК ЛОББИ - НАСТРОЙКИ] */
        .lobby-settings-container {
            width: 100%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            gap: 30px;
            margin-bottom: 60px;
        }

        .setting-box-module {
            background: var(--bs-panel-bg);
            border: 5px solid var(--bs-neon-cyan);
            border-radius: 35px;
            padding: 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 0 20px var(--bs-blur-blue);
            transition: 0.3s;
        }

        /* Твой запрос: УЧАСТНИКИ: и ШПИОН: с двоеточием и неоновой обводкой */
        .setting-box-module.spy-alert {
            border-color: var(--bs-neon-crimson);
            box-shadow: 0 0 25px var(--bs-blur-red);
            animation: pulse-danger 2.5s infinite;
        }

        @keyframes pulse-danger {
            0% { transform: scale(1); box-shadow: 0 0 20px var(--bs-blur-red); }
            50% { transform: scale(1.02); box-shadow: 0 0 35px var(--bs-neon-crimson); }
            100% { transform: scale(1); box-shadow: 0 0 20px var(--bs-blur-red); }
        }

        .label-text-neon {
            font-family: 'Exo 2';
            font-weight: 900;
            font-size: 26px;
            text-transform: uppercase;
            color: var(--bs-pure-white);
        }

        .control-panel-stepper {
            display: flex;
            align-items: center;
            gap: 25px;
        }

        .btn-stepper-ui {
            width: 55px;
            height: 55px;
            background: #000;
            border: 4px solid var(--bs-neon-cyan);
            border-radius: 18px;
            color: var(--bs-neon-cyan);
            font-size: 32px;
            font-family: 'Rubik One';
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        .spy-alert .btn-stepper-ui {
            border-color: var(--bs-neon-crimson);
            color: var(--bs-neon-crimson);
        }

        .val-display-ui {
            font-family: 'Black Ops One';
            font-size: 42px;
            min-width: 50px;
            text-align: center;
        }

        /* [РАЗДЕЛ 5: КНОПКИ ДЕЙСТВИЙ] */
        .action-btn-main {
            width: 100%;
            max-width: 360px;
            padding: 26px;
            background: #000;
            border: 5px solid var(--bs-neon-cyan);
            border-radius: 28px;
            color: var(--bs-pure-white);
            font-family: 'Exo 2', sans-serif;
            font-weight: 900;
            font-size: 24px;
            text-transform: uppercase;
            box-shadow: 0 0 15px var(--bs-blur-blue);
            margin-bottom: 20px;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .action-btn-main:active { transform: scale(0.92); }
        .btn-variant-gold { border-color: var(--bs-neon-gold); color: var(--bs-neon-gold); box-shadow: 0 0 20px rgba(255, 215, 0, 0.4); }
        .btn-variant-danger { border-color: var(--bs-neon-crimson); box-shadow: 0 0 20px var(--bs-blur-red); }

        /* [РАЗДЕЛ 6: ВХОД ПО КОДУ - ИНТЕРФЕЙС] */
        .code-input-display {
            width: 100%;
            max-width: 340px;
            height: 90px;
            background: #000;
            border: 4px solid var(--bs-neon-cyan);
            border-radius: 22px;
            color: var(--bs-neon-cyan);
            font-family: 'Black Ops One';
            font-size: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 40px;
            text-shadow: 0 0 10px var(--bs-neon-cyan);
        }

        /* [РАЗДЕЛ 7: ИГРОВАЯ КАРТА] */
        .mega-card-wrap {
            width: 320px;
            height: 460px;
            perspective: 2500px;
            margin-bottom: 45px;
        }

        .mega-card-inner {
            position: relative;
            width: 100%;
            height: 100%;
            transition: transform 0.8s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            transform-style: preserve-3d;
        }

        .mega-card-inner.flipped-state { transform: rotateY(180deg); }

        .mega-card-face {
            position: absolute;
            inset: 0;
            backface-visibility: hidden;
            border-radius: 50px;
            border: 12px solid var(--bs-neon-cyan);
            background: var(--bs-panel-bg);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 30px var(--bs-blur-blue);
        }

        .mega-card-face-back {
            transform: rotateY(180deg);
            background: var(--bs-pure-white);
            color: #000;
            border-color: var(--bs-neon-crimson);
            box-shadow: 0 0 30px var(--bs-blur-red);
        }

        /* [РАЗДЕЛ 8: ТАЙМЕР И ГОЛОСОВАНИЕ] */
        .timer-display-huge {
            font-size: 120px;
            font-family: 'Black Ops One';
            color: var(--bs-neon-crimson);
            text-shadow: 0 0 40px var(--bs-neon-crimson);
            margin: 30px 0;
        }

        .voting-grid-layout {
            width: 100%;
            max-width: 420px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            max-height: 400px;
            overflow-y: auto;
            padding: 15px;
        }

        .player-vote-node {
            background: rgba(0, 210, 255, 0.1);
            border: 4px solid var(--bs-neon-cyan);
            padding: 30px 10px;
            border-radius: 30px;
            text-align: center;
            font-family: 'Exo 2';
            font-weight: 900;
            font-size: 20px;
            transition: 0.3s;
        }

        .player-vote-node.is-selected {
            background: var(--bs-neon-cyan);
            color: #000;
            box-shadow: 0 0 30px var(--bs-neon-cyan);
            transform: translateY(-5px);
        }

        .host-lock-label {
            font-size: 14px;
            color: var(--bs-neon-gold);
            margin-top: 40px;
            letter-spacing: 5px;
            font-weight: 900;
            text-transform: uppercase;
        }
    </style>
</head>
<body>

    <div class="master-container">
        
        <div id="ui-screen-home" class="view-layer active">
            <h1 style="font-family: 'Orbitron'; font-size: 90px; color: var(--bs-neon-crimson); text-shadow: 0 0 30px var(--bs-neon-crimson); margin-top: 60px;">SPY</h1>
            <div style="font-family: 'Black Ops One'; color: var(--bs-neon-gold); font-size: 28px; margin-bottom: 90px; letter-spacing: 4px;">BRAWL STARS</div>
            
            <button class="action-btn-main" onclick="GameCore.navigateTo('ui-screen-lobby')">Создать лобби</button>
            <button class="action-btn-main" onclick="GameCore.navigateTo('ui-screen-join')">Вход по коду</button>
            <button class="action-btn-main" style="border-color: #444; color: #888;" onclick="tg.close()">Выход</button>
        </div>

        <div id="ui-screen-join" class="view-layer">
            <h2 class="white-title-top">Введите код</h2>
            <div class="code-input-display" id="js-code-view">____-____</div>
            
            <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; width: 100%; max-width: 340px; margin-bottom: 40px;">
                <button class="btn-stepper-ui" style="width:100%;" onclick="GameCore.inputKey('1')">1</button>
                <button class="btn-stepper-ui" style="width:100%;" onclick="GameCore.inputKey('2')">2</button>
                <button class="btn-stepper-ui" style="width:100%;" onclick="GameCore.inputKey('3')">3</button>
                <button class="btn-stepper-ui" style="width:100%;" onclick="GameCore.inputKey('4')">4</button>
                <button class="btn-stepper-ui" style="width:100%;" onclick="GameCore.inputKey('5')">5</button>
                <button class="btn-stepper-ui" style="width:100%;" onclick="GameCore.inputKey('6')">6</button>
                <button class="btn-stepper-ui" style="width:100%;" onclick="GameCore.inputKey('7')">7</button>
                <button class="btn-stepper-ui" style="width:100%;" onclick="GameCore.inputKey('8')">8</button>
                <button class="btn-stepper-ui" style="width:100%;" onclick="GameCore.inputKey('9')">9</button>
                <button class="btn-stepper-ui" style="width:100%; border-color: var(--bs-neon-crimson);" onclick="GameCore.inputKey('DEL')">←</button>
                <button class="btn-stepper-ui" style="width:100%;" onclick="GameCore.inputKey('0')">0</button>
                <button class="btn-stepper-ui" style="width:100%; border-color: var(--bs-neon-gold);" onclick="GameCore.connectRoom()">OK</button>
            </div>
            
            <button class="action-btn-main" style="border-color: #555;" onclick="GameCore.navigateTo('ui-screen-home')">Назад</button>
        </div>

        <div id="ui-screen-lobby" class="view-layer">
            <h2 class="white-title-top">Параметры лобби</h2>
            
            <div class="lobby-settings-container">
                <div class="setting-box-module">
                    <span class="label-text-neon">УЧАСТНИКИ:</span>
                    <div class="control-panel-stepper">
                        <button class="btn-stepper-ui" onclick="GameCore.updateConfig('p', -1)">-</button>
                        <span id="js-p-val" class="val-display-ui">3</span>
                        <button class="btn-stepper-ui" onclick="GameCore.updateConfig('p', 1)">+</button>
                    </div>
                </div>

                <div class="setting-box-module spy-alert">
                    <span class="label-text-neon">ШПИОН:</span>
                    <div class="control-panel-stepper">
                        <button class="btn-stepper-ui" onclick="GameCore.updateConfig('s', -1)">-</button>
                        <span id="js-s-val" class="val-display-ui">1</span>
                        <button class="btn-stepper-ui" onclick="GameCore.updateConfig('s', 1)">+</button>
                    </div>
                </div>
            </div>

            <button class="action-btn-main btn-variant-gold" onclick="GameCore.launchMatch()">Начать битву</button>
            <button class="action-btn-main" style="border-color: #555;" onclick="GameCore.navigateTo('ui-screen-home')">В главное меню</button>
        </div>

        <div id="ui-screen-deal" class="view-layer">
            <h2 id="js-player-header" class="white-title-top">ИГРОК 1</h2>
            <div class="mega-card-wrap" onclick="GameCore.triggerCardFlip()">
                <div id="js-card-anchor" class="mega-card-inner">
                    <div class="mega-card-face">
                        <div style="font-size: 200px; color: var(--bs-neon-cyan); text-shadow: 0 0 30px var(--bs-neon-cyan);">?</div>
                    </div>
                    <div id="js-card-back-content" class="mega-card-face mega-card-face-back">
                        </div>
                </div>
            </div>
            <button id="js-next-btn" class="action-btn-main" style="visibility: hidden;" onclick="GameCore.moveToNextPlayer()">Я запомнил</button>
        </div>

        <div id="ui-screen-timer" class="view-layer">
            <h2 class="white-title-top">Обсуждение</h2>
            <div id="js-main-timer-digits" class="timer-display-huge">10:00</div>
            
            <button class="action-btn-main btn-variant-gold" style="margin-top: 60px;" onclick="GameCore.initVoteMode()">Голосовать</button>
            
            <div id="js-host-control-1" style="width: 100%; display: flex; flex-direction: column; align-items: center;">
                <div class="host-lock-label">Панель создателя</div>
                <button class="action-btn-main btn-variant-danger" style="margin-top: 10px;" onclick="GameCore.launchMatch()">Сбросить раунд</button>
            </div>
        </div>

        <div id="ui-screen-vote" class="view-layer">
            <h2 class="white-title-top">Кто предатель?</h2>
            <div id="js-vote-timer" style="font-family: 'Black Ops One'; color: var(--bs-neon-crimson); font-size: 36px; margin-bottom: 20px;">60s</div>
            
            <div id="js-vote-players-list" class="voting-grid-layout"></div>
            
            <button id="js-confirm-vote-btn" class="action-btn-main btn-variant-gold" style="display: none; margin-top: auto;" onclick="GameCore.showFinalReveal()">Изгнать</button>
        </div>

        <div id="ui-screen-reveal" class="view-layer">
            <h2 id="js-reveal-status-msg" class="white-title-top">Итог</h2>
            <div id="js-reveal-visual-box" class="mega-card-wrap"></div>
            
            <div id="js-reveal-full-list" style="display: none; width: 100%; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 30px;"></div>

            <div id="js-host-control-2" style="display: none; width: 100%; flex-direction: column; align-items: center; margin-top: auto;">
                <button class="action-btn-main btn-variant-gold" onclick="GameCore.launchMatch()">Новый матч</button>
                <button class="action-btn-main" onclick="GameCore.navigateTo('ui-screen-home')">В меню</button>
            </div>
        </div>

    </div>

    <script>
        /**
         * BRAWL SPY GIGA-MONOLITH ENGINE v13.0
         * ----------------------------------------------------
         * ПОЛНОСТЬЮ РАЗВЕРНУТАЯ ЛОГИКА БЕЗ СЖАТИЯ
         */
        
        const tg = window.Telegram.WebApp;
        tg.expand();

        const GameCore = {
            // [ОГРОМНАЯ БАЗА ДАННЫХ ПЕРСОНАЖЕЙ]
            brawlers: [
                {name: "ШЕЛЛИ", img: "https://cdn.brawlstats.com/character-arts/16000000.png"},
                {name: "КОЛЬТ", img: "https://cdn.brawlstats.com/character-arts/16000001.png"},
                {name: "НИТА", img: "https://cdn.brawlstats.com/character-arts/16000002.png"},
                {name: "БУЛЛ", img: "https://cdn.brawlstats.com/character-arts/16000003.png"},
                {name: "БРОК", img: "https://cdn.brawlstats.com/character-arts/16000005.png"},
                {name: "ЭЛЬ ПРИМО", img: "https://cdn.brawlstats.com/character-arts/16000012.png"},
                {name: "БАРЛИ", img: "https://cdn.brawlstats.com/character-arts/16000013.png"},
                {name: "ПОКО", img: "https://cdn.brawlstats.com/character-arts/16000011.png"},
                {name: "РИКО", img: "https://cdn.brawlstats.com/character-arts/16000006.png"},
                {name: "ДЭРРИЛ", img: "https://cdn.brawlstats.com/character-arts/16000015.png"},
                {name: "ПЕННИ", img: "https://cdn.brawlstats.com/character-arts/16000016.png"},
                {name: "ПАЙПЕР", img: "https://cdn.brawlstats.com/character-arts/16000019.png"},
                {name: "ФРЭНК", img: "https://cdn.brawlstats.com/character-arts/16000020.png"},
                {name: "БИБИ", img: "https://cdn.brawlstats.com/character-arts/16000022.png"},
                {name: "БЕА", img: "https://cdn.brawlstats.com/character-arts/16000031.png"},
                {name: "ЭДГАР", img: "https://cdn.brawlstats.com/character-arts/16000042.png"},
                {name: "МОРТИС", img: "https://cdn.brawlstats.com/character-arts/16000014.png"},
                {name: "ТАРА", img: "https://cdn.brawlstats.com/character-arts/16000018.png"},
                {name: "ЛЕОН", img: "https://cdn.brawlstats.com/character-arts/16000017.png"},
                {name: "СПАЙК", img: "https://cdn.brawlstats.com/character-arts/16000007.png"},
                {name: "КРОУ", img: "https://cdn.brawlstats.com/character-arts/16000008.png"},
                {name: "СЭНДИ", img: "https://cdn.brawlstats.com/character-arts/16000028.png"}
            ],

            // [СОСТОЯНИЕ ИГРЫ]
            session: {
                playerCount: 3,
                spyCount: 1,
                roles: [],
                currentTurn: 0,
                flipped: false,
                isHost: true,
                countdown: 600,
                roomCodeBuffer: "",
                selectedVoteIdx: null,
                timerId: null
            },

            // [ЛОГИКА НАВИГАЦИИ]
            navigateTo: function(screenId) {
                this.stopTimer();
                const allScreens = document.querySelectorAll('.view-layer');
                allScreens.forEach(s => s.classList.remove('active'));
                
                const target = document.getElementById(screenId);
                if(target) target.classList.add('active');
                
                this.vibrate('light');
            },

            // [ЛОГИКА ЛОББИ]
            updateConfig: function(key, val) {
                if(key === 'p') {
                    this.session.playerCount = Math.max(2, Math.min(15, this.session.playerCount + val));
                    if(this.session.spyCount >= this.session.playerCount) {
                        this.session.spyCount = this.session.playerCount - 1;
                    }
                } else {
                    this.session.spyCount = Math.max(1, Math.min(this.session.playerCount - 1, this.session.spyCount + val));
                }
                
                document.getElementById('js-p-val').innerText = this.session.playerCount;
                document.getElementById('js-s-val').innerText = this.session.spyCount;
                this.vibrate('medium');
            },

            // [ЛОГИКА ВВОДА КОДА]
            inputKey: function(key) {
                const view = document.getElementById('js-code-view');
                if(key === 'DEL') {
                    this.session.roomCodeBuffer = this.session.roomCodeBuffer.slice(0, -1);
                } else if(this.session.roomCodeBuffer.length < 8) {
                    this.session.roomCodeBuffer += key;
                }
                
                let str = this.session.roomCodeBuffer;
                while(str.length < 8) str += "_";
                view.innerText = str.slice(0,4) + "-" + str.slice(4,8);
                this.vibrate('light');
            },

            connectRoom: function() {
                if(this.session.roomCodeBuffer.length === 8) {
                    this.vibrateSuccess();
                    alert("Подключение к комнате #" + this.session.roomCodeBuffer);
                } else {
                    this.vibrateError();
                }
            },

            // [ЛОГИКА МАТЧА]
            launchMatch: function() {
                this.session.currentTurn = 0;
                this.session.flipped = false;
                this.session.countdown = 600;
                this.session.selectedVoteIdx = null;

                // Генерация ролей
                const randomHero = this.brawlers[Math.floor(Math.random() * this.brawlers.length)];
                let deck = [];
                
                for(let i=0; i<this.session.spyCount; i++) {
                    deck.push({name: "ШПИОН", img: "https://cdn-icons-png.flaticon.com/512/953/953791.png", isSpy: true});
                }
                for(let i=0; i<(this.session.playerCount - this.session.spyCount); i++) {
                    deck.push({name: randomHero.name, img: randomHero.img, isSpy: false});
                }
                
                this.session.roles = deck.sort(() => Math.random() - 0.5);

                // Настройка UI
                document.getElementById('js-host-control-1').style.display = this.session.isHost ? 'flex' : 'none';
                document.getElementById('js-host-control-2').style.display = 'none';
                document.getElementById('js-reveal-full-list').style.display = 'none';

                this.navigateTo('ui-screen-deal');
                this.syncDealUI();
            },

            triggerCardFlip: function() {
                if(this.session.flipped) return;
                
                const role = this.session.roles[this.session.currentTurn];
                const back = document.getElementById('js-card-back-content');
                
                back.innerHTML = `
                    <h3 style="font-size:42px; margin-bottom:15px; font-family:'Exo 2';">${role.name}</h3>
                    <img src="${role.img}" style="width:240px; height:240px; object-fit:contain; margin:20px 0;">
                    <div style="color:red; font-weight:900; letter-spacing:2px; font-size:18px;">НЕ ПАЛИСЬ!</div>
                `;
                
                document.getElementById('js-card-anchor').classList.add('flipped-state');
                document.getElementById('js-next-btn').style.visibility = 'visible';
                this.session.flipped = true;
                this.vibrate('heavy');
            },

            moveToNextPlayer: function() {
                this.session.currentTurn++;
                if(this.session.currentTurn < this.session.playerCount) {
                    this.session.flipped = false;
                    document.getElementById('js-card-anchor').classList.remove('flipped-state');
                    document.getElementById('js-next-btn').style.visibility = 'hidden';
                    setTimeout(() => this.syncDealUI(), 300);
                } else {
                    this.startDiscussionTimer();
                }
            },

            syncDealUI: function() {
                document.getElementById('js-player-header').innerText = "ИГРОК " + (this.session.currentTurn + 1);
            },

            // [ЛОГИКА ТАЙМЕРА]
            startDiscussionTimer: function() {
                this.navigateTo('ui-screen-timer');
                this.session.timerId = setInterval(() => {
                    this.session.countdown--;
                    const m = Math.floor(this.session.countdown / 60);
                    const s = this.session.countdown % 60;
                    document.getElementById('js-main-timer-digits').innerText = `${m}:${s < 10 ? '0'+s : s}`;
                    if(this.session.countdown <= 0) this.stopTimer();
                }, 1000);
            },

            stopTimer: function() {
                if(this.session.timerId) clearInterval(this.session.timerId);
            },

            // [ЛОГИКА ГОЛОСОВАНИЯ]
            initVoteMode: function() {
                this.navigateTo('ui-screen-vote');
                const listContainer = document.getElementById('js-vote-players-list');
                listContainer.innerHTML = '';
                
                this.session.roles.forEach((player, index) => {
                    const card = document.createElement('div');
                    card.className = 'player-vote-node';
                    card.innerText = `ИГРОК ${index + 1}`;
                    card.onclick = () => {
                        document.querySelectorAll('.player-vote-node').forEach(n => n.classList.remove('is-selected'));
                        card.classList.add('is-selected');
                        this.session.selectedVoteIdx = index;
                        document.getElementById('js-confirm-vote-btn').style.display = 'flex';
                        this.vibrate('medium');
                    };
                    listContainer.appendChild(card);
                });

                let vLimit = 60;
                this.session.timerId = setInterval(() => {
                    vLimit--;
                    document.getElementById('js-vote-timer').innerText = vLimit + "s";
                    if(vLimit <= 0) {
                        if(this.session.selectedVoteIdx === null) this.session.selectedVoteIdx = 0;
                        this.showFinalReveal();
                    }
                }, 1000);
            },

            // [ЛОГИКА ФИНАЛА]
            showFinalReveal: function() {
                this.navigateTo('ui-screen-reveal');
                const target = this.session.roles[this.session.selectedVoteIdx];
                const box = document.getElementById('js-reveal-visual-box');
                
                box.innerHTML = `
                    <div class="mega-card-inner flipped-state">
                        <div class="mega-card-face mega-card-face-back" style="border-color:${target.isSpy ? 'var(--bs-neon-crimson)' : 'var(--bs-neon-cyan)'}">
                            <div style="font-size:16px; opacity:0.7;">ИГРОК ${this.session.selectedVoteIdx + 1}</div>
                            <img src="${target.img}" style="width:200px; margin:20px 0;">
                            <h2 style="font-size:36px; text-transform:uppercase;">${target.name}</h2>
                        </div>
                    </div>
                `;
                
                document.getElementById('js-reveal-status-msg').innerText = target.isSpy ? "ШПИОН ПОЙМАН!" : "ВЫГНАЛИ МИРНОГО";

                setTimeout(() => {
                    const fullList = document.getElementById('js-reveal-full-list');
                    fullList.style.display = 'grid';
                    fullList.innerHTML = '';
                    this.session.roles.forEach((r, i) => {
                        fullList.innerHTML += `
                            <div style="background:#fff; color:#000; padding:15px; border-radius:20px; text-align:center; font-weight:bold; font-size:14px;">
                                P${i+1}: ${r.name}
                            </div>
                        `;
                    });
                    if(this.session.isHost) document.getElementById('js-host-control-2').style.display = 'flex';
                    this.vibrateSuccess();
                }, 5000);
            },

            // [УТИЛИТЫ]
            vibrate: function(style) {
                try { tg.HapticFeedback.impactOccurred(style); } catch(e) {}
            },
            vibrateSuccess: function() {
                try { tg.HapticFeedback.notificationOccurred('success'); } catch(e) {}
            },
            vibrateError: function() {
                try { tg.HapticFeedback.notificationOccurred('error'); } catch(e) {}
            }
        };

        // Запуск при полной загрузке
        window.addEventListener('load', () => {
            tg.ready();
            tg.expand();
        });
    </script>
</body>
</html>
