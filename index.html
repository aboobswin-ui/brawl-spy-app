<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Brawl Spy: Pro Edition v2.0</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Rubik+One&family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        /* --- ПЕРЕМЕННЫЕ И ОСНОВА --- */
        :root {
            --bg-main: #0A0A0F;
            --purp: #7209B7;
            --purp-dark: #3c096c;
            --blue-neon: #4CC9F0;
            --pink-spy: #F72585;
            --gray-matte: #1c1c1f;
            --white: #ffffff;
            --glass: rgba(255, 255, 255, 0.05);
            --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * { 
            box-sizing: border-box; 
            -webkit-tap-highlight-color: transparent; 
            margin: 0; 
            padding: 0; 
            user-select: none;
            -webkit-user-drag: none;
        }
        
        body {
            background-color: var(--bg-main);
            background-image: 
                radial-gradient(circle at top left, rgba(114, 9, 183, 0.25), transparent 40%),
                radial-gradient(circle at bottom right, rgba(76, 201, 240, 0.15), transparent 40%);
            color: var(--white);
            font-family: 'Rubik One', sans-serif;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* --- АНИМАЦИИ --- */
        @keyframes fadeInScale {
            from { opacity: 0; transform: scale(0.9) translateY(20px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }

        @keyframes rotateGlow {
            0% { filter: drop-shadow(0 0 5px var(--purp)); }
            50% { filter: drop-shadow(0 0 20px var(--purp)); }
            100% { filter: drop-shadow(0 0 5px var(--purp)); }
        }

        /* --- ЭКРАНЫ --- */
        .screen {
            display: none;
            width: 100%;
            height: 100%;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 40px 20px;
            animation: fadeInScale 0.4s forwards;
        }

        .active { display: flex !important; }

        /* --- ЗАГОЛОВКИ --- */
        .main-title {
            font-size: 44px;
            text-align: center;
            text-transform: uppercase;
            line-height: 0.9;
            background: linear-gradient(to bottom, #fff, #bbb);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 5px 15px rgba(0,0,0,0.8));
            margin-bottom: 10px;
        }

        .room-info-pill {
            background: var(--purp);
            padding: 6px 14px;
            border-radius: 50px;
            font-size: 12px;
            letter-spacing: 1px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        /* --- ЛОББИ: СПИСОК ИГРОКОВ --- */
        .lobby-box {
            width: 100%;
            max-width: 360px;
            background: var(--glass);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 30px;
            padding: 20px;
            flex: 1;
            margin: 20px 0;
            display: flex;
            flex-direction: column;
            gap: 12px;
            overflow-y: auto;
        }

        .player-card {
            background: var(--gray-matte);
            padding: 16px 20px;
            border-radius: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-left: 5px solid var(--purp);
            transition: var(--transition);
        }

        .player-card.host { border-left-color: var(--blue-neon); }

        .status-ready { font-size: 10px; color: var(--blue-neon); text-transform: uppercase; }

        /* --- КНОПКИ (МАТОВЫЙ СТИЛЬ) --- */
        .btn {
            background-color: var(--gray-matte);
            border: 3px solid var(--purp);
            border-radius: 22px;
            color: white;
            font-family: 'Rubik One', sans-serif;
            font-size: 20px;
            padding: 22px;
            width: 100%;
            max-width: 340px;
            text-transform: uppercase;
            cursor: pointer;
            box-shadow: 0 10px 0px rgba(0,0,0,0.3);
            transition: 0.1s;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .btn:active {
            transform: translateY(6px);
            box-shadow: 0 4px 0px rgba(0,0,0,0.3);
            background-color: #252529;
        }

        .btn-cyan { border-color: var(--blue-neon); color: var(--blue-neon); }
        
        .btn-nav {
            background: transparent;
            border: 2px solid #444;
            color: #777;
            font-size: 14px;
            padding: 14px;
            box-shadow: none;
            margin-top: 10px;
        }

        /* --- НАСТРОЙКИ --- */
        .setting-row {
            background: var(--gray-matte);
            width: 100%;
            max-width: 340px;
            padding: 20px;
            border-radius: 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid rgba(114, 9, 183, 0.3);
        }

        .step-control {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .round-btn {
            width: 50px;
            height: 50px;
            background: var(--purp);
            border: none;
            border-radius: 15px;
            color: white;
            font-size: 24px;
            font-family: 'Rubik One';
        }

        /* --- ИГРОВАЯ КАРТОЧКА --- */
        .game-card-display {
            background: var(--gray-matte);
            border: 5px solid var(--purp);
            border-radius: 40px;
            width: 310px;
            height: 460px;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 35px 20px;
            box-shadow: 0 0 50px rgba(0,0,0,0.5);
            transition: var(--transition);
        }

        /* ИМЯ НАД КАРТИНКОЙ */
        .brawler-name-label {
            font-size: 30px;
            text-align: center;
            margin-bottom: 30px;
            text-transform: uppercase;
            min-height: 40px;
            text-shadow: 0 2px 5px rgba(0,0,0,0.5);
        }

        .brawler-img-box {
            width: 230px;
            height: 230px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: radial-gradient(circle, rgba(114, 9, 183, 0.2) 0%, transparent 75%);
            animation: rotateGlow 3s infinite ease-in-out;
        }

        .brawler-img-box img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .spy-theme {
            border-color: var(--pink-spy);
            box-shadow: 0 0 40px rgba(247, 37, 133, 0.4);
        }

        .spy-theme .brawler-name-label { color: var(--pink-spy); }

        /* --- ФИНАЛЬНЫЙ ТАЙМЕР --- */
        .timer-display {
            font-size: 70px;
            color: var(--pink-spy);
            text-shadow: 0 0 20px rgba(247, 37, 133, 0.3);
        }

    </style>
</head>
<body>

    <div id="app" style="height:100%; display:flex; flex-direction:column;">
        
        <div id="scr-menu" class="screen active">
            <div style="text-align:center">
                <h1 class="main-title">BRAWL<br>SPY</h1>
                <p style="font-size:12px; color:var(--purp); letter-spacing:4px">MOBILE EDITION</p>
            </div>
            
            <div style="width:100%; display:flex; flex-direction:column; align-items:center; gap:15px;">
                <button class="btn" onclick="openLobby()">СОЗДАТЬ ХОЛЛ</button>
                <button class="btn btn-cyan" onclick="tg.showAlert('Сетевой режим в разработке!')">ПОИСК ИГРЫ</button>
            </div>
        </div>

        <div id="scr-lobby" class="screen">
            <div style="text-align:center">
                <div class="room-info-pill" id="room-id">ROOM #4412</div>
                <h2 style="margin-top:10px; font-size:24px">ПОДГОТОВКА</h2>
            </div>

            <div class="setting-row">
                <span>ИГРОКИ</span>
                <div class="step-control">
                    <button class="round-btn" onclick="setPlayers(-1)">-</button>
                    <span id="player-val" style="font-size:24px; width:30px; text-align:center">4</span>
                    <button class="round-btn" onclick="setPlayers(1)">+</button>
                </div>
            </div>

            <div class="lobby-box" id="lobby-list-ui">
                </div>

            <div style="width:100%; display:flex; flex-direction:column; align-items:center;">
                <button class="btn" onclick="startGame()">НАЧАТЬ МАТЧ</button>
                <button class="btn btn-nav" onclick="nav('scr-menu')">ВЕРНУТЬСЯ В МЕНЮ</button>
            </div>
        </div>

        <div id="scr-game" class="screen">
            <h1 id="status-header" style="font-size:22px">ИГРОК 1</h1>

            <div class="game-card-display" id="main-card" onclick="flipCard()">
                <div id="card-inner-view" style="display:flex; flex-direction:column; align-items:center; justify-content:center; height:100%; width:100%">
                    <p style="color:var(--purp); font-size:14px; text-align:center">НАЖМИ НА КАРТУ,<br>ЧТОБЫ УЗНАТЬ РОЛЬ</p>
                </div>
            </div>

            <div id="timer-ui" class="timer-display" style="display:none">05:00</div>

            <div style="width:100%; display:flex; flex-direction:column; align-items:center;">
                <button class="btn" id="btn-next" style="display:none" onclick="nextPlayer()">СЛЕДУЮЩИЙ</button>
                <button class="btn btn-nav" onclick="location.reload()">СБРОСИТЬ ИГРУ</button>
            </div>
        </div>

    </div>

    <script>
        // Инициализация Telegram
        const tg = window.Telegram.WebApp;
        tg.expand();
        tg.enableClosingConfirmation();

        // Состояние игры
        let config = {
            pCount: 4,
            current: 0,
            deck: [],
            isFlipped: false
        };

        // --- БАЗА БРАВЛЕРОВ (50+ ШТУК) ---
        const BRAWLERS_MEGA_DB = [
            {n: "LEON", i: "https://media.brawltime.ninja/brawlers/leon/portrait.webp"},
            {n: "SHELLY", i: "https://media.brawltime.ninja/brawlers/shelly/portrait.webp"},
            {n: "SPIKE", i: "https://media.brawltime.ninja/brawlers/spike/portrait.webp"},
            {n: "CROW", i: "https://media.brawltime.ninja/brawlers/crow/portrait.webp"},
            {n: "MORTIS", i: "https://media.brawltime.ninja/brawlers/mortis/portrait.webp"},
            {n: "EDGAR", i: "https://media.brawltime.ninja/brawlers/edgar/portrait.webp"},
            {n: "SURGE", i: "https://media.brawltime.ninja/brawlers/surge/portrait.webp"},
            {n: "FANG", i: "https://media.brawltime.ninja/brawlers/fang/portrait.webp"},
            {n: "PIPER", i: "https://media.brawltime.ninja/brawlers/piper/portrait.webp"},
            {n: "COLT", i: "https://media.brawltime.ninja/brawlers/colt/portrait.webp"},
            {n: "EL PRIMO", i: "https://media.brawltime.ninja/brawlers/el_primo/portrait.webp"},
            {n: "BUZZ", i: "https://media.brawltime.ninja/brawlers/buzz/portrait.webp"},
            {n: "STU", i: "https://media.brawltime.ninja/brawlers/stu/portrait.webp"},
            {n: "AMBER", i: "https://media.brawltime.ninja/brawlers/amber/portrait.webp"},
            {n: "CHESTER", i: "https://media.brawltime.ninja/brawlers/chester/portrait.webp"},
            {n: "CORDELIUS", i: "https://media.brawltime.ninja/brawlers/cordelius/portrait.webp"},
            {n: "MELODIE", i: "https://media.brawltime.ninja/brawlers/melodie/portrait.webp"},
            {n: "ANGELO", i: "https://media.brawltime.ninja/brawlers/angelo/portrait.webp"},
            {n: "DRACO", i: "https://media.brawltime.ninja/brawlers/draco/portrait.webp"},
            {n: "LILY", i: "https://media.brawltime.ninja/brawlers/lily/portrait.webp"},
            {n: "BEA", i: "https://media.brawltime.ninja/brawlers/bea/portrait.webp"},
            {n: "BIBI", i: "https://media.brawltime.ninja/brawlers/bibi/portrait.webp"},
            {n: "TICK", i: "https://media.brawltime.ninja/brawlers/tick/portrait.webp"},
            {n: "BO", i: "https://media.brawltime.ninja/brawlers/bo/portrait.webp"},
            {n: "NITA", i: "https://media.brawltime.ninja/brawlers/nita/portrait.webp"},
            {n: "BROCK", i: "https://media.brawltime.ninja/brawlers/brock/portrait.webp"},
            {n: "DYNAMIKE", i: "https://media.brawltime.ninja/brawlers/dynamike/portrait.webp"},
            {n: "BULL", i: "https://media.brawltime.ninja/brawlers/bull/portrait.webp"},
            {n: "JESSIE", i: "https://media.brawltime.ninja/brawlers/jessie/portrait.webp"},
            {n: "8-BIT", i: "https://media.brawltime.ninja/brawlers/8-bit/portrait.webp"},
            {n: "RICO", i: "https://media.brawltime.ninja/brawlers/rico/portrait.webp"},
            {n: "DARRYL", i: "https://media.brawltime.ninja/brawlers/darryl/portrait.webp"},
            {n: "PENNY", i: "https://media.brawltime.ninja/brawlers/penny/portrait.webp"},
            {n: "CARL", i: "https://media.brawltime.ninja/brawlers/carl/portrait.webp"},
            {n: "JACKY", i: "https://media.brawltime.ninja/brawlers/jacky/portrait.webp"},
            {n: "GALE", i: "https://media.brawltime.ninja/brawlers/gale/portrait.webp"},
            {n: "COLETTE", i: "https://media.brawltime.ninja/brawlers/colette/portrait.webp"},
            {n: "LOU", i: "https://media.brawltime.ninja/brawlers/lou/portrait.webp"},
            {n: "RUFFS", i: "https://media.brawltime.ninja/brawlers/ruffs/portrait.webp"},
            {n: "BELLE", i: "https://media.brawltime.ninja/brawlers/belle/portrait.webp"},
            {n: "ASH", i: "https://media.brawltime.ninja/brawlers/ash/portrait.webp"},
            {n: "LOLA", i: "https://media.brawltime.ninja/brawlers/lola/portrait.webp"},
            {n: "EVE", i: "https://media.brawltime.ninja/brawlers/eve/portrait.webp"},
            {n: "JANET", i: "https://media.brawltime.ninja/brawlers/janet/portrait.webp"},
            {n: "OTIS", i: "https://media.brawltime.ninja/brawlers/otis/portrait.webp"},
            {n: "BUSTER", i: "https://media.brawltime.ninja/brawlers/buster/portrait.webp"},
            {n: "MANDY", i: "https://media.brawltime.ninja/brawlers/mandy/portrait.webp"},
            {n: "MAISIE", i: "https://media.brawltime.ninja/brawlers/maisie/portrait.webp"},
            {n: "PEARL", i: "https://media.brawltime.ninja/brawlers/pearl/portrait.webp"},
            {n: "CHARLIE", i: "https://media.brawltime.ninja/brawlers/charlie/portrait.webp"}
        ];

        // --- ЛОГИКА ИНТЕРФЕЙСА ---
        function nav(id) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            tg.HapticFeedback.impactOccurred('medium');
        }

        function openLobby() {
            const rid = Math.floor(1000 + Math.random() * 8999);
            document.getElementById('room-id').innerText = "ROOM #" + rid;
            renderLobbyList();
            nav('scr-lobby');
        }

        function setPlayers(v) {
            config.pCount = Math.max(3, Math.min(15, config.pCount + v));
            document.getElementById('player-val').innerText = config.pCount;
            renderLobbyList();
            tg.HapticFeedback.selectionChanged();
        }

        function renderLobbyList() {
            const box = document.getElementById('lobby-list-ui');
            box.innerHTML = "";
            const me = tg.initDataUnsafe?.user?.first_name || "ТЫ";
            
            for(let i=0; i < config.pCount; i++) {
                const item = document.createElement('div');
                item.className = "player-card" + (i === 0 ? " host" : "");
                item.innerHTML = `
                    <span>${i === 0 ? me.toUpperCase() : 'ИГРОК ' + (i+1)}</span>
                    <span class="status-ready">${i === 0 ? 'READY' : 'WAITING...'}</span>
                `;
                box.appendChild(item);
            }
        }

        // --- ЛОГИКА ИГРЫ ---
        function startGame() {
            config.deck = [];
            config.current = 0;
            config.isFlipped = false;
            
            // Выбор бравлера раунда
            const hero = BRAWLERS_MEGA_DB[Math.floor(Math.random() * BRAWLERS_MEGA_DB.length)];
            
            // Наполнение колоды
            for(let i=0; i < config.pCount; i++) {
                config.deck.push({ isSpy: false, name: hero.n, img: hero.i });
            }
            
            // Добавление шпиона
            const spyIdx = Math.floor(Math.random() * config.pCount);
            config.deck[spyIdx] = { 
                isSpy: true, 
                name: "ШПИОН", 
                img: "https://cdn-icons-png.flaticon.com/512/1266/1266106.png" 
            };
            
            nav('scr-game');
            resetCardUI();
        }

        function resetCardUI() {
            document.getElementById('status-header').innerText = "ИГРОК " + (config.current + 1);
            const card = document.getElementById('main-card');
            card.classList.remove('spy-theme');
            document.getElementById('card-inner-view').innerHTML = `
                <p style="color:var(--purp); font-size:14px; text-align:center">НАЖМИ НА КАРТУ,<br>ЧТОБЫ УЗНАТЬ РОЛЬ</p>
            `;
            document.getElementById('btn-next').style.display = 'none';
        }

        function flipCard() {
            if(config.isFlipped) return;
            
            const data = config.deck[config.current];
            const card = document.getElementById('main-card');
            
            if(data.isSpy) card.classList.add('spy-theme');
            
            // РЕНДЕР: ИМЯ НАД КАРТИНКОЙ
            document.getElementById('card-inner-view').innerHTML = `
                <div class="brawler-name-label">${data.name}</div>
                <div class="brawler-img-box">
                    <img src="${data.img}" onerror="this.src='https://cdn-icons-png.flaticon.com/512/1266/1266106.png'">
                </div>
            `;
            
            config.isFlipped = true;
            document.getElementById('btn-next').style.display = 'flex';
            tg.HapticFeedback.notificationOccurred('success');
        }

        function nextPlayer() {
            config.current++;
            config.isFlipped = false;
            
            if(config.current < config.pCount) {
                resetCardUI();
                tg.HapticFeedback.impactOccurred('light');
            } else {
                showFinalStage();
            }
        }

        function showFinalStage() {
            document.getElementById('status-header').innerText = "ОБСУЖДЕНИЕ";
            document.getElementById('main-card').style.display = 'none';
            document.getElementById('timer-ui').style.display = 'block';
            document.getElementById('btn-next').innerText = "НОВЫЙ МАТЧ";
            document.getElementById('btn-next').onclick = () => location.reload();
            
            startTimer(300); // 5 минут
        }

        function startTimer(duration) {
            let timer = duration, minutes, seconds;
            const display = document.getElementById('timer-ui');
            
            const interval = setInterval(function () {
                minutes = parseInt(timer / 60, 10);
                seconds = parseInt(timer % 60, 10);

                minutes = minutes < 10 ? "0" + minutes : minutes;
                seconds = seconds < 10 ? "0" + seconds : seconds;

                display.textContent = minutes + ":" + seconds;

                if (--timer < 0) {
                    clearInterval(interval);
                    tg.HapticFeedback.notificationOccurred('error');
                    display.innerText = "ВРЕМЯ!";
                }
            }, 1000);
        }

        // Приветствие ТГ
        window.onload = () => {
            tg.ready();
        };
    </script>
</body>
</html>
