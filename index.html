<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>ШПИОН BRAWL STARS - EDITION 2026 - ULTIMATE MONOLITH</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Black+Ops+One&family=Exo+2:wght@900&family=Rubik:wght@900&display=swap" rel="stylesheet">
    
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>
        /* ГЛОБАЛЬНЫЕ ПЕРЕМЕННЫЕ ЦВЕТА И СВЕЧЕНИЯ */
        :root {
            --neon-blue: #00d2ff;
            --neon-red: #ff3131;
            --neon-gold: #ffd700;
            --neon-green: #00ff00;
            --bg-black: #010103;
            --glow-white: #ffffff;
            --shadow-intensity: 20px;
        }

        /* ПОЛНЫЙ СБРОС СТИЛЕЙ */
        * { 
            box-sizing: border-box; 
            margin: 0; 
            padding: 0; 
            -webkit-user-select: none; 
            -webkit-tap-highlight-color: transparent;
            outline: none; 
            user-select: none;
        }

        /* АНИМАЦИИ */
        @keyframes neonPulseGold {
            0% { box-shadow: 0 0 10px var(--neon-gold); }
            50% { box-shadow: 0 0 30px var(--neon-gold); }
            100% { box-shadow: 0 0 10px var(--neon-gold); }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }

        @keyframes flicker {
            0%, 18%, 22%, 25%, 53%, 57%, 100% { text-shadow: 0 0 15px var(--glow-white); }
            20%, 24%, 55% { text-shadow: none; }
        }

        /* БАЗОВЫЕ СТИЛИ СТРАНИЦЫ */
        body { 
            background: var(--bg-black); 
            color: #ffffff; 
            font-family: 'Lilita One', cursive; 
            height: 100vh; 
            width: 100vw;
            overflow: hidden; 
            display: flex; 
            justify-content: center; 
            align-items: center;
        }

        .app-container { 
            width: 100%; 
            height: 100%; 
            max-width: 480px; 
            position: relative; 
            display: flex; 
            flex-direction: column;
            border-left: 1px solid rgba(255,255,255,0.02);
            border-right: 1px solid rgba(255,255,255,0.02);
        }

        /* ЭКРАНЫ */
        .screen-view { 
            position: absolute; 
            inset: 0; 
            display: none; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            padding: 60px 40px; 
            background: var(--bg-black); 
            z-index: 5;
        }

        .screen-view.active { 
            display: flex; 
            animation: fadeIn 0.4s cubic-bezier(0.4, 0, 0.2, 1); 
        }

        /* --- ГЛАВНОЕ МЕНЮ (ШРИФТЫ И ЦЕНТРИРОВАНИЕ) --- */
        .header-section { 
            text-align: center; 
            margin-bottom: 70px; 
            display: flex; 
            flex-direction: column; 
            align-items: center;
        }

        .logo-main-title { 
            font-size: 115px; 
            color: var(--neon-red); 
            text-shadow: 0 0 30px var(--neon-red), 0 0 60px var(--neon-red); 
            line-height: 0.8;
            letter-spacing: -2px;
            text-transform: uppercase;
        }

        .logo-brawl-subtitle { 
            font-size: 44px; 
            color: var(--neon-gold); 
            text-shadow: 0 0 20px var(--neon-gold); 
            margin-top: 5px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .logo-edition-tag { 
            font-family: 'Black Ops One'; 
            font-size: 18px; 
            color: #ffffff; 
            text-shadow: 0 0 15px var(--glow-white); 
            margin-top: 15px;
            letter-spacing: 4px;
            animation: flicker 4s infinite;
        }

        /* КНОПКИ */
        .btn-wrapper { 
            width: 100%; 
            display: flex; 
            flex-direction: column; 
            gap: 24px; 
        }

        .btn-universal {
            width: 100%;
            padding: 26px;
            background: rgba(0,0,0,0.6);
            border: 4px solid var(--neon-blue);
            box-shadow: 0 0 18px var(--neon-blue);
            border-radius: 45px;
            color: #ffffff;
            font-family: 'Exo 2';
            font-weight: 900;
            font-size: 24px;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: center;
        }

        .btn-universal:active { transform: scale(0.96); filter: brightness(1.2); }

        .btn-exit-ui { 
            border-color: #333333; 
            box-shadow: none; 
            color: #777777; 
        }

        /* --- ЭКРАН НАСТРОЕК ЛОББИ --- */
        .setup-heading { 
            font-family: 'Exo 2'; 
            font-size: 32px; 
            color: #ffffff; 
            text-shadow: 0 0 15px rgba(255,255,255,0.7); 
            margin-bottom: 40px; 
            text-transform: uppercase; 
        }

        .tab-selector { 
            display: flex; 
            width: 100%; 
            gap: 15px; 
            margin-bottom: 45px; 
        }

        .tab-item { 
            flex: 1; 
            padding: 20px; 
            border-radius: 25px; 
            border: 3px solid; 
            background: #000; 
            font-family: 'Exo 2'; 
            font-size: 16px; 
            text-transform: uppercase; 
            text-align: center; 
            font-weight: 900;
        }

        .tab-blue-neon { border-color: var(--neon-blue); color: var(--neon-blue); box-shadow: 0 0 12px var(--neon-blue); }
        .tab-red-neon { border-color: var(--neon-red); color: var(--neon-red); box-shadow: 0 0 12px var(--neon-red); }

        .control-row { 
            width: 100%; 
            margin-bottom: 30px; 
        }

        .control-header { 
            display: flex; 
            justify-content: space-between; 
            font-family: 'Exo 2'; 
            font-size: 14px; 
            color: #999999; 
            margin-bottom: 15px; 
            text-transform: uppercase; 
            letter-spacing: 1px;
        }

        .control-counter { 
            font-family: 'Black Ops One'; 
            color: #ffffff; 
            font-size: 24px; 
        }

        input[type=range] { 
            width: 100%; 
            -webkit-appearance: none; 
            background: transparent; 
        }

        input[type=range]::-webkit-slider-runnable-track { 
            width: 100%; 
            height: 8px; 
            background: #1a1a1a; 
            border-radius: 4px; 
        }

        input[type=range]::-webkit-slider-thumb { 
            -webkit-appearance: none; 
            height: 28px; 
            width: 28px; 
            border-radius: 50%; 
            background: #ffffff; 
            box-shadow: 0 0 15px #ffffff; 
            margin-top: -10px; 
        }

        /* КНОПКА №6: СОЗДАТЬ КОМНАТУ (ЖИРНЫЙ НЕОН) */
        .btn-create-lobby-final { 
            border-color: var(--neon-gold); 
            box-shadow: 0 0 25px var(--neon-gold); 
            color: #ffffff !important; 
            margin-top: 20px; 
            animation: neonPulseGold 2s infinite;
        }

        /* --- ВХОД ПО ID (БЕЛЫЙ НЕОН ЦИФРЫ) --- */
        .id-input-container { 
            display: flex; 
            align-items: center; 
            gap: 12px; 
            margin: 50px 0; 
        }

        .id-digit-box { 
            font-family: 'Black Ops One'; 
            font-size: 52px; 
            width: 44px; 
            text-align: center; 
            border-bottom: 5px solid #ffffff; 
            color: #ffffff; 
            text-shadow: 0 0 25px #ffffff, 0 0 40px #ffffff; 
        }

        .id-digit-separator { 
            font-family: 'Black Ops One'; 
            font-size: 52px; 
            color: #ffffff; 
            text-shadow: 0 0 25px #ffffff; 
            transform: translateY(-10px); 
        }

        .numpad-layout { 
            display: grid; 
            grid-template-columns: repeat(3, 1fr); 
            gap: 20px; 
            width: 100%; 
        }

        .num-key { 
            aspect-ratio: 1.2; 
            background: #08080c; 
            border: 2px solid #1a1a25; 
            border-radius: 30px; 
            font-size: 36px; 
            color: #ffffff; 
            font-family: 'Black Ops One'; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            transition: 0.1s;
        }

        .num-key:active { transform: scale(0.9); background: #151520; }

        /* --- ЛОББИ: ТГ ЮЗЕР В НЕОНЕ --- */
        .user-neon-badge { 
            padding: 14px 35px; 
            border: 2px solid var(--neon-blue); 
            border-radius: 60px; 
            color: var(--neon-blue); 
            font-family: 'Exo 2'; 
            font-size: 20px; 
            box-shadow: 0 0 20px var(--neon-blue); 
            margin-bottom: 40px; 
            text-transform: lowercase;
            background: rgba(0, 210, 255, 0.05);
        }

        .players-scroll-list { 
            width: 100%; 
            flex: 1; 
            overflow-y: auto; 
            display: flex; 
            flex-direction: column; 
            gap: 18px; 
            padding-right: 5px;
        }

        .player-card-ui { 
            background: #0a0a0f; 
            border: 2px solid #222222; 
            border-radius: 28px; 
            padding: 22px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center;
        }

        .status-ready-pill { color: var(--neon-green); text-shadow: 0 0 10px var(--neon-green); font-family: 'Exo 2'; text-transform: uppercase; font-size: 15px; font-weight: 900; }
        .status-waiting-pill { color: var(--neon-red); text-shadow: 0 0 10px var(--neon-red); font-family: 'Exo 2'; text-transform: uppercase; font-size: 15px; font-weight: 900; }

    </style>
</head>
<body>

    <div class="app-container">
        
        <div id="scr-menu" class="screen-view active">
            <div class="header-section">
                <div class="logo-main-title">ШПИОН</div>
                <div class="logo-brawl-subtitle">BRAWL STARS</div>
                <div class="logo-edition-tag">EDITION 2026</div>
            </div>
            
            <div class="btn-wrapper">
                <button class="btn-universal" onclick="App.nav('scr-setup')">СОЗДАТЬ ЛОББИ</button>
                <button class="btn-universal" onclick="App.nav('scr-join')">ВХОД ПО ID</button>
                <button class="btn-universal btn-exit-ui" onclick="tg.close()">ВЫХОД</button>
            </div>
        </div>

        <div id="scr-setup" class="screen-view">
            <h2 class="setup-heading">НАСТРОЙКА ЛОББИ</h2>
            
            <div class="tab-selector">
                <div class="tab-item tab-blue-neon">УЧАСТНИКИ</div>
                <div class="tab-item tab-red-neon">ШПИОН</div>
            </div>

            <div class="control-row">
                <div class="control-header">КОЛ-ВО ИГРОКОВ <span class="control-counter" id="p-count">8</span></div>
                <input type="range" min="3" max="30" value="8" oninput="document.getElementById('p-count').innerText = this.value">
            </div>

            <div class="control-row">
                <div class="control-header">КОЛ-ВО ШПИОНОВ <span class="control-counter" id="s-count">1</span></div>
                <input type="range" min="1" max="15" value="1" oninput="document.getElementById('s-count').innerText = this.value">
            </div>

            <div id="setup-id-preview" style="font-family:'Black Ops One'; font-size: 28px; color: var(--neon-gold); margin: 25px 0;">ID: ....-....</div>

            <div class="btn-wrapper">
                <button class="btn-universal btn-create-lobby-final" onclick="App.createRoom()">СОЗДАТЬ КОМНАТУ</button>
                <button class="btn-universal" style="border-color:#333; box-shadow:none;" onclick="App.nav('scr-menu')">НАЗАД</button>
            </div>
        </div>

        <div id="scr-join" class="screen-view">
            <h2 class="setup-heading">ID КОМНАТЫ</h2>
            
            <div class="id-input-container">
                <div class="id-digit-box" id="c1">_</div><div class="id-digit-box" id="c2">_</div><div class="id-digit-box" id="c3">_</div><div class="id-digit-box" id="c4">_</div>
                <div class="id-digit-separator">-</div>
                <div class="id-digit-box" id="c5">_</div><div class="id-digit-box" id="c6">_</div><div class="id-digit-box" id="c7">_</div><div class="id-digit-box" id="c8">_</div>
            </div>

            <div class="numpad-layout">
                <script>
                    for(let i=1; i<=9; i++) {
                        document.write(`<div class="num-key" onclick="App.keyPress('${i}')">${i}</div>`);
                    }
                </script>
                <div class="num-key" style="color:var(--neon-red)" onclick="App.keyPress('C')">C</div>
                <div class="num-key" onclick="App.keyPress('0')">0</div>
                <div class="num-key" style="color:var(--neon-gold)" onclick="App.joinRoom()">OK</div>
            </div>

            <button class="btn-universal" style="margin-top:40px; border-color:#333; box-shadow:none;" onclick="App.nav('scr-menu')">НАЗАД</button>
        </div>

        <div id="scr-room" class="screen-view">
            <div class="user-neon-badge" id="player-tag">@BRAWLER</div>
            <h2 class="setup-heading">ЛОББИ БИТВЫ</h2>
            <div id="room-id-display" style="font-family:'Black Ops One'; font-size: 30px; color: var(--neon-gold); margin-bottom: 30px;">ID: ....-....</div>
            
            <div class="players-scroll-list" id="ui-player-list"></div>
            
            <div class="btn-wrapper" style="margin-top:35px;">
                <button class="btn-universal" id="ready-trigger" style="border-color:var(--neon-green);" onclick="App.toggleReady()">ГОТОВ</button>
                <button class="btn-universal btn-create-lobby-final" id="start-trigger" style="display:none;">НАЧАТЬ ИГРУ</button>
                <button class="btn-universal" style="border-color:var(--neon-red); box-shadow:none;" onclick="location.reload()">ВЫЙТИ</button>
            </div>
        </div>

    </div>

    <script>
        // FIREBASE CONFIGURATION
        const firebaseConfig = {
            apiKey: "AIzaSyDbopGDAnN6RxiXoAk_Il90WZBCW0bVBvg",
            authDomain: "brawlspy.firebaseapp.com",
            databaseURL: "https://brawlspy-default-rtdb.firebaseio.com",
            projectId: "brawlspy",
            storageBucket: "brawlspy.firebasestorage.app",
            messagingSenderId: "803859610634",
            appId: "1:803859610634:web:2310aa16bb6e61049833f3"
        };

        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();
        const tg = window.Telegram.WebApp;
        
        // ДАННЫЕ ПОЛЬЗОВАТЕЛЯ
        const currentUser = tg.initDataUnsafe.user || { id: 999, username: "LocalBrawler" };
        document.getElementById('player-tag').innerText = "@" + (currentUser.username || "Guest");
        tg.expand();

        // ОБЪЕКТ ПРИЛОЖЕНИЯ
        const App = {
            currentRoomId: null,
            inputString: "",
            isPlayerReady: false,

            // НАВИГАЦИЯ МЕЖДУ ЭКРАНАМИ
            nav: function(screenId) {
                const screens = document.querySelectorAll('.screen-view');
                screens.forEach(s => s.classList.remove('active'));
                
                const target = document.getElementById(screenId);
                target.classList.add('active');

                // Генерация ID при переходе на экран настроек
                if(screenId === 'scr-setup') {
                    const p1 = Math.floor(1000 + Math.random() * 8999);
                    const p2 = Math.floor(1000 + Math.random() * 8999);
                    App.currentRoomId = p1 + "-" + p2;
                    document.getElementById('setup-id-preview').innerText = "ID: " + App.currentRoomId;
                }
            },

            // ОБРАБОТКА НАЖАТИЯ ЦИФР
            keyPress: function(val) {
                if(val === 'C') {
                    App.inputString = "";
                } else {
                    if(App.inputString.length < 8) {
                        App.inputString += val;
                    }
                }
                
                // Визуальное обновление ячеек
                for(let i = 1; i <= 8; i++) {
                    const box = document.getElementById('c' + i);
                    box.innerText = App.inputString[i-1] || "_";
                }
                
                tg.HapticFeedback.impactOccurred('light');
            },

            // СОЗДАНИЕ И ПОДКЛЮЧЕНИЕ К ЛОББИ
            createRoom: function() {
                App.nav('scr-room');
                App.initializeSync();
            },

            joinRoom: function() {
                if(App.inputString.length === 8) {
                    App.currentRoomId = App.inputString.slice(0,4) + "-" + App.inputString.slice(4,8);
                    App.nav('scr-room');
                    App.initializeSync();
                } else {
                    tg.showAlert("Введите полный ID комнаты!");
                }
            },

            // СИНХРОНИЗАЦИЯ С FIREBASE
            initializeSync: function() {
                document.getElementById('room-id-display').innerText = "ID: " + App.currentRoomId;
                
                const refPath = 'rooms/' + App.currentRoomId + '/players/' + currentUser.id;
                database.ref(refPath).set({
                    name: "@" + (currentUser.username || "player"),
                    ready: false,
                    lastSeen: Date.now()
                });

                // Слушатель списка игроков
                database.ref('rooms/' + App.currentRoomId + '/players').on('value', (snapshot) => {
                    const listUi = document.getElementById('ui-player-list');
                    listUi.innerHTML = "";
                    const playersData = snapshot.val();

                    if(playersData) {
                        Object.keys(playersData).forEach(id => {
                            const p = playersData[id];
                            const card = document.createElement('div');
                            card.className = 'player-card-ui';
                            card.innerHTML = `
                                <span style="font-family:'Exo 2'; font-size:20px; font-weight:900;">${p.name}</span>
                                <span class="${p.ready ? 'status-ready-pill' : 'status-waiting-pill'}">
                                    ${p.ready ? 'ГОТОВ' : 'ЖДЕМ'}
                                </span>
                            `;
                            listUi.appendChild(card);
                        });
                    }
                });
            },

            // ПЕРЕКЛЮЧЕНИЕ ГОТОВНОСТИ
            toggleReady: function() {
                App.isPlayerReady = !App.isPlayerReady;
                const ref = database.ref('rooms/' + App.currentRoomId + '/players/' + currentUser.id);
                ref.update({ ready: App.isPlayerReady });

                const btn = document.getElementById('ready-trigger');
                btn.innerText = App.isPlayerReady ? "ОТМЕНА" : "ГОТОВ";
                btn.style.borderColor = App.isPlayerReady ? "var(--neon-red)" : "var(--neon-green)";
                
                tg.HapticFeedback.notificationOccurred(App.isPlayerReady ? 'success' : 'warning');
            }
        };
    </script>
</body>
</html>
