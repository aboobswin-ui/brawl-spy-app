<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brawl Spy - Главное меню</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* Сброс и база */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0a0a0a 0%, #1a1a1a 50%, #0a0a0a 100%);
            color: #f0f0f0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            overflow-x: hidden;
        }

        /* Контейнер для всего контента */
        .main-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 500px;
            gap: 40px;
            padding-top: 30px;
        }

        /* Стиль для логотипа */
        .logo-container {
            width: 100%;
            display: flex;
            justify-content: center;
            margin-bottom: 20px;
        }
        .logo-img {
            max-width: 90%;
            height: auto;
            filter: drop-shadow(0 0 15px rgba(255, 10, 30, 0.4));
        }

        /* ОБЩИЙ СТИЛЬ ВСЕХ КНОПОК */
        .menu-button {
            width: 100%;
            padding: 20px;
            border: none;
            border-radius: 16px;
            font-size: 1.3rem;
            font-weight: 700;
            letter-spacing: 1px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.4);
            position: relative;
            overflow: hidden;
        }
        .menu-button:active {
            transform: scale(0.98);
        }

        /* Конкретные кнопки */
        /* 1. СОЗДАТЬ ЛОББИ - главная, как в лого */
        #createLobby {
            background: linear-gradient(135deg, #8B0000 0%, #B22222 30%, #8B0000 100%);
            color: #FFD700;
            border: 2px solid #FF4500;
            margin-top: 10px;
        }
        #createLobby:hover {
            background: linear-gradient(135deg, #9E0000 0%, #C22 40%, #9E0000 100%);
            box-shadow: 0 0 25px rgba(255, 69, 0, 0.7);
        }

        /* 2. ВХОД ПО ID - нейтральная, но стильная */
        #joinById {
            background: linear-gradient(135deg, #222 0%, #333 50%, #222 100%);
            color: #00CED1;
            border: 2px solid #2F4F4F;
        }
        #joinById:hover {
            background: linear-gradient(135deg, #2A2A2A 0%, #3A3A3A 50%, #2A2A2A 100%);
            box-shadow: 0 0 20px rgba(0, 206, 209, 0.5);
        }

        /* 3. ВЫХОД - предупреждающая */
        #exitGame {
            background: linear-gradient(135deg, #333 0%, #222 100%);
            color: #FF6347;
            border: 2px solid #8B0000;
        }
        #exitGame:hover {
            background: linear-gradient(135deg, #3A3A3A 0%, #2A2A2A 100%);
            box-shadow: 0 0 20px rgba(139, 0, 0, 0.6);
        }

        /* Блок с информацией или полем ввода (для ВХОДА ПО ID) */
        .input-container {
            width: 100%;
            display: none; /* Скрыт по умолчанию */
            flex-direction: column;
            gap: 15px;
            margin-top: 15px;
            animation: fadeIn 0.5s ease;
        }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        .input-container input {
            padding: 16px;
            border-radius: 12px;
            border: 2px solid #2F4F4F;
            background-color: #111;
            color: #00CED1;
            font-size: 1.1rem;
            text-align: center;
        }
        .input-container button {
            padding: 16px;
            border-radius: 12px;
            border: none;
            background: linear-gradient(135deg, #006400 0%, #228B22 100%);
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }
        .input-container button:hover {
            background: linear-gradient(135deg, #228B22 0%, #32CD32 100%);
        }

        /* Подсказка внизу */
        .hint {
            margin-top: 30px;
            color: #888;
            font-size: 0.9rem;
            text-align: center;
            padding: 0 20px;
        }
    </style>
</head>
<body>
    <div class="main-container">
        <!-- ЛОГОТИП -->
        <div class="logo-container">
            <img src="https://i.postimg.cc/1X6p4hZ8/Gemini-Generated-Image-sdde75sdde75sdde.png" 
                 alt="Brawl Spy Logo" 
                 class="logo-img">
        </div>

        <!-- КНОПКА 1: СОЗДАТЬ ЛОББИ -->
        <button class="menu-button" id="createLobby">
            <i class="fas fa-plus-circle"></i> СОЗДАТЬ ЛОББИ
        </button>

        <!-- КНОПКА 2: ВХОД ПО ID -->
        <button class="menu-button" id="joinById">
            <i class="fas fa-door-closed"></i> ВХОД ПО ID
        </button>
        <!-- Блок для ввода ID (появляется при нажатии) -->
        <div class="input-container" id="joinInputContainer">
            <input type="text" id="lobbyIdInput" placeholder="Введите ID лобби (например: X7F9K3)" maxlength="10">
            <button id="confirmJoin"><i class="fas fa-check"></i> ПОДТВЕРДИТЬ ВХОД</button>
        </div>

        <!-- КНОПКА 3: ВЫХОД -->
        <button class="menu-button" id="exitGame">
            <i class="fas fa-sign-out-alt"></i> ВЫХОД
        </button>

        <!-- Подсказка -->
        <p class="hint">
            <i class="fas fa-info-circle"></i> Нажмите "Создать лобби", чтобы начать новую шпионскую игру.
        </p>
    </div>

    <script>
        // Получаем элементы
        const joinButton = document.getElementById('joinById');
        const inputContainer = document.getElementById('joinInputContainer');
        const createLobbyBtn = document.getElementById('createLobby');
        const exitBtn = document.getElementById('exitGame');
        const confirmJoinBtn = document.getElementById('confirmJoin');
        const idInput = document.getElementById('lobbyIdInput');

        // Обработка кнопки ВХОД ПО ID
        joinButton.addEventListener('click', () => {
            // Показываем/скрываем поле ввода
            const isVisible = inputContainer.style.display === 'flex';
            inputContainer.style.display = isVisible ? 'none' : 'flex';
            
            // Меняем иконку на кнопке
            const icon = joinButton.querySelector('i');
            if (isVisible) {
                icon.className = 'fas fa-door-closed';
                joinButton.style.border = '2px solid #2F4F4F';
            } else {
                icon.className = 'fas fa-door-open';
                joinButton.style.border = '2px solid #00CED1';
            }
        });

        // Обработка кнопки СОЗДАТЬ ЛОББИ
        createLobbyBtn.addEventListener('click', () => {
            alert('Создание нового лобби...\nПеренаправление на экран настроек.');
            // Здесь будет логика создания лобби
        });

        // Обработка кнопки подтверждения ввода ID
        confirmJoinBtn.addEventListener('click', () => {
            const id = idInput.value.trim();
            if(id.length < 3) {
                alert('Ошибка: ID лобби должен содержать минимум 3 символа.');
                return;
            }
            alert(`Попытка присоединиться к лобби с ID: ${id}\nПроверка соединения...`);
            // Здесь будет логика подключения к лобби
        });

        // Обработка кнопки ВЫХОД
        exitBtn.addEventListener('click', () => {
            if(confirm('Вы уверены, что хотите выйти из игры?')) {
                alert('Выход из игры...');
                // Здесь будет логика выхода
            }
        });

        // Можно нажать Enter в поле ввода ID
        idInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                confirmJoinBtn.click();
            }
        });
    </script>
</body>
</html>
