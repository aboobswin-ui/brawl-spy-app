<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>BRAWL SPY ULTIMATE EDITION 2026</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Black+Ops+One&family=Rubik+One&family=Exo+2:wght@700;900&display=swap" rel="stylesheet">
    
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    
    <style>
        /* --- ГЛОБАЛЬНЫЕ ПЕРЕМЕННЫЕ ЦВЕТОВ --- */
        :root {
            --neon-blue: #00d2ff;
            --neon-red: #ff3131;
            --neon-gold: #ffd700;
            --neon-green: #00ff00;
            --bg-black: #020205;
            --card-bg: #0a0a10;
            --glow-white: rgba(255, 255, 255, 0.9);
            --transition-speed: 0.25s;
        }

        /* --- СБРОС СТИЛЕЙ И БАЗА --- */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
            outline: none;
        }

        html, body {
            width: 100%;
            height: 100%;
            background-color: var(--bg-black);
            color: #ffffff;
            font-family: 'Rubik One', sans-serif;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* --- ОСНОВНАЯ ОБОЛОЧКА ПРИЛОЖЕНИЯ --- */
        .app-shell {
            width: 100%;
            height: 100%;
            max-width: 450px;
            background: radial-gradient(circle at center, #0a0a1a 0%, #020205 100%);
            position: relative;
            display: flex;
            flex-direction: column;
            box-shadow: 0 0 50px rgba(0,0,0,1);
            overflow: hidden;
        }

        /* --- СИСТЕМА ЭКРАНОВ --- */
        .screen {
            position: absolute;
            inset: 0;
            display: none;
            flex-direction: column;
            align-items: center;
            padding: 30px 25px;
            z-index: 10;
            opacity: 0;
            transform: scale(1.05);
            transition: opacity var(--transition-speed), transform var(--transition-speed);
            overflow-y: auto;
            overflow-x: hidden;
        }

        .screen.active {
            display: flex;
            opacity: 1;
            transform: scale(1);
        }

        /* --- ЭКРАН 1: ГЛАВНОЕ МЕНЮ --- */
        .main-menu-header {
            text-align: center;
            margin-top: 40px;
            margin-bottom: 60px;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .main-logo-text {
            font-size: 100px;
            color: var(--neon-red);
            text-shadow: 0 0 40px var(--neon-red), 0 0 10px rgba(0,0,0,0.5);
            line-height: 0.8;
            letter-spacing: -2px;
            margin-bottom: 5px;
        }

        .sub-logo-text {
            font-family: 'Black Ops One';
            font-size: 32px;
            color: var(--neon-gold);
            margin-top: 15px;
            text-shadow: 0 0 15px rgba(255, 215, 0, 0.4);
        }

        .edition-label {
            font-family: 'Exo 2';
            font-size: 16px;
            font-weight: 400;
            color: #ffffff;
            opacity: 0.7;
            margin-top: 8px;
            letter-spacing: 3px;
            text-transform: uppercase;
        }

        /* --- УНИВЕРСАЛЬНЫЕ КНОПКИ --- */
        .btn-action {
            width: 100%;
            max-width: 350px;
            padding: 22px;
            background: #000000;
            border: 4px solid var(--neon-blue);
            box-shadow: 0 0 20px rgba(0, 210, 255, 0.4);
            border-radius: 25px;
            color: #ffffff;
            font-family: 'Exo 2';
            font-weight: 900;
            font-size: 22px;
            text-transform: uppercase;
            margin: 0 auto 20px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.15s ease;
        }

        .btn-action:active {
            transform: scale(0.94);
            box-shadow: 0 0 30px rgba(0, 210, 255, 0.7);
        }

        .btn-secondary {
            border-color: #252525;
            box-shadow: none;
            color: #888888;
            margin-top: auto;
            font-size: 22px;
            border-radius: 25px;
            max-width: 350px;
        }

        /* --- ЭКРАН 2: ВВОД ID --- */
        .title-neon-white {
            font-family: 'Exo 2';
            font-size: 32px;
            color: #ffffff;
            text-shadow: 0 0 20px var(--glow-white);
            margin-bottom: 40px;
            text-transform: uppercase;
            text-align: center;
            width: 100%;
        }

        .id-input-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-bottom: 45px;
            height: 80px;
        }

        .id-digit-box {
            font-family: 'Black Ops One';
            font-size: 42px;
            color: #ffffff;
            text-shadow: 0 0 15px var(--glow-white);
            width: 35px;
            text-align: center;
            border-bottom: 4px solid #ffffff;
            padding-bottom: 5px;
            height: 60px;
            display: flex;
            align-items: flex-end;
            justify-content: center;
        }

        .id-hyphen {
            font-family: 'Black Ops One';
            font-size: 36px;
            color: #ffffff;
            text-shadow: 0 0 15px var(--glow-white);
            margin: 0 8px;
            display: flex;
            align-items: center;
            height: 100%;
        }

        /* ЦИФРОВАЯ КЛАВИАТУРА */
        .numpad-container {
            width: 100%;
            display: flex;
            justify-content: center;
            margin-bottom: 30px;
        }

        .numpad-grid {
            display: grid;
            grid-template-columns: repeat(3, 85px);
            gap: 15px;
            justify-content: center;
        }

        .n-key {
            width: 85px;
            height: 85px;
            background: #0d0d14;
            border: 2px solid #252525;
            border-radius: 20px;
            font-size: 32px;
            color: #ffffff;
            font-family: 'Black Ops One';
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.1s;
        }

        .n-key:active {
            background: #1a1a25;
            transform: scale(0.9);
            border-color: var(--neon-blue);
        }

        /* --- ЭКРАН 3: НАСТРОЙКА ЛОББИ --- */
        .id-display-white {
            color: #ffffff;
            font-family: 'Black Ops One';
            font-size: 20px;
            letter-spacing: 1px;
            margin-bottom: 25px;
            text-align: center;
            width: 100%;
        }

        .user-identity-card {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            margin: 0 auto 35px;
            width: 100%;
            max-width: 350px;
        }

        .avatar-frame {
            width: 55px;
            height: 55px;
            border-radius: 50%;
            border: 2px solid #ffffff;
            box-shadow: 0 0 15px var(--glow-white);
            background: #222 center/cover;
        }

        .username-label {
            font-family: 'Exo 2';
            font-size: 18px;
            color: #ffffff;
            text-shadow: 0 0 8px #ffffff;
        }

        .settings-row {
            width: 100%;
            max-width: 350px;
            background: var(--card-bg);
            border: 3px solid var(--neon-blue);
            box-shadow: 0 0 15px rgba(0, 210, 255, 0.3);
            border-radius: 22px;
            padding: 15px 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 0 auto 18px;
        }

        .settings-row.red-theme {
            border-color: var(--neon-red);
            box-shadow: 0 0 15px rgba(255, 49, 49, 0.3);
        }

        .control-group {
            display: flex;
            align-items: center;
            gap: 18px;
        }

        .circle-btn {
            width: 45px;
            height: 45px;
            background: #000;
            border: 2px solid var(--neon-blue);
            border-radius: 12px;
            color: var(--neon-blue);
            font-size: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Rubik One';
            cursor: pointer;
        }

        .circle-btn.red-btn {
            border-color: var(--neon-red);
            color: var(--neon-red);
        }

        .circle-btn:active {
            transform: scale(0.9);
        }

        .value-display {
            font-family: 'Black Ops One';
            font-size: 32px;
            min-width: 30px;
            text-align: center;
            color: #ffffff;
        }

        /* КНОПКА СОЗДАТЬ КОМНАТУ */
        .btn-create-lobby {
            width: 100%;
            max-width: 350px;
            padding: 22px;
            background: #000;
            border: 5px solid var(--neon-gold);
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.5);
            border-radius: 25px;
            color: #ffffff;
            font-family: 'Exo 2';
            font-weight: 900;
            font-size: 22px;
            text-transform: uppercase;
            margin: 15px auto 0;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.15s ease;
        }

        .btn-create-lobby:active {
            transform: scale(0.94);
            box-shadow: 0 0 30px rgba(255, 215, 0, 0.7);
        }

        /* --- ЭКРАН 4: АКТИВНАЯ КОМНАТА --- */
        .players-scroll-area {
            width: 100%;
            max-width: 350px;
            display: flex;
            flex-direction: column;
            gap: 14px;
            margin: 0 auto 25px;
            overflow-y: auto;
            padding-right: 5px;
            max-height: 250px;
        }

        .player-slot-card {
            width: 100%;
            background: rgba(10, 10, 16, 0.8);
            border: 2px solid #222;
            border-radius: 20px;
            padding: 14px 18px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: border-color 0.3s;
        }

        .player-slot-card.occupied {
            border-color: #444;
        }

        .slot-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .slot-ava {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            border: 1px solid rgba(255,255,255,0.3);
            background: #111 center/cover;
        }

        .slot-name {
            font-family: 'Exo 2';
            font-size: 16px;
            color: #ffffff;
        }

        .status-indicator {
            padding: 6px 14px;
            border-radius: 12px;
            font-family: 'Exo 2';
            font-size: 13px;
            font-weight: 900;
            text-transform: uppercase;
            border: 2px solid;
            white-space: nowrap;
        }

        .status-ready {
            border-color: var(--neon-green);
            color: var(--neon-green);
            box-shadow: 0 0 10px var(--neon-green);
        }

        .status-not-ready {
            border-color: var(--neon-red);
            color: var(--neon-red);
            box-shadow: 0 0 10px var(--neon-red);
        }

        .status-empty {
            border-color: #333;
            color: #333;
        }

        /* КНОПКИ УПРАВЛЕНИЯ В КОМНАТЕ */
        .room-controls-box {
            width: 100%;
            max-width: 350px;
            display: flex;
            flex-direction: column;
            margin: 20px auto 0;
        }

        .btn-ready-toggle {
            border-color: var(--neon-green);
            box-shadow: 0 0 15px rgba(0, 255, 0, 0.3);
        }

        .btn-ready-toggle.active-ready {
            border-color: var(--neon-red);
            box-shadow: 0 0 15px rgba(255, 49, 49, 0.3);
        }

        #start-btn {
            border-color: var(--neon-gold);
            color: var(--neon-gold);
            display: none;
        }

        /* СКРОЛЛБАР */
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #333; border-radius: 10px; }
        
        /* ХОВЕР ЭФФЕКТЫ ДЛЯ ДЕСКТОПА */
        @media (hover: hover) {
            .btn-action:hover, .btn-create-lobby:hover {
                transform: translateY(-2px);
            }
            .n-key:hover {
                border-color: var(--neon-blue);
                transform: scale(1.05);
            }
        }
    </style>
</head>
<body>

    <div class="app-shell">
        
        <div id="scr-menu" class="screen active">
            <div class="main-menu-header">
                <div class="main-logo-text">SPY</div>
                <div class="sub-logo-text">BRAWL STARS</div>
                <div class="edition-label">edition 2026</div>
            </div>
            
            <button class="btn-action" onclick="App.navigate('scr-lobby')">СОЗДАТЬ ЛОББИ</button>
            <button class="btn-action" onclick="App.navigate('scr-join')">ВХОД ПО ID</button>
            
            <button class="btn-action btn-secondary" onclick="App.exitGame()">ВЫХОД</button>
        </div>

        <div id="scr-join" class="screen">
            <h2 class="title-neon-white">ВВЕДИТЕ КОД</h2>
            
            <div class="id-input-container">
                <div class="id-digit-box" id="d1">_</div>
                <div class="id-digit-box" id="d2">_</div>
                <div class="id-digit-box" id="d3">_</div>
                <div class="id-digit-box" id="d4">_</div>
                <div class="id-hyphen">-</div>
                <div class="id-digit-box" id="d5">_</div>
                <div class="id-digit-box" id="d6">_</div>
                <div class="id-digit-box" id="d7">_</div>
                <div class="id-digit-box" id="d8">_</div>
            </div>

            <div class="numpad-container">
                <div class="numpad-grid">
                    <button class="n-key" onclick="App.pressKey('1')">1</button>
                    <button class="n-key" onclick="App.pressKey('2')">2</button>
                    <button class="n-key" onclick="App.pressKey('3')">3</button>
                    <button class="n-key" onclick="App.pressKey('4')">4</button>
                    <button class="n-key" onclick="App.pressKey('5')">5</button>
                    <button class="n-key" onclick="App.pressKey('6')">6</button>
                    <button class="n-key" onclick="App.pressKey('7')">7</button>
                    <button class="n-key" onclick="App.pressKey('8')">8</button>
                    <button class="n-key" onclick="App.pressKey('9')">9</button>
                    <button class="n-key" style="color:var(--neon-red)" onclick="App.pressKey('C')">C</button>
                    <button class="n-key" onclick="App.pressKey('0')">0</button>
                    <button class="n-key" style="color:var(--neon-gold)" onclick="App.joinByCode()">OK</button>
                </div>
            </div>

            <button class="btn-action btn-secondary" onclick="App.navigate('scr-menu')">НАЗАД</button>
        </div>

        <div id="scr-lobby" class="screen">
            <h2 class="title-neon-white" style="margin-bottom:5px">НАСТРОЙКА ЛОББИ</h2>
            <div class="id-display-white" id="lobby-id-val">ID: 0000-0000</div>

            <div class="user-identity-card">
                <div class="avatar-frame" id="my-ava"></div>
                <div class="username-label" id="my-tag">@player</div>
            </div>

            <div class="settings-row">
                <span style="font-family:'Exo 2'; font-size:18px; color:#fff">УЧАСТНИКИ</span>
                <div class="control-group">
                    <button class="circle-btn" onclick="App.updateSettings('p', -1)">-</button>
                    <span class="value-display" id="p-count">4</span>
                    <button class="circle-btn" onclick="App.updateSettings('p', 1)">+</button>
                </div>
            </div>

            <div class="settings-row red-theme">
                <span style="font-family:'Exo 2'; font-size:18px; color:#fff">ШПИОН</span>
                <div class="control-group">
                    <button class="circle-btn red-btn" onclick="App.updateSettings('s', -1)">-</button>
                    <span class="value-display" id="s-count">1</span>
                    <button class="circle-btn red-btn" onclick="App.updateSettings('s', 1)">+</button>
                </div>
            </div>

            <button class="btn-create-lobby" onclick="App.createFinalRoom()">СОЗДАТЬ КОМНАТУ</button>
            
            <button class="btn-action btn-secondary" onclick="App.navigate('scr-menu')">НАЗАД</button>
        </div>

        <div id="scr-room" class="screen">
            <h2 class="title-neon-white" style="margin-bottom:5px">КОМНАТА ИГРЫ</h2>
            <div class="id-display-white" id="room-id-val">ID: 0000-0000</div>

            <div class="players-scroll-area" id="room-slots">
                <!-- Слоты игроков будут здесь -->
            </div>

            <div class="room-controls-box">
                <button class="btn-action btn-ready-toggle" id="ready-btn" onclick="App.toggleReady()">ГОТОВ</button>
                <button class="btn-action" id="start-btn" onclick="App.startGame()">НАЧАТЬ ИГРУ</button>
                <button class="btn-action btn-secondary" style="margin-top:10px" onclick="App.navigate('scr-menu')">ПОКИНУТЬ</button>
            </div>
        </div>

    </div>

    <script>
        // ИНИЦИАЛИЗАЦИЯ TELEGRAM
        const tg = window.Telegram.WebApp;
        tg.expand();
        tg.enableClosingConfirmation();

        // ГЕНЕРАЦИЯ РАНДОМНОГО ID
        function generateRandomId() {
            const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ0123456789';
            let result = '';
            for (let i = 0; i < 8; i++) {
                result += chars.charAt(Math.floor(Math.random() * chars.length));
                if (i === 3) result += '-';
            }
            return result;
        }

        // ОСНОВНОЕ ПРИЛОЖЕНИЕ
        const App = {
            state: {
                currentScreen: 'scr-menu',
                inputCode: '',
                participants: 4,
                spies: 1,
                lobbyId: generateRandomId(),
                isReady: false,
                isAdmin: true,
                players: []
            },

            // Навигация
            navigate: (screenId) => {
                document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
                const target = document.getElementById(screenId);
                target.classList.add('active');
                App.state.currentScreen = screenId;
                
                if(screenId === 'scr-lobby') {
                    document.getElementById('lobby-id-val').innerText = "ID: " + App.state.lobbyId;
                }
                if(screenId === 'scr-room') {
                    App.buildRoom();
                }
                
                // Обновляем кнопку "Начать игру"
                const startBtn = document.getElementById('start-btn');
                if (screenId === 'scr-room') {
                    startBtn.style.display = App.state.isAdmin ? 'block' : 'none';
                } else {
                    startBtn.style.display = 'none';
                }
                
                tg.HapticFeedback.impactOccurred('light');
            },

            // Выход из игры
            exitGame: () => {
                if (confirm("Вы уверены, что хотите выйти?")) {
                    tg.close();
                }
            },

            // Ввод кода
            pressKey: (key) => {
                if(key === 'C') {
                    App.state.inputCode = '';
                } else if(App.state.inputCode.length < 8 && /^[0-9]$/.test(key)) {
                    App.state.inputCode += key;
                }
                
                for(let i = 1; i <= 8; i++) {
                    const char = App.state.inputCode[i-1] || "_";
                    const el = document.getElementById('d' + i);
                    el.innerText = char;
                    el.style.opacity = char === "_" ? "0.3" : "1";
                    el.style.color = char === "_" ? "#666" : "#ffffff";
                }
                tg.HapticFeedback.selectionChanged();
            },

            // Подключение по коду
            joinByCode: () => {
                if(App.state.inputCode.length === 8 && /^\d+$/.test(App.state.inputCode)) {
                    App.state.lobbyId = App.state.inputCode.slice(0,4) + "-" + App.state.inputCode.slice(4,8);
                    App.state.isAdmin = false;
                    App.navigate('scr-room');
                    tg.showAlert("Подключение к комнате...");
                } else {
                    tg.showAlert("Ошибка: введите 8 цифр");
                    tg.HapticFeedback.notificationOccurred('error');
                }
            },

            // Настройки лобби
            updateSettings: (type, delta) => {
                if(type === 'p') {
                    const newVal = App.state.participants + delta;
                    if (newVal >= 2 && newVal <= 12) {
                        App.state.participants = newVal;
                        document.getElementById('p-count').innerText = App.state.participants;
                        
                        // Автоматически корректируем шпионов
                        if (App.state.spies > App.state.participants - 1) {
                            App.state.spies = Math.max(1, App.state.participants - 1);
                            document.getElementById('s-count').innerText = App.state.spies;
                        }
                    }
                } else {
                    const newVal = App.state.spies + delta;
                    const maxSpies = App.state.participants - 1;
                    if (newVal >= 1 && newVal <= maxSpies) {
                        App.state.spies = newVal;
                        document.getElementById('s-count').innerText = App.state.spies;
                    }
                }
                tg.HapticFeedback.selectionChanged();
            },

            // Создание финальной комнаты
            createFinalRoom: () => {
                if (App.state.spies >= App.state.participants) {
                    tg.showAlert("Ошибка: шпионов должно быть меньше чем участников");
                    tg.HapticFeedback.notificationOccurred('error');
                    return;
                }
                
                App.state.isAdmin = true;
                App.state.lobbyId = generateRandomId();
                App.navigate('scr-room');
                tg.showAlert("Комната создана! ID: " + App.state.lobbyId);
            },

            // Логика комнаты
            buildRoom: () => {
                document.getElementById('room-id-val').innerText = "ID: " + App.state.lobbyId;
                const container = document.getElementById('room-slots');
                container.innerHTML = '';

                for(let i = 0; i < App.state.participants; i++) {
                    const isMe = i === 0;
                    const card = document.createElement('div');
                    card.className = `player-slot-card ${isMe ? 'occupied' : ''}`;
                    
                    card.innerHTML = `
                        <div class="slot-info">
                            <div class="slot-ava" style="${isMe && tg.initDataUnsafe.user?.photo_url ? 'background-image:url('+tg.initDataUnsafe.user.photo_url+')' : ''}"></div>
                            <div class="slot-name">${isMe ? '@' + (tg.initDataUnsafe.user?.username || 'Вы') : 'ОЖИДАНИЕ...'}</div>
                        </div>
                        <div class="status-indicator ${isMe ? (App.state.isReady ? 'status-ready' : 'status-not-ready') : 'status-empty'}">
                            ${isMe ? (App.state.isReady ? 'ГОТОВ' : 'НЕ ГОТОВ') : 'ПУСТО'}
                        </div>
                    `;
                    container.appendChild(card);
                }
            },

            // Переключение готовности
            toggleReady: () => {
                App.state.isReady = !App.state.isReady;
                const btn = document.getElementById('ready-btn');
                btn.innerText = App.state.isReady ? 'ОТМЕНА' : 'ГОТОВ';
                btn.classList.toggle('active-ready', App.state.isReady);
                
                App.buildRoom();
                tg.HapticFeedback.notificationOccurred('success');
            },

            // Начать игру
            startGame: () => {
                if (!App.state.isReady) {
                    tg.showAlert("Вы должны быть готовы!");
                    tg.HapticFeedback.notificationOccurred('error');
                    return;
                }
                
                tg.showAlert("Игра начинается! Шпионы: " + App.state.spies);
                tg.HapticFeedback.notificationOccurred('success');
                // Здесь будет переход на экран игры
            }
        };

        // Подгрузка данных профиля
        if(tg.initDataUnsafe.user) {
            const user = tg.initDataUnsafe.user;
            document.getElementById('my-tag').innerText = "@" + (user.username || "player");
            if(user.photo_url) {
                document.getElementById('my-ava').style.backgroundImage = `url(${user.photo_url})`;
            }
        }

        // Инициализация при загрузке
        document.addEventListener('DOMContentLoaded', () => {
            App.navigate('scr-menu');
        });
    </script>
</body>
</html>
