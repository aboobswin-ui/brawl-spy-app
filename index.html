<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Brawl Spy Ultimate</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Rubik+One&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0b0b10;
            --panel: #1a1a24;
            --primary: #7209B7;
            --accent: #F72585;
            --text: #FFFFFF;
            --secondary: #4CC9F0;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; font-family: 'Rubik One', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background-color: var(--bg); color: var(--text); height: 100vh; display: flex; align-items: center; justify-content: center; overflow: hidden; }
        
        .screen { display: none; width: 100%; height: 100%; flex-direction: column; align-items: center; justify-content: space-between; padding: 40px 20px; text-align: center; }
        .screen.active { display: flex; }

        /* Дизайн кнопок */
        .btn-main {
            width: 100%; max-width: 320px; padding: 20px; border-radius: 20px;
            background: var(--primary); color: white; border: none; font-size: 22px;
            box-shadow: 0 6px 0 #4a0577; transition: 0.1s; cursor: pointer;
        }
        .btn-main:active { transform: translateY(4px); box-shadow: 0 2px 0 #4a0577; }
        
        /* 3D Карта */
        .card-wrap { width: 280px; height: 400px; perspective: 1000px; margin: 20px 0; }
        .card-inner { position: relative; width: 100%; height: 100%; transition: transform 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275); transform-style: preserve-3d; }
        .card-inner.flipped { transform: rotateY(180deg); }
        .card-side { position: absolute; width: 100%; height: 100%; backface-visibility: hidden; border-radius: 35px; border: 8px solid var(--primary); display: flex; flex-direction: column; align-items: center; justify-content: center; background: var(--panel); }
        .card-front { transform: rotateY(180deg); background: #fff; color: #000; border-color: var(--accent); }
        
        .brawler-img { width: 200px; height: 200px; object-fit: contain; }
        #timer-display { font-size: 70px; color: var(--accent); margin-bottom: 20px; }
    </style>
</head>
<body>

    <div id="menu" class="screen active">
        <h1 style="font-size: 50px;">BRAWL<br><span style="color:var(--primary)">SPY</span></h1>
        <button class="btn-main" onclick="nav('lobby')">ИГРАТЬ</button>
    </div>

    <div id="lobby" class="screen">
        <h2>ИГРОКИ</h2>
        <div style="display:flex; align-items:center; gap:30px; background:var(--panel); padding:20px; border-radius:20px;">
            <button class="btn-circle" style="width:50px; height:50px; background:var(--primary); border:none; border-radius:10px; color:white; font-size:24px;" onclick="changeP(-1)">-</button>
            <span id="p-count" style="font-size:40px;">3</span>
            <button class="btn-circle" style="width:50px; height:50px; background:var(--primary); border:none; border-radius:10px; color:white; font-size:24px;" onclick="changeP(1)">+</button>
        </div>
        <button class="btn-main" onclick="startGame()">РАЗДАТЬ</button>
    </div>

    <div id="game" class="screen">
        <h3 id="p-label" style="color:var(--secondary)">ИГРОК 1</h3>
        <div class="card-wrap" onclick="flip()">
            <div id="card-obj" class="card-inner">
                <div class="card-side"><h1>?</h1><p>ТАПНИ МЕНЯ</p></div>
                <div class="card-side card-front" id="role-ui"></div>
            </div>
        </div>
        <div id="timer-ui" style="display:none;">
            <div id="timer-display">05:00</div>
        </div>
        <button id="btn-action" class="btn-main" style="visibility:hidden;" onclick="next()">ДАЛЕЕ</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        const BRAWLERS = [
            { n: "LEON", i: "https://cdn.brawlstats.com/character-arts/16000017.png" },
            { n: "SPIKE", i: "https://cdn.brawlstats.com/character-arts/16000007.png" },
            { n: "CROW", i: "https://cdn.brawlstats.com/character-arts/16000008.png" },
            { n: "MORTIS", i: "https://cdn.brawlstats.com/character-arts/16000014.png" },
            { n: "SHELLY", i: "https://cdn.brawlstats.com/character-arts/16000000.png" },
            { n: "EL PRIMO", i: "https://cdn.brawlstats.com/character-arts/16000012.png" }
        ];

        let state = { p: 3, cur: 0, roles: [], isFlipped: false, time: 300 };

        function nav(id) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            tg.HapticFeedback.impactOccurred('light');
        }

        function changeP(v) {
            state.p = Math.max(3, Math.min(12, state.p + v));
            document.getElementById('p-count').innerText = state.p;
            tg.HapticFeedback.selectionChanged();
        }

        function startGame() {
            state.cur = 0; state.roles = []; state.isFlipped = false;
            let spyIdx = Math.floor(Math.random() * state.p);
            let brawler = BRAWLERS[Math.floor(Math.random() * BRAWLERS.length)];
            
            for(let i=0; i<state.p; i++) {
                state.roles.push(i === spyIdx ? {n: "ШПИОН", i: "https://cdn-icons-png.flaticon.com/512/953/953791.png"} : brawler);
            }
            nav('game');
            updateUI();
        }

        function flip() {
            if(state.isFlipped) return;
            const role = state.roles[state.cur];
            document.getElementById('role-ui').innerHTML = `<h2 style="margin-bottom:10px">${role.n}</h2><img src="${role.i}" class="brawler-img">`;
            document.getElementById('card-obj').classList.add('flipped');
            document.getElementById('btn-action').style.visibility = 'visible';
            state.isFlipped = true;
            tg.HapticFeedback.impactOccurred('heavy');
        }

        function next() {
            state.cur++;
            if(state.cur < state.p) {
                state.isFlipped = false;
                document.getElementById('card-obj').classList.remove('flipped');
                document.getElementById('btn-action').style.visibility = 'hidden';
                setTimeout(updateUI, 300);
            } else {
                startTimer();
            }
        }

        function updateUI() { document.getElementById('p-label').innerText = `ИГРОК ${state.cur + 1}`; }

        function startTimer() {
            document.querySelector('.card-canvas').style.display = 'none';
            document.getElementById('btn-action').style.display = 'none';
            document.getElementById('p-label').innerText = "КТО ШПИОН?";
            document.getElementById('timer-ui').style.display = 'block';
            
            let countdown = setInterval(() => {
                state.time--;
                let m = Math.floor(state.time / 60), s = state.time % 60;
                document.getElementById('timer-display').innerText = `${m}:${s < 10 ? '0'+s : s}`;
                if(state.time <= 0) {
                    clearInterval(countdown);
                    tg.HapticFeedback.notificationOccurred('error');
                    tg.showSelection({title: "ВРЕМЯ ВЫШЛО", items: [{id:"1", title: "Голосовать"}]});
                }
            }, 1000);
        }

        window.onload = () => { tg.ready(); };
    </script>
</body>
</html>
