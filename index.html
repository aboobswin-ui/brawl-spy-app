<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>BRAWL SPY ONLINE - PREVIEW 2026</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Black+Ops+One&family=Rubik+Mono+One&family=Roboto:wght@700;900&display=swap" rel="stylesheet">
    
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>
        /* =========================================
           БЛОК 1: ПЕРЕМЕННЫЕ И ДИЗАЙН-ТОКЕНЫ
           =========================================
        */
        :root {
            --primary-bg: #05070a;
            --accent-white: #ffffff;
            --btn-gold-top: #ffcc00;
            --btn-gold-bottom: #ff8c00;
            --btn-blue-top: #00a2ff;
            --btn-blue-bottom: #004dff;
            --neon-blue-glow: rgba(0, 210, 255, 0.5);
            --neon-red-glow: rgba(255, 49, 49, 0.5);
            --neon-yellow-main: #ffff00;
            --glass-background: rgba(255, 255, 255, 0.05);
            --glass-border-color: rgba(255, 255, 255, 0.12);
            --transition-speed: 0.3s;
            --font-warrior: 'Black Ops One', cursive;
        }

        /* =========================================
           БЛОК 2: ГЛОБАЛЬНЫЙ СБРОС И БАЗОВЫЕ СТИЛИ
           =========================================
        */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            background-color: var(--primary-bg);
            color: var(--accent-white);
            height: 100vh;
            width: 100vw;
            font-family: 'Roboto', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow: hidden;
            position: relative;
            /* Радиальное свечение в центре для акцента на логотипе (Halo Effect) */
            background: radial-gradient(circle at 50% 30%, rgba(255,255,255,0.15) 0%, rgba(0,0,0,0) 70%), var(--primary-bg);
        }

        /* Анимированный фон (имитация частиц/пыли) */
        body::before {
            content: "";
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: url('https://www.transparenttextures.com/patterns/stardust.png');
            opacity: 0.1;
            pointer-events: none;
        }

        /* =========================================
           БЛОК 3: ВЕРХНЯЯ ПАНЕЛЬ И СТАТУСЫ
           =========================================
        */
        .system-top-bar {
            width: 100%;
            padding: 20px 30px;
            display: flex;
            justify-content: flex-end;
            align-items: center;
            z-index: 1000;
        }

        .status-badge {
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(0, 0, 0, 0.4);
            padding: 6px 16px;
            border-radius: 100px;
            border: 1px solid rgba(0, 255, 0, 0.2);
            box-shadow: 0 0 15px rgba(0, 255, 0, 0.1);
        }

        .indicator-dot {
            width: 8px;
            height: 8px;
            background-color: #00ff00;
            border-radius: 50%;
            box-shadow: 0 0 10px #00ff00;
            animation: indicator-pulse 2s infinite ease-in-out;
        }

        @keyframes indicator-pulse {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.4); opacity: 0.4; }
            100% { transform: scale(1); opacity: 1; }
        }

        .status-text {
            color: #00ff00;
            font-size: 12px;
            font-weight: 900;
            letter-spacing: 1.5px;
            text-transform: uppercase;
        }

        /* =========================================
           БЛОК 4: БРЕНДИНГ И ЛОГОТИП (ВАШ ФАЙЛ)
           =========================================
        */
        .main-branding {
            width: 100%;
            padding: 10px 40px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 30px;
            z-index: 500;
        }

        .main-branding img {
            width: 100%;
            max-width: 360px;
            filter: drop-shadow(0 0 35px rgba(255,255,255,0.3));
            animation: logo-levitation 5s infinite ease-in-out;
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes logo-levitation {
            0% { transform: translateY(0) scale(1); }
            50% { transform: translateY(-15px) scale(1.02); }
            100% { transform: translateY(0) scale(1); }
        }

        /* =========================================
           БЛОК 5: АРХИТЕКТУРА ЭКРАНОВ
           =========================================
        */
        .ui-viewport {
            width: 100%;
            max-width: 440px;
            flex-grow: 1;
            position: relative;
            padding: 0 45px;
            z-index: 800;
        }

        .view-screen {
            display: none;
            width: 100%;
            flex-direction: column;
            animation: screen-fade-in 0.5s ease-out forwards;
        }

        .view-screen.active-module {
            display: flex;
        }

        @keyframes screen-fade-in {
            from { opacity: 0; transform: translateY(30px) scale(0.95); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        /* =========================================
           БЛОК 6: СИСТЕМА КНОПОК
           =========================================
        */
        .button-layout-stack {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .game-btn {
            width: 100%;
            padding: 24px 0;
            font-family: var(--font-warrior);
            font-size: 26px;
            text-transform: uppercase;
            border-radius: 22px;
            border: none;
            cursor: pointer;
            position: relative;
            box-shadow: 0 8px 0 rgba(0,0,0,0.7);
            transition: all 0.1s;
            overflow: hidden;
        }

        .game-btn:active {
            transform: translateY(4px);
            box-shadow: 0 4px 0 rgba(0,0,0,0.7);
        }

        /* Блик на кнопках */
        .game-btn::before {
            content: "";
            position: absolute;
            top: 0; left: -100%; width: 50%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            transform: skewX(-25deg);
            transition: 0.5s;
        }

        .game-btn:hover::before {
            left: 150%;
            transition: 0.8s;
        }

        /* КНОПКА №6: СОЗДАТЬ КОМНАТУ (ЗОЛОТО + БЕЛЫЙ ТЕКСТ) */
        .btn-create-gold {
            background: linear-gradient(180deg, var(--btn-gold-top) 0%, var(--btn-gold-bottom) 100%);
            color: var(--accent-white) !important;
            border: 2px solid rgba(255, 255, 255, 0.35);
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }

        .btn-join-blue {
            background: linear-gradient(180deg, var(--btn-blue-top) 0%, var(--btn-blue-bottom) 100%);
            color: var(--accent-white);
            border: 2px solid rgba(255, 255, 255, 0.2);
        }

        .btn-utility-dark {
            background: #1a1d22;
            color: #666e7a;
            font-size: 18px;
            margin-top: 15px;
            box-shadow: 0 6px 0 rgba(0,0,0,0.8);
        }

        /* =========================================
           БЛОК 7: ОФОРМЛЕНИЕ ЛОББИ
           =========================================
        */
        .lobby-main-header {
            font-family: var(--font-warrior);
            font-size: 30px;
            color: var(--accent-white);
            text-shadow: 0 0 20px var(--accent-white);
            text-align: center;
            margin-bottom: 35px;
            text-transform: uppercase;
        }

        .lobby-panel-card {
            width: 100%;
            background: var(--glass-background);
            border: 1px solid var(--glass-border-color);
            border-radius: 28px;
            padding: 24px;
            backdrop-filter: blur(15px);
            margin-bottom: 35px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
        }

        .lobby-tab-group {
            display: flex;
            gap: 15px;
            margin-bottom: 30px;
        }

        .interactive-tab {
            flex: 1;
            padding: 18px 0;
            border-radius: 18px;
            border: 4px solid;
            text-align: center;
            font-weight: 900;
            font-size: 13px;
            text-transform: uppercase;
            transition: var(--transition-speed);
        }

        /* НЕОНОВЫЕ ЭФФЕКТЫ ДЛЯ ВКЛАДОК ПО ТЗ */
        .tab-neon-blue {
            border-color: #00d2ff;
            color: #00d2ff;
            box-shadow: 0 0 15px var(--neon-blue-glow), inset 0 0 10px var(--neon-blue-glow);
        }

        .tab-neon-red {
            border-color: #ff3131;
            color: #ff3131;
            box-shadow: 0 0 15px var(--neon-red-glow), inset 0 0 10px var(--neon-red-glow);
        }

        .room-id-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
        }

        .id-label {
            font-size: 16px;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: rgba(255,255,255,0.7);
        }

        .id-display-value {
            font-family: var(--font-warrior);
            font-size: 48px;
            color: var(--btn-gold-top);
            letter-spacing: 6px;
            text-shadow: 0 0 15px rgba(255, 204, 0, 0.4);
        }

        .btn-start-game {
            background-color: var(--neon-yellow-main);
            color: #000000;
            font-weight: 900;
            box-shadow: 0 0 30px var(--neon-yellow-main), 0 8px 0 #b3b300;
        }

    </style>
</head>
<body>

    <header class="system-top-bar">
        <div class="status-badge">
            <div class="indicator-dot"></div>
            <span class="status-text">ОНЛАЙН: 24,195</span>
        </div>
    </header>

    <section class="main-branding">
        <img src="https://i.postimg.cc/JzZfNGR3/unnamed.jpg" alt="BRAWL SPY LOGO">
    </section>

    <main class="ui-viewport">
        
        <div id="screen-home" class="view-screen active-module">
            <div class="button-layout-stack">
                <button class="game-btn btn-create-gold" onclick="switchAppView('screen-lobby')">СОЗДАТЬ КОМНАТУ</button>
                <button class="game-btn btn-join-blue" onclick="switchAppView('screen-id-entry')">ВХОД ПО ID</button>
                <button class="game-btn btn-utility-dark" onclick="tg.close()">ВЫХОД</button>
            </div>
        </div>

        <div id="screen-lobby" class="view-screen">
            <h2 class="lobby-main-header">НАСТРОЙКА ЛОББИ</h2>
            
            <div class="lobby-panel-card">
                <div class="lobby-tab-group">
                    <div class="interactive-tab tab-neon-blue">Участники</div>
                    <div class="interactive-tab tab-neon-red">Шпион</div>
                </div>

                <div class="room-id-container">
                    <p class="id-label">ID КОМНАТЫ</p>
                    <h3 id="generated-id-text" class="id-display-value">000-000</h3>
                </div>
            </div>

            <div class="button-layout-stack">
                <button class="game-btn btn-start-game" onclick="tg.showAlert('ПРИГОТОВЬТЕСЬ! ИГРА НАЧИНАЕТСЯ.')">НАЧАТЬ ИГРУ</button>
                <button class="game-btn btn-utility-dark" onclick="switchAppView('screen-home')">В МЕНЮ</button>
            </div>
        </div>

        <div id="screen-id-entry" class="view-screen">
            <h2 class="lobby-main-header">ПОДКЛЮЧЕНИЕ</h2>
            <div class="lobby-panel-card" style="padding: 50px 20px;">
                <p class="id-label" style="text-align: center; margin-bottom: 20px;">Введите код доступа</p>
                <div style="font-family: 'Black Ops One'; font-size: 50px; text-align: center; border-bottom: 5px solid #fff; width: 260px; margin: 0 auto; letter-spacing: 15px; color: #fff;">____</div>
            </div>
            <div class="button-layout-stack">
                <button class="game-btn btn-utility-dark" onclick="switchAppView('screen-home')">НАЗАД</button>
            </div>
        </div>

    </main>

    <script>
        // Инициализация объекта Telegram WebApp
        const tg = window.Telegram.WebApp;
        
        // Базовая настройка интерфейса Telegram
        tg.expand();
        tg.enableClosingConfirmation();
        tg.headerColor = "#05070a";
        tg.backgroundColor = "#05070a";

        /**
         * Управляет переключением экранов приложения
         * @param {string} viewId - ID целевого экрана
         */
        function switchAppView(viewId) {
            console.log("Navigating to view:", viewId);

            // 1. Скрываем все активные модули
            const modules = document.querySelectorAll('.view-screen');
            modules.forEach(module => {
                module.classList.remove('active-module');
            });

            // 2. Отображаем запрошенный экран
            const target = document.getElementById(viewId);
            if (target) {
                target.classList.add('active-module');
            }

            // 3. Генерация нового ID при входе в лобби
            if (viewId === 'screen-lobby') {
                processIdGeneration();
            }

            // 4. Тактильный отклик через Telegram SDK
            if (tg.HapticFeedback) {
                tg.HapticFeedback.impactOccurred('heavy');
            }
        }

        /**
         * Генерирует уникальный идентификатор для игровой комнаты
         */
        function processIdGeneration() {
            const part1 = Math.floor(100 + Math.random() * 899);
            const part2 = Math.floor(100 + Math.random() * 899);
            const combinedId = `${part1}-${part2}`;
            
            const label = document.getElementById('generated-id-text');
            if (label) {
                label.innerText = combinedId;
            }
        }

        // Вызов после полной отрисовки DOM
        window.addEventListener('DOMContentLoaded', () => {
            tg.ready();
            console.log("Brawl Spy Engine v2.0 Initialized");
        });
    </script>
</body>
</html>
