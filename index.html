<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brawl Spy</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            background-color: #1a237e;
            color: white;
            font-family: 'Arial Black', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        .container { text-align: center; padding: 20px; }
        h1 { color: #ffeb3b; text-shadow: 3px 3px #000; font-size: 36px; margin-bottom: 10px; }
        .btn {
            background: #4caf50;
            border: 4px solid #1b5e20;
            color: white;
            padding: 20px 50px;
            font-size: 24px;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 6px #000;
            transition: 0.1s;
        }
        .btn:active { box-shadow: 0 2px #000; transform: translateY(4px); }
    </style>
</head>
<body>
    <div class="container">
        <h1>BRAWL SPY</h1>
        <p>Нажми кнопку, чтобы выбрать тему игры</p>
        <button class="btn" onclick="sendChoice()">ВЫБРАТЬ ТЕМУ</button>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand(); 

        function sendChoice() {
            // Эта команда отправит боту сигнал, что мы хотим начать
            tg.sendData("start_game_selection"); 
            tg.close();
        }
    </script>
</body>
</html>
