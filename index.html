<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>BRAWL SPY ULTIMATE EDITION 2026</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Black+Ops+One&display=swap" rel="stylesheet">
    
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>
        :root {
            --bg-main: #0a0e14;
            --white-glow: #ffffff;
            --neon-blue: #00d2ff;
            --neon-red: #ff3131;
            --neon-yellow: #ffff00;
            --gold-top: #ffcc00;
            --gold-bottom: #ff8c00;
            --f-main: 'Black Ops One', cursive;
        }

        /* ГЛОБАЛЬНЫЕ НАСТРОЙКИ СТИЛЕЙ */
        * { 
            margin: 0; 
            padding: 0; 
            box-sizing: border-box; 
            -webkit-tap-highlight-color: transparent; 
            user-select: none; 
            outline: none;
        }

        body {
            background-color: var(--bg-main);
            color: #ffffff;
            height: 100vh;
            width: 100vw;
            font-family: var(--f-main);
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* ЭФФЕКТ СВЕТОВОГО ПЯТНА НА ФОНЕ */
        .background-light {
            position: absolute;
            top: 20%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(255,255,255,0.12) 0%, rgba(0,0,0,0) 70%);
            z-index: 1;
            pointer-events: none;
        }

        /* ВЕРХНЯЯ ПАНЕЛЬ СТАТИСТИКИ */
        .top-stats-bar {
            width: 100%;
            padding: 15px 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
        }

        .online-counter {
            color: #00ff00;
            font-size: 14px;
            text-shadow: 0 0 8px #00ff00;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .online-dot {
            width: 8px;
            height: 8px;
            background-color: #00ff00;
            border-radius: 50%;
            animation: blink 1.5s infinite;
        }

        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }

        /* КОНТЕЙНЕР ЛОГОТИПА */
        .logo-container {
            width: 100%;
            padding: 20px 40px;
            display: flex;
            justify-content: center;
            z-index: 10;
            margin-bottom: 30px;
        }

        .logo-container img {
            width: 100%;
            max-width: 350px;
            filter: drop-shadow(0 0 25px rgba(255,255,255,0.25));
        }

        /* СИСТЕМА ЭКРАНОВ */
        .ui-screen {
            width: 100%;
            max-width: 440px;
            flex-grow: 1;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding: 0 45px;
            z-index: 10;
        }

        .ui-screen.active { display: flex; animation: fadeIn 0.4s ease-in-out; }

        @keyframes fadeIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }

        /* КНОПКИ УПРАВЛЕНИЯ */
        .btn-group {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 20px;
            margin-top: 20px;
        }

        .main-btn {
            width: 100%;
            padding: 22px 0;
            font-family: inherit;
            font-size: 26px;
            text-transform: uppercase;
            border-radius: 16px;
            border: none;
            cursor: pointer;
            position: relative;
            box-shadow: 0 8px 0 rgba(0,0,0,0.6);
            transition: all 0.1s ease;
        }

        .main-btn:active {
            transform: translateY(4px);
            box-shadow: 0 4px 0 rgba(0,0,0,0.6);
        }

        /* КНОПКА №6: ЗОЛОТАЯ + БЕЛЫЙ ТЕКСТ */
        .btn-create-room {
            background: linear-gradient(180deg, var(--gold-top), var(--gold-bottom));
            color: #ffffff !important;
            border: 2px solid rgba(255,255,255,0.3);
        }

        .btn-enter-id {
            background: linear-gradient(180deg, #00a2ff, #004dff);
            color: #ffffff;
            border: 2px solid rgba(255,255,255,0.2);
        }

        .btn-exit {
            background: #222;
            color: #777;
            font-size: 18px;
            margin-top: 15px;
            box-shadow: 0 5px 0 rgba(0,0,0,0.6);
        }

        /* ЭКРАН НАСТРОЙКИ ЛОББИ */
        .lobby-title-text {
            font-size: 32px;
            color: var(--white-glow);
            text-shadow: 0 0 20px var(--white-glow);
            margin-bottom: 40px;
            text-align: center;
            text-transform: uppercase;
        }

        .lobby-settings-container {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 35px;
        }

        .tabs-wrapper {
            display: flex;
            gap: 15px;
            width: 100%;
        }

        .tab-item {
            flex: 1;
            padding: 20px 0;
            border: 4px solid;
            border-radius: 14px;
            text-align: center;
            font-size: 16px;
            font-weight: bold;
            text-transform: uppercase;
        }

        .tab-participants {
            border-color: var(--neon-blue);
            color: var(--neon-blue);
            box-shadow: inset 0 0 12px var(--neon-blue), 0 0 12px var(--neon-blue);
        }

        .tab-spy {
            border-color: var(--neon-red);
            color: var(--neon-red);
            box-shadow: inset 0 0 12px var(--neon-red), 0 0 12px var(--neon-red);
        }

        .start-game-btn {
            background-color: var(--neon-yellow);
            color: #000;
            box-shadow: 0 0 20px var(--neon-yellow), 0 8px 0 #b3b300;
            font-weight: 900;
        }

        /* БЛОК ID КОМНАТЫ */
        .room-id-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            margin-top: 10px;
        }

        .id-label-white {
            color: #ffffff;
            font-size: 22px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .id-value-gold {
            color: var(--gold-top);
            font-size: 42px;
            letter-spacing: 6px;
            text-shadow: 0 0 10px rgba(255,204,0,0.4);
        }

    </style>
</head>
<body>

    <div class="background-light"></div>

    <div class="top-stats-bar">
        <div></div>
        <div class="online-counter">
            <div class="online-dot"></div>
            <span>В СЕТИ: 4,812</span>
        </div>
    </div>

    <div class="logo-container">
        <img src="https://i.ibb.co/XfXfXfX/logo.png" alt="BRAWL SPY LOGO" onerror="this.src='data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iNDAwIiBoZWlnaHQ9IjIwMCIgeBtbbnM9Imh0dHA6Ly93d3cudzMub3JnLzIwMDAvc3ZnIj48cmVjdCB3aWR0aD0iMTAwJSIgaGVpZ2h0PSIxMDAlIiBmaWxsPSJub25lIi8+PHRleHQgeD0iNTAlIiB5PSI1MCUiIGZpbGw9IndoaXRlIiBmb250LWZhbWlseT0iQmxhY2sgT3BzIE9uZSIgZm9udC1zaXplPSI0MCIgdGV4dC1hbmNob3I9Im1pZGRsZSI+QlJBV0wgU1BZPC90ZXh0Pjwvc3ZnPg=='">
    </div>

    <div id="screen-menu" class="ui-screen active">
        <div class="btn-group">
            <button class="main-btn btn-create-room" onclick="navigateTo('screen-lobby')">СОЗДАТЬ КОМНАТУ</button>
            <button class="main-btn btn-enter-id" onclick="navigateTo('screen-id-entry')">ВХОД ПО ID</button>
            <button class="main-btn btn-exit" onclick="tg.close()">ВЫХОД</button>
        </div>
    </div>

    <div id="screen-lobby" class="ui-screen">
        <h2 class="lobby-title-text">НАСТРОЙКА ЛОББИ</h2>
        
        <div class="lobby-settings-container">
            <div class="tabs-wrapper">
                <div class="tab-item tab-participants">УЧАСТНИКИ</div>
                <div class="tab-item tab-spy">ШПИОН</div>
            </div>

            <div class="room-id-box">
                <div class="id-label-white">ID КОМНАТЫ</div>
                <div id="display-room-code" class="id-value-gold">444-999</div>
            </div>

            <div class="btn-group">
                <button class="main-btn start-game-btn" onclick="tg.showAlert('БИТВА НАЧИНАЕТСЯ!')">НАЧАТЬ ИГРУ</button>
                <button class="main-btn btn-exit" onclick="navigateTo('screen-menu')">МЕНЮ</button>
            </div>
        </div>
    </div>

    <div id="screen-id-entry" class="ui-screen">
        <div class="room-id-box" style="margin-top: 50px;">
            <div class="id-label-white">ID КОМНАТЫ</div>
            <div style="font-size: 50px; border-bottom: 5px solid #fff; width: 250px; text-align: center; margin-top: 30px; letter-spacing: 15px;">____</div>
        </div>
        <div class="btn-group" style="margin-top: 60px;">
            <button class="main-btn btn-exit" onclick="navigateTo('screen-menu')">НАЗАД</button>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        function navigateTo(screenId) {
            // Переключение активного экрана
            document.querySelectorAll('.ui-screen').forEach(screen => {
                screen.classList.remove('active');
            });
            document.getElementById(screenId).classList.add('active');

            // Генерация случайного ID при входе в лобби
            if(screenId === 'screen-lobby') {
                const p1 = Math.floor(100 + Math.random() * 899);
                const p2 = Math.floor(100 + Math.random() * 899);
                document.getElementById('display-room-code').innerText = `${p1}-${p2}`;
            }

            // Обратная связь (вибрация)
            tg.HapticFeedback.impactOccurred('medium');
        }

        window.onload = () => {
            tg.ready();
            console.log("WebApp Ready");
        };
    </script>
</body>
</html>
