<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>BRAWL SPY 2026 - ULTIMATE INTERFACE</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Black+Ops+One&family=Rubik+Mono+One&display=swap" rel="stylesheet">
    
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>
        /* ПЕРЕМЕННЫЕ ЦВЕТОВ ПО ТЗ */
        :root {
            --bg-dark: #05070a;
            --white-glow: #ffffff;
            --neon-blue: #00d2ff;
            --neon-red: #ff3131;
            --neon-yellow: #ffff00;
            --gold-gradient: linear-gradient(180deg, #ffcc00 0%, #ff8c00 100%);
            --f-main: 'Black Ops One', cursive;
        }

        /* ГЛОБАЛЬНЫЙ СБРОС */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            outline: none;
        }

        body {
            background-color: var(--bg-dark);
            color: #ffffff;
            height: 100vh;
            width: 100vw;
            font-family: var(--f-main);
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* ФОНОВОЕ СВЕЧЕНИЕ (HALO) */
        .glow-overlay {
            position: absolute;
            top: 25%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(255,255,255,0.15) 0%, rgba(0,0,0,0) 70%);
            z-index: 1;
            pointer-events: none;
        }

        /* ИНДИКАТОР ОНЛАЙНА */
        .online-wrapper {
            width: 100%;
            padding: 15px 25px;
            display: flex;
            justify-content: flex-end;
            z-index: 100;
        }

        .online-box {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #00ff00;
            font-size: 13px;
            text-shadow: 0 0 10px #00ff00;
            font-family: sans-serif;
            font-weight: bold;
        }

        .dot-pulse {
            width: 8px;
            height: 8px;
            background-color: #00ff00;
            border-radius: 50%;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.4; transform: scale(1.2); }
            100% { opacity: 1; transform: scale(1); }
        }

        /* ЛОГОТИП СВЕРХУ */
        .header-container {
            width: 100%;
            padding: 20px 40px;
            display: flex;
            justify-content: center;
            z-index: 10;
            margin-bottom: 20px;
        }

        .header-container img {
            width: 100%;
            max-width: 320px;
            filter: drop-shadow(0 0 25px rgba(255,255,255,0.3));
        }

        /* КОНТЕЙНЕР ЭКРАНОВ */
        .screen-container {
            width: 100%;
            max-width: 440px;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            position: relative;
            z-index: 20;
        }

        .screen {
            display: none;
            width: 100%;
            flex-direction: column;
            align-items: center;
            padding: 0 45px;
            animation: screenFade 0.3s ease-out;
        }

        .screen.active {
            display: flex;
        }

        @keyframes screenFade {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* КНОПКИ ГЛАВНОГО МЕНЮ */
        .btn-list {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 18px;
            margin-top: 30px;
        }

        .btn-core {
            width: 100%;
            padding: 22px 0;
            font-family: inherit;
            font-size: 26px;
            text-transform: uppercase;
            border-radius: 15px;
            border: none;
            cursor: pointer;
            box-shadow: 0 8px 0 rgba(0,0,0,0.6);
            transition: 0.1s;
            position: relative;
            overflow: hidden;
        }

        .btn-core::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 40%;
            background: linear-gradient(rgba(255,255,255,0.1), transparent);
        }

        .btn-core:active {
            transform: translateY(4px);
            box-shadow: 0 4px 0 rgba(0,0,0,0.6);
        }

        /* КНОПКА №6: СОЗДАТЬ КОМНАТУ */
        .btn-create {
            background: var(--gold-gradient);
            color: #ffffff !important;
            border: 2px solid rgba(255,255,255,0.2);
        }

        .btn-join {
            background: linear-gradient(180deg, #00a2ff, #004dff);
            color: #ffffff;
        }

        .btn-menu-back {
            background: #2a2a2a;
            color: #888;
            font-size: 18px;
            margin-top: 15px;
        }

        /* ЭКРАН: НАСТРОЙКА ЛОББИ */
        .lobby-header-title {
            font-size: 32px;
            color: var(--white-glow);
            text-shadow: 0 0 20px var(--white-glow);
            margin-bottom: 40px;
            text-align: center;
            text-transform: uppercase;
        }

        .lobby-tabs-row {
            display: flex;
            width: 100%;
            gap: 15px;
            margin-bottom: 35px;
        }

        .tab-button {
            flex: 1;
            padding: 20px 0;
            border: 4px solid;
            border-radius: 14px;
            text-align: center;
            font-size: 15px;
            font-weight: 900;
            text-transform: uppercase;
            background: transparent;
        }

        .tab-blue-neon {
            border-color: var(--neon-blue);
            color: var(--neon-blue);
            box-shadow: inset 0 0 12px var(--neon-blue), 0 0 12px var(--neon-blue);
        }

        .tab-red-neon {
            border-color: var(--neon-red);
            color: var(--neon-red);
            box-shadow: inset 0 0 12px var(--neon-red), 0 0 12px var(--neon-red);
        }

        /* ИДЕНТИФИКАТОР КОМНАТЫ */
        .id-display-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            margin-bottom: 40px;
        }

        .id-caption-white {
            color: #ffffff;
            font-size: 22px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .id-number-gold {
            color: #ffcc00;
            font-size: 44px;
            letter-spacing: 8px;
            text-shadow: 0 0 15px rgba(255,204,0,0.5);
        }

        /* КНОПКА СТАРТ */
        .btn-start-neon {
            background: var(--neon-yellow);
            color: #000;
            box-shadow: 0 0 20px var(--neon-yellow), 0 8px 0 #b3b300;
            font-weight: 900;
        }

    </style>
</head>
<body>

    <div class="glow-overlay"></div>

    <div class="online-wrapper">
        <div class="online-box">
            <div class="dot-pulse"></div>
            <span>ОНЛАЙН: 5,102</span>
        </div>
    </div>

    <div class="header-container">
        <img src="https://i.ibb.co/b29d0c/logo.png" alt="BRAWL SPY LOGO">
    </div>

    <div class="screen-container">
        
        <div id="scr-menu" class="screen active">
            <div class="btn-list">
                <button class="btn-core btn-create" onclick="showScreen('scr-lobby')">СОЗДАТЬ КОМНАТУ</button>
                <button class="btn-core btn-join" onclick="showScreen('scr-id-input')">ВХОД ПО ID</button>
                <button class="btn-core btn-menu-back" onclick="tg.close()">ВЫХОД</button>
            </div>
        </div>

        <div id="scr-lobby" class="screen">
            <h2 class="lobby-header-title">НАСТРОЙКА ЛОББИ</h2>
            
            <div class="lobby-tabs-row">
                <button class="tab-button tab-blue-neon">УЧАСТНИКИ</button>
                <button class="tab-button tab-red-neon">ШПИОН</button>
            </div>

            <div class="id-display-box">
                <div class="id-caption-white">ID КОМНАТЫ</div>
                <div id="room-code-val" class="id-number-gold">777-111</div>
            </div>

            <div class="btn-list">
                <button class="btn-core btn-start-neon" onclick="tg.showAlert('ИГРА НАЧИНАЕТСЯ!')">НАЧАТЬ ИГРУ</button>
                <button class="btn-core btn-menu-back" onclick="showScreen('scr-menu')">МЕНЮ</button>
            </div>
        </div>

        <div id="scr-id-input" class="screen">
            <div class="id-display-box" style="margin-top: 40px;">
                <div class="id-caption-white">ID КОМНАТЫ</div>
                <div style="font-size: 50px; border-bottom: 5px solid #fff; width: 260px; text-align: center; margin-top: 30px; letter-spacing: 15px;">____</div>
            </div>
            <div class="btn-list" style="margin-top: 50px;">
                <button class="btn-core btn-menu-back" onclick="showScreen('scr-menu')">НАЗАД</button>
            </div>
        </div>

    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        // ФУНКЦИЯ НАВИГАЦИИ
        function showScreen(screenId) {
            // Скрываем все экраны
            document.querySelectorAll('.screen').forEach(s => {
                s.classList.remove('active');
            });
            // Показываем нужный
            document.getElementById(screenId).classList.add('active');

            // Если заходим в лобби - генерируем новый ID
            if(screenId === 'scr-lobby') {
                const r1 = Math.floor(100 + Math.random() * 899);
                const r2 = Math.floor(100 + Math.random() * 899);
                document.getElementById('room-code-val').innerText = `${r1}-${r2}`;
            }

            // Виброотклик
            tg.HapticFeedback.impactOccurred('medium');
        }

        window.onload = () => {
            tg.ready();
        };
    </script>
</body>
</html>
