<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    
    <title>BRAWL SPY | SUPREME MONOLITH</title>
    
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Black+Ops+One&family=Rubik+One&family=Exo+2:wght@900&family=Orbitron:wght@900&display=swap" rel="stylesheet">
    
    <style>
        /* [SECTION 1: CSS ARCHITECTURE]
           -------------------------------------------------------------
        */
        :root {
            --bs-black: #020204;
            --bs-dark: #08080a;
            --bs-grey: #121216;
            --bs-white: #FFFFFF;
            --bs-gold: #FFD700;
            --bs-neon-blue: #00D2FF;
            --bs-neon-pink: #FF007F;
            --bs-neon-red: #FF3131;
            
            /* Shadows and Glows */
            --glow-blue: 0 0 15px rgba(0, 210, 255, 0.6), 0 0 30px rgba(0, 210, 255, 0.3);
            --glow-red: 0 0 20px rgba(255, 49, 49, 0.7), 0 0 40px rgba(255, 49, 49, 0.4);
            --glow-gold: 0 0 15px rgba(255, 215, 0, 0.5);
            
            /* Transitions */
            --anim-fast: 0.2s ease;
            --anim-mid: 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            --anim-slow: 0.8s cubic-bezier(0.68, -0.55, 0.265, 1.55);
        }

        /* [SECTION 2: GLOBAL RESET & BASE]
           -------------------------------------------------------------
        */
        * {
            box-sizing: border-box;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            width: 100%;
            height: 100%;
            background-color: var(--bs-black);
            color: var(--bs-white);
            font-family: 'Rubik One', sans-serif;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* [SECTION 3: LAYOUT SYSTEM]
           -------------------------------------------------------------
        */
        .app-container {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            z-index: 1;
        }

        .screen-view {
            position: absolute;
            inset: 0;
            display: none;
            flex-direction: column;
            align-items: center;
            padding: 25px;
            background-color: var(--bs-black);
            z-index: 10;
        }

        .screen-view.is-visible {
            display: flex;
            animation: screen-slide-in var(--anim-mid) forwards;
        }

        @keyframes screen-slide-in {
            from { opacity: 0; transform: translateY(40px) scale(0.95); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        /* [SECTION 4: TYPOGRAPHY]
           -------------------------------------------------------------
        */
        .ui-header {
            color: var(--bs-white);
            font-family: 'Exo 2', sans-serif;
            font-size: 38px;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 0 0 20px rgba(255,255,255,0.3);
            margin-top: 15px;
            margin-bottom: 50px;
            text-align: center;
        }

        .ui-brand {
            font-size: 75px;
            font-family: 'Orbitron', sans-serif;
            color: var(--bs-neon-red);
            text-shadow: var(--glow-red);
            margin-top: 60px;
            line-height: 0.9;
        }

        .ui-subtitle {
            font-family: 'Black Ops One', cursive;
            color: var(--bs-gold);
            font-size: 26px;
            margin-bottom: 80px;
            text-shadow: var(--glow-gold);
        }

        /* [SECTION 5: BUTTON ENGINE]
           -------------------------------------------------------------
        */
        .bs-button {
            position: relative;
            width: 100%;
            max-width: 340px;
            padding: 22px 30px;
            margin-bottom: 18px;
            background: var(--bs-dark);
            border: 3px solid var(--bs-neon-blue);
            border-radius: 22px;
            color: var(--bs-white);
            font-family: 'Exo 2', sans-serif;
            font-weight: 900;
            font-size: 19px;
            text-transform: uppercase;
            cursor: pointer;
            box-shadow: var(--glow-blue);
            transition: all var(--anim-fast);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .bs-button::before {
            content: '';
            position: absolute;
            top: 0; left: -100%;
            width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.1), transparent);
            transition: 0.5s;
        }

        .bs-button:active {
            transform: scale(0.96);
            box-shadow: 0 0 10px var(--bs-neon-blue);
        }

        .bs-button:active::before {
            left: 100%;
        }

        .bs-button-red {
            border-color: var(--bs-neon-red);
            box-shadow: var(--glow-red);
        }

        .bs-button-gold {
            border-color: var(--bs-gold);
            color: var(--bs-gold);
            box-shadow: var(--glow-gold);
        }

        /* [SECTION 6: SETTINGS COMPONENTS]
           -------------------------------------------------------------
        */
        .config-card {
            width: 100%;
            max-width: 360px;
            background: var(--bs-grey);
            border: 2px solid var(--bs-neon-blue);
            border-radius: 35px;
            padding: 30px;
            margin-bottom: 50px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
        }

        .config-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        .config-item:last-child { margin-bottom: 0; }

        .config-label {
            font-family: 'Exo 2';
            font-weight: 900;
            font-size: 20px;
            text-transform: uppercase;
        }

        .config-controls {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .control-btn {
            width: 45px;
            height: 45px;
            background: var(--bs-black);
            border: 2px solid var(--bs-neon-blue);
            border-radius: 12px;
            color: var(--bs-neon-blue);
            font-size: 24px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .control-value {
            font-family: 'Black Ops One';
            font-size: 28px;
            min-width: 40px;
            text-align: center;
        }

        /* [SECTION 7: CARD MECHANICS]
           -------------------------------------------------------------
        */
        .card-perspective {
            width: 310px;
            height: 440px;
            perspective: 1500px;
            margin-bottom: 40px;
        }

        .card-main {
            position: relative;
            width: 100%;
            height: 100%;
            transition: transform var(--anim-slow);
            transform-style: preserve-3d;
        }

        .card-main.flipped {
            transform: rotateY(180deg);
        }

        .card-side {
            position: absolute;
            inset: 0;
            backface-visibility: hidden;
            border-radius: 40px;
            border: 8px solid var(--bs-neon-blue);
            background: var(--bs-dark);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-shadow: var(--glow-blue);
        }

        .card-front {
            transform: rotateY(180deg);
            background: var(--bs-white);
            color: #000;
            border-color: var(--bs-neon-red);
            box-shadow: var(--glow-red);
        }

        .role-img {
            width: 240px;
            height: 240px;
            object-fit: contain;
            margin: 20px 0;
            filter: drop-shadow(0 5px 15px rgba(0,0,0,0.3));
        }

        /* [SECTION 8: VOTING INTERFACE]
           -------------------------------------------------------------
        */
        .vote-timer {
            font-size: 85px;
            font-family: 'Black Ops One';
            color: var(--bs-neon-red);
            text-shadow: var(--glow-red);
            margin: 20px 0;
        }

        .player-grid {
            width: 100%;
            max-width: 380px;
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin-top: 20px;
            overflow-y: auto;
            max-height: 350px;
            padding: 10px;
        }

        .player-node {
            background: rgba(0, 210, 255, 0.05);
            border: 2px solid var(--bs-neon-blue);
            border-radius: 20px;
            padding: 22px;
            text-align: center;
            font-family: 'Exo 2';
            font-weight: 900;
            font-size: 16px;
            transition: 0.3s ease;
        }

        .player-node.is-selected {
            background: var(--bs-neon-blue);
            color: var(--bs-black);
            box-shadow: 0 0 25px var(--bs-neon-blue);
            transform: translateY(-5px);
        }

        /* [SECTION 9: REVEAL SYSTEM]
           -------------------------------------------------------------
        */
        .reveal-summary {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            width: 100%;
            margin-top: 30px;
            opacity: 0;
            transform: translateY(20px);
        }

        .reveal-summary.show {
            opacity: 1;
            transform: translateY(0);
            transition: 0.8s ease-out;
        }

        .summary-box {
            background: var(--bs-white);
            color: #000;
            padding: 15px;
            border-radius: 15px;
            text-align: center;
            font-size: 13px;
            border-bottom: 4px solid var(--bs-gold);
        }

        .host-label {
            font-size: 12px;
            color: var(--bs-gold);
            margin-top: 40px;
            text-transform: uppercase;
            letter-spacing: 3px;
        }

    </style>
</head>
<body>

    <div class="app-container">
        
        <div id="screen-home" class="screen-view is-visible">
            <h1 class="ui-brand">SPY</h1>
            <div class="ui-subtitle">BRAWL MONOLITH</div>
            
            <button class="bs-button" onclick="App.nav('screen-lobby', true)">
                Создать комнату
            </button>
            <button class="bs-button" style="opacity: 0.4; pointer-events: none;">
                Вход по коду
            </button>
            <button class="bs-button" style="border-color: #333;" onclick="App.nav('screen-home')">
                Настройки
            </button>
        </div>

        <div id="screen-lobby" class="screen-view">
            <h2 class="ui-header">Параметры игры</h2>
            
            <div class="config-card">
                <div class="config-item">
                    <span class="config-label">Участники</span>
                    <div class="config-controls">
                        <button class="control-btn" onclick="App.adjust('p', -1)">-</button>
                        <span id="p-count" class="control-value">3</span>
                        <button class="control-btn" onclick="App.adjust('p', 1)">+</button>
                    </div>
                </div>
                <div class="config-item">
                    <span class="config-label">Шпионы</span>
                    <div class="config-controls">
                        <button class="control-btn" onclick="App.adjust('s', -1)">-</button>
                        <span id="s-val" class="control-value">1</span>
                        <button class="control-btn" onclick="App.adjust('s', 1)">+</button>
                    </div>
                </div>
            </div>

            <button class="bs-button bs-button-gold" onclick="App.gameInit()">
                Запустить матч
            </button>
            <button class="bs-button" style="border-color: #444;" onclick="App.nav('screen-home')">
                В меню
            </button>
        </div>

        <div id="screen-deal" class="screen-view">
            <h2 id="current-player-name" class="ui-header">ИГРОК 1</h2>
            
            <div class="card-perspective" onclick="App.flip()">
                <div id="main-card-element" class="card-main">
                    <div class="card-side">
                        <div style="font-size: 180px; color: var(--bs-neon-blue);">?</div>
                    </div>
                    <div id="card-content-side" class="card-side card-front">
                        </div>
                </div>
            </div>

            <button id="btn-next-player" class="bs-button" style="visibility: hidden;" onclick="App.next()">
                Далее
            </button>
        </div>

        <div id="screen-timer" class="screen-view">
            <h2 class="ui-header">Обсуждение</h2>
            <div id="timer-display" class="vote-timer">10:00</div>
            
            <button class="bs-button bs-button-gold" style="margin-top: 40px;" onclick="App.startVote()">
                Голосовать
            </button>

            <div id="host-timer-controls" style="width: 100%; display: flex; flex-direction: column; align-items: center;">
                <div class="host-label">Опции создателя</div>
                <button class="bs-button bs-button-red" style="margin-top: 10px;" onclick="App.gameInit()">
                    Сброс матча
                </button>
            </div>
        </div>

        <div id="screen-vote" class="screen-view">
            <h2 class="ui-header">Кто крыса?</h2>
            <div id="vote-countdown" style="font-family: 'Black Ops One'; color: var(--bs-neon-red); font-size: 26px;">60s</div>
            
            <div id="player-vote-grid" class="player-grid">
                </div>

            <button id="btn-confirm-selection" class="bs-button bs-button-gold" style="display: none; margin-top: auto;" onclick="App.processReveal()">
                Подтвердить
            </button>
        </div>

        <div id="screen-reveal" class="screen-view">
            <h2 id="reveal-status-text" class="ui-header">Результат</h2>
            
            <div id="reveal-target-container" class="card-perspective">
                </div>

            <div id="reveal-final-list" class="reveal-summary">
                </div>

            <div id="host-reveal-controls" style="display: none; width: 100%; flex-direction: column; align-items: center; margin-top: auto;">
                <button class="bs-button bs-button-gold" onclick="App.gameInit()">
                    Новый раунд
                </button>
                <button class="bs-button" onclick="App.nav('screen-home')">
                    В меню
                </button>
            </div>
        </div>

    </div>

    <script>
        /**
         * BRAWL SPY ENGINE v9.0
         * Handles game state, role generation, timers and UI events.
         */
        const App = {
            // DATABASE
            characters: [
                {n: "ТАРА", i: "https://cdn.brawlstats.com/character-arts/16000018.png"},
                {n: "ЛЕОН", i: "https://cdn.brawlstats.com/character-arts/16000017.png"},
                {n: "СПАЙК", i: "https://cdn.brawlstats.com/character-arts/16000007.png"},
                {n: "МОРТИС", i: "https://cdn.brawlstats.com/character-arts/16000014.png"},
                {n: "КРОУ", i: "https://cdn.brawlstats.com/character-arts/16000008.png"},
                {n: "ШЕЛЛИ", i: "https://cdn.brawlstats.com/character-arts/16000000.png"},
                {n: "НИТА", i: "https://cdn.brawlstats.com/character-arts/16000002.png"},
                {n: "КОЛЬТ", i: "https://cdn.brawlstats.com/character-arts/16000001.png"},
                {n: "БУЛЛ", i: "https://cdn.brawlstats.com/character-arts/16000003.png"},
                {n: "ДЖЕССИ", i: "https://cdn.brawlstats.com/character-arts/16000009.png"},
                {n: "БРОК", i: "https://cdn.brawlstats.com/character-arts/16000005.png"},
                {n: "ДИНАМАЙК", i: "https://cdn.brawlstats.com/character-arts/16000004.png"},
                {n: "БО", i: "https://cdn.brawlstats.com/character-arts/16000010.png"},
                {n: "ЭЛЬ ПРИМО", i: "https://cdn.brawlstats.com/character-arts/16000012.png"},
                {n: "БАРЛИ", i: "https://cdn.brawlstats.com/character-arts/16000013.png"},
                {n: "ПОКО", i: "https://cdn.brawlstats.com/character-arts/16000011.png"},
                {n: "РИКО", i: "https://cdn.brawlstats.com/character-arts/16000006.png"},
                {n: "ДЭРРИЛ", i: "https://cdn.brawlstats.com/character-arts/16000015.png"},
                {n: "ПЕННИ", i: "https://cdn.brawlstats.com/character-arts/16000016.png"},
                {n: "ПАЙПЕР", i: "https://cdn.brawlstats.com/character-arts/16000019.png"},
                {n: "ФРЭНК", i: "https://cdn.brawlstats.com/character-arts/16000020.png"},
                {n: "БИБИ", i: "https://cdn.brawlstats.com/character-arts/16000022.png"},
                {n: "БИ", i: "https://cdn.brawlstats.com/character-arts/16000023.png"},
                {n: "НАНИ", i: "https://cdn.brawlstats.com/character-arts/16000024.png"},
                {n: "ЭДГАР", i: "https://cdn.brawlstats.com/character-arts/16000042.png"}
            ],

            // STATE
            state: {
                players: 3,
                spies: 1,
                roles: [],
                idx: 0,
                flipped: false,
                isHost: true,
                timer: 600,
                interval: null,
                voteTarget: null
            },

            // NAVIGATION
            nav: function(screenId) {
                if(this.state.interval) clearInterval(this.state.interval);
                
                document.querySelectorAll('.screen-view').forEach(s => s.classList.remove('is-visible'));
                const target = document.getElementById(screenId);
                if(target) target.classList.add('is-visible');
                
                window.scrollTo(0, 0);
                this.haptic('light');
            },

            // CONFIGURATION
            adjust: function(key, delta) {
                if(key === 'p') {
                    this.state.players = Math.max(2, Math.min(12, this.state.players + delta));
                    if(this.state.spies >= this.state.players) this.state.spies = this.state.players - 1;
                } else {
                    this.state.spies = Math.max(1, Math.min(this.state.players - 1, this.state.spies + delta));
                }
                
                document.getElementById('p-count').innerText = this.state.players;
                document.getElementById('s-val').innerText = this.state.spies;
                this.haptic('medium');
            },

            // INITIALIZATION
            gameInit: function() {
                this.state.idx = 0;
                this.state.flipped = false;
                this.state.timer = 600;
                this.state.voteTarget = null;
                
                const randomChar = this.characters[Math.floor(Math.random() * this.characters.length)];
                let rolesPool = [];
                
                for(let i=0; i < this.state.spies; i++) {
                    rolesPool.push({ name: "ШПИОН", img: "https://cdn-icons-png.flaticon.com/512/953/953791.png", isSpy: true });
                }
                for(let i=0; i < (this.state.players - this.state.spies); i++) {
                    rolesPool.push({ name: randomChar.n, img: randomChar.i, isSpy: false });
                }
                
                this.state.roles = rolesPool.sort(() => Math.random() - 0.5);
                
                // Host logic
                document.getElementById('host-timer-controls').style.display = this.state.isHost ? 'flex' : 'none';
                
                this.nav('screen-deal');
                this.updateDealUI();
            },

            // DEAL LOGIC
            flip: function() {
                if(this.state.flipped) return;
                
                const role = this.state.roles[this.state.idx];
                const display = document.getElementById('card-content-side');
                
                display.innerHTML = `
                    <h3 style="font-size: 36px; margin-bottom: 5px;">${role.name}</h3>
                    <img src="${role.img}" class="role-img">
                    <div style="color:red; font-weight:900; letter-spacing:1px;">НЕ ПОКАЗЫВАЙ!</div>
                `;
                
                document.getElementById('main-card-element').classList.add('flipped');
                document.getElementById('btn-next-player').style.visibility = 'visible';
                this.state.flipped = true;
                this.haptic('heavy');
            },

            next: function() {
                this.state.idx++;
                if(this.state.idx < this.state.players) {
                    this.state.flipped = false;
                    document.getElementById('main-card-element').classList.remove('flipped');
                    document.getElementById('btn-next-player').style.visibility = 'hidden';
                    setTimeout(() => this.updateDealUI(), 300);
                } else {
                    this.startDiscussion();
                }
            },

            updateDealUI: function() {
                document.getElementById('current-player-name').innerText = "ИГРОК " + (this.state.idx + 1);
            },

            // TIMER LOGIC
            startDiscussion: function() {
                this.nav('screen-timer');
                const label = document.getElementById('timer-display');
                
                this.state.interval = setInterval(() => {
                    this.state.timer--;
                    let m = Math.floor(this.state.timer / 60);
                    let s = this.state.timer % 60;
                    label.innerText = (m < 10 ? '0' + m : m) + ":" + (s < 10 ? '0' + s : s);
                    
                    if(this.state.timer <= 0) {
                        clearInterval(this.state.interval);
                        this.hapticNotification('error');
                    }
                }, 1000);
            },

            // VOTING LOGIC
            startVote: function() {
                this.nav('screen-vote');
                const grid = document.getElementById('player-vote-grid');
                grid.innerHTML = '';
                
                this.state.roles.forEach((r, i) => {
                    const node = document.createElement('div');
                    node.className = 'player-node';
                    node.innerText = `ИГРОК ${i+1}`;
                    node.onclick = () => {
                        document.querySelectorAll('.player-node').forEach(n => n.classList.remove('is-selected'));
                        node.classList.add('is-selected');
                        this.state.voteTarget = i;
                        document.getElementById('btn-confirm-selection').style.display = 'flex';
                        this.haptic('medium');
                    };
                    grid.appendChild(node);
                });

                let seconds = 60;
                this.state.interval = setInterval(() => {
                    seconds--;
                    document.getElementById('vote-countdown').innerText = seconds + "s";
                    if(seconds <= 0) {
                        if(this.state.voteTarget === null) this.state.voteTarget = 0;
                        this.processReveal();
                    }
                }, 1000);
            },

            // REVEAL LOGIC
            processReveal: function() {
                this.nav('screen-reveal');
                const target = this.state.roles[this.state.voteTarget];
                const box = document.getElementById('reveal-target-container');
                
                box.innerHTML = `
                    <div class="card-main flipped">
                        <div class="card-side card-front" style="border-color:${target.isSpy ? 'var(--bs-neon-red)' : 'var(--bs-neon-blue)'}">
                            <div style="font-size:14px; opacity:0.6;">ИГРОК ${this.state.voteTarget + 1}</div>
                            <img src="${target.img}" style="width:180px;">
                            <h2 style="font-size:32px;">${target.name}</h2>
                        </div>
                    </div>
                `;
                
                document.getElementById('reveal-status-text').innerText = target.isSpy ? "ШПИОН ОБНАРУЖЕН!" : "ОШИБОЧКА...";
                
                // Chain reaction reveal
                setTimeout(() => {
                    const summary = document.getElementById('reveal-final-list');
                    summary.innerHTML = '';
                    this.state.roles.forEach((r, i) => {
                        summary.innerHTML += `
                            <div class="summary-box">
                                <b>P${i+1}:</b> ${r.name}
                            </div>
                        `;
                    });
                    summary.classList.add('show');
                    
                    if(this.state.isHost) {
                        document.getElementById('host-reveal-controls').style.display = 'flex';
                    }
                    this.hapticNotification('success');
                }, 4500);
            },

            // HELPERS
            haptic: function(style) {
                try { tg.HapticFeedback.impactOccurred(style); } catch(e) {}
            },
            hapticNotification: function(type) {
                try { tg.HapticFeedback.notificationOccurred(type); } catch(e) {}
            }
        };

        // Initialize Telegram Bridge
        window.addEventListener('load', () => {
            tg.ready();
            tg.expand();
            console.log("BRAWL MONOLITH ENGINE LOADED.");
        });
    </script>
</body>
</html>
