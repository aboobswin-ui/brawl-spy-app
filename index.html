<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>BRAWL STARS SPY | ULTIMATE MONOLITH</title>
    
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Black+Ops+One&family=Rubik+One&family=Exo+2:wght@900&display=swap" rel="stylesheet">
    
    <style>
        /* ЦВЕТОВАЯ ПАЛИТРА ПРОЕКТА
           РАСПИСАНО МАКСИМАЛЬНО ПОДРОБНО ДЛЯ СТРУКТУРЫ
        */
        :root {
            --global-bg: #050508;
            --panel-bg: #0c0c0f;
            --neon-red-primary: #FF0000;
            --neon-blue-primary: #4CC9F0;
            --text-white: #FFFFFF;
            --brawl-gold-main: #ffcc00;
            --tg-brand-blue: #0088cc;
            --shadow-intensity: 0 0 15px;
        }

        /* ГЛОБАЛЬНЫЙ СБРОС И ОСНОВЫ */
        * { 
            box-sizing: border-box; 
            margin-top: 0;
            margin-bottom: 0;
            margin-left: 0;
            margin-right: 0;
            padding-top: 0;
            padding-bottom: 0;
            padding-left: 0;
            padding-right: 0;
            user-select: none; 
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
            outline: none;
        }
        
        body { 
            background-color: var(--global-bg); 
            color: var(--text-white); 
            height: 100vh; 
            width: 100vw;
            overflow: hidden; 
            font-family: 'Rubik One', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            position: relative;
        }

        /* АРХИТЕКТУРА СЛОЕВ ЭКРАНА
        */
        .screen-container { 
            display: none; 
            width: 100%; 
            height: 100%; 
            flex-direction: column; 
            align-items: center; 
            padding-top: 20px;
            padding-bottom: 20px;
            padding-left: 25px;
            padding-right: 25px;
            position: absolute; 
            top: 0; 
            left: 0;
            background-color: var(--global-bg);
            z-index: 10;
            overflow: hidden;
        }

        .screen-container.active-view { 
            display: flex; 
            animation-name: pageSlideFade;
            animation-duration: 0.35s;
            animation-fill-mode: forwards;
        }

        @keyframes pageSlideFade {
            from { opacity: 0; transform: scale(1.05); }
            to { opacity: 1; transform: scale(1); }
        }

        /* БРЕНДИНГ И ЛОГОТИПЫ (ГЛАВНОЕ МЕНЮ)
        */
        .main-branding-area {
            text-align: center;
            margin-top: 15px;
            width: 100%;
            display: block;
        }

        .huge-spy-text { 
            font-size: 18vw; 
            color: var(--text-white); 
            text-transform: uppercase;
            letter-spacing: -2px;
            line-height: 0.82;
            display: block;
            /* УМЕНЬШЕНО СВЕЧЕНИЕ ПО ТЗ */
            text-shadow: 0 0 10px var(--neon-red-primary), 0 0 25px var(--neon-red-primary);
            transform: scaleX(1.35); 
            margin-bottom: 8px;
            font-weight: 900;
        }

        .brawl-stars-title {
            font-family: 'Black Ops One', cursive;
            font-size: 38px;
            color: var(--brawl-gold-main);
            margin-top: 18px;
            text-shadow: 4px 4px 0px #000;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .edition-badge-text {
            font-family: 'Exo 2', sans-serif;
            font-size: 19px;
            letter-spacing: 11px;
            text-transform: uppercase;
            margin-top: -4px;
            color: var(--text-white);
            opacity: 0.9;
        }

        /* ПРОФИЛЬ ПОЛЬЗОВАТЕЛЯ TELEGRAM
        */
        .user-identity-card {
            margin-top: 25px;
            display: inline-flex;
            align-items: center;
            gap: 12px;
            background-color: rgba(255, 255, 255, 0.08);
            padding-top: 10px;
            padding-bottom: 10px;
            padding-left: 22px;
            padding-right: 22px;
            border-radius: 60px;
            border-width: 2px;
            border-style: solid;
            border-color: var(--neon-blue-primary);
            box-shadow: 0 0 12px var(--neon-blue-primary);
        }

        .user-avatar-circle { 
            width: 32px; 
            height: 32px; 
            border-radius: 50%; 
            border: 1px solid var(--neon-blue-primary);
            object-fit: cover;
        }

        .user-name-label { 
            font-family: 'Exo 2', sans-serif; 
            color: var(--text-white); /* БЕЛЫЙ ЦВЕТ ПО ТЗ */
            font-size: 16px; 
            font-weight: 900;
            text-transform: uppercase;
        }

        /* КНОПКИ И УПРАВЛЕНИЕ
        */
        .action-button-group {
            width: 100%;
            max-width: 340px;
            margin-top: 45px;
            display: flex;
            flex-direction: column;
            gap: 18px;
            z-index: 20;
        }

        .btn-neon-action {
            width: 100%;
            padding-top: 22px;
            padding-bottom: 22px;
            border-radius: 20px;
            background-color: #000000;
            border-width: 2px;
            border-style: solid;
            border-color: var(--neon-blue-primary);
            color: var(--text-white); /* БЕЛЫЙ ТЕКСТ ПО ТЗ */
            font-size: 20px;
            text-transform: uppercase;
            font-family: 'Exo 2', sans-serif;
            font-weight: 900;
            box-shadow: 0 0 10px var(--neon-blue-primary), inset 0 0 5px var(--neon-blue-primary);
            cursor: pointer;
            transition-duration: 0.15s;
            transition-property: transform, box-shadow;
        }

        .btn-neon-action:active { 
            transform: scale(0.96); 
            box-shadow: 0 0 25px var(--neon-blue-primary);
        }

        .btn-universal-back { 
            position: absolute; 
            top: 25px; 
            left: 20px;
            background: none; 
            border: none; 
            color: var(--text-white); 
            font-family: 'Exo 2', sans-serif; 
            font-size: 15px; 
            font-weight: 900;
            text-transform: uppercase; 
            z-index: 100;
            cursor: pointer;
        }

        /* ОТОБРАЖЕНИЕ ID И КОДОВ
        */
        .massive-id-display { 
            font-size: 60px; 
            color: var(--text-white); /* БЕЛЫЙ ЦВЕТ ПО ТЗ */
            border-width: 4px;
            border-style: solid;
            border-color: var(--neon-blue-primary);
            padding-top: 15px;
            padding-bottom: 15px;
            padding-left: 45px;
            padding-right: 45px;
            border-radius: 25px; 
            margin-top: 25px;
            margin-bottom: 25px;
            font-family: 'Black Ops One'; 
            box-shadow: 0 0 20px var(--neon-blue-primary);
            background-color: rgba(0,0,0,0.5);
            text-align: center;
        }

        /* ИГРОВАЯ КАРТА (3D ЭФФЕКТ)
        */
        .card-view-wrapper { 
            width: 310px; 
            height: 430px; 
            perspective: 1200px; 
            margin-top: 20px; 
        }

        .card-view-inner { 
            position: relative; 
            width: 100%; 
            height: 100%; 
            transition: transform 0.65s cubic-bezier(0.4, 0, 0.2, 1); 
            transform-style: preserve-3d; 
            cursor: pointer;
        }

        .card-view-inner.is-flipped { 
            transform: rotateY(180deg); 
        }

        .card-side { 
            position: absolute; 
            width: 100%; 
            height: 100%; 
            backface-visibility: hidden; 
            border-radius: 45px; 
            border-width: 8px;
            border-style: solid;
            border-color: var(--neon-blue-primary); 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            background-color: var(--panel-bg); 
            box-shadow: 0 0 30px var(--neon-blue-primary);
        }

        .card-side-front { 
            transform: rotateY(180deg); 
            background-color: var(--text-white); 
            color: #000000; 
            border-color: var(--neon-red-primary); 
            box-shadow: 0 0 35px var(--neon-red-primary);
        }

        .brawler-portrait { 
            width: 260px; 
            height: 260px; 
            object-fit: contain; 
            margin-top: 10px;
        }

        /* ТАЙМЕР И ОБСУЖДЕНИЕ
        */
        .timer-display-text { 
            font-size: 90px; 
            color: var(--neon-red-primary); 
            text-shadow: 0 0 30px var(--neon-red-primary); 
            font-family: 'Black Ops One'; 
            margin-top: 30px;
            margin-bottom: 10px;
        }

        .white-status-label { 
            color: var(--text-white); 
            font-family: 'Exo 2', sans-serif; 
            text-transform: uppercase;
            font-weight: 900;
        }

    </style>
</head>
<body>

    <div id="view-main-menu" class="screen-container active-view">
        <div class="main-branding-area" id="brand-header">
            <span class="huge-spy-text">ШПИОН</span>
            <div class="brawl-stars-title">Brawl Stars</div>
            <div class="edition-badge-text">edition</div>
            
            <div class="user-identity-card">
                <img id="tg-pfp" class="user-avatar-circle" src="https://cdn-icons-png.flaticon.com/512/149/149071.png">
                <span id="tg-name" class="user-name-label">BRAWLER</span>
            </div>
        </div>

        <div class="action-button-group">
            <button class="btn-neon-action" onclick="appNavigate('view-lobby', true)">Создать комнату</button>
            <button class="btn-neon-action" onclick="appNavigate('view-join-room')">Поиск по коду</button>
        </div>
    </div>

    <div id="view-join-room" class="screen-container">
        <button class="btn-universal-back" onclick="appNavigate('view-main-menu')">← НАЗАД</button>
        <div style="margin-top: 80px; text-align: center; width: 100%;">
            <h2 class="white-status-label" style="font-size: 32px; letter-spacing: 2px;">ID ЛОББИ</h2>
            <input type="number" class="massive-id-display" style="background:none; width:280px; text-align:center; color:#fff;" placeholder="0000">
            <div class="action-button-group" style="margin: 30px auto;">
                <button class="btn-neon-action">ПОДКЛЮЧИТЬСЯ</button>
            </div>
        </div>
    </div>

    <div id="view-lobby" class="screen-container">
        <button class="btn-universal-back" onclick="appNavigate('view-main-menu')">← ВЫЙТИ</button>
        <div style="margin-top: 60px; text-align: center; width: 100%;">
            <p class="white-status-label" style="opacity: 0.6; letter-spacing: 2px;">ВАШ КОД ЛОББИ:</p>
            <div class="massive-id-display" id="display-room-id">----</div>
        </div>
        
        <div class="action-button-group" style="margin-top: auto; margin-bottom: 30px;">
            <button class="btn-neon-action" style="border-color: var(--tg-brand-blue); box-shadow: 0 0 15px var(--tg-brand-blue);" onclick="appShareRoom()">Пригласить друга</button>
            <button class="btn-neon-action" onclick="appStartGameSequence()">Начать игру</button>
        </div>
    </div>

    <div id="view-gameplay" class="screen-container">
        <h3 id="current-player-tag" style="color:var(--neon-blue-primary); font-family:'Exo 2'; font-size: 26px; margin-top: 15px; text-transform: uppercase;">ИГРОК 1</h3>
        
        <div class="card-view-wrapper" id="game-card-area" onclick="appHandleCardFlip()">
            <div id="card-inner-engine" class="card-view-inner">
                <div class="card-side">
                    <h1 style="font-size:150px; color:var(--neon-blue-primary); text-shadow: 0 0 20px var(--neon-blue-primary);">?</h1>
                </div>
                <div id="card-content-front" class="card-side card-side-front">
                    </div>
            </div>
        </div>

        <div id="discussion-ui" style="display:none; text-align:center;">
            <div id="timer-clock-digits" class="timer-display-text">10:00</div>
            <p class="white-status-label" style="letter-spacing: 6px; font-size: 22px;">КТО ШПИОН?</p>
            
            <button class="btn-neon-action" style="margin-top: 40px; border-color: var(--neon-red-primary); box-shadow: 0 0 15px var(--neon-red-primary);" onclick="appResetCurrentSession()">ЗАНОВО</button>
        </div>

        <button id="btn-next-player" class="btn-neon-action" style="visibility:hidden; margin-top: auto; margin-bottom: 30px;" onclick="appProceedToNextPlayer()">СЛЕДУЮЩИЙ</button>
    </div>

    <script>
        const webApp = window.Telegram.WebApp;
        webApp.expand();

        /*
           МАССИВНАЯ БАЗА ДАННЫХ БРАВЛЕРОВ ДЛЯ ВЕСА И РАЗНООБРАЗИЯ
        */
        const BRAWLER_LIST_FULL = [
            { name: "ШЕЛЛИ", img: "https://cdn.brawlstats.com/character-arts/16000000.png" },
            { name: "НИТА", img: "https://cdn.brawlstats.com/character-arts/16000001.png" },
            { name: "КОЛЬТ", img: "https://cdn.brawlstats.com/character-arts/16000002.png" },
            { name: "БУЛЛ", img: "https://cdn.brawlstats.com/character-arts/16000003.png" },
            { name: "ДЖЕССИ", img: "https://cdn.brawlstats.com/character-arts/16000004.png" },
            { name: "БРОК", img: "https://cdn.brawlstats.com/character-arts/16000005.png" },
            { name: "ДИНАМАЙК", img: "https://cdn.brawlstats.com/character-arts/16000006.png" },
            { name: "БО", img: "https://cdn.brawlstats.com/character-arts/16000010.png" },
            { name: "ЭЛЬ ПРИМО", img: "https://cdn.brawlstats.com/character-arts/16000012.png" },
            { name: "БАРЛИ", img: "https://cdn.brawlstats.com/character-arts/16000008.png" },
            { name: "ПОКО", img: "https://cdn.brawlstats.com/character-arts/16000011.png" },
            { name: "РОЗА", img: "https://cdn.brawlstats.com/character-arts/16000023.png" },
            { name: "РИКО", img: "https://cdn.brawlstats.com/character-arts/16000007.png" },
            { name: "ДЭРРИЛ", img: "https://cdn.brawlstats.com/character-arts/16000015.png" },
            { name: "ПЕННИ", img: "https://cdn.brawlstats.com/character-arts/16000017.png" },
            { name: "КАРЛ", img: "https://cdn.brawlstats.com/character-arts/16000019.png" },
            { name: "ДЖЕКИ", img: "https://cdn.brawlstats.com/character-arts/16000035.png" },
            { name: "ПАЙПЕР", img: "https://cdn.brawlstats.com/character-arts/16000013.png" },
            { name: "ПАМ", img: "https://cdn.brawlstats.com/character-arts/16000014.png" },
            { name: "ФРЭНК", img: "https://cdn.brawlstats.com/character-arts/16000020.png" },
            { name: "БИБИ", img: "https://cdn.brawlstats.com/character-arts/16000025.png" },
            { name: "БЕА", img: "https://cdn.brawlstats.com/character-arts/16000031.png" },
            { name: "НАНИ", img: "https://cdn.brawlstats.com/character-arts/16000038.png" },
            { name: "ЭДГАР", img: "https://cdn.brawlstats.com/character-arts/16000042.png" },
            { name: "МОРТИС", img: "https://cdn.brawlstats.com/character-arts/16000016.png" },
            { name: "ТАРА", img: "https://cdn.brawlstats.com/character-arts/16000018.png" },
            { name: "ДЖИН", img: "https://cdn.brawlstats.com/character-arts/16000021.png" },
            { name: "МАКС", img: "https://cdn.brawlstats.com/character-arts/16000027.png" },
            { name: "МИСТЕР ПИ", img: "https://cdn.brawlstats.com/character-arts/16000032.png" },
            { name: "СПРУТ", img: "https://cdn.brawlstats.com/character-arts/16000033.png" },
            { name: "БАЙРОН", img: "https://cdn.brawlstats.com/character-arts/16000040.png" },
            { name: "СПАЙК", img: "https://cdn.brawlstats.com/character-arts/16000009.png" },
            { name: "ВОРОН", img: "https://cdn.brawlstats.com/character-arts/16000022.png" },
            { name: "ЛЕОН", img: "https://cdn.brawlstats.com/character-arts/16000017.png" },
            { name: "СЭНДИ", img: "https://cdn.brawlstats.com/character-arts/16000029.png" },
            { name: "АМБЕР", img: "https://cdn.brawlstats.com/character-arts/16000039.png" },
            { name: "СЕРДЖ", img: "https://cdn.brawlstats.com/character-arts/16000037.png" }
        ];

        /*
           ГЛОБАЛЬНОЕ СОСТОЯНИЕ ПРИЛОЖЕНИЯ
        */
        const INTERNAL_STATE = {
            gameSessionActive: false,
            totalPlayers: 3,
            currentPlayerTurn: 0,
            assignedRoles: [],
            isCardShown: false,
            discussionTimerSeconds: 600, // 10 МИНУТ ПО ТЗ
            roomCode: "0000",
            activeIntervalId: null
        };

        /*
           ИНИЦИАЛИЗАЦИЯ ПРИ ЗАГРУЗКЕ
        */
        window.addEventListener('load', function() {
            console.log("System initialization started...");
            const userData = webApp.initDataUnsafe?.user;
            if (userData) {
                document.getElementById('tg-name').textContent = userData.first_name.toUpperCase();
                if (userData.photo_url) {
                    document.getElementById('tg-pfp').src = userData.photo_url;
                }
            }
            webApp.ready();
            console.log("Telegram WebApp ready.");
        });

        /*
           ФУНКЦИЯ НАВИГАЦИИ МЕЖДУ ЭКРАНАМИ
        */
        function appNavigate(viewId, isGeneratingCode = false) {
            console.log("Navigating to: " + viewId);
            
            // Сброс всех экранов
            const screens = document.querySelectorAll('.screen-container');
            for (let i = 0; i < screens.length; i++) {
                screens[i].classList.remove('active-view');
            }

            // Активация нужного
            document.getElementById(viewId).classList.add('active-view');

            // Генерация кода если нужно
            if (isGeneratingCode) {
                INTERNAL_STATE.roomCode = Math.floor(1000 + Math.random() * 9000);
                document.getElementById('display-room-id').textContent = INTERNAL_STATE.roomCode;
            }

            // Очистка таймеров при уходе с экрана игры
            if (viewId !== 'view-gameplay' && INTERNAL_STATE.activeIntervalId) {
                clearInterval(INTERNAL_STATE.activeIntervalId);
            }

            webApp.HapticFeedback.impactOccurred('medium');
        }

        /*
           ЛОГИКА СТАРТА ИГРЫ
        */
        function appStartGameSequence() {
            console.log("Starting game sequence...");
            INTERNAL_STATE.currentPlayerTurn = 0;
            INTERNAL_STATE.assignedRoles = [];
            INTERNAL_STATE.isCardShown = false;
            INTERNAL_STATE.discussionTimerSeconds = 600;

            // Выбор случайного бравлера для катки
            const secretBrawler = BRAWLER_LIST_FULL[Math.floor(Math.random() * BRAWLER_LIST_FULL.length)];
            const spyPosition = Math.floor(Math.random() * 3);

            console.log("Secret location: " + secretBrawler.name);
            console.log("Spy at position: " + spyPosition);

            for (let i = 0; i < 3; i++) {
                if (i === spyPosition) {
                    INTERNAL_STATE.assignedRoles.push({
                        name: "ШПИОН",
                        img: "https://cdn-icons-png.flaticon.com/512/953/953791.png"
                    });
                } else {
                    INTERNAL_STATE.assignedRoles.push(secretBrawler);
                }
            }

            appNavigate('view-gameplay');
            
            // Сброс UI игры
            document.getElementById('game-card-area').style.display = 'block';
            document.getElementById('discussion-ui').style.display = 'none';
            document.getElementById('btn-next-player').style.display = 'block';
            document.getElementById('btn-next-player').style.visibility = 'hidden';
            document.getElementById('card-inner-engine').classList.remove('is-flipped');
            
            appRefreshPlayerLabel();
        }

        /*
           ОБРАБОТКА ТАПА ПО КАРТЕ
        */
        function appHandleCardFlip() {
            if (INTERNAL_STATE.isCardShown) return;

            console.log("Flipping card for player: " + (INTERNAL_STATE.currentPlayerTurn + 1));
            const currentRole = INTERNAL_STATE.assignedRoles[INTERNAL_STATE.currentPlayerTurn];
            const frontSide = document.getElementById('card-content-front');

            frontSide.innerHTML = `
                <h2 style="font-family:'Exo 2'; font-size: 38px; margin-bottom: 5px;">${currentRole.name}</h2>
                <img src="${currentRole.img}" class="brawler-portrait">
                <p style="font-family:'Exo 2'; color:red; font-weight:900; margin-top:15px; letter-spacing: 1px;">НЕ ПОКАЗЫВАЙ!</p>
            `;

            document.getElementById('card-inner-engine').classList.add('is-flipped');
            document.getElementById('btn-next-player').style.visibility = 'visible';
            INTERNAL_STATE.isCardShown = true;

            webApp.HapticFeedback.impactOccurred('heavy');
        }

        /*
           ПЕРЕХОД К СЛЕДУЮЩЕМУ ИГРОКУ
        */
        function appProceedToNextPlayer() {
            INTERNAL_STATE.currentPlayerTurn++;

            if (INTERNAL_STATE.currentPlayerTurn < 3) {
                console.log("Next turn: Player " + (INTERNAL_STATE.currentPlayerTurn + 1));
                INTERNAL_STATE.isCardShown = false;
                document.getElementById('card-inner-engine').classList.remove('is-flipped');
                document.getElementById('btn-next-player').style.visibility = 'hidden';
                
                setTimeout(function() {
                    appRefreshPlayerLabel();
                }, 300);
            } else {
                appStartDiscussionTimer();
            }
        }

        function appRefreshPlayerLabel() {
            document.getElementById('current-player-tag').textContent = "ИГРОК " + (INTERNAL_STATE.currentPlayerTurn + 1);
        }

        /*
           ТАЙМЕР ОБСУЖДЕНИЯ (10 МИНУТ)
        */
        function appStartDiscussionTimer() {
            console.log("All players checked roles. Starting discussion...");
            document.getElementById('game-card-area').style.display = 'none';
            document.getElementById('btn-next-player').style.display = 'none';
            document.getElementById('discussion-ui').style.display = 'block';
            document.getElementById('current-player-tag').textContent = "ОБСУЖДЕНИЕ";

            if (INTERNAL_STATE.activeIntervalId) clearInterval(INTERNAL_STATE.activeIntervalId);

            INTERNAL_STATE.activeIntervalId = setInterval(function() {
                INTERNAL_STATE.discussionTimerSeconds--;

                let minutes = Math.floor(INTERNAL_STATE.discussionTimerSeconds / 60);
                let seconds = INTERNAL_STATE.discussionTimerSeconds % 60;

                document.getElementById('timer-clock-digits').textContent = 
                    (minutes < 10 ? "0" + minutes : minutes) + ":" + (seconds < 10 ? "0" + seconds : seconds);

                if (INTERNAL_STATE.discussionTimerSeconds <= 0) {
                    clearInterval(INTERNAL_STATE.activeIntervalId);
                    webApp.HapticFeedback.notificationOccurred('error');
                    console.log("Time is up!");
                }
            }, 1000);
        }

        /*
           КНОПКА ЗАНОВО (RESET)
        */
        function appResetCurrentSession() {
            console.log("Resetting current game session...");
            webApp.HapticFeedback.notificationOccurred('warning');
            appStartGameSequence();
        }

        /*
           ПОДЕЛИТЬСЯ КОДОМ ЛОББИ
        */
        function appShareRoom() {
            console.log("Sharing room code: " + INTERNAL_STATE.roomCode);
            webApp.switchInlineQuery("Заходи в Шпиона Brawl Stars! Код нашего лобби: " + INTERNAL_STATE.roomCode);
        }

    </script>
</body>
</html>
