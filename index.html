<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>BRAWL SPY ULTIMATE 2026</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Black+Ops+One&family=Rubik+Mono+One&family=Roboto:wght@900&display=swap" rel="stylesheet">
    
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>
        /* =========================================
           ФУНДАМЕНТАЛЬНЫЕ ПЕРЕМЕННЫЕ ДИЗАЙНА
           ========================================= */
        :root {
            --base-bg: #05070a;
            --white-glow: #ffffff;
            --gold-bright: #ffcc00;
            --gold-shadow: #ff8c00;
            --blue-bright: #00a2ff;
            --blue-shadow: #004dff;
            --neon-blue: #00d2ff;
            --neon-red: #ff3131;
            --neon-yellow: #ffff00;
            --neon-green: #00ff00;
            --font-main: 'Black Ops One', cursive;
            --font-secondary: 'Rubik Mono One', sans-serif;
            --glass-bg: rgba(255, 255, 255, 0.04);
            --glass-border: rgba(255, 255, 255, 0.1);
        }

        /* =========================================
           ОБНУЛЕНИЕ И БАЗОВЫЕ СТИЛИ
           ========================================= */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            -webkit-user-select: none;
            outline: none;
        }

        body {
            background-color: var(--base-bg);
            color: #ffffff;
            height: 100vh;
            width: 100vw;
            font-family: var(--font-main);
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow: hidden;
            position: relative;
            /* Радиальный градиент для создания глубины и эффекта Halo */
            background: radial-gradient(circle at 50% 30%, rgba(255,255,255,0.12) 0%, rgba(0,0,0,0) 65%), var(--base-bg);
        }

        /* =========================================
           ИНДИКАТОР ОНЛАЙНА (TOP BAR)
           ========================================= */
        .top-status-bar {
            width: 100%;
            padding: 20px 25px 10px;
            display: flex;
            justify-content: flex-end;
            align-items: center;
            z-index: 999;
        }

        .online-wrapper {
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(0, 0, 0, 0.3);
            padding: 6px 14px;
            border-radius: 50px;
            border: 1px solid rgba(0, 255, 0, 0.2);
        }

        .online-dot {
            width: 8px;
            height: 8px;
            background-color: var(--neon-green);
            border-radius: 50%;
            box-shadow: 0 0 10px var(--neon-green);
            animation: pulse-green 2s infinite;
        }

        @keyframes pulse-green {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.4); opacity: 0.5; }
            100% { transform: scale(1); opacity: 1; }
        }

        .online-count {
            color: var(--neon-green);
            font-size: 12px;
            font-weight: 900;
            letter-spacing: 1px;
            text-shadow: 0 0 5px rgba(0, 255, 0, 0.5);
        }

        /* =========================================
           БРЕНДИНГ И ЛОГОТИП
           ========================================= */
        .brand-container {
            width: 100%;
            padding: 10px 40px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 25px;
            z-index: 100;
        }

        .brand-container img {
            width: 100%;
            max-width: 380px;
            filter: drop-shadow(0 0 30px rgba(255,255,255,0.25));
            animation: float-animation 4s infinite ease-in-out;
            transition: 0.5s;
        }

        @keyframes float-animation {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-12px) rotate(1deg); }
        }

        /* =========================================
           КОНТЕЙНЕР ЭКРАНОВ (MAIN WRAPPER)
           ========================================= */
        .app-view-container {
            width: 100%;
            max-width: 440px;
            flex-grow: 1;
            position: relative;
            display: flex;
            justify-content: center;
            z-index: 200;
        }

        .screen-module {
            display: none;
            width: 100%;
            flex-direction: column;
            align-items: center;
            padding: 0 45px;
            position: absolute;
            top: 0;
            left: 0;
        }

        .screen-module.is-active {
            display: flex;
            animation: slide-up 0.4s cubic-bezier(0.18, 0.89, 0.32, 1.28) forwards;
        }

        @keyframes slide-up {
            from { opacity: 0; transform: translateY(40px) scale(0.9); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        /* =========================================
           УНИВЕРСАЛЬНЫЕ КНОПКИ (BUTTON SYSTEM)
           ========================================= */
        .ui-button-stack {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 20px;
            margin-top: 15px;
        }

        .btn-ui {
            width: 100%;
            padding: 24px 0;
            font-family: var(--font-main);
            font-size: 26px;
            text-transform: uppercase;
            border-radius: 20px;
            border: none;
            cursor: pointer;
            position: relative;
            box-shadow: 0 8px 0 rgba(0,0,0,0.7);
            transition: all 0.1s;
            overflow: hidden;
        }

        .btn-ui::after {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 50%;
            background: linear-gradient(rgba(255,255,255,0.15), transparent);
        }

        .btn-ui:active {
            transform: translateY(4px);
            box-shadow: 0 4px 0 rgba(0,0,0,0.7);
        }

        /* КНОПКА №6: СОЗДАТЬ КОМНАТУ (ЗОЛОТО + БЕЛЫЙ ТЕКСТ) */
        .btn-gold-action {
            background: linear-gradient(180deg, var(--gold-bright) 0%, var(--gold-shadow) 100%);
            color: #ffffff !important;
            border: 2px solid rgba(255, 255, 255, 0.3);
            text-shadow: 0 2px 4px rgba(0,0,0,0.4);
        }

        .btn-blue-action {
            background: linear-gradient(180deg, var(--blue-bright) 0%, var(--blue-shadow) 100%);
            color: #ffffff;
            border: 2px solid rgba(255, 255, 255, 0.2);
        }

        .btn-dark-return {
            background: #1c1f24;
            color: #6c6c6c;
            font-size: 18px;
            margin-top: 15px;
            box-shadow: 0 6px 0 rgba(0,0,0,0.6);
        }

        /* =========================================
           ЭКРАН: НАСТРОЙКА ЛОББИ
           ========================================= */
        .lobby-main-header {
            font-size: 32px;
            color: var(--white-glow);
            text-shadow: 0 0 20px var(--white-glow);
            margin-bottom: 35px;
            text-transform: uppercase;
            text-align: center;
            letter-spacing: 1px;
        }

        .settings-card {
            width: 100%;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 20px;
            margin-bottom: 30px;
            backdrop-filter: blur(8px);
        }

        .tab-navigation {
            display: flex;
            width: 100%;
            gap: 15px;
            margin-bottom: 25px;
        }

        .tab-item {
            flex: 1;
            padding: 20px 0;
            border: 4px solid;
            border-radius: 18px;
            text-align: center;
            font-size: 14px;
            font-weight: bold;
            text-transform: uppercase;
            background: rgba(0,0,0,0.2);
            transition: 0.3s;
        }

        .tab-neon-blue {
            border-color: var(--neon-blue);
            color: var(--neon-blue);
            box-shadow: inset 0 0 15px var(--neon-blue), 0 0 15px var(--neon-blue);
        }

        .tab-neon-red {
            border-color: var(--neon-red);
            color: var(--neon-red);
            box-shadow: inset 0 0 15px var(--neon-red), 0 0 15px var(--neon-red);
        }

        .room-id-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        .room-id-title {
            color: #ffffff;
            font-size: 20px;
            text-transform: uppercase;
            letter-spacing: 2px;
            opacity: 0.8;
        }

        .room-id-code {
            color: var(--gold-bright);
            font-size: 48px;
            letter-spacing: 8px;
            text-shadow: 0 0 15px rgba(255, 204, 0, 0.5);
            font-family: var(--font-secondary);
        }

        .btn-neon-yellow-play {
            background-color: var(--neon-yellow);
            color: #000000;
            box-shadow: 0 0 25px var(--neon-yellow), 0 8px 0 #b3b300;
            font-weight: 900;
        }

        /* =========================================
           ЭКРАН: ВВОД ПО ID
           ========================================= */
        .id-input-wrapper {
            width: 100%;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 30px;
        }

        .input-placeholder-line {
            font-size: 55px;
            border-bottom: 6px solid #ffffff;
            width: 100%;
            max-width: 280px;
            text-align: center;
            letter-spacing: 18px;
            color: #ffffff;
            padding-bottom: 10px;
            font-family: var(--font-secondary);
        }

    </style>
</head>
<body>

    <div class="top-status-bar">
        <div class="online-wrapper">
            <div class="online-dot"></div>
            <div class="online-count">В СЕТИ: 12,481</div>
        </div>
    </div>

    <div class="brand-container">
        <img src="https://i.ibb.co/b29d0c/logo.png" alt="BRAWL SPY LOGO">
    </div>

    <div class="app-view-container">
        
        <div id="scr-home" class="screen-module is-active">
            <div class="ui-button-stack">
                <button class="btn-ui btn-gold-action" onclick="navigateToScreen('scr-lobby')">СОЗДАТЬ КОМНАТУ</button>
                <button class="btn-ui btn-blue-action" onclick="navigateToScreen('scr-join')">ВХОД ПО ID</button>
                <button class="btn-ui btn-dark-return" onclick="tg.close()">ВЫХОД</button>
            </div>
        </div>

        <div id="scr-lobby" class="screen-module">
            <h2 class="lobby-main-header">НАСТРОЙКА ЛОББИ</h2>
            
            <div class="settings-card">
                <div class="tab-navigation">
                    <div class="tab-item tab-neon-blue">УЧАСТНИКИ</div>
                    <div class="tab-item tab-neon-red">ШПИОН</div>
                </div>

                <div class="room-id-section">
                    <div class="room-id-title">ID КОМНАТЫ</div>
                    <div id="dynamic-room-id" class="room-id-code">000-000</div>
                </div>
            </div>

            <div class="ui-button-stack">
                <button class="btn-ui btn-neon-yellow-play" onclick="tg.showAlert('БИТВА НАЧИНАЕТСЯ! УДАЧИ!')">НАЧАТЬ ИГРУ</button>
                <button class="btn-ui btn-dark-return" onclick="navigateToScreen('scr-home')">В МЕНЮ</button>
            </div>
        </div>

        <div id="scr-join" class="screen-module">
             <div class="lobby-main-header">ВВОД ПО ID</div>
             
             <div class="id-input-wrapper">
                 <div class="room-id-title">ID КОМНАТЫ</div>
                 <div class="input-placeholder-line">____</div>
             </div>

             <div class="ui-button-stack">
                <button class="btn-ui btn-dark-return" onclick="navigateToScreen('scr-home')">НАЗАД</button>
            </div>
        </div>

    </div>

    <script>
        // Глобальный объект Telegram SDK
        const tg = window.Telegram.WebApp;
        
        // Настройка внешнего вида WebApp
        tg.expand();
        tg.enableClosingConfirmation();
        tg.headerColor = "#05070a";

        /**
         * Глобальная функция навигации между экранами
         * @param {string} screenId - ID экрана, который нужно отобразить
         */
        function navigateToScreen(screenId) {
            console.log("Переход на экран:", screenId);

            // 1. Деактивация текущего экрана
            const activeScreens = document.querySelectorAll('.screen-module');
            activeScreens.forEach(screen => {
                screen.classList.remove('is-active');
            });

            // 2. Активация целевого экрана
            const targetScreen = document.getElementById(screenId);
            if (targetScreen) {
                targetScreen.classList.add('is-active');
            }

            // 3. Специфическая логика для экрана Лобби
            if (screenId === 'scr-lobby') {
                updateRoomIdentifier();
            }

            // 4. Тактильная обратная связь
            if (tg.HapticFeedback) {
                tg.HapticFeedback.impactOccurred('medium');
            }
        }

        /**
         * Генерация и обновление случайного ID комнаты
         */
        function updateRoomIdentifier() {
            const blockA = Math.floor(100 + Math.random() * 899);
            const blockB = Math.floor(100 + Math.random() * 899);
            const finalCode = `${blockA}-${blockB}`;
            
            const idDisplay = document.getElementById('dynamic-room-id');
            if (idDisplay) {
                idDisplay.innerText = finalCode;
            }
        }

        // Выполнение при полной инициализации страницы
        window.addEventListener('DOMContentLoaded', () => {
            tg.ready();
            console.log("Brawl Spy App Loaded Successfully");
        });
    </script>
</body>
</html>
