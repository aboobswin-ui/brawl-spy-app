<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>BRAWL SPY 2026 REPLICA</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Black+Ops+One&family=Rubik+Mono+One&display=swap" rel="stylesheet">
    
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>
        :root {
            --bg-dark: #0d1117;
            --spy-red: #e61e1e;
            --brawl-white: #ffffff;
            /* Тяжелые 3D тени */
            --shadow-3d: 
                0 1px 0 #000, 0 2px 0 #000, 0 3px 0 #000, 0 4px 0 #000, 
                0 5px 0 #000, 0 6px 0 #000, 0 10px 20px rgba(0,0,0,0.8);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            background-color: var(--bg-dark);
            height: 100vh; width: 100vw;
            display: flex; justify-content: center; align-items: center;
            overflow: hidden; font-family: 'Black Ops One', cursive;
        }

        /* Центрирующий контейнер с эффектом свечения сзади */
        .main-container {
            width: 100%; max-width: 440px; height: 100%;
            position: relative; display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            background: radial-gradient(circle at 50% 45%, rgba(255,255,255,0.15) 0%, rgba(0,0,0,0) 60%);
        }

        /* КОНСТРУКЦИЯ ЛОГОТИПА (КАК НА ФОТО) */
        .logo-stack {
            position: relative;
            display: flex; flex-direction: column;
            align-items: center;
            z-index: 10;
            margin-bottom: 80px;
            transform: scale(1.1);
        }

        .logo-brawl {
            font-size: 64px;
            color: var(--brawl-white);
            line-height: 0.8;
            text-shadow: var(--shadow-3d);
            letter-spacing: -2px;
            z-index: 1;
        }

        .logo-spy {
            font-family: 'Rubik Mono One', sans-serif;
            font-size: 58px;
            color: var(--spy-red);
            line-height: 0.8;
            z-index: 5;
            margin: -5px 0;
            /* Белая обводка и глянец */
            -webkit-text-stroke: 2px #fff;
            text-shadow: 0 0 10px rgba(255,255,255,0.3), 4px 4px 0 #000;
            background: linear-gradient(180deg, #ff4d4d 0%, #b30000 100%);
            -webkit-background-clip: text;
            background-clip: text;
        }

        .logo-stars {
            font-size: 92px;
            color: var(--spy-red);
            line-height: 0.75;
            text-shadow: var(--shadow-3d);
            letter-spacing: -4px;
            z-index: 1;
        }

        .logo-year {
            font-size: 48px;
            color: #fff;
            margin-top: -10px;
            text-shadow: var(--shadow-3d);
        }

        /* КНОПКИ (НИЖНЯЯ ПАНЕЛЬ) */
        .ui-panel {
            width: 100%;
            position: absolute;
            bottom: 40px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            padding: 0 20px;
            z-index: 20;
        }

        .btn-base {
            padding: 18px 0;
            font-size: 20px;
            font-weight: bold;
            border-radius: 6px;
            border: none;
            cursor: pointer;
            text-transform: uppercase;
            box-shadow: 0 4px 0 rgba(0,0,0,0.5);
            transition: 0.1s;
            background: linear-gradient(180deg, #ffffff 0%, #cccccc 100%);
            color: #000;
        }

        .btn-base:active {
            transform: translateY(2px);
            box-shadow: 0 2px 0 rgba(0,0,0,0.5);
        }

        /* Кнопка создания (по твоей инструкции: Белый текст на золоте) */
        .btn-create {
            grid-column: span 2;
            background: linear-gradient(180deg, #ffcc00 0%, #ff9900 100%);
            color: #ffffff;
            margin-bottom: 10px;
            font-size: 24px;
        }

        .btn-id { grid-column: 1; }
        .btn-exit { grid-column: 2; }

    </style>
</head>
<body>

    <div class="main-container">
        
        <div class="logo-stack">
            <div class="logo-brawl">BRAWL</div>
            <div class="logo-spy">ШПИОН</div>
            <div class="logo-stars">STARS</div>
            <div class="logo-year">-2026</div>
        </div>

        <div class="ui-panel">
            <button class="btn-base btn-create" onclick="tg.showAlert('Создание лобби...')">СОЗДАТЬ КОМНАТУ</button>
            <button class="btn-base btn-id">ВХОД ПО ID</button>
            <button class="btn-base btn-exit" onclick="tg.close()">ВЫХОД</button>
        </div>

    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        tg.ready();
    </script>
</body>
</html>
