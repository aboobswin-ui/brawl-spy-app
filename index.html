<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Brawl Spy</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Rubik+One&display=swap" rel="stylesheet">
    <style>
        /* Сброс стилей */
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; margin: 0; padding: 0; }
        
        body {
            background-color: #0A0A0F;
            background-image: radial-gradient(circle at 50% 50%, #1a0b2e 0%, #0A0A0F 100%);
            color: white;
            font-family: 'Rubik One', 'Arial Black', sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .app-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        .screen {
            display: none;
            width: 100%;
            height: 100%;
            flex-direction: column;
            align-items: center;
            justify-content: center; /* Центруем контент */
            gap: 30px;
        }

        .active { display: flex; }

        h1 {
            font-size: 42px;
            text-transform: uppercase;
            text-align: center;
            color: #FFFFFF;
            text-shadow: 0 0 10px rgba(114, 9, 183, 0.4), 3px 3px 0px #000;
            margin-bottom: 10px;
        }

        /* Твой стиль профиля */
        .user-info {
            background: rgba(114, 9, 183, 0.1);
            border: 2px solid #7209B7;
            border-radius: 50px;
            padding: 8px 20px;
            display: flex;
            align-items: center;
            box-shadow: 0 0 10px rgba(114, 9, 183, 0.2);
        }

        .avatar {
            width: 40px; height: 40px;
            border-radius: 50%;
            border: 2px solid #FFFFFF;
            margin-right: 12px;
        }

        /* ЕДИНЫЙ СТИЛЬ КНОПОК */
        .btn-style {
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid #7209B7;
            border-radius: 20px;
            color: white;
            font-family: 'Rubik One', sans-serif;
            font-size: 20px;
            padding: 18px;
            width: 100%;
            max-width: 310px;
            text-transform: uppercase;
            cursor: pointer;
            transition: 0.15s;
        }

        .btn-style:active { transform: scale(0.96); background: rgba(114, 9, 183, 0.2); }

        /* Настройки комнаты */
        .settings-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(114, 9, 183, 0.3);
            border-radius: 20px;
            width: 100%;
            max-width: 340px;
            padding: 10px;
        }

        .setting-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px;
        }

        .circle-btn {
            width: 40px; height: 40px;
            background: #560bad;
            border: none;
            border-radius: 10px;
            color: white;
            font-size: 24px;
            font-family: 'Rubik One';
        }

        .back-btn {
            color: #B0B7C3;
            text-transform: uppercase;
            font-size: 14px;
            margin-top: 15px;
            cursor: pointer;
            opacity: 0.7;
        }
    </style>
</head>
<body>

    <div class="app-container">
        
        <div id="screen-main" class="screen active">
            <div style="text-align: center;">
                <h1>BRAWL SPY</h1>
                <div class="user-info" style="display: inline-flex; margin-bottom: 20px;">
                    <img id="u-pic" src="https://cdn-icons-png.flaticon.com/512/847/847969.png" class="avatar">
                    <span id="u-name">ИГРОК</span>
                </div>
            </div>
            <button class="btn-style" onclick="go('screen-menu')">ИГРАТЬ</button>
        </div>

        <div id="screen-menu" class="screen">
            <h1 style="font-size: 58px;">МЕНЮ</h1>
            <div style="width: 100%; display: flex; flex-direction: column; align-items: center; gap: 15px;">
                <button class="btn-style" onclick="go('screen-settings')">Создать комнату</button>
                <button class="btn-style" onclick="invite()">Пригласить друга</button>
            </div>
            <div class="back-btn" onclick="go('screen-main')">назад</div>
        </div>

        <div id="screen-settings" class="screen">
            <h1>КОМНАТА</h1>
            <div class="settings-card">
                <div class="setting-item">
                    <span>ИГРОКОВ</span>
                    <div style="display: flex; align-items: center; gap: 12px;">
                        <button class="circle-btn" onclick="adj('p',-1)">-</button>
                        <span id="p-v" style="font-size: 26px; min-width: 30px; text-align: center;">4</span>
                        <button class="circle-btn" onclick="adj('p',1)">+</button>
                    </div>
                </div>
                <div class="setting-item">
                    <span>ШПИОНОВ</span>
                    <div style="display: flex; align-items: center; gap: 12px;">
                        <button class="circle-btn" onclick="adj('s',-1)">-</button>
                        <span id="s-v" style="font-size: 26px; min-width: 30px; text-align: center;">1</span>
                        <button class="circle-btn" onclick="adj('s',1)">+</button>
                    </div>
                </div>
            </div>
            <button class="btn-style" onclick="invite()">ПОЗВАТЬ ДРУЗЕЙ</button>
            <div class="back-btn" onclick="go('screen-menu')">назад</div>
        </div>

    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();
        tg.ready();

        const user = tg.initDataUnsafe?.user;
        if (user) {
            document.getElementById('u-name').innerText = user.first_name.toUpperCase();
            if (user.photo_url) document.getElementById('u-pic').src = user.photo_url;
        }

        function go(id) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            tg.HapticFeedback.impactOccurred('light');
        }

            let e = document.getElementById(t + '-v');
            let v
