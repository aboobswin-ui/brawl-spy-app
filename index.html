<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>BRAWL SPY - TOCH V TOCH</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Black+Ops+One&family=Rubik+Mono+One&display=swap" rel="stylesheet">
    
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>
        :root {
            --clr-spy-red: #ff0000;
            --clr-white: #ffffff;
            --clr-gold: #ffcc00;
            --clr-neon-blue: #00e5ff;
            --clr-neon-red: #ff003c;
            --clr-bg-black: #010103;
            
            --f-spy: 'Rubik Mono One', sans-serif;
            --f-main: 'Black Ops One', cursive;

            /* ТЯЖЕЛЫЕ ТЕНИ ДЛЯ ЭФФЕКТА 3D ОБЪЕМА БУКВ */
            --shadow-3d: 
                0 1px 0 #000, 0 2px 0 #000, 0 3px 0 #000, 0 4px 0 #000, 
                0 5px 0 #000, 0 6px 0 #000, 0 15px 30px rgba(0,0,0,0.9);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }

        body {
            background-color: var(--clr-bg-black);
            color: var(--clr-white);
            height: 100vh; width: 100vw;
            display: flex; justify-content: center; align-items: center;
            overflow: hidden; font-family: var(--f-main);
        }

        /* ОСНОВНОЙ КОНТЕЙНЕР */
        .wrapper {
            width: 100%; max-width: 440px; height: 100%;
            position: relative; display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            background: radial-gradient(circle at center, rgba(255,255,255,0.08) 0%, rgba(0,0,0,0) 70%);
        }

        /* ТО САМОЕ ОСВЕЩЕНИЕ СЗАДИ (HALO EFFECT) */
        .ambient-light {
            position: absolute; top: 40%; left: 50%;
            transform: translate(-50%, -50%);
            width: 350px; height: 350px;
            background: radial-gradient(circle, rgba(255,255,255,0.18) 0%, rgba(255,255,255,0) 75%);
            filter: blur(50px); z-index: 1;
            pointer-events: none;
        }

        /* --- ЛОГОТИП: ТОЧЬ В ТОЧЬ КАК НА ФОТО --- */
        .logo-group {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 10;
            margin-bottom: 65px;
            transform: rotate(-3deg); /* ХАРАКТЕРНЫЙ НАКЛОН */
        }

        .txt-brawl {
            font-size: 58px;
            color: var(--clr-white);
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: var(--shadow-3d);
            margin-bottom: -10px; /* СБЛИЖАЕМ СЛОВА */
        }

        .txt-stars {
            font-size: 105px;
            color: var(--clr-spy-red);
            text-transform: uppercase;
            line-height: 0.8;
            text-shadow: var(--shadow-3d);
        }

        /* ШПИОН: НАКЛАДКА В ЦЕНТРЕ */
        .txt-spy-overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(1.1);
            font-family: var(--f-spy);
            font-size: 65px;
            color: var(--clr-spy-red);
            text-transform: uppercase;
            z-index: 50;
            white-space: nowrap;
            /* ЖИРНАЯ БЕЛАЯ ОБВОДКА И СИЛЬНОЕ СВЕЧЕНИЕ */
            -webkit-text-stroke: 4px #ffffff;
            text-shadow: 0 0 20px rgba(255,255,255,0.6), 5px 5px 0 #000;
        }

        /* --- ИНТЕРФЕЙС КНОПОК --- */
        .menu-btns { width: 100%; padding: 0 45px; display: flex; flex-direction: column; gap: 18px; z-index: 100; }

        .btn-game {
            width: 100%; padding: 22px 0;
            font-family: var(--f-main); font-size: 26px; font-style: italic;
            text-transform: uppercase; border-radius: 16px; border: none;
            color: #fff; box-shadow: 0 8px 0 rgba(0,0,0,0.5);
            -webkit-text-stroke: 1.2px #000; text-shadow: 2px 2px 0 #000;
            position: relative; overflow: hidden; transition: 0.1s;
        }

        /* ГЛЯНЕЦ НА ВЕРХНЕЙ ЧАСТИ КНОПОК */
        .btn-game::before {
            content: ''; position: absolute; top: 0; left: 0;
            width: 100%; height: 45%;
            background: linear-gradient(rgba(255,255,255,0.15), transparent);
        }

        .btn-game:active { transform: translateY(5px); box-shadow: 0 3px 0 rgba(0,0,0,0.5); }

        .btn-blue { background: linear-gradient(180deg, #0099ff, #0044ff); border: 3.5px solid #00ccff; }
        
        /* КНОПКА №6: ЗОЛОТАЯ, ТЕКСТ БЕЛЫЙ */
        .btn-gold { 
            background: linear-gradient(180deg, #ffdb00, #ff8c00); 
            border: 3.5px solid #ffea00; 
            color: #ffffff !important; 
        }

        .btn-menu { background: linear-gradient(180deg, #555, #1a1a1a); border: 3.5px solid #777; font-size: 16px; padding: 16px 0; margin-top: 10px; }

        /* --- ЭКРАН НАСТРОЕК ЛОББИ --- */
        .screen { position: absolute; inset: 0; display: none; flex-direction: column; align-items: center; justify-content: center; z-index: 10; }
        .screen.active { display: flex; animation: viewFade 0.3s ease; }

        #main-menu {
            background: linear-gradient(rgba(0,0,0,0.7), rgba(0,0,0,0.7)), 
                        url('https://avatars.mds.yandex.net/i?id=bf88c867806a71c96d2d94c597a3c9ea_l-8271622-images-thumbs&n=13');
            background-size: cover; background-position: center;
        }

        .lobby-title { font-size: 34px; color: #fff; text-shadow: 0 0 15px #fff; margin-bottom: 40px; }
        .lobby-tabs { display: flex; width: 100%; gap: 15px; padding: 0 45px; margin-bottom: 40px; }
        .tab-item { 
            flex: 1; padding: 20px 0; border: 3px solid; border-radius: 12px; 
            text-align: center; font-family: var(--f-main); font-size: 14px; 
        }
        
        .tab-neon-blue { border-color: var(--clr-neon-blue); color: var(--clr-neon-blue); box-shadow: 0 0 15px var(--clr-neon-blue); }
        .tab-neon-red { border-color: var(--clr-neon-red); color: var(--clr-neon-red); box-shadow: 0 0 15px var(--clr-neon-red); }
        
        .id-text { color: #fff; font-size: 20px; margin-bottom: 5px; opacity: 0.9; }
        .id-val { color: var(--clr-gold); font-size: 36px; margin-bottom: 45px; letter-spacing: 5px; }

        @keyframes viewFade { from { opacity: 0; transform: scale(1.05); } to { opacity: 1; transform: scale(1); } }
    </style>
</head>
<body>

    <div class="wrapper">
        <div class="ambient-light"></div>

        <div id="main-menu" class="screen active">
            <div class="logo-group">
                <div class="txt-brawl">BRAWL</div>
                <div class="txt-stars">STARS</div>
                <div class="txt-spy-overlay">ШПИОН</div>
            </div>
            
            <div class="menu-btns">
                <button class="btn-game btn-blue" onclick="change('lobby-screen')">СОЗДАТЬ ЛОББИ</button>
                <button class="btn-game btn-blue" onclick="change('join-screen')">ВХОД ПО ID</button>
                <button class="btn-game btn-menu" onclick="tg.close()">ВЫХОД</button>
            </div>
        </div>

        <div id="lobby-screen" class="screen" style="background: var(--clr-bg-black);">
            <h2 class="lobby-title">НАСТРОЙКА ЛОББИ</h2>
            
            <div class="lobby-tabs">
                <div class="tab-item tab-neon-blue">УЧАСТНИКИ</div>
                <div class="tab-item tab-neon-red">ШПИОН</div>
            </div>

            <p class="id-text">ID КОМНАТЫ</p>
            <div id="room-code" class="id-val">777-000</div>

            <div class="menu-btns">
                <button class="btn-game btn-gold" onclick="tg.showAlert('БИТВА НАЧАТА!')">СОЗДАТЬ КОМНАТУ</button>
                <button class="btn-game btn-menu" onclick="change('main-menu')">МЕНЮ</button>
            </div>
        </div>

        <div id="join-screen" class="screen" style="background: var(--clr-bg-black);">
            <h2 class="lobby-title" style="font-size: 26px;">ID КОМНАТЫ</h2>
            <div style="margin: 40px 0; font-size: 44px; border-bottom: 5px solid #fff; width: 220px; text-align: center; letter-spacing: 12px;">____</div>
            <button class="btn-game btn-menu" onclick="change('main-menu')">ОТМЕНА</button>
        </div>

    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        function change(id) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            
            if(id === 'lobby-screen') {
                const num = Math.floor(100+Math.random()*899) + "-" + Math.floor(100+Math.random()*899);
                document.getElementById('room-code').innerText = num;
            }
            tg.HapticFeedback.impactOccurred('medium');
        }

        window.onload = () => { tg.ready(); };
    </script>
</body>
</html>
