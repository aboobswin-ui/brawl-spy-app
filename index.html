<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Brawl Spy: Ultimate Brawler Edition</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Rubik+One&display=swap" rel="stylesheet">
    
    <style>
        /* --- ГЛОБАЛЬНЫЕ СТИЛИ (МАССИВНЫЙ БЛОК) --- */
        :root {
            --accent: #7209B7;
            --accent-light: #B5179E;
            --spy-color: #F72585;
            --bg-dark: #0A0A0F;
            --matte-gray: #1c1c1f;
        }

        * { 
            box-sizing: border-box; 
            -webkit-tap-highlight-color: transparent; 
            margin: 0; 
            padding: 0; 
            user-select: none;
        }
        
        body {
            background-color: var(--bg-dark);
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(114, 9, 183, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(247, 37, 133, 0.1) 0%, transparent 40%);
            color: white;
            font-family: 'Rubik One', sans-serif;
            height: 100vh;
            width: 100vw;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* --- КОНТЕЙНЕР ПРИЛОЖЕНИЯ --- */
        .app-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
        }

        /* --- ЭКРАНЫ И АНИМАЦИИ --- */
        .screen {
            display: none;
            width: 100%;
            height: 100%;
            flex-direction: column;
            align-items: center;
            justify-content: space-around;
            padding: 40px 0;
            opacity: 0;
            transform: translateY(20px);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .screen.active { 
            display: flex !important; 
            opacity: 1; 
            transform: translateY(0);
        }

        /* --- ШАПКИ И ЗАГОЛОВКИ --- */
        h1 {
            font-size: 38px;
            text-transform: uppercase;
            text-align: center;
            line-height: 1.1;
            background: linear-gradient(to bottom, #fff 40%, #ccc 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 10px rgba(114, 9, 183, 0.5));
        }

        /* --- КАРТОЧКА ЮЗЕРА ТГ --- */
        .user-profile {
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid var(--accent);
            border-radius: 60px;
            padding: 10px 25px;
            display: flex;
            align-items: center;
            gap: 15px;
            backdrop-filter: blur(10px);
            margin-bottom: 10px;
        }

        .avatar-img {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            border: 2px solid white;
            background: #222;
        }

        /* --- КНОПКИ (ТВОЙ МАТОВЫЙ СТИЛЬ) --- */
        .btn-matte {
            background-color: var(--matte-gray);
            border: 3px solid var(--accent);
            border-radius: 24px;
            color: white;
            font-family: 'Rubik One', sans-serif;
            font-size: 20px;
            padding: 24px;
            width: 100%;
            max-width: 340px;
            text-transform: uppercase;
            cursor: pointer;
            box-shadow: 0 12px 0px rgba(0, 0, 0, 0.3), 0 20px 40px rgba(0, 0, 0, 0.5);
            transition: all 0.1s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            letter-spacing: 1px;
        }

        .btn-matte:active {
            transform: translateY(4px);
            box-shadow: 0 4px 0px rgba(0, 0, 0, 0.3);
            background-color: #252529;
        }

        /* --- ИГРОВАЯ КАРТОЧКА (VIP ДИЗАЙН) --- */
        .card-main {
            background: var(--matte-gray);
            border: 5px solid var(--accent);
            border-radius: 40px;
            width: 310px;
            height: 460px;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 35px 20px;
            position: relative;
            box-shadow: 0 0 50px rgba(114, 9, 183, 0.3);
            transition: transform 0.6s;
        }

        .brawler-name-header {
            font-size: 30px;
            height: 40px;
            margin-bottom: 30px;
            text-transform: uppercase;
            text-align: center;
            width: 100%;
            color: #fff;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }

        .spy-alert { color: var(--spy-color); text-shadow: 0 0 15px var(--spy-color); }

        .image-holder {
            width: 230px;
            height: 230px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: radial-gradient(circle, rgba(114, 9, 183, 0.25) 0%, transparent 70%);
            border-radius: 50%;
        }

        .image-holder img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            filter: drop-shadow(0 5px 15px rgba(0,0,0,0.5));
        }

        /* --- НАСТРОЙКИ --- */
        .settings-wrap {
            background: rgba(255, 255, 255, 0.03);
            border-radius: 35px;
            padding: 30px;
            width: 100%;
            max-width: 350px;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .count-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 10px 0;
        }

        .circle-btn {
            width: 55px;
            height: 55px;
            background: var(--accent);
            border: none;
            border-radius: 18px;
            color: white;
            font-family: 'Rubik One', sans-serif;
            font-size: 24px;
            box-shadow: 0 4px 0 #560bad;
        }

        .circle-btn:active { transform: translateY(2px); box-shadow: 0 2px 0 #560bad; }

        /* --- ТАЙМЕР --- */
        .timer-val {
            font-size: 64px;
            color: var(--spy-color);
            text-shadow: 0 0 20px rgba(247, 37, 133, 0.4);
        }

        .small-link {
            margin-top: 20px;
            color: #555;
            text-transform: uppercase;
            font-size: 13px;
            letter-spacing: 2px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="app-container">
        
        <div id="scr-start" class="screen active">
            <h1>BRAWL<br>SPY</h1>
            <div class="user-profile">
                <img id="p-ava" src="" class="avatar-img" style="display:none;">
                <span id="p-name">ИГРОК</span>
            </div>
            <button class="btn-matte" onclick="nav('scr-setup')">ИГРАТЬ</button>
        </div>

        <div id="scr-setup" class="screen">
            <h1>КОМНАТА</h1>
            <div class="settings-wrap">
                <div class="count-row">
                    <span style="font-size: 18px;">ИГРОКИ</span>
                    <div style="display:flex; align-items:center;">
                        <button class="circle-btn" onclick="adjustP(-1)">-</button>
                        <span id="p-label" style="margin: 0 20px; font-size: 28px;">4</span>
                        <button class="circle-btn" onclick="adjustP(1)">+</button>
                    </div>
                </div>
            </div>
            <button class="btn-matte" onclick="prepareGame()">НАЧАТЬ</button>
            <div class="small-link" onclick="nav('scr-start')">назад</div>
        </div>

        <div id="scr-game" class="screen">
            <h1 id="top-title">ИГРОК 1</h1>
            
            <div id="main-card-ui" class="card-main" onclick="reveal()">
                <div id="card-inside" style="width:100%; height:100%; display:flex; flex-direction:column; align-items:center;">
                    <p style="margin-top: 180px; font-size: 14px; color: var(--accent);">КЛИКНИ ПО КАРТЕ</p>
                </div>
            </div>

            <div id="timer-ui" class="timer-val" style="display:none;">05:00</div>
            
            <button class="btn-matte" id="flow-btn" style="display:none;" onclick="nextStep()">СЛЕДУЮЩИЙ</button>
            
            <div class="small-link" onclick="location.reload()">завершить</div>
        </div>

    </div>

    <script>
        // --- ИНИЦИАЛИЗАЦИЯ TG ---
        const tg = window.Telegram.WebApp;
        tg.expand();
        tg.ready();

        let playersCount = 4;
        let gameStep = 0;
        let gameDeck = [];
        
        // --- БАЗА ДАННЫХ БРАВЛЕРОВ (МАССИВНЫЙ БЛОК) ---
        const BRAWLERS_DB = [
            { n: "LEON", i: "https://media.brawltime.ninja/brawlers/leon/portrait.webp" },
            { n: "SHELLY", i: "https://media.brawltime.ninja/brawlers/shelly/portrait.webp" },
            { n: "CROW", i: "https://media.brawltime.ninja/brawlers/crow/portrait.webp" },
            { n: "SPIKE", i: "https://media.brawltime.ninja/brawlers/spike/portrait.webp" },
            { n: "MORTIS", i: "https://media.brawltime.ninja/brawlers/mortis/portrait.webp" },
            { n: "EDGAR", i: "https://media.brawltime.ninja/brawlers/edgar/portrait.webp" },
            { n: "SURGE", i: "https://media.brawltime.ninja/brawlers/surge/portrait.webp" },
            { n: "FANG", i: "https://media.brawltime.ninja/brawlers/fang/portrait.webp" },
            { n: "PIPER", i: "https://media.brawltime.ninja/brawlers/piper/portrait.webp" },
            { n: "STU", i: "https://media.brawltime.ninja/brawlers/stu/portrait.webp" },
            { n: "COLT", i: "https://media.brawltime.ninja/brawlers/colt/portrait.webp" },
            { n: "BUZZ", i: "https://media.brawltime.ninja/brawlers/buzz/portrait.webp" },
            { n: "AMBER", i: "https://media.brawltime.ninja/brawlers/amber/portrait.webp" },
            { n: "CHESTER", i: "https://media.brawltime.ninja/brawlers/chester/portrait.webp" },
            { n: "CORDELIUS", i: "https://media.brawltime.ninja/brawlers/cordelius/portrait.webp" }
        ];

        // --- НАВИГАЦИЯ ---
        function nav(id) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            const target = document.getElementById(id);
            target.classList.add('active');
            tg.HapticFeedback.impactOccurred('light');
        }

        // --- ЛОГИКА НАСТРОЕК ---
        function adjustP(val) {
            playersCount = Math.max(3, Math.min(15, playersCount + val));
            document.getElementById('p-label').innerText = playersCount;
            tg.HapticFeedback.selectionChanged();
        }

        // --- ЗАПУСК ИГРЫ ---
        function prepareGame() {
            gameDeck = [];
            gameStep = 0;
            const roundHero = BRAWLERS_DB[Math.floor(Math.random() * BRAWLERS_DB.length)];
            
            // Наполняем роли
            for (let i = 0; i < playersCount; i++) {
                gameDeck.push({ spy: false, name: roundHero.n, img: roundHero.i });
            }
            
            // Внедряем шпиона
            const spyPos = Math.floor(Math.random() * playersCount);
            gameDeck[spyPos] = { 
                spy: true, 
                name: "ШПИОН", 
                img: "https://cdn-icons-png.flaticon.com/512/1266/1266106.png" 
            };
            
            nav('scr-game');
            refreshCard();
        }

        // --- ИГРОВОЙ ЦИКЛ ---
        function refreshCard() {
            document.getElementById('top-title').innerText = "ИГРОК " + (gameStep + 1);
            document.getElementById('card-inside').innerHTML = `
                <p style="margin-top: 180px; font-size: 14px; color: var(--accent);">КЛИКНИ ПО КАРТЕ</p>
            `;
            document.getElementById('flow-btn').style.display = 'none';
            document.getElementById('main-card-ui').style.display = 'flex';
        }

        function reveal() {
            if(document.getElementById('flow-btn').style.display === 'flex') return;
            
            const currentRole = gameDeck[gameStep];
            const html = `
                <div class="brawler-name-header ${currentRole.spy ? 'spy-alert' : ''}">
                    ${currentRole.name}
                </div>
                <div class="image-holder">
                    <img src="${currentRole.img}" onerror="this.src='https://cdn-icons-png.flaticon.com/512/1266/1266106.png'">
                </div>
            `;
            document.getElementById('card-inside').innerHTML = html;
            document.getElementById('flow-btn').style.display = 'flex';
            tg.HapticFeedback.notificationOccurred('success');
        }

        function nextStep() {
            gameStep++;
            if (gameStep < playersCount) {
                refreshCard();
            } else {
                startTimer();
            }
        }

        // --- ФИНАЛЬНЫЙ ТАЙМЕР ---
        function startTimer() {
            document.getElementById('top-title').innerText = "ОБСУЖДЕНИЕ";
            document.getElementById('main-card-ui').style.display = 'none';
            document.getElementById('timer-ui').style.display = 'block';
            document.getElementById('flow-btn').innerText = "НОВЫЙ РАУНД";
            document.getElementById('flow-btn').onclick = () => location.reload();
            
            let time = 300;
            const clock = setInterval(() => {
                let m = Math.floor(time / 60);
                let s = time % 60;
                document.getElementById('timer-ui').innerText = `${m}:${s < 10 ? '0'+s : s}`;
                if (time <= 0) {
                    clearInterval(clock);
                    tg.HapticFeedback.notificationOccurred('error');
                    document.getElementById('timer-ui').innerText = "ВРЕМЯ!";
                }
                time--;
            }, 1000);
        }

        // --- ПОДТЯГИВАЕМ ЮЗЕРА ---
        window.onload = () => {
            const u = tg.initDataUnsafe?.user;
            if(u) {
                document.getElementById('p-name').innerText = (u.first_name || "ИГРОК").toUpperCase();
                if(u.photo_url) {
                    const ava = document.getElementById('p-ava');
                    ava.src = u.photo_url;
                    ava.style.display = 'block';
                }
            }
        };
    </script>
</body>
</html>
