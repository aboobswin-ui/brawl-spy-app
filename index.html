<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Brawl Spy Ultimate Edition</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Rubik+One&display=swap" rel="stylesheet">
    
    <style>
        /* БАЗОВЫЕ НАСТРОЙКИ */
        * { 
            box-sizing: border-box; 
            -webkit-tap-highlight-color: transparent; 
            margin: 0; 
            padding: 0; 
        }
        
        body {
            background-color: #0A0A0F;
            background-image: radial-gradient(circle at 50% 50%, #1a0b2e 0%, #0A0A0F 100%);
            color: white;
            font-family: 'Rubik One', sans-serif;
            height: 100vh;
            width: 100vw;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            user-select: none;
        }

        .app-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        /* ЭКРАНЫ */
        .screen {
            display: none;
            width: 100%;
            height: 100%;
            flex-direction: column;
            align-items: center;
            justify-content: space-around;
            padding: 30px 0;
        }

        .active { display: flex !important; }

        /* ТЕКСТЫ */
        h1 {
            font-size: 36px;
            text-transform: uppercase;
            text-align: center;
            text-shadow: 0 0 15px rgba(114, 9, 183, 0.7);
        }

        .room-tag {
            background: #7209B7;
            padding: 4px 12px;
            border-radius: 8px;
            font-size: 14px;
            margin-bottom: 10px;
        }

        /* КНОПКИ (ТЕМНО-СЕРЫЙ МАТОВЫЙ) */
        .btn-matte {
            background-color: #1c1c1f; /* Тот самый темно-серый */
            border: 3px solid #7209B7;
            border-radius: 20px;
            color: white;
            font-family: 'Rubik One', sans-serif;
            font-size: 18px;
            padding: 22px;
            width: 100%;
            max-width: 320px;
            text-transform: uppercase;
            cursor: pointer;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.6);
            transition: 0.1s;
            outline: none;
        }

        .btn-matte:active {
            transform: scale(0.95);
            background-color: #252529;
        }

        /* КАРТОЧКА ЮЗЕРА */
        .user-card {
            background: rgba(114, 9, 183, 0.15);
            border: 2px solid #7209B7;
            border-radius: 50px;
            padding: 10px 20px;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .user-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: 2px solid white;
            object-fit: cover;
        }

        /* НАСТРОЙКИ КОМНАТЫ */
        .settings-card {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 25px;
            padding: 20px;
            width: 100%;
            max-width: 320px;
            border: 1px solid rgba(114, 9, 183, 0.3);
        }

        .setting-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 15px 0;
        }

        .counter-btn {
            width: 45px;
            height: 45px;
            background: #560bad;
            border: none;
            border-radius: 12px;
            color: white;
            font-family: 'Rubik One', sans-serif;
            font-size: 20px;
        }

        /* ИГРОВАЯ КАРТА */
        .game-card {
            background: #1c1c1f;
            border: 4px solid #7209B7;
            border-radius: 30px;
            width: 280px;
            height: 380px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px;
            box-shadow: 0 0 30px rgba(114, 9, 183, 0.3);
        }

        .timer {
            font-size: 48px;
            color: #f72585;
            text-shadow: 0 0 10px rgba(247, 37, 133, 0.5);
        }

        .back-btn {
            color: #555;
            text-transform: uppercase;
            font-size: 12px;
            margin-top: 10px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="app-container">
        
        <div id="scr-start" class="screen active">
            <h1>BRAWL SPY</h1>
            <div class="user-card">
                <img id="u-avatar" src="https://cdn-icons-png.flaticon.com/512/847/847969.png" class="user-avatar">
                <span id="u-name">ИГРОК</span>
            </div>
            <button class="btn-matte" onclick="nav('scr-menu')">ИГРАТЬ</button>
        </div>

        <div id="scr-menu" class="screen">
            <h1>МЕНЮ</h1>
            <div style="width:100%; display:flex; flex-direction:column; align-items:center; gap:20px;">
                <button class="btn-matte" onclick="initRoom()">СОЗДАТЬ КОМНАТУ</button>
                <button class="btn-matte" onclick="inviteFriend()">ПРИГЛАСИТЬ ДРУГА</button>
            </div>
            <div class="back-btn" onclick="nav('scr-start')">назад</div>
        </div>

        <div id="scr-lobby" class="screen">
            <div class="room-tag" id="room-id-display">ID: #0000</div>
            <h1>КОМНАТА</h1>
            <div class="settings-card">
                <div class="setting-row">
                    <span>ИГРОКИ</span>
                    <div>
                        <button class="counter-btn" onclick="changeVal('p', -1)">-</button>
                        <span id="val-p" style="margin: 0 15px;">4</span>
                        <button class="counter-btn" onclick="changeVal('p', 1)">+</button>
                    </div>
                </div>
                <div class="setting-row">
                    <span>ШПИОНЫ</span>
                    <div>
                        <button class="counter-btn" onclick="changeVal('s', -1)">-</button>
                        <span id="val-s" style="margin: 0 15px;">1</span>
                        <button class="counter-btn" onclick="changeVal('s', 1)">+</button>
                    </div>
                </div>
            </div>
            <button class="btn-matte" onclick="startProcess()">СТАРТ</button>
            <div class="back-btn" onclick="nav('scr-menu')">выйти</div>
        </div>

        <div id="scr-game" class="screen">
            <h1 id="game-title">КТО ТЫ?</h1>
            <div id="main-card" class="game-card" onclick="toggleCard()">
                <div id="card-content">
                    <p style="font-size: 14px; color: #7209B7;">НАЖМИ, ЧТОБЫ УЗНАТЬ РОЛЬ</p>
                </div>
            </div>
            <div id="game-timer" class="timer" style="display:none;">05:00</div>
            <button class="btn-matte" id="btn-next" style="display:none;" onclick="nextStep()">СЛЕДУЮЩИЙ</button>
            <div class="back-btn" onclick="location.reload()">закончить</div>
        </div>

    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        let config = { players: 4, spies: 1, current: 0, roomId: 0 };
        let gameRoles = [];
        const locs = ["ШКОЛА", "БОЛЬНИЦА", "БАЗАР", "КОСМОС", "ОКЕАН", "БАНК", "ЦИРК", "ЗАВОД"];

        function nav(id) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            tg.HapticFeedback.impactOccurred('medium');
        }

        function initRoom() {
            config.roomId = Math.floor(1000 + Math.random() * 9000);
            document.getElementById('room-id-display').innerText = "ID: #" + config.roomId;
            nav('scr-lobby');
        }

        function changeVal(type, delta) {
            if(type === 'p') {
                config.players = Math.max(3, Math.min(15, config.players + delta));
                document.getElementById('val-p').innerText = config.players;
            } else {
                config.spies = Math.max(1, Math.min(config.players - 1, config.spies + delta));
                document.getElementById('val-s').innerText = config.spies;
            }
            tg.HapticFeedback.selectionChanged();
        }

        function inviteFriend() {
            const text = `Заходи в мою комнату #${config.roomId || '...'} в Brawl Spy!`;
            tg.switchInlineQuery(text);
        }

        function startProcess() {
            gameRoles = [];
            let chosenLoc = locs[Math.floor(Math.random() * locs.length)];
            for(let i=0; i<config.players; i++) gameRoles.push(chosenLoc);
            for(let i=0; i<config.spies; i++) gameRoles[i] = "ШПИОН 🕵️";
            gameRoles.sort(() => Math.random() - 0.5);
            
            config.current = 0;
            nav('scr-game');
            resetCardUI();
        }

        function resetCardUI() {
            document.getElementById('card-content').innerHTML = '<p>КЛАТЦ!</p>';
            document.getElementById('btn-next').style.display = 'none';
            document.getElementById('main-card').style.filter = 'none';
        }

        function toggleCard() {
            document.getElementById('card-content').innerHTML = `<h2>${gameRoles[config.current]}</h2>`;
            document.getElementById('btn-next').style.display = 'block';
            tg.HapticFeedback.notificationOccurred('success');
        }

        function nextStep() {
            config.current++;
            if(config.current < config.players) {
                resetCardUI();
            } else {
                startTimer();
            }
        }

        function startTimer() {
            document.getElementById('game-title').innerText = "ИГРАЕМ
