<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>BRAWL STARS: SPY EDITION</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Rubik+One&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #050508;
            --panel: #121217;
            --primary: #7209B7;
            --accent: #F72585; /* Красный неон */
            --neon-blue: #4CC9F0;
            --text: #FFFFFF;
            --glass: rgba(255, 255, 255, 0.05);
        }

        * { 
            box-sizing: border-box; 
            margin: 0; 
            padding: 0; 
            user-select: none; 
            font-family: 'Rubik One', sans-serif; 
            -webkit-tap-highlight-color: transparent;
        }
        
        body { 
            background-color: var(--bg); 
            color: var(--text); 
            height: 100vh; 
            overflow: hidden; 
            display: flex; 
            flex-direction: column; 
        }

        /* АНИМАЦИЯ НЕОНА */
        @keyframes neonPulse {
            from { text-shadow: 0 0 10px var(--accent), 0 0 20px var(--accent); }
            to { text-shadow: 0 0 20px var(--accent), 0 0 40px var(--accent), 0 0 60px var(--accent); }
        }

        /* ШАПКА ПРОФИЛЯ */
        .user-bar {
            width: 90%;
            margin: 20px auto 10px;
            display: flex;
            align-items: center;
            gap: 15px;
            background: var(--panel);
            padding: 12px 20px;
            border-radius: 20px;
            border: 1px solid var(--primary);
            box-shadow: 0 0 15px rgba(114, 9, 183, 0.2);
        }
        .user-avatar { 
            width: 45px; 
            height: 45px; 
            border-radius: 50%; 
            border: 2px solid var(--neon-blue);
            object-fit: cover;
        }
        .user-info span { font-size: 16px; color: var(--neon-blue); display: block; }

        /* ЭКРАНЫ */
        .screen { 
            display: none; 
            width: 100%; 
            height: 100%; 
            flex-direction: column; 
            align-items: center; 
            padding: 20px 25px; 
            overflow-y: auto;
        }
        .screen.active { display: flex; }

        /* ЗАГОЛОВКИ */
        .main-header { text-align: center; margin: 40px 0; }
        .title-spy { 
            font-size: 75px; 
            color: #FFF; 
            text-transform: uppercase;
            animation: neonPulse 1.5s infinite alternate;
            line-height: 0.8;
        }
        .title-edition { 
            font-size: 32px; 
            color: var(--accent); 
            margin-top: 10px;
        }
        .title-edition span { 
            font-size: 18px; 
            color: #fff; 
            opacity: 0.6; 
            display: block; 
            text-transform: lowercase; 
        }

        /* КНОПКИ */
        .btn-group { width: 100%; max-width: 340px; display: flex; flex-direction: column; gap: 15px; }
        
        .btn-neon {
            width: 100%;
            padding: 22px;
            border-radius: 25px;
            border: none;
            font-size: 22px;
            color: white;
            text-transform: uppercase;
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 6px 0 rgba(0,0,0,0.3);
        }
        .btn-purple { background: var(--primary); box-shadow: 0 6px 0 #4a0577; }
        .btn-purple:active { transform: translateY(4px); box-shadow: 0 2px 0 #4a0577; }
        
        .btn-outline { 
            background: transparent; 
            border: 2px solid var(--neon-blue); 
            box-shadow: inset 0 0 10px var(--neon-blue), 0 0 10px var(--neon-blue);
        }

        .btn-back { 
            align-self: flex-start; 
            background: none; 
            border: none; 
            color: var(--accent); 
            font-size: 18px; 
            margin-bottom: 20px;
        }

        /* ИНПУТЫ И ЛОББИ */
        .input-room {
            width: 100%;
            max-width: 280px;
            padding: 20px;
            background: var(--panel);
            border: 3px solid var(--primary);
            border-radius: 20px;
            color: #fff;
            font-size: 40px;
            text-align: center;
            margin: 20px 0;
            outline: none;
        }

        .lobby-card {
            width: 100%;
            background: var(--panel);
            border-radius: 25px;
            padding: 20px;
            border: 1px solid var(--glass);
            margin-bottom: 20px;
        }
        .player-row {
            display: flex;
            justify-content: space-between;
            padding: 12px 0;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }
        .player-row:last-child { border: none; }
        .status-ready { color: var(--neon-blue); font-size: 14px; }

        /* КАРТА И ТАЙМЕР */
        .card-container { width: 300px; height: 420px; perspective: 1200px; margin: 20px 0; }
        .card-inner { position: relative; width: 100%; height: 100%; transition: transform 0.6s; transform-style: preserve-3d; }
        .card-inner.flipped { transform: rotateY(180deg); }
        .card-face { 
            position: absolute; width: 100%; height: 100%; 
            backface-visibility: hidden; border-radius: 40px; 
            border: 8px solid var(--primary); display: flex; 
            flex-direction: column; align-items: center; justify-content: center;
            background: var(--panel);
        }
        .card-back { transform: rotateY(180deg); background: #fff; color: #000; border-color: var(--accent); }
        .brawler-img { width: 230px; height: 230px; object-fit: contain; }
        
        #timer-val { font-size: 80px; color: var(--accent); text-shadow: 0 0 15px var(--accent); }

    </style>
</head>
<body>

    <div class="user-bar">
        <img id="user-pic" class="user-avatar" src="https://cdn-icons-png.flaticon.com/512/149/149071.png">
        <div class="user-info">
            <span id="user-nick">ЗАГРУЗКА...</span>
        </div>
    </div>

    <div id="scr-menu" class="screen active">
        <div class="main-header">
            <h1 class="title-spy">ШПИОН</h1>
            <h2 class="title-edition">BRAWL STARS <span>edition</span></h2>
        </div>
        <div class="btn-group">
            <button class="btn-neon btn-purple" onclick="createRoom()">Создать комнату</button>
            <button class="btn-neon btn-outline" onclick="nav('scr-join')">Поиск по коду</button>
            <button class="btn-neon" style="background: #0088cc;" onclick="invite()">Пригласить друга</button>
        </div>
    </div>

    <div id="scr-join" class="screen">
        <button class="btn-back" onclick="nav('scr-menu')">← НАЗАД</button>
        <h1>ВВЕДИТЕ КОД</h1>
        <input type="number" class="input-room" placeholder="0000" id="room-input">
        <button class="btn-neon btn-purple" onclick="alert('Комната не найдена')">ВОЙТИ</button>
    </div>

    <div id="scr-lobby" class="screen">
        <button class="btn-back" onclick="nav('scr-menu')">← ВЫЙТИ</button>
        <h2 style="color: var(--neon-blue)">КОД: <span id="display-code">----</span></h2>
        <div class="lobby-card">
            <div class="player-row"><p id="p1-name">Ты</p><span class="status-ready">АДМИН</span></div>
            <div class="player-row"><p>Leon_Killer</p><span class="status-ready">ГОТОВ</span></div>
            <div class="player-row"><p>Brawl_King</p><span class="status-ready">...</span></div>
        </div>
        <p style="opacity: 0.5; margin-bottom: 20px;">Ожидание игроков (3/10)</p>
        <button class="btn-neon btn-purple" onclick="startGame()">НАЧАТЬ ИГРУ</button>
    </div>

    <div id="scr-game" class="screen">
        <h3 id="player-turn" style="color: var(--neon-blue)">ИГРОК 1</h3>
        <div class="card-container" onclick="flipCard()">
            <div id="card-obj" class="card-inner">
                <div class="card-face">
                    <h1 style="font-size: 120px; color: var(--primary);">?</h1>
                </div>
                <div class="card-face card-back" id="role-content">
                    </div>
            </div>
        </div>
        <div id="game-ui" style="display:none; text-align: center;">
            <div id="timer-val">05:00</div>
            <p>КТО ШПИОН?</p>
        </div>
        <button id="btn-next" class="btn-neon btn-purple" style="visibility:hidden;" onclick="nextStep()">ДАЛЕЕ</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        const BRAWLERS = [
            { n: "ЛЕОН", i: "https://cdn.brawlstats.com/character-arts/16000017.png" },
            { n: "ШЕЛЛИ", i: "https://cdn.brawlstats.com/character-arts/16000000.png" },
            { n: "СПАЙК", i: "https://cdn.brawlstats.com/character-arts/16000007.png" },
            { n: "КРОУ", i: "https://cdn.brawlstats.com/character-arts/16000008.png" },
            { n: "МОРТИС", i: "https://cdn.brawlstats.com/character-arts/16000014.png" },
            { n: "ЭДГАР", i: "https://cdn.brawlstats.com/character-arts/16000042.png" }
        ];

        let game = { code: 0, p: 3, cur: 0, roles: [], flipped: false, timer: 300 };

        window.onload = () => {
            const user = tg.initDataUnsafe?.user;
            if(user) {
                document.getElementById('user-nick').innerText = user.first_name;
                document.getElementById('p1-name').innerText = user.first_name + " (Ты)";
                if(user.photo_url) document.getElementById('user-pic').src = user.photo_url;
            } else {
                document.getElementById('user-nick').innerText = "BRAWLER_TEST";
            }
            tg.ready();
        };

        function nav(id) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            tg.HapticFeedback.impactOccurred('medium');
        }

        function createRoom() {
            game.code = Math.floor(1000 + Math.random() * 8999);
            document.getElementById('display-code').innerText = game.code;
            nav('scr-lobby');
        }

        function invite() {
            tg.switchInlineQuery("Заходи в Шпиона! Код комнаты: " + game.code);
        }

        function startGame() {
            game.cur = 0; game.roles = []; game.flipped = false;
            let spyIdx = Math.floor(Math.random() * game.p);
            let brawler = BRAWLERS[Math.floor(Math.random() * BRAWLERS.length)];
            
            for(let i=0; i<game.p; i++) {
                game.roles.push(i === spyIdx ? {n: "ШПИОН", i: "https://cdn-icons-png.flaticon.com/512/953/953791.png"} : brawler);
            }
            nav('scr-game');
            updateGameUI();
        }

        function flipCard() {
            if(game.flipped) return;
            const role = game.roles[game.cur];
            document.getElementById('role-content').innerHTML = `
                <h2 style="font-size:30px; margin-bottom:10px;">${role.n}</h2>
                <img src="${role.i}" class="brawler-img">
            `;
            document.getElementById('card-obj').classList.add('flipped');
            document.getElementById('btn-next').style.visibility = 'visible';
            game.flipped = true;
            tg.HapticFeedback.impactOccurred('heavy');
        }

        function nextStep() {
            game.cur++;
            if(game.cur < game.p) {
                game.flipped = false;
                document.getElementById('card-obj').classList.remove('flipped');
                document.getElementById('btn-next').style.visibility = 'hidden';
                setTimeout(updateGameUI, 300);
            } else {
                runTimer();
            }
        }

        function updateGameUI() {
            document.getElementById('player-turn').innerText = "ИГРОК " + (game.cur + 1);
        }

        function runTimer() {
            document.getElementById('card-obj').parentElement.style.display = 'none';
            document.getElementById('btn-next').style.display = 'none';
            document.getElementById('game-ui').style.display = 'block';
            document.getElementById('player-turn').innerText = "ОБСУЖДЕНИЕ";

            let timerId = setInterval(() => {
                game.timer--;
                let m = Math.floor(game.timer / 60);
                let s = game.timer % 60;
                document.getElementById('timer-val').innerText = `${m}:${s < 10 ? '0'+s : s}`;
                if(game.timer <= 0) {
                    clearInterval(timerId);
                    tg.HapticFeedback.notificationOccurred('error');
                    tg.showAlert("ВРЕМЯ ВЫШЛО! КТО ШПИОН?");
                }
            }, 1000);
        }
    </script>
</body>
</html>
