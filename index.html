<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>BRAWL STARS: SPY EDITION ULTIMATE</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Black+Ops+One&family=Rubik+One&family=Exo+2:wght@700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #050508;
            --panel: #0a0a0c;
            --neon-blue: #4CC9F0;
            --neon-red: #FF0000;
            --text: #FFFFFF;
            --gold: #ffcc00;
        }

        * { 
            box-sizing: border-box; 
            margin: 0; padding: 0; 
            user-select: none; 
            -webkit-tap-highlight-color: transparent;
        }
        
        body { 
            background-color: var(--bg); 
            color: var(--text); 
            height: 100vh; 
            overflow: hidden; 
            display: flex; 
            flex-direction: column; 
            font-family: 'Rubik One', sans-serif;
        }

        /* --- ПУНКТ 9,10: ТГ ЮЗЕР БАР (ИДЕАЛЬНЫЙ НЕОН) --- */
        .user-bar {
            width: 90%;
            margin: 20px auto;
            display: flex;
            align-items: center;
            gap: 15px;
            background: rgba(0, 0, 0, 0.8);
            padding: 12px 18px;
            border-radius: 50px;
            border: 2px solid var(--neon-blue);
            box-shadow: 0 0 15px var(--neon-blue), inset 0 0 8px var(--neon-blue);
        }
        .user-avatar { 
            width: 42px; height: 42px; 
            border-radius: 50%; 
            border: 2px solid var(--neon-blue);
            box-shadow: 0 0 10px var(--neon-blue);
            object-fit: cover;
        }
        .user-info span { 
            font-family: 'Exo 2', sans-serif;
            font-weight: 900;
            font-size: 18px; 
            color: var(--neon-blue); 
            text-transform: uppercase;
            letter-spacing: 1.5px;
            text-shadow: 0 0 5px var(--neon-blue);
        }

        .screen { 
            display: none; 
            width: 100%; height: 100%; 
            flex-direction: column; 
            align-items: center; 
            padding: 10px 25px; 
            position: relative;
        }
        .screen.active { display: flex; }

        /* --- ПУНКТ 1,2,3: ЗАГОЛОВОК ШПИОН --- */
        .title-spy { 
            font-size: 70px; 
            color: #FFF; 
            text-transform: uppercase;
            text-shadow: 0 0 5px var(--neon-red), 0 0 15px var(--neon-red); /* Узкое алое свечение */
            line-height: 1;
            margin-top: 10px;
            z-index: 10;
        }

        /* --- ПУНКТ 4,5: BRAWL STARS EDITION --- */
        .title-bs {
            font-family: 'Black Ops One', cursive;
            font-size: 32px;
            color: var(--gold);
            text-shadow: 3px 3px 0 #000;
            margin-top: 5px;
        }
        .title-edition {
            font-family: 'Exo 2', sans-serif;
            font-size: 18px;
            color: #FFFFFF;
            letter-spacing: 6px;
            text-transform: uppercase;
            margin-top: -2px;
            font-weight: 700;
        }

        /* --- ПУНКТ 6,7: КНОПКИ НЕОН --- */
        .btn-group { width: 100%; max-width: 320px; margin-top: auto; margin-bottom: 40px; display: flex; flex-direction: column; gap: 18px; }
        
        .btn-neon-blue {
            width: 100%;
            padding: 20px;
            border-radius: 18px;
            background: #000;
            border: 2px solid var(--neon-blue);
            color: var(--neon-blue);
            font-size: 19px;
            text-transform: uppercase;
            font-family: 'Exo 2', sans-serif;
            font-weight: 900;
            box-shadow: 0 0 15px var(--neon-blue), inset 0 0 10px var(--neon-blue);
            cursor: pointer;
            transition: 0.2s;
        }
        .btn-neon-blue:active {
            transform: scale(0.97);
            box-shadow: 0 0 30px var(--neon-blue);
        }

        /* Кнопка Назад (Пункт 2 - Поиск) */
        .btn-back { 
            position: absolute; top: 10px; left: 20px;
            background: none; border: none; 
            color: #ff4444; 
            font-family: 'Exo 2', sans-serif;
            font-size: 16px; font-weight: 900;
            text-transform: uppercase;
            cursor: pointer;
        }

        /* --- ПУНКТ 3,4: ИНПУТ И РАМКА АЙДИ --- */
        .input-box {
            width: 100%; max-width: 280px;
            padding: 18px;
            background: transparent;
            border: 2px solid var(--neon-blue);
            border-radius: 15px;
            color: var(--neon-blue);
            font-size: 35px;
            text-align: center;
            margin: 40px 0;
            outline: none;
            box-shadow: 0 0 15px var(--neon-blue), inset 0 0 10px var(--neon-blue);
            font-family: 'Rubik One';
        }

        .room-id-box {
            font-size: 45px;
            color: var(--neon-blue);
            border: 3px solid var(--neon-blue);
            padding: 15px 40px;
            border-radius: 20px;
            box-shadow: 0 0 20px var(--neon-blue), inset 0 0 10px var(--neon-blue);
            margin: 30px 0;
            font-family: 'Black Ops One';
        }

        /* ЛОББИ СПИСОК */
        .lobby-list {
            width: 100%;
            background: rgba(76, 201, 240, 0.05);
            border-radius: 25px;
            padding: 25px;
            border: 1px solid rgba(76, 201, 240, 0.3);
            margin-bottom: 20px;
        }
        .player-slot {
            display: flex; justify-content: space-between;
            padding: 12px 0; border-bottom: 1px solid rgba(76, 201, 240, 0.1);
            font-family: 'Exo 2'; color: #fff;
        }

        /* КАРТА 3D */
        .card-wrap { width: 300px; height: 420px; perspective: 1200px; margin: 20px 0; }
        .card-inner { position: relative; width: 100%; height: 100%; transition: transform 0.7s cubic-bezier(0.175, 0.885, 0.32, 1.275); transform-style: preserve-3d; }
        .card-inner.flipped { transform: rotateY(180deg); }
        .card-side { 
            position: absolute; width: 100%; height: 100%; 
            backface-visibility: hidden; border-radius: 40px; 
            border: 8px solid var(--neon-blue); display: flex; 
            flex-direction: column; align-items: center; justify-content: center;
            background: #0a0a0c; box-shadow: 0 0 20px var(--neon-blue);
        }
        .card-front { transform: rotateY(180deg); background: #fff; color: #000; border-color: var(--neon-red); box-shadow: 0 0 20px var(--neon-red); }
        .brawler-img { width: 240px; height: 240px; object-fit: contain; }

        #timer-display { font-size: 85px; color: var(--neon-red); text-shadow: 0 0 20px var(--neon-red); font-family: 'Black Ops One'; }
    </style>
</head>
<body>

    <div id="top-bar" class="user-bar">
        <img id="u-pic" class="user-avatar" src="https://cdn-icons-png.flaticon.com/512/149/149071.png">
        <div class="user-info">
            <span id="u-nick">ЗАГРУЗКА...</span>
        </div>
    </div>

    <div id="scr-menu" class="screen active">
        <h1 class="title-spy">ШПИОН</h1>
        <h2 class="title-bs">BRAWL STARS</h2>
        <p class="title-edition">edition</p>

        <div class="btn-group">
            <button class="btn-neon-blue" onclick="createRoom()">Создать комнату</button>
            <button class="btn-neon-blue" onclick="nav('scr-join')">Поиск по коду</button>
        </div>
    </div>

    <div id="scr-join" class="screen">
        <button class="btn-back" onclick="nav('scr-menu')">← НАЗАД</button>
        <h2 style="font-family: 'Exo 2'; margin-top: 60px; letter-spacing: 2px;">ВВЕДИТЕ ID</h2>
        <input type="number" class="input-box" placeholder="0000" id="room-input">
        <button class="btn-neon-blue" onclick="alert('Комната не найдена')">Войти</button>
    </div>

    <div id="scr-lobby" class="screen">
        <button class="btn-back" onclick="nav('scr-menu')">← ВЫЙТИ</button>
        <div class="room-id-box" id="room-code-display">0000</div>
        
        <div class="lobby-list">
            <div class="player-slot"><p id="me-name">Ты</p> <span style="color:var(--neon-blue)">HOST</span></div>
            <div class="player-slot"><p>Leon_Pro</p> <span style="color:var(--neon-blue)">READY</span></div>
            <div class="player-slot"><p>Bot_Silent</p> <span style="color:#555">WAIT...</span></div>
        </div>

        <div class="btn-group" style="margin-bottom: 20px;">
            <button class="btn-neon-blue" style="border-color: #0088cc; color: #0088cc; box-shadow: 0 0 15px #0088cc;" onclick="invite()">Пригласить друга</button>
            <button class="btn-neon-blue" onclick="startGameplay()">Начать игру</button>
        </div>
    </div>

    <div id="scr-game" class="screen">
        <h3 id="turn-label" style="color: var(--neon-blue); margin-top: 20px; font-family: 'Exo 2';">ИГРОК 1</h3>
        
        <div class="card-wrap" onclick="flipCard()">
            <div id="card-obj" class="card-inner">
                <div class="card-side">
                    <h1 style="font-size: 120px; color: var(--neon-blue); text-shadow: 0 0 20px var(--neon-blue);">?</h1>
                </div>
                <div class="card-side card-front" id="role-card-ui">
                    </div>
            </div>
        </div>

        <div id="timer-ui" style="display:none; text-align:center;">
            <div id="timer-display">05:00</div>
            <p style="font-family: 'Exo 2'; letter-spacing: 3px;">КТО ПРЕДАТЕЛЬ?</p>
        </div>

        <button id="btn-next" class="btn-neon-blue" style="visibility:hidden; margin-top: auto; margin-bottom: 40px;" onclick="nextPlayer()">ДАЛЕЕ</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        const BRAWLERS = [
            { n: "ШЕЛЛИ", i: "https://cdn.brawlstats.com/character-arts/16000000.png" },
            { n: "КОЛЬТ", i: "https://cdn.brawlstats.com/character-arts/16000001.png" },
            { n: "БУЛЛ", i: "https://cdn.brawlstats.com/character-arts/16000002.png" },
            { n: "СПАЙК", i: "https://cdn.brawlstats.com/character-arts/16000007.png" },
            { n: "КРОУ", i: "https://cdn.brawlstats.com/character-arts/16000008.png" },
            { n: "ЛЕОН", i: "https://cdn.brawlstats.com/character-arts/16000017.png" },
            { n: "МОРТИС", i: "https://cdn.brawlstats.com/character-arts/16000014.png" },
            { n: "ЭДГАР", i: "https://cdn.brawlstats.com/character-arts/16000042.png" },
            { n: "ФРЭНК", i: "https://cdn.brawlstats.com/character-arts/16000020.png" },
            { n: "РИКО", i: "https://cdn.brawlstats.com/character-arts/16000003.png" }
        ];

        let state = { code: 0, p: 3, cur: 0, roles: [], isFlipped: false, time: 300 };

        window.onload = () => {
            const user = tg.initDataUnsafe?.user;
            if(user) {
                document.getElementById('u-nick').innerText = user.first_name;
                document.getElementById('me-name').innerText = user.first_name + " (Ты)";
                if(user.photo_url) document.getElementById('u-pic').src = user.photo_url;
            } else {
                document.getElementById('u-nick').innerText = "GUEST_BRAWLER";
            }
            tg.ready();
        };

        function nav(id) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            
            // Пункт 2 (Лобби): Убираем ТГ юз
            document.getElementById('top-bar').style.display = (id === 'scr-lobby' || id === 'scr-game') ? 'none' : 'flex';
            tg.HapticFeedback.impactOccurred('medium');
        }

        function createRoom() {
            state.code = Math.floor(1000 + Math.random() * 9000);
            document.getElementById('room-code-display').innerText = state.code;
            nav('scr-lobby');
        }

        function invite() {
            tg.switchInlineQuery("Заходи в Шпиона! Код: " + state.code);
        }

        function startGameplay() {
            state.cur = 0; state.roles = []; state.isFlipped = false;
            let spyIdx = Math.floor(Math.random() * state.p);
            let brawler = BRAWLERS[Math.floor(Math.random() * BRAWLERS.length)];
            
            for(let i=0; i<state.p; i++) {
                state.roles.push(i === spyIdx ? {n: "ШПИОН", i: "https://cdn-icons-png.flaticon.com/512/953/953791.png"} : brawler);
            }
            nav('scr-game');
            updateTurn();
        }

        function flipCard() {
            if(state.isFlipped) return;
            const role = state.roles[state.cur];
            document.getElementById('role-card-ui').innerHTML = `
                <h2 style="font-family:'Exo 2'; font-size:32px; margin-bottom:10px;">${role.n}</h2>
                <img src="${role.i}" class="brawler-img">
            `;
            document.getElementById('card-obj').classList.add('flipped');
            document.getElementById('btn-next').style.visibility = 'visible';
            state.isFlipped = true;
            tg.HapticFeedback.impactOccurred('heavy');
        }

        function nextPlayer() {
            state.cur++;
            if(state.cur < state.p) {
                state.isFlipped = false;
                document.getElementById('card-obj').classList.remove('flipped');
                document.getElementById('btn-next').style.visibility = 'hidden';
                setTimeout(updateTurn, 300);
            } else {
                startTimer();
            }
        }

        function updateTurn() {
            document.getElementById('turn-label').innerText = "ИГРОК " + (state.cur + 1);
        }

        function startTimer() {
            document.getElementById('card-obj').parentElement.style.display = 'none';
            document.getElementById('btn-next').style.display = 'none';
            document.getElementById('timer-ui').style.display = 'block';
            document.getElementById('turn-label').innerText = "ОБСУЖДЕНИЕ";

            let timerId = setInterval(() => {
                state.time--;
                let m = Math.floor(state.time / 60);
                let s = state.time % 60;
                document.getElementById('timer-display').innerText = `${m}:${s < 10 ? '0'+s : s}`;
                if(state.time <= 0) {
                    clearInterval(timerId);
                    tg.HapticFeedback.notificationOccurred('error');
                    tg.showAlert("ВРЕМЯ ВЫШЛО!");
                }
            }, 1000);
        }
    </script>
</body>
</html>
