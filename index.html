<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>BRAWL SPY 2026 - ULTIMATE MONOLITH</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Black+Ops+One&family=Luckiest+Guy&family=Exo+2:wght@900&display=swap" rel="stylesheet">
    
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>
        /* --- ГЛОБАЛЬНЫЕ НАСТРОЙКИ --- */
        :root {
            --neon-red: #ff3131;
            --neon-blue: #00d2ff;
            --neon-gold: #ffd700;
            --white: #ffffff;
            --bg-black: #010103;
            /* Шрифты */
            --font-supercell: 'Luckiest Guy', cursive; /* Аналог KZ Supercell-Magic */
            --font-ops: 'Black Ops One', cursive;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        body {
            background-color: var(--bg-black);
            color: var(--white);
            height: 100vh;
            width: 100vw;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
            font-family: var(--font-ops);
        }

        /* ГЛАВНЫЙ КОНТЕЙНЕР (ЦЕНТРОВКА) */
        .app-shell {
            width: 100%;
            max-width: 440px;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            padding: 20px;
            z-index: 10;
        }

        /* --- EDITION 2026 (ТВОЙ ИДЕАЛ) --- */
        .ed-2026-label {
            position: absolute;
            top: 30px;
            right: 25px;
            font-size: 16px;
            color: var(--white);
            text-shadow: 0 0 10px var(--white), 0 0 20px rgba(255,255,255,0.5);
            z-index: 1000;
        }

        /* --- БЛОК ЛОГОТИПА (ШПИОН + BRAWL STARS) --- */
        .logo-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 50px;
            width: 100%;
        }

        /* ШПИОН - КРАСНЫЙ НЕОН (SUPERCELL MAGIC) */
        .title-spy {
            font-family: var(--font-supercell);
            font-size: 82px;
            color: var(--neon-red);
            text-transform: uppercase;
            line-height: 1;
            text-shadow: 0 0 15px var(--neon-red), 0 0 30px rgba(255, 49, 49, 0.6);
            margin-bottom: 5px;
        }

        /* ГРУППА BRAWL STARS */
        .bs-group {
            display: flex;
            align-items: baseline;
            gap: 10px;
            font-family: var(--font-ops); /* Как у Edition 2026 */
        }

        .txt-brawl {
            font-size: 24px;
            color: var(--white);
            text-shadow: 0 0 10px var(--white);
            text-transform: uppercase;
        }

        .txt-stars {
            font-size: 48px;
            color: var(--neon-red);
            text-shadow: 0 0 15px var(--neon-red);
            text-transform: uppercase;
        }

        /* --- ЭКРАНЫ ПРИЛОЖЕНИЯ --- */
        .screen {
            position: absolute;
            inset: 0;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px;
            background: var(--bg-black);
        }

        .screen.active {
            display: flex;
            animation: screenFade 0.3s ease-out;
        }

        @keyframes screenFade {
            from { opacity: 0; transform: scale(0.98); }
            to { opacity: 1; transform: scale(1); }
        }

        /* --- КНОПКИ --- */
        .btn-stack {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        .main-btn {
            width: 100%;
            padding: 22px 0;
            background: rgba(0,0,0,0.5);
            border: 3px solid var(--neon-blue);
            box-shadow: 0 0 15px var(--neon-blue);
            border-radius: 15px;
            color: var(--white);
            font-size: 20px;
            text-transform: uppercase;
            cursor: pointer;
            transition: 0.2s;
        }

        .main-btn:active { transform: scale(0.96); box-shadow: 0 0 25px var(--neon-blue); }

        /* КНОПКА №6: СОЗДАТЬ КОМНАТУ (БЕЛЫЙ ТЕКСТ + ЗОЛОТО) */
        .btn-create-lobby {
            border-color: var(--neon-gold);
            box-shadow: 0 0 20px var(--neon-gold);
            color: var(--white) !important;
        }

        .btn-back {
            border-color: #333;
            color: #555;
            box-shadow: none;
            margin-top: 10px;
        }

        /* --- НАСТРОЙКИ --- */
        .section-header {
            font-size: 26px;
            color: var(--white);
            text-shadow: 0 0 10px var(--white);
            margin-bottom: 35px;
            text-transform: uppercase;
        }

        .tabs-row {
            display: flex;
            width: 100%;
            gap: 10px;
            margin-bottom: 30px;
        }

        .tab-btn {
            flex: 1;
            padding: 15px 0;
            border: 2px solid;
            border-radius: 10px;
            font-size: 14px;
            text-align: center;
        }

        .tab-blue { border-color: var(--neon-blue); color: var(--neon-blue); text-shadow: 0 0 5px var(--neon-blue); }
        .tab-red { border-color: var(--neon-red); color: var(--neon-red); text-shadow: 0 0 5px var(--neon-red); }

        /* ВХОД ПО ID (БЕЛЫЙ НЕОН) */
        .id-input-wrap {
            display: flex;
            gap: 10px;
            margin: 40px 0;
        }

        .id-slot {
            font-size: 40px;
            width: 30px;
            border-bottom: 4px solid var(--white);
            color: var(--white);
            text-shadow: 0 0 15px var(--white);
            text-align: center;
        }

        /* ЛОББИ */
        .tg-user-tag {
            border: 2px solid var(--neon-blue);
            box-shadow: 0 0 15px var(--neon-blue);
            padding: 10px 30px;
            border-radius: 50px;
            color: var(--neon-blue);
            margin-bottom: 40px;
        }
    </style>
</head>
<body>

    <div class="ed-2026-label">EDITION 2026</div>

    <div class="app-shell">
        
        <div id="scr-menu" class="screen active">
            <div class="logo-container">
                <div class="title-spy">ШПИОН</div>
                <div class="bs-group">
                    <span class="txt-brawl">BRAWL</span>
                    <span class="txt-stars">STARS</span>
                </div>
            </div>
            
            <div class="btn-stack">
                <button class="main-btn" onclick="nav('scr-setup')">СОЗДАТЬ ЛОББИ</button>
                <button class="main-btn" onclick="nav('scr-join')">ВХОД ПО ID</button>
                <button class="main-btn btn-back" onclick="tg.close()">ВЫХОД</button>
            </div>
        </div>

        <div id="scr-setup" class="screen">
            <h2 class="section-header">НАСТРОЙКА ЛОББИ</h2>
            
            <div class="tabs-row">
                <div class="tab-btn tab-blue">УЧАСТНИКИ</div>
                <div class="tab-btn tab-red">ШПИОН</div>
            </div>

            <div id="display-id" style="color:var(--neon-gold); font-size: 24px; margin-bottom: 30px;">ID: ....-....</div>

            <div class="btn-stack">
                <button class="main-btn btn-create-lobby" onclick="create()">СОЗДАТЬ КОМНАТУ</button>
                <button class="main-btn btn-back" onclick="nav('scr-menu')">НАЗАД</button>
            </div>
        </div>

        <div id="scr-join" class="screen">
            <h2 class="section-header">ID КОМНАТЫ</h2>
            
            <div class="id-input-wrap">
                <div class="id-slot">_</div><div class="id-slot">_</div><div class="id-slot">_</div><div class="id-slot">_</div>
                <div style="font-size: 30px;">-</div>
                <div class="id-slot">_</div><div class="id-slot">_</div><div class="id-slot">_</div><div class="id-slot">_</div>
            </div>

            <button class="main-btn btn-back" onclick="nav('scr-menu')">ОТМЕНА</button>
        </div>

    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        function nav(s) {
            document.querySelectorAll('.screen').forEach(el => el.classList.remove('active'));
            document.getElementById(s).classList.add('active');
            
            if(s === 'scr-setup') {
                const id = Math.floor(1000+Math.random()*8999)+"-"+Math.floor(1000+Math.random()*8999);
                document.getElementById('display-id').innerText = "ID: " + id;
            }
        }

        function create() {
            tg.HapticFeedback.notificationOccurred('success');
            tg.showAlert("КОМНАТА СОЗДАНА");
        }

        // Блокировка вылетов и багов центровки при скролле
        window.addEventListener('scroll', (e) => {
            e.preventDefault();
            window.scrollTo(0,0);
        }, {passive: false});
    </script>
</body>
</html>
