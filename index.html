<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>BRAWL SPY 2026 - ULTIMATE LOGO EDITION</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Black+Ops+One&family=Rubik+Mono+One&display=swap" rel="stylesheet">
    
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>
        /* --- СИСТЕМНЫЕ ПЕРЕМЕННЫЕ --- */
        :root {
            --clr-scarlet: #e60000; /* Алый цвет для Шпиона */
            --clr-neon-blue: #00d2ff;
            --clr-neon-gold: #ffd700;
            --clr-white: #ffffff;
            --clr-black: #000000;
            --clr-bg-deep: #010103;
            
            --f-spy: 'Rubik Mono One', sans-serif;
            --f-main: 'Black Ops One', cursive;
        }

        /* --- ГЛОБАЛЬНЫЕ НАСТРОЙКИ --- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            background-color: var(--clr-bg-deep);
            color: var(--clr-white);
            height: 100vh;
            width: 100vw;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            font-family: var(--f-main);
        }

        /* --- ОСНОВНАЯ ОБОЛОЧКА --- */
        .app-container {
            width: 100%;
            max-width: 440px;
            height: 100%;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        /* --- СИСТЕМА ЭКРАНОВ --- */
        .screen {
            position: absolute;
            inset: 0;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px;
            z-index: 10;
        }

        /* ГЛАВНОЕ МЕНЮ (С ТВОИМ ФОНОМ) */
        #menu-screen {
            background-image: linear-gradient(rgba(0,0,0,0.7), rgba(0,0,0,0.7)), 
                              url('https://avatars.mds.yandex.net/i?id=bf88c867806a71c96d2d94c597a3c9ea_l-8271622-images-thumbs&n=13');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }

        #setup-screen, #join-screen {
            background-color: var(--clr-bg-deep);
        }

        .screen.active {
            display: flex;
            animation: fadeInScreen 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* --- КОНСТРУКТОР ЛОГОТИПА (ПИРАМИДА) --- */
        .logo-monolith {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            margin-bottom: 50px;
            position: relative;
        }

        /* Мягкий белый ореол за логотипом */
        .logo-monolith::before {
            content: '';
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 85%; height: 85%;
            background: radial-gradient(circle, rgba(255,255,255,0.1) 0%, rgba(255,255,255,0) 70%);
            filter: blur(20px);
            z-index: -1;
        }

        /* 1. BRAWL (ВЕРХНИЙ СЛОЙ БОЛЬШОГО ЛОГО) */
        .logo-brawl {
            font-size: 36px;
            color: var(--clr-white);
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: -5px; /* Подтягиваем к STARS */
            z-index: 3;
            /* Черная обводка средней жирности */
            -webkit-text-stroke: 1.5px var(--clr-black);
            text-shadow: 2px 2px 0 var(--clr-black);
        }

        /* 2. ШПИОН (АЛЫЙ С БЕЛОЙ ОБВОДКОЙ - ОПУЩЕН НИЖЕ) */
        .logo-spy {
            font-family: var(--f-spy);
            font-size: 72px;
            color: var(--clr-scarlet);
            text-transform: uppercase;
            letter-spacing: -3px;
            line-height: 0.9;
            transform: scaleY(1.15);
            margin-top: 5px; /* Капелька вниз по просьбе */
            margin-bottom: 10px;
            z-index: 5;
            /* БЕЛАЯ ЖИРНАЯ ОБВОДКА */
            -webkit-text-stroke: 2.5px var(--clr-white);
            /* Объемная тень для глубины */
            text-shadow: 
                0 4px 0 rgba(0,0,0,0.8),
                0 0 10px rgba(230, 0, 0, 0.4);
        }

        /* 3. STARS (НИЖНИЙ СЛОЙ БОЛЬШОГО ЛОГО) */
        .logo-stars {
            font-size: 78px;
            color: var(--clr-scarlet);
            text-transform: uppercase;
            line-height: 0.8;
            margin-top: -10px; /* Эффект вложенности */
            z-index: 2;
            /* МАССИВНАЯ ЧЕРНАЯ ОБВОДКА */
            -webkit-text-stroke: 4px var(--clr-black);
            text-shadow: 4px 4px 0 var(--clr-black);
        }

        /* 4. EDITION 2026 */
        .logo-edition {
            font-size: 16px;
            color: var(--clr-white);
            opacity: 0.7;
            letter-spacing: 5px;
            text-transform: uppercase;
            margin-top: 15px;
        }

        /* --- КНОПКИ (UI STACK) --- */
        .button-stack {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .btn-action {
            width: 100%;
            padding: 24px 0;
            background: rgba(0, 0, 0, 0.85);
            border: 3.5px solid var(--clr-neon-blue);
            box-shadow: 0 0 12px var(--clr-neon-blue);
            border-radius: 20px;
            color: var(--clr-white);
            font-size: 22px;
            text-transform: uppercase;
            cursor: pointer;
            text-align: center;
            transition: 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .btn-action:active {
            transform: scale(0.95);
            box-shadow: 0 0 25px var(--clr-neon-blue);
            background: var(--clr-neon-blue);
            color: #000;
        }

        /* КНОПКА №6: СОЗДАТЬ КОМНАТУ (БЕЛЫЙ ТЕКСТ + ЗОЛОТОЙ НЕОН) */
        .btn-gold-special {
            border-color: var(--clr-neon-gold);
            box-shadow: 0 0 18px var(--clr-neon-gold);
            color: var(--clr-white) !important;
        }

        .btn-gold-special:active {
            background: var(--clr-neon-gold);
            color: #000 !important;
        }

        .btn-navigation-back {
            border-color: #2a2a2a;
            color: #555555;
            box-shadow: none;
            margin-top: 10px;
        }

        /* --- НАСТРОЙКИ БИТВЫ --- */
        .view-title {
            font-size: 30px;
            color: var(--clr-white);
            margin-bottom: 40px;
            text-transform: uppercase;
            text-shadow: 0 0 10px rgba(255,255,255,0.2);
        }

        .tab-selector {
            display: flex;
            width: 100%;
            gap: 15px;
            margin-bottom: 40px;
        }

        .tab-btn {
            flex: 1;
            padding: 18px 0;
            border-radius: 15px;
            border: 2.5px solid;
            font-size: 14px;
            text-align: center;
            text-transform: uppercase;
        }

        .tab-blue { border-color: var(--clr-neon-blue); color: var(--clr-neon-blue); }
        .tab-red { border-color: var(--clr-scarlet); color: var(--clr-scarlet); }

        /* ВВОД ID */
        .id-input-container {
            display: flex;
            gap: 12px;
            margin: 40px 0;
        }

        .id-char-box {
            width: 34px;
            font-size: 40px;
            border-bottom: 4px solid var(--clr-white);
            text-align: center;
            color: var(--clr-white);
        }

        /* --- АНИМАЦИИ --- */
        @keyframes fadeInScreen {
            from { opacity: 0; transform: scale(1.05); }
            to { opacity: 1; transform: scale(1); }
        }

    </style>
</head>
<body>

    <div class="app-container">
        
        <div id="menu-screen" class="screen active">
            <div class="logo-monolith">
                <div class="logo-brawl">BRAWL</div>
                <div class="logo-spy">ШПИОН</div>
                <div class="logo-stars">STARS</div>
                <div class="logo-edition">EDITION 2026</div>
            </div>
            
            <div class="button-stack">
                <button class="btn-action" onclick="App.nav('setup-screen')">СОЗДАТЬ ЛОББИ</button>
                <button class="btn-action" onclick="App.nav('join-screen')">ВХОД ПО ID</button>
                <button class="btn-action btn-navigation-back" onclick="tg.close()">ВЫХОД</button>
            </div>
        </div>

        <div id="setup-screen" class="screen">
            <h2 class="view-title">НАСТРОЙКИ БИТВЫ</h2>
            
            <div class="tab-selector">
                <div class="tab-btn tab-blue">УЧАСТНИКИ</div>
                <div class="tab-btn tab-red">ШПИОН</div>
            </div>

            <div id="id-label" style="color:var(--clr-neon-gold); font-size: 26px; margin-bottom: 40px; letter-spacing: 2px;">ID: 0000-0000</div>

            <div class="button-stack">
                <button class="btn-action btn-gold-special" onclick="App.createRoom()">СОЗДАТЬ КОМНАТУ</button>
                <button class="btn-action btn-navigation-back" onclick="App.nav('menu-screen')">МЕНЮ</button>
            </div>
        </div>

        <div id="join-screen" class="screen">
            <h2 class="view-title">ID КОМНАТЫ</h2>
            
            <div class="id-input-container">
                <div class="id-char-box">_</div><div class="id-char-box">_</div><div class="id-char-box">_</div><div class="id-char-box">_</div>
                <div style="font-size: 30px;">-</div>
                <div class="id-char-box">_</div><div class="id-char-box">_</div><div class="id-char-box">_</div><div class="id-char-box">_</div>
            </div>

            <div class="button-stack">
                <button class="btn-action btn-navigation-back" onclick="App.nav('menu-screen')">ОТМЕНА</button>
            </div>
        </div>

    </div>

    <script>
        /**
         * УПРАВЛЯЮЩЕЕ ЯДРО BRAWL SPY
         */
        const tg = window.Telegram.WebApp;
        tg.expand();

        const App = {
            currentId: "",

            /**
             * Навигация по экранам
             */
            nav: function(screenId) {
                const screens = document.querySelectorAll('.screen');
                screens.forEach(s => s.classList.remove('active'));
                
                const target = document.getElementById(screenId);
                if (target) {
                    target.classList.add('active');
                }

                if (screenId === 'setup-screen') {
                    this.currentId = this.generateId();
                    document.getElementById('id-label').innerText = "ID: " + this.currentId;
                }
                
                tg.HapticFeedback.impactOccurred('medium');
            },

            /**
             * Генерация ID комнаты
             */
            generateId: function() {
                const a = Math.floor(1000 + Math.random() * 8999);
                const b = Math.floor(1000 + Math.random() * 8999);
                return `${a}-${b}`;
            },

            /**
             * Команда создания комнаты
             */
            createRoom: function() {
                tg.HapticFeedback.notificationOccurred('success');
                tg.showAlert(`ЛОББИ [${this.currentId}] УСПЕШНО СОЗДАНО!`);
            }
        };

        // Защита от свайпов
        document.addEventListener('touchmove', (e) => e.preventDefault(), { passive: false });
        
        window.onload = () => {
            tg.ready();
        };
    </script>
</body>
</html>
