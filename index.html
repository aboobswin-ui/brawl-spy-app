<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>BRAWL SPY - EDITION 2026 ULTIMATE</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Black+Ops+One&family=Rubik+One&family=Exo+2:wght@900&display=swap" rel="stylesheet">
    
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>
        :root {
            --neon-blue: #00d2ff;
            --neon-red: #ff3131;
            --neon-gold: #ffd700;
            --neon-green: #00ff00;
            --bg-black: #020205;
            --glow-white: rgba(255, 255, 255, 1);
            --transition-speed: 0.3s;
        }

        /* ПОЛНЫЙ СБРОС И БАЗА */
        * { 
            box-sizing: border-box; 
            margin: 0; padding: 0; 
            -webkit-user-select: none; 
            -webkit-tap-highlight-color: transparent;
            outline: none; 
        }

        @keyframes pulse-gold {
            0% { box-shadow: 0 0 10px var(--neon-gold); }
            50% { box-shadow: 0 0 25px var(--neon-gold); }
            100% { box-shadow: 0 0 10px var(--neon-gold); }
        }

        @keyframes neon-flicker {
            0%, 19%, 21%, 23%, 25%, 54%, 56%, 100% { opacity: 1; }
            20%, 22%, 24%, 55% { opacity: 0.8; }
        }

        body { 
            background: var(--bg-black); 
            color: #fff; 
            font-family: 'Rubik One', sans-serif; 
            height: 100vh; 
            width: 100vw;
            overflow: hidden; 
            display: flex; 
            justify-content: center; 
            align-items: center;
        }

        .app-shell { 
            width: 100%; 
            height: 100%; 
            max-width: 500px; 
            position: relative; 
            display: flex; 
            flex-direction: column;
            overflow: hidden;
        }

        /* EDITION 2026 */
        .edition-layer {
            position: absolute;
            top: 25px;
            right: 25px;
            z-index: 1000;
            font-family: 'Black Ops One';
            font-size: 16px;
            color: var(--neon-blue);
            text-shadow: 0 0 15px var(--neon-blue);
            letter-spacing: 1px;
            animation: neon-flicker 3s infinite;
        }

        .screen { 
            position: absolute; 
            inset: 0; 
            display: none; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; /* СТРОГО ПО ЦЕНТРУ */
            padding: 60px 35px; 
            background: var(--bg-black); 
            z-index: 10;
        }

        .screen.active { display: flex; animation: slideUp 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px) scale(0.9); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        /* ГЛАВНОЕ МЕНЮ (ПО ТЗ И ФОТО) */
        .logo-wrap { text-align: center; margin-bottom: 60px; }
        .main-spy-text { font-size: 110px; color: var(--neon-red); text-shadow: 0 0 40px var(--neon-red); line-height: 0.85; }
        .stars-subtitle { font-family: 'Black Ops One'; font-size: 34px; color: var(--neon-gold); text-shadow: 0 0 10px var(--neon-gold); }

        .btn-group { width: 100%; display: flex; flex-direction: column; gap: 22px; }

        .btn-core {
            width: 100%;
            padding: 26px;
            background: rgba(0,0,0,0.8);
            border: 4px solid var(--neon-blue);
            box-shadow: 0 0 18px var(--neon-blue);
            border-radius: 40px;
            color: #fff;
            font-family: 'Exo 2';
            font-weight: 900;
            font-size: 24px;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.2s ease;
            position: relative;
            overflow: hidden;
        }
        .btn-core:active { transform: scale(0.95); filter: brightness(1.3); }
        
        .btn-exit-style { border-color: #333; box-shadow: none; color: #666; }

        /* НАСТРОЙКА ЛОББИ [cite: 2026-01-03] */
        .header-lobby { font-family: 'Exo 2'; font-size: 32px; color: #fff; text-shadow: 0 0 20px var(--glow-white); margin-bottom: 35px; text-transform: uppercase; }
        
        .tab-system { display: flex; width: 100%; gap: 15px; margin-bottom: 40px; }
        .tab-unit { 
            flex: 1; padding: 20px; border-radius: 25px; text-align: center; 
            font-family: 'Exo 2'; font-size: 16px; border: 3px solid; background: #000; 
            text-transform: uppercase; font-weight: 900;
        }
        .unit-participants { border-color: var(--neon-blue); color: var(--neon-blue); box-shadow: 0 0 15px var(--neon-blue); }
        .unit-spy { border-color: var(--neon-red); color: var(--neon-red); box-shadow: 0 0 15px var(--neon-red); }

        .slider-container { width: 100%; margin-bottom: 30px; }
        .slider-info { display: flex; justify-content: space-between; font-family: 'Exo 2'; color: #888; margin-bottom: 12px; font-size: 14px; text-transform: uppercase; }
        .slider-val-num { color: #fff; font-family: 'Black Ops One'; font-size: 22px; }

        /* КНОПКА №6: СОЗДАТЬ КОМНАТУ (БЕЛЫЙ ТЕКСТ) [cite: 2026-01-04] */
        .btn-create-special { 
            border-color: var(--neon-gold); 
            box-shadow: 0 0 20px var(--neon-gold); 
            color: #ffffff !important; 
            animation: pulse-gold 2s infinite;
            margin-top: 25px;
        }

        /* ВХОД ПО ID: БЕЛЫЙ НЕОН */
        .id-input-wrapper { display: flex; align-items: center; gap: 10px; margin: 45px 0; }
        .digit-slot { 
            font-family: 'Black Ops One'; font-size: 50px; width: 42px; text-align: center; 
            border-bottom: 5px solid #fff; color: #fff; text-shadow: 0 0 25px #fff; 
        }
        .dash-slot { font-family: 'Black Ops One'; font-size: 50px; color: #fff; text-shadow: 0 0 25px #fff; transform: translateY(-8px); }

        .numpad-container { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; width: 100%; }
        .numpad-key { 
            aspect-ratio: 1.1; background: #08080c; border: 2px solid #1a1a22; border-radius: 28px; 
            font-size: 34px; color: #fff; font-family: 'Black Ops One'; display: flex; 
            justify-content: center; align-items: center; transition: 0.1s;
        }
        .numpad-key:active { background: #222; transform: scale(0.9); }

        /* ЛОББИ: ТГ ЮЗ НЕОН */
        .lobby-tg-pill {
            background: rgba(0, 210, 255, 0.1);
            border: 2px solid var(--neon-blue);
            box-shadow: 0 0 15px var(--neon-blue);
            padding: 12px 30px;
            border-radius: 50px;
            color: var(--neon-blue);
            font-family: 'Exo 2';
            font-size: 18px;
            margin-bottom: 40px;
            text-transform: lowercase;
            text-shadow: 0 0 5px var(--neon-blue);
        }

        .player-row-list { 
            width: 100%; flex: 1; overflow-y: auto; 
            display: flex; flex-direction: column; gap: 15px; 
            padding-right: 5px;
        }
        .p-card { 
            background: #0a0a0f; border: 2px solid #222; border-radius: 25px; 
            padding: 20px; display: flex; justify-content: space-between; align-items: center;
        }
        .p-name { font-family: 'Exo 2'; font-size: 20px; font-weight: 900; }
        .p-status { font-family: 'Exo 2'; font-size: 14px; text-transform: uppercase; font-weight: 900; }

    </style>
</head>
<body>
    <div class="edition-layer">EDITION 2026</div>
    
    <div class="app-shell">
        
        <div id="scr-menu" class="screen active">
            <div class="logo-wrap">
                <div class="main-spy-text">SPY</div>
                <div class="stars-subtitle">BRAWL STARS</div>
            </div>
            <div class="btn-group">
                <button class="btn-core" onclick="App.nav('scr-setup')">СОЗДАТЬ ЛОББИ</button>
                <button class="btn-core" onclick="App.nav('scr-join')">ВХОД ПО ID</button>
                <button class="btn-core btn-exit-style" onclick="tg.close()">ВЫХОД</button>
            </div>
        </div>

        <div id="scr-setup" class="screen">
            <h2 class="header-lobby">НАСТРОЙКА ЛОББИ</h2>
            <div class="tab-system">
                <div class="tab-unit unit-participants">УЧАСТНИКИ</div>
                <div class="tab-unit unit-spy">ШПИОН</div>
            </div>

            <div class="slider-container">
                <div class="slider-info">УЧАСТНИКИ <span class="slider-val-num" id="p-val">8</span></div>
                <input type="range" min="3" max="25" value="8" style="width:100%" oninput="document.getElementById('p-val').innerText = this.value">
            </div>

            <div class="slider-container">
                <div class="slider-info">ШПИОНЫ <span class="slider-val-num" id="s-val">1</span></div>
                <input type="range" min="1" max="12" value="1" style="width:100%" oninput="document.getElementById('s-val').innerText = this.value">
            </div>

            <div id="setup-id-display" style="font-family:'Black Ops One'; font-size: 26px; color: var(--neon-gold); margin: 20px 0;">ID: ....-....</div>

            <div class="btn-group">
                <button class="btn-core btn-create-special" onclick="App.createRoom()">СОЗДАТЬ КОМНАТУ</button>
                <button class="btn-core" style="border-color:#222; box-shadow:none;" onclick="App.nav('scr-menu')">НАЗАД</button>
            </div>
        </div>

        <div id="scr-join" class="screen">
            <h2 class="header-lobby">ID ЛОББИ</h2>
            <div class="id-input-wrapper">
                <div class="digit-slot" id="c1">_</div><div class="digit-slot" id="c2">_</div><div class="digit-slot" id="c3">_</div><div class="digit-slot" id="c4">_</div>
                <div class="dash-slot">-</div>
                <div class="digit-slot" id="c5">_</div><div class="digit-slot" id="c6">_</div><div class="digit-slot" id="c7">_</div><div class="digit-slot" id="c8">_</div>
            </div>
            
            <div class="numpad-container">
                <script>for(let i=1; i<=9; i++) document.write(`<div class="numpad-key" onclick="App.key('${i}')">${i}</div>`);</script>
                <div class="numpad-key" style="color:var(--neon-red)" onclick="App.key('C')">C</div>
                <div class="numpad-key" onclick="App.key('0')">0</div>
                <div class="numpad-key" style="color:var(--neon-gold)" onclick="App.joinRoom()">OK</div>
            </div>
            <button class="btn-core" style="margin-top:35px; border-color:#222;" onclick="App.nav('scr-menu')">НАЗАД</button>
        </div>

        <div id="scr-room" class="screen">
            <div class="lobby-tg-pill" id="lobby-username">@loading...</div>
            <h2 class="header-lobby">ЛОББИ БИТВЫ</h2>
            <div id="room-id-label" style="font-family:'Black Ops One'; font-size: 28px; color: var(--neon-gold); margin-bottom: 30px;">ID: ....-....</div>
            
            <div class="player-row-list" id="ui-players"></div>
            
            <div class="btn-group" style="margin-top: 30px;">
                <button class="btn-core" id="ready-btn-ui" style="border-color:var(--neon-green); box-shadow: 0 0 20px var(--neon-green);" onclick="App.toggleReady()">ГОТОВ</button>
                <button class="btn-core btn-create-special" id="start-btn-ui" style="display:none;">НАЧАТЬ ИГРУ</button>
                <button class="btn-core" style="border-color:var(--neon-red);" onclick="location.reload()">ВЫЙТИ</button>
            </div>
        </div>

    </div>

    <script>
        // FIREBASE КОНФИГ
        const firebaseConfig = {
            apiKey: "AIzaSyDbopGDAnN6RxiXoAk_Il90WZBCW0bVBvg",
            authDomain: "brawlspy.firebaseapp.com",
            databaseURL: "https://brawlspy-default-rtdb.firebaseio.com",
            projectId: "brawlspy",
            storageBucket: "brawlspy.firebasestorage.app",
            messagingSenderId: "803859610634",
            appId: "1:803859610634:web:2310aa16bb6e61049833f3"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        const tg = window.Telegram.WebApp;
        const user = tg.initDataUnsafe.user || { id: 1001, username: "LocalSpy" };
        
        document.getElementById('lobby-username').innerText = "@" + (user.username || "Anonymous");

        const App = {
            activeRoom: null,
            inputBuffer: "",
            ready: false,

            nav: (id) => {
                document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
                document.getElementById(id).classList.add('active');
                if(id === 'scr-setup') {
                    const roomCode = Math.floor(1000+Math.random()*8999)+"-"+Math.floor(1000+Math.random()*8999);
                    App.activeRoom = roomCode;
                    document.getElementById('setup-id-display').innerText = "ID: " + roomCode;
                }
            },

            key: (val) => {
                if(val === 'C') App.inputBuffer = "";
                else if(App.inputBuffer.length < 8) App.inputBuffer += val;
                for(let i=1; i<=8; i++) {
                    const cell = document.getElementById('c'+i);
                    cell.innerText = App.inputBuffer[i-1] || "_";
                }
                tg.HapticFeedback.impactOccurred('medium');
            },

            createRoom: () => { App.nav('scr-room'); App.connect(); },
            joinRoom: () => {
                if(App.inputBuffer.length === 8) {
                    App.activeRoom = App.inputBuffer.slice(0,4) + "-" + App.inputBuffer.slice(4,8);
                    App.nav('scr-room'); App.connect();
                }
            },

            connect: () => {
                document.getElementById('room-id-label').innerText = "ID: " + App.activeRoom;
                const playerPath = 'rooms/' + App.activeRoom + '/players/' + user.id;
                db.ref(playerPath).set({ name: "@" + (user.username || "spy"), ready: false });

                db.ref('rooms/' + App.activeRoom + '/players').on('value', snap => {
                    const list = document.getElementById('ui-players');
                    list.innerHTML = "";
                    const data = snap.val();
                    if(data) {
                        Object.keys(data).forEach(uid => {
                            const p = data[uid];
                            list.innerHTML += `
                                <div class="p-card">
                                    <span class="p-name">${p.name}</span>
                                    <span class="p-status" style="color:${p.ready?'var(--neon-green)':'var(--neon-red)'}">${p.ready?'ГОТОВ':'ЖДЁМ'}</span>
                                </div>`;
                        });
                    }
                });
            },

            toggleReady: () => {
                App.ready = !App.ready;
                db.ref('rooms/' + App.activeRoom + '/players/' + user.id).update({ ready: App.ready });
                const btn = document.getElementById('ready-btn-ui');
                btn.innerText = App.ready ? "ОТМЕНА" : "ГОТОВ";
                btn.style.borderColor = App.ready ? "var(--neon-red)" : "var(--neon-green)";
                btn.style.boxShadow = App.ready ? "0 0 20px var(--neon-red)" : "0 0 20px var(--neon-green)";
            }
        };
    </script>
</body>
</html>
