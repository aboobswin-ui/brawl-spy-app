<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>BRAWL SPY 2026 - MEGA MONOLITH EDITION</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Black+Ops+One&family=Rubik+Mono+One&display=swap" rel="stylesheet">
    
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>
        /* --- ЦВЕТОВАЯ ПАЛИТРА --- */
        :root {
            --neon-red: #ff3131;
            --neon-blue: #00d2ff;
            --neon-gold: #ffd700;
            --white: #ffffff;
            --bg-black: #010103;
            --font-main: 'Black Ops One', cursive;
            --font-spy: 'Rubik Mono One', sans-serif;
        }

        /* --- ГЛОБАЛЬНЫЕ СТИЛИ И ФИКСЫ БАГОВ --- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            background-color: var(--bg-black);
            color: var(--white);
            height: 100vh;
            width: 100vw;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            font-family: var(--font-main);
            position: relative;
        }

        /* ГЛАВНЫЙ КОНТЕЙНЕР (ЖЕСТКАЯ ЦЕНТРОВКА) */
        .app-container {
            width: 100%;
            max-width: 440px;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            padding: 30px;
            z-index: 10;
        }

        /* --- ЛОГОТИП ПИРАМИДОЙ (ШПИОН -> BRAWL -> STARS -> ED 2026) --- */
        .logo-stack {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            margin-bottom: 60px;
            animation: logoPulse 2s infinite ease-in-out;
        }

        /* 1. ШПИОН (ВЕРХ - KZ SUPERCELL MAGIC STYLE) */
        .spy-top {
            font-family: var(--font-spy);
            font-size: 66px;
            color: var(--neon-red);
            text-transform: uppercase;
            letter-spacing: -6px; /* Сжатие как на фото */
            line-height: 0.85;
            transform: scaleY(1.2); /* Вытягивание как на фото */
            text-shadow: 
                0 0 15px var(--neon-red),
                0 0 30px rgba(255, 49, 49, 0.5);
            margin-bottom: 20px;
        }

        /* 2. BRAWL (ПОД ШПИОНОМ) */
        .brawl-mid {
            font-size: 28px;
            color: var(--white);
            text-shadow: 0 0 10px var(--white);
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 5px;
        }

        /* 3. STARS (ПОД БРАВЛОМ - САМЫЙ БОЛЬШОЙ) */
        .stars-low {
            font-size: 62px;
            color: var(--neon-red);
            text-shadow: 0 0 20px var(--neon-red);
            text-transform: uppercase;
            line-height: 0.8;
            margin-bottom: 15px;
        }

        /* 4. EDITION 2026 (ПОД СТАРСОМ) */
        .ed-bottom {
            font-size: 16px;
            color: var(--white);
            text-shadow: 0 0 10px var(--white);
            text-transform: uppercase;
            letter-spacing: 4px;
            opacity: 0.9;
        }

        /* --- ЭКРАНЫ ПРИЛОЖЕНИЯ --- */
        .screen {
            position: absolute;
            inset: 0;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px;
            background: var(--bg-black);
            z-index: 20;
        }

        .screen.active {
            display: flex;
            animation: screenIn 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* --- СИСТЕМА КНОПОК --- */
        .menu-stack {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .btn-base {
            width: 100%;
            padding: 24px 0;
            background: rgba(0,0,0,0.7);
            border: 4px solid var(--neon-blue);
            box-shadow: 0 0 15px var(--neon-blue);
            border-radius: 20px;
            color: var(--white);
            font-size: 22px;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .btn-base:active {
            transform: scale(0.95);
            box-shadow: 0 0 25px var(--neon-blue);
            filter: brightness(1.2);
        }

        .btn-exit {
            border-color: #333333;
            color: #555555;
            box-shadow: none;
            margin-top: 10px;
        }

        /* --- НАСТРОЙКА ЛОББИ --- */
        .battle-settings-title {
            font-size: 30px;
            color: var(--white);
            text-shadow: 0 0 15px var(--white);
            margin-bottom: 40px;
            text-transform: uppercase;
            text-align: center;
        }

        .neon-tabs-container {
            display: flex;
            width: 100%;
            gap: 12px;
            margin-bottom: 35px;
        }

        .tab-button {
            flex: 1;
            padding: 18px 0;
            border: 3px solid;
            border-radius: 15px;
            font-size: 14px;
            text-align: center;
            text-transform: uppercase;
            background: #000;
        }

        .tab-participants {
            border-color: var(--neon-blue);
            color: var(--neon-blue);
            text-shadow: 0 0 10px var(--neon-blue);
            box-shadow: inset 0 0 5px var(--neon-blue);
        }

        .tab-spy {
            border-color: var(--neon-red);
            color: var(--neon-red);
            text-shadow: 0 0 10px var(--neon-red);
            box-shadow: inset 0 0 5px var(--neon-red);
        }

        /* КНОПКА №6: СОЗДАТЬ КОМНАТУ (ЗОЛОТОЙ НЕОН, БЕЛЫЙ ТЕКСТ) */
        .btn-create-lobby-gold {
            border-color: var(--neon-gold);
            box-shadow: 0 0 25px var(--neon-gold);
            color: var(--white) !important; /* Текст белый */
            margin-top: 25px;
        }

        /* --- ВВОД ID --- */
        .id-input-section {
            display: flex;
            align-items: center;
            gap: 12px;
            margin: 45px 0;
        }

        .id-char-slot {
            font-size: 44px;
            width: 35px;
            border-bottom: 5px solid var(--white);
            color: var(--white);
            text-shadow: 0 0 15px var(--white);
            text-align: center;
        }

        /* --- АНИМАЦИИ --- */
        @keyframes logoPulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.02); }
        }

        @keyframes screenIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

    </style>
</head>
<body>

    <div class="app-container">
        
        <div id="scr-menu" class="screen active">
            <div class="logo-stack">
                <div class="spy-top">ШПИОН</div>
                <div class="brawl-mid">BRAWL</div>
                <div class="stars-low">STARS</div>
                <div class="ed-bottom">EDITION 2026</div>
            </div>
            
            <div class="menu-stack">
                <button class="btn-base" onclick="App.nav('scr-setup')">СОЗДАТЬ ЛОББИ</button>
                <button class="btn-base" onclick="App.nav('scr-join')">ВХОД ПО ID</button>
                <button class="btn-base btn-exit" onclick="tg.close()">ВЫХОД</button>
            </div>
        </div>

        <div id="scr-setup" class="screen">
            <h2 class="battle-settings-title">НАСТРОЙКИ БИТВЫ</h2>
            
            <div class="neon-tabs-container">
                <div class="tab-button tab-participants">УЧАСТНИКИ</div>
                <div class="tab-button tab-spy">ШПИОН</div>
            </div>

            <div id="lobby-id-gen" style="color:var(--neon-gold); font-size: 26px; margin-bottom: 30px; letter-spacing: 2px;">ID: ....-....</div>

            <div class="menu-stack">
                <button class="btn-base btn-create-lobby-gold" onclick="App.createRoom()">СОЗДАТЬ КОМНАТУ</button>
                <button class="btn-base btn-exit" onclick="App.nav('scr-menu')">МЕНЮ</button>
            </div>
        </div>

        <div id="scr-join" class="screen">
            <h2 class="battle-settings-title" style="color: var(--white)">ID КОМНАТЫ</h2>
            
            <div class="id-input-section">
                <div class="id-char-slot">_</div><div class="id-char-slot">_</div><div class="id-char-slot">_</div><div class="id-char-slot">_</div>
                <div style="font-size: 35px; color: var(--white)">-</div>
                <div class="id-char-slot">_</div><div class="id-char-slot">_</div><div class="id-char-slot">_</div><div class="id-char-slot">_</div>
            </div>

            <div class="menu-stack">
                <button class="btn-base btn-exit" onclick="App.nav('scr-menu')">ОТМЕНА</button>
            </div>
        </div>

    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        tg.enableClosingConfirmation();

        const App = {
            currentRoomId: "",

            nav: function(screenId) {
                // Плавное переключение экранов
                document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
                document.getElementById(screenId).classList.add('active');
                
                // Генерация ID при входе в настройки
                if(screenId === 'scr-setup') {
                    this.currentRoomId = this.generateId();
                    document.getElementById('lobby-id-gen').innerText = "ID: " + this.currentRoomId;
                }
                tg.HapticFeedback.impactOccurred('light');
            },

            generateId: function() {
                const part1 = Math.floor(1000 + Math.random() * 8999);
                const part2 = Math.floor(1000 + Math.random() * 8999);
                return `${part1}-${part2}`;
            },

            createRoom: function() {
                tg.HapticFeedback.notificationOccurred('success');
                tg.showAlert(`КОМНАТА ${this.currentRoomId} СОЗДАНА!`);
            }
        };

        // Блокировка стандартного скролла для стабильности центровки
        window.addEventListener('scroll', (e) => e.preventDefault(), {passive: false});
    </script>
</body>
</html>
