<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>BRAWL SPY 2026 - ULTIMATE ALIGNMENT MONOLITH</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Black+Ops+One&family=Rubik+Mono+One&display=swap" rel="stylesheet">
    
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>
        /* ========================================
           1. СИСТЕМНЫЕ ПЕРЕМЕННЫЕ (VARIABLES)
           ========================================
        */
        :root {
            --clr-red-neon: #ff3131;
            --clr-blue-neon: #00d2ff;
            --clr-gold-neon: #ffd700;
            --clr-white: #ffffff;
            --clr-bg-pure: #010103;
            
            /* Шрифты */
            --font-spy: 'Rubik Mono One', sans-serif;
            --font-ops: 'Black Ops One', cursive;

            /* Физика 3D объема для ШПИОН */
            --spy-3d-stack: 
                0 1px 0 #941a1a,
                0 2px 0 #851717,
                0 3px 0 #751414,
                0 4px 0 #661111,
                0 5px 0 #570e0e,
                0 6px 10px rgba(0,0,0,0.8);

            /* Мягкое белое свечение */
            --white-glow-halo: radial-gradient(circle, rgba(255,255,255,0.08) 0%, rgba(255,255,255,0) 65%);
        }

        /* ========================================
           2. ГЛОБАЛЬНЫЙ СБРОС (GLOBAL RESET)
           ========================================
        */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            -webkit-user-select: none;
            user-select: none;
        }

        html, body {
            width: 100vw;
            height: 100vh;
            background-color: var(--clr-bg-pure);
            color: var(--clr-white);
            overflow: hidden;
            font-family: var(--font-ops);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* ========================================
           3. КОНТЕЙНЕРЫ (LAYOUT)
           ========================================
        */
        .app-monolith {
            width: 100%;
            height: 100%;
            max-width: 440px;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .view-frame {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 45px;
            z-index: 100;
        }

        /* ФОН ТОЛЬКО ДЛЯ ГЛАВНОГО МЕНЮ */
        #view-main-menu {
            background-image: linear-gradient(rgba(0,0,0,0.75), rgba(0,0,0,0.75)), 
                              url('https://avatars.mds.yandex.net/i?id=bf88c867806a71c96d2d94c597a3c9ea_l-8271622-images-thumbs&n=13');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }

        /* ОСТАЛЬНЫЕ ЭКРАНЫ */
        #view-settings, #view-id-gate {
            background-color: var(--clr-bg-pure);
        }

        .view-frame.active {
            display: flex;
            animation: viewFadeTransition 0.5s ease-out forwards;
        }

        /* ========================================
           4. ПЕРФЕКТНЫЙ ЛОГОТИП (LOGO STACK)
           ========================================
        */
        .perfect-logo-container {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            margin-bottom: 55px;
        }

        /* БЕЛОЕ СВЕТОВОЕ ОБЛАКО ЗА ЛОГО */
        .white-halo-effect {
            position: absolute;
            width: 320px;
            height: 320px;
            background: var(--white-glow-halo);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: -1;
            pointer-events: none;
            filter: blur(15px);
        }

        /* ШПИОН (УМЕНЬШЕННЫЙ, ОБЪЕМНЫЙ) */
        .spy-monolith-text {
            font-family: var(--font-spy);
            font-size: 74px; /* Уменьшил для идеальной гармонии */
            color: var(--clr-red-neon);
            text-transform: uppercase;
            letter-spacing: -4px;
            line-height: 0.9;
            transform: scaleY(1.15);
            text-shadow: var(--spy-3d-stack);
            margin-bottom: 22px;
            text-align: center;
        }

        .brawl-monolith-text {
            font-size: 32px;
            color: var(--clr-white);
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.25);
            margin-bottom: 6px;
        }

        .stars-monolith-text {
            font-size: 74px;
            color: var(--clr-red-neon);
            text-transform: uppercase;
            line-height: 0.85;
            text-shadow: 0 3px 0 #851717, 0 0 12px rgba(255, 49, 49, 0.3);
            margin-bottom: 18px;
        }

        .edition-monolith-text {
            font-size: 16px;
            color: var(--clr-white);
            opacity: 0.65;
            letter-spacing: 5px;
            text-transform: uppercase;
        }

        /* ========================================
           5. ИНТЕРФЕЙС КНОПОК (UI CONTROLS)
           ========================================
        */
        .ui-vertical-stack {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .btn-monolith {
            width: 100%;
            padding: 24px 0;
            background: rgba(0, 0, 0, 0.85);
            border: 3.5px solid var(--clr-blue-neon);
            box-shadow: 0 0 12px var(--clr-blue-neon);
            border-radius: 22px;
            color: var(--clr-white);
            font-size: 22px;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.23, 1, 0.32, 1);
            text-align: center;
        }

        .btn-monolith:active {
            transform: scale(0.95);
            box-shadow: 0 0 25px var(--clr-blue-neon);
            background: var(--clr-blue-neon);
            color: #000;
        }

        /* КНОПКА №6: СОЗДАТЬ КОМНАТУ (ЗОЛОТОЙ НЕОН) */
        .btn-monolith-gold {
            border-color: var(--clr-gold-neon);
            box-shadow: 0 0 18px var(--clr-gold-neon);
            color: var(--clr-white) !important;
        }

        .btn-monolith-gold:active {
            background: var(--clr-gold-neon);
            color: #000 !important;
        }

        .btn-monolith-back {
            border-color: #2a2a2a;
            color: #555555;
            box-shadow: none;
            margin-top: 15px;
        }

        /* ========================================
           6. НАСТРОЙКИ (SETTINGS UI)
           ========================================
        */
        .section-header-text {
            font-size: 30px;
            color: var(--clr-white);
            text-shadow: 0 0 15px rgba(255,255,255,0.2);
            margin-bottom: 45px;
            text-transform: uppercase;
        }

        .tab-navigation-grid {
            display: flex;
            width: 100%;
            gap: 15px;
            margin-bottom: 40px;
        }

        .tab-link {
            flex: 1;
            padding: 18px 0;
            border: 2.5px solid;
            border-radius: 16px;
            font-size: 14px;
            text-align: center;
            text-transform: uppercase;
            background: #000;
        }

        .tab-link-blue { border-color: var(--clr-blue-neon); color: var(--clr-blue-neon); }
        .tab-link-red { border-color: var(--clr-red-neon); color: var(--clr-red-neon); }

        /* ИДЕНТИФИКАТОРЫ */
        .id-display-box {
            display: flex;
            align-items: center;
            gap: 12px;
            margin: 50px 0;
        }

        .id-char-underline {
            width: 34px;
            font-size: 42px;
            border-bottom: 4.5px solid var(--clr-white);
            color: var(--clr-white);
            text-align: center;
        }

        /* ========================================
           7. АНИМАЦИИ (ANIMATIONS)
           ========================================
        */
        @keyframes viewFadeTransition {
            from { opacity: 0; transform: scale(1.03); }
            to { opacity: 1; transform: scale(1); }
        }

    </style>
</head>
<body>

    <div class="app-monolith">
        
        <div id="view-main-menu" class="view-frame active">
            
            <div class="perfect-logo-container">
                <div class="white-halo-effect"></div>
                <div class="spy-monolith-text">ШПИОН</div>
                <div class="brawl-monolith-text">BRAWL</div>
                <div class="stars-monolith-text">STARS</div>
                <div class="edition-monolith-text">EDITION 2026</div>
            </div>
            
            <div class="ui-vertical-stack">
                <button class="btn-monolith" onclick="AppEngine.navigateTo('view-settings')">СОЗДАТЬ ЛОББИ</button>
                <button class="btn-monolith" onclick="AppEngine.navigateTo('view-id-gate')">ВХОД ПО ID</button>
                <button class="btn-monolith btn-monolith-back" onclick="tg.close()">ВЫХОД</button>
            </div>
        </div>

        <div id="view-settings" class="view-frame">
            <h2 class="section-header-text">НАСТРОЙКИ БИТВЫ</h2>
            
            <div class="tab-navigation-grid">
                <div class="tab-link tab-link-blue">УЧАСТНИКИ</div>
                <div class="tab-link tab-link-red">ШПИОН</div>
            </div>

            <div id="session-id-label" style="color:var(--clr-gold-neon); font-size: 28px; margin-bottom: 40px; letter-spacing: 2px;">ID: 0000-0000</div>

            <div class="ui-vertical-stack">
                <button class="btn-monolith btn-monolith-gold" onclick="AppEngine.initRoom()">СОЗДАТЬ КОМНАТУ</button>
                <button class="btn-monolith btn-monolith-back" onclick="AppEngine.navigateTo('view-main-menu')">МЕНЮ</button>
            </div>
        </div>

        <div id="view-id-gate" class="view-frame">
            <h2 class="section-header-text">ID КОМНАТЫ</h2>
            
            <div class="id-display-box">
                <div class="id-char-underline">_</div><div class="id-char-underline">_</div><div class="id-char-underline">_</div><div class="id-char-underline">_</div>
                <div style="font-size: 30px; color: #fff;">-</div>
                <div class="id-char-underline">_</div><div class="id-char-underline">_</div><div class="id-char-underline">_</div><div class="id-char-underline">_</div>
            </div>

            <div class="ui-vertical-stack">
                <button class="btn-monolith btn-monolith-back" onclick="AppEngine.navigateTo('view-main-menu')">ОТМЕНА</button>
            </div>
        </div>

    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        const AppEngine = {
            activeRoom: null,

            /**
             * Переход между видами
             */
            navigateTo: function(viewId) {
                const views = document.querySelectorAll('.view-frame');
                views.forEach(v => v.classList.remove('active'));
                
                const target = document.getElementById(viewId);
                if (target) {
                    target.classList.add('active');
                }

                if (viewId === 'view-settings') {
                    this.activeRoom = this.createId();
                    document.getElementById('session-id-label').innerText = "ID: " + this.activeRoom;
                }

                tg.HapticFeedback.impactOccurred('medium');
                console.log("System Status: View changed to " + viewId);
            },

            /**
             * Создание сессионного ключа
             */
            createId: function() {
                const partA = Math.floor(1000 + Math.random() * 8999);
                const partB = Math.floor(1000 + Math.random() * 8999);
                return `${partA}-${partB}`;
            },

            /**
             * Финализация создания комнаты
             */
            initRoom: function() {
                tg.HapticFeedback.notificationOccurred('success');
                tg.showAlert(`ЛОББИ [${this.activeRoom}] УСПЕШНО РАЗВЕРНУТО!`);
            }
        };

        // Блокировка прокрутки для мобильных браузеров
        document.addEventListener('touchmove', function(e) {
            e.preventDefault();
        }, { passive: false });
    </script>
</body>
</html>
