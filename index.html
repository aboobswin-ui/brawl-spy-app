<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎲 YAHTZEE ULTIMATE - Telegram Web App</title>

            projectId: "brawlspy",

            messagingSenderId: "803859610634",

    <style>
        /* ==================== CSS RESET ==================== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        :root {
            /* Цветовая тема */
            --primary: #6a11cb;
            --secondary: #2575fc;
            --accent: #ff6b6b;
            --success: #4CAF50;
            --warning: #FFC107;
            --danger: #F44336;
            --dark: #1a1a2e;
            --light: #f8f9fa;
            --gray: #6c757d;
            
            /* Тени */
            --shadow-sm: 0 2px 8px rgba(0,0,0,0.1);
            --shadow-md: 0 4px 16px rgba(0,0,0,0.15);
            --shadow-lg: 0 8px 32px rgba(0,0,0,0.2);
            --shadow-xl: 0 16px 48px rgba(0,0,0,0.25);
            --shadow-xxl: 0 24px 64px rgba(0,0,0,0.3);
            
            /* Анимации */
            --transition-fast: 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            --transition-normal: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            --transition-slow: 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            --transition-bounce: 0.5s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            
            /* Градиенты */
            --gradient-primary: linear-gradient(135deg, var(--primary), var(--secondary));
            --gradient-accent: linear-gradient(45deg, var(--accent), #ff8e53);
            --gradient-success: linear-gradient(45deg, var(--success), #2E7D32);
            --gradient-warning: linear-gradient(45deg, var(--warning), #FF9800);
            --gradient-danger: linear-gradient(45deg, var(--danger), #D32F2F);
            --gradient-dark: linear-gradient(135deg, var(--dark), #16213e);
            --gradient-gold: linear-gradient(45deg, #FFD700, #FFA500);
            --gradient-neon: linear-gradient(45deg, #00ff88, #00ccff);
            --gradient-retro: linear-gradient(45deg, #ff6b6b, #4ECDC4);
        }

        /* ==================== БАЗОВЫЕ СТИЛИ ==================== */
        body {
            font-family: 'Segoe UI', 'Roboto', 'Arial', sans-serif;
            background: var(--gradient-dark);
            color: var(--light);
            min-height: 100vh;
            line-height: 1.6;
            overflow-x: hidden;
            position: relative;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(circle at 20% 80%, rgba(106, 17, 203, 0.15) 0%, transparent 50%),
                radial-gradient(circle at 80% 20%, rgba(37, 117, 252, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 40% 40%, rgba(255, 107, 107, 0.08) 0%, transparent 50%);
            z-index: -1;
            pointer-events: none;
        }

        .container {
            max-width: 500px;
            margin: 0 auto;
            padding: 20px;
            position: relative;
            z-index: 1;
        }

        /* ==================== ЗАГОЛОВОК ==================== */
        .header {
            text-align: center;
            margin-bottom: 30px;
            position: relative;
            padding-top: 10px;
        }

        .title {
            font-size: clamp(2.2rem, 6vw, 2.8rem);
            font-weight: 900;
            background: linear-gradient(45deg, #FFD700, #FF6B6B, #4ECDC4, #2575fc);
            background-size: 300% 300%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: 0 4px 20px rgba(0,0,0,0.3);
            margin-bottom: 8px;
            animation: titleGlow 3s ease-in-out infinite alternate, gradientShift 8s ease infinite;
            position: relative;
            display: inline-block;
        }

        .title::after {
            content: '';
            position: absolute;
            bottom: -5px;
            left: 10%;
            width: 80%;
            height: 3px;
            background: linear-gradient(90deg, transparent, #FFD700, #4ECDC4, transparent);
            border-radius: 3px;
            filter: blur(1px);
        }

        @keyframes titleGlow {
            0% { filter: drop-shadow(0 0 10px rgba(255, 215, 0, 0.3)); }
            50% { filter: drop-shadow(0 0 20px rgba(255, 107, 107, 0.5)); }
            100% { filter: drop-shadow(0 0 15px rgba(78, 205, 196, 0.4)); }
        }

        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .subtitle {
            font-size: 1.1rem;
            opacity: 0.9;
            color: #a5b4fc;
            margin-bottom: 20px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.2);
            animation: subtitleFloat 6s ease-in-out infinite;
        }

        @keyframes subtitleFloat {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-3px); }
        }

        /* ==================== МОДАЛЬНОЕ ОКНО ВВОДА КОДА ==================== */
        .code-input-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.95);
            backdrop-filter: blur(20px);
            z-index: 2001;
            align-items: center;
            justify-content: center;
            padding: 20px;
            animation: modalFadeIn 0.4s ease;
        }

        .code-input-modal.active {
            display: flex;
        }

        .code-input-content {
            background: var(--gradient-dark);
            border-radius: 30px;
            padding: 40px;
            max-width: 450px;
            width: 100%;
            border: 2px solid rgba(255, 255, 255, 0.2);
            box-shadow: 
                var(--shadow-xxl),
                0 0 100px rgba(106, 17, 203, 0.3),
                inset 0 0 50px rgba(255, 255, 255, 0.05);
            position: relative;
            animation: modalSlideUp 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            overflow: hidden;
        }

        .code-input-content::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: 
                radial-gradient(circle at 20% 30%, rgba(106, 17, 203, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 80% 70%, rgba(37, 117, 252, 0.1) 0%, transparent 50%);
            pointer-events: none;
        }

        .code-input-title {
            font-size: 1.8rem;
            font-weight: 900;
            margin-bottom: 30px;
            background: linear-gradient(45deg, #FFD700, #4ECDC4);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-align: center;
            text-shadow: 0 4px 15px rgba(0,0,0,0.3);
            position: relative;
        }

        .code-input-title::after {
            content: '';
            position: absolute;
            bottom: -10px;
            left: 20%;
            width: 60%;
            height: 3px;
            background: linear-gradient(90deg, transparent, #FFD700, #4ECDC4, transparent);
            border-radius: 3px;
            filter: blur(2px);
        }

        /* Поле ввода кода */
        .code-input-container {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin: 40px 0;
        }

        .code-input-digit {
            width: 70px;
            height: 90px;
            background: rgba(255, 255, 255, 0.1);
            border: 3px solid rgba(255, 255, 255, 0.2);
            border-radius: 20px;
            font-size: 3.5rem;
            font-weight: 900;
            text-align: center;
            color: #FFD700;
            text-shadow: 0 0 20px rgba(255, 215, 0, 0.4);
            font-family: 'Courier New', monospace;
            outline: none;
            transition: all var(--transition-bounce);
            caret-color: transparent;
            position: relative;
            overflow: hidden;
        }

        .code-input-digit:focus {
            border-color: #FFD700;
            background: rgba(255, 215, 0, 0.1);
            box-shadow: 0 0 30px rgba(255, 215, 0, 0.3);
            transform: scale(1.1) translateY(-5px);
        }

        .code-input-digit::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            animation: digitShine 3s infinite;
        }

        @keyframes digitShine {
            0% { left: -100%; }
            100% { left: 100%; }
        }

        /* Клавиатура */
        .code-keyboard {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-top: 30px;
        }

        .code-key {
            background: var(--gradient-primary);
            border: none;
            height: 70px;
            border-radius: 20px;
            font-size: 1.8rem;
            font-weight: 900;
            color: white;
            cursor: pointer;
            transition: all var(--transition-bounce);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: var(--shadow-xl);
            position: relative;
            overflow: hidden;
        }

        .code-key::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            transition: var(--transition-slow);
        }

        .code-key:hover::before {
            left: 100%;
        }

        .code-key:hover {
            transform: translateY(-5px) scale(1.05);
            box-shadow: var(--shadow-xxl);
        }

        .code-key:active {
            transform: translateY(-2px) scale(1.02);
        }

        .code-key.delete {
            background: var(--gradient-danger);
            grid-column: span 2;
        }

        .code-key.enter {
            background: var(--gradient-success);
            grid-column: span 3;
            font-size: 1.5rem;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        /* Подсказка */
        .code-hint {
            text-align: center;
            margin-top: 25px;
            font-size: 0.95rem;
            opacity: 0.8;
            color: #a5b4fc;
            animation: hintPulse 3s ease-in-out infinite;
        }

        @keyframes hintPulse {
            0%, 100% { opacity: 0.8; }
            50% { opacity: 1; }
        }

        /* ==================== ВЫБОР РАУНДОВ ==================== */
        .rounds-selection {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin: 30px 0;
        }

        .round-option {
            background: rgba(255, 255, 255, 0.07);
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 25px 15px;
            text-align: center;
            cursor: pointer;
            transition: all var(--transition-bounce);
            position: relative;
            overflow: hidden;
        }

        .round-option:hover {
            background: rgba(255, 255, 255, 0.12);
            transform: translateY(-8px);
            border-color: rgba(255, 255, 255, 0.2);
            box-shadow: var(--shadow-xl);
        }

        .round-option.selected {
            background: linear-gradient(135deg, rgba(106, 17, 203, 0.3), rgba(37, 117, 252, 0.2));
            border-color: #6a11cb;
            box-shadow: 0 0 30px rgba(106, 17, 203, 0.4);
            transform: translateY(-5px);
        }

        .round-option.selected::before {
            content: '✓';
            position: absolute;
            top: 10px;
            right: 10px;
            color: #FFD700;
            font-weight: 900;
            font-size: 1.2rem;
        }

        .round-number {
            font-size: 2.5rem;
            font-weight: 900;
            color: #FFD700;
            margin-bottom: 5px;
            text-shadow: 0 2px 10px rgba(255, 215, 0, 0.3);
        }

        .round-label {
            font-size: 0.9rem;
            opacity: 0.8;
            color: #a5b4fc;
        }

        /* ==================== ИТОГИ ВСЕХ РАУНДОВ ==================== */
        .final-results {
            background: rgba(255, 255, 255, 0.07);
            backdrop-filter: blur(20px);
            border-radius: 25px;
            padding: 30px;
            margin: 30px 0;
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: var(--shadow-xxl);
            position: relative;
            overflow: hidden;
        }

        .final-results::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: var(--gradient-primary);
            border-radius: 25px 25px 0 0;
        }

        .final-title {
            font-size: 1.8rem;
            font-weight: 900;
            margin-bottom: 30px;
            background: linear-gradient(45deg, #FFD700, #FF6B6B);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-align: center;
            text-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        .rounds-history {
            display: grid;
            gap: 15px;
            margin-bottom: 30px;
        }

        .round-result {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 15px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .round-name {
            font-weight: 600;
            color: #a5b4fc;
        }

        .round-scores {
            display: flex;
            gap: 30px;
        }

        .round-score {
            text-align: center;
            min-width: 70px;
        }

        .round-player {
            font-size: 0.8rem;
            opacity: 0.7;
            margin-bottom: 5px;
        }

        .round-value {
            font-size: 1.3rem;
            font-weight: 800;
            color: #FFD700;
        }

        .round-winner {
            background: rgba(255, 215, 0, 0.1);
            border-color: rgba(255, 215, 0, 0.3);
        }

        .round-winner .round-value {
            animation: winnerPulse 2s ease-in-out infinite;
        }

        @keyframes winnerPulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        .total-results {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-top: 30px;
        }

        .total-box {
            background: linear-gradient(135deg, rgba(255, 215, 0, 0.15), rgba(255, 107, 107, 0.1));
            border-radius: 20px;
            padding: 25px;
            text-align: center;
            border: 2px solid rgba(255, 215, 0, 0.3);
            position: relative;
            overflow: hidden;
        }

        .total-box.winner {
            background: linear-gradient(135deg, rgba(76, 175, 80, 0.2), rgba(46, 125, 50, 0.1));
            border-color: #4CAF50;
            animation: winnerGlow 2s ease-in-out infinite;
        }

        @keyframes winnerGlow {
            0%, 100% { box-shadow: 0 0 20px rgba(76, 175, 80, 0.3); }
            50% { box-shadow: 0 0 40px rgba(76, 175, 80, 0.5); }
        }

        .total-label {
            font-size: 1rem;
            opacity: 0.9;
            margin-bottom: 10px;
            color: #FFD700;
            font-weight: 600;
        }

        .total-value {
            font-size: 2.5rem;
            font-weight: 900;
            color: #FFD700;
            text-shadow: 0 4px 20px rgba(255, 215, 0, 0.4);
        }

        .total-box.winner .total-value {
            color: #4CAF50;
        }

        .champion-crown {
            position: absolute;
            top: -20px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 2.5rem;
            filter: drop-shadow(0 4px 10px rgba(255, 215, 0, 0.5));
        }

        /* ==================== КНОПКИ ==================== */
        .btn {
            background: var(--gradient-primary);
            color: white;
            border: none;
            padding: 20px 30px;
            border-radius: 20px;
            font-size: 1.2rem;
            font-weight: 700;
            cursor: pointer;
            transition: all var(--transition-bounce);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            box-shadow: var(--shadow-xl);
            position: relative;
            overflow: hidden;
            width: 100%;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            transition: var(--transition-slow);
        }

        .btn:hover::before {
            left: 100%;
        }

        .btn:hover:not(:disabled) {
            transform: translateY(-8px) scale(1.05);
            box-shadow: var(--shadow-xxl);
        }

        .btn:active:not(:disabled) {
            transform: translateY(-4px) scale(1.02);
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none !important;
            animation: none !important;
        }

        .btn-success {
            background: var(--gradient-success);
        }

        .btn-warning {
            background: var(--gradient-warning);
        }

        .btn-danger {
            background: var(--gradient-danger);
        }

        /* ==================== АДАПТИВНОСТЬ ==================== */
        @media (max-width: 480px) {
            .container {
                padding: 15px;
            }
            
            .code-input-digit {
                width: 60px;
                height: 80px;
                font-size: 2.8rem;
            }
            
            .code-key {
                height: 60px;
                font-size: 1.5rem;
            }
            
            .round-option {
                padding: 20px 10px;
            }
            
            .round-number {
                font-size: 2rem;
            }
        }
    </style>
</head>
<body class="theme-dark">
    <!-- Модальное окно ввода кода -->
    <div id="codeInputModal" class="code-input-modal">
        <div class="code-input-content">
            <h2 class="code-input-title">🔢 ВВЕДИТЕ КОД КОМНАТЫ</h2>
            
            <div class="code-input-container">
                <input type="text" class="code-input-digit" maxlength="1" data-index="0" onkeyup="moveToNext(this, 1)" onkeydown="handleDigitInput(event, 0)">
                <input type="text" class="code-input-digit" maxlength="1" data-index="1" onkeyup="moveToNext(this, 2)" onkeydown="handleDigitInput(event, 1)">
                <input type="text" class="code-input-digit" maxlength="1" data-index="2" onkeyup="moveToNext(this, 3)" onkeydown="handleDigitInput(event, 2)">
                <input type="text" class="code-input-digit" maxlength="1" data-index="3" onkeyup="moveToNext(this, 4)" onkeydown="handleDigitInput(event, 3)">
                <input type="text" class="code-input-digit" maxlength="1" data-index="4" onkeyup="moveToNext(this, 5)" onkeydown="handleDigitInput(event, 4)">
                <input type="text" class="code-input-digit" maxlength="1" data-index="5" onkeyup="moveToNext(this, 6)" onkeydown="handleDigitInput(event, 5)">
            </div>
            
            <div class="code-keyboard">
                <button class="code-key" onclick="addDigit('1')">1</button>
                <button class="code-key" onclick="addDigit('2')">2</button>
                <button class="code-key" onclick="addDigit('3')">3</button>
                <button class="code-key" onclick="addDigit('4')">4</button>
                <button class="code-key" onclick="addDigit('5')">5</button>
                <button class="code-key" onclick="addDigit('6')">6</button>
                <button class="code-key" onclick="addDigit('7')">7</button>
                <button class="code-key" onclick="addDigit('8')">8</button>
                <button class="code-key" onclick="addDigit('9')">9</button>
                <button class="code-key delete" onclick="deleteDigit()">⌫ УДАЛИТЬ</button>
                <button class="code-key" onclick="addDigit('0')">0</button>
                <button class="code-key enter" onclick="joinRoomByCode()">🚀 ВОЙТИ В КОМНАТУ</button>
            </div>
            
            <div class="code-hint">
                Введите 6-значный код комнаты, который вам отправил друг
            </div>
        </div>
    </div>

    <!-- Модальное окно выбора раундов -->
    <div id="roundsModal" class="code-input-modal">
        <div class="code-input-content">
            <h2 class="code-input-title">🎯 ВЫБЕРИТЕ КОЛИЧЕСТВО РАУНДОВ</h2>
            
            <div class="rounds-selection">
                <div class="round-option" data-rounds="3" onclick="selectRounds(3)">
                    <div class="round-number">3</div>
                    <div class="round-label">Короткая игра</div>
                </div>
                <div class="round-option" data-rounds="5" onclick="selectRounds(5)">
                    <div class="round-number">5</div>
                    <div class="round-label">Стандартная</div>
                </div>
                <div class="round-option" data-rounds="7" onclick="selectRounds(7)">
                    <div class="round-number">7</div>
                    <div class="round-label">Продвинутая</div>
                </div>
                <div class="round-option" data-rounds="9" onclick="selectRounds(9)">
                    <div class="round-number">9</div>
                    <div class="round-label">Эпическая битва</div>
                </div>
            </div>
            
            <button class="btn btn-success" onclick="createRoomWithRounds()" style="margin-top: 30px;">
                🚀 СОЗДАТЬ КОМНАТУ
            </button>
            
            <button class="btn" onclick="closeRoundsModal()" style="margin-top: 15px;">
                ⬅ НАЗАД
            </button>
        </div>
    </div>

    <!-- Основной контейнер -->
    <div class="container">
        <!-- Ваш существующий код остается здесь -->
        <!-- Заголовок, меню, лобби, игровое поле -->
        <!-- ... -->
    </div>

    <!-- JavaScript -->
    <script>
        // ==================== ПЕРЕМЕННЫЕ ДЛЯ FIREBASE ====================
        let currentRoom = null;
        let currentRoomCode = null;
        let selectedRounds = 5; // По умолчанию 5 раундов
        let totalRoundsHistory = []; // История всех сыгранных раундов
        let gameState = {
            // ... существующий state ...
            totalRounds: 5, // Добавляем общее количество раундов
            currentGameRound: 1, // Текущий раунд в игре
            gamesHistory: [] // История всех игр
        };

        // ==================== УПРАВЛЕНИЕ ВВОДОМ КОДА ====================
        function showCodeInput() {
            document.getElementById('codeInputModal').classList.add('active');
            // Сбрасываем все поля ввода
            document.querySelectorAll('.code-input-digit').forEach(input => {
                input.value = '';
                input.style.borderColor = 'rgba(255, 255, 255, 0.2)';
                input.style.background = 'rgba(255, 255, 255, 0.1)';
            });
            // Фокус на первый инпут
            document.querySelector('.code-input-digit[data-index="0"]').focus();
        }

        function closeCodeInput() {
            document.getElementById('codeInputModal').classList.remove('active');
        }

        function addDigit(digit) {
            const inputs = document.querySelectorAll('.code-input-digit');
            for (let i = 0; i < inputs.length; i++) {
                if (!inputs[i].value) {
                    inputs[i].value = digit;
                    inputs[i].style.borderColor = '#FFD700';
                    inputs[i].style.background = 'rgba(255, 215, 0, 0.1)';
                    
                    // Анимация ввода
                    inputs[i].style.transform = 'scale(1.2)';
                    setTimeout(() => {
                        inputs[i].style.transform = 'scale(1)';
                    }, 200);
                    
                    // Переход к следующему полю
                    if (i < inputs.length - 1) {
                        inputs[i + 1].focus();
                    }
                    break;
                }
            }
        }

        function deleteDigit() {
            const inputs = document.querySelectorAll('.code-input-digit');
            for (let i = inputs.length - 1; i >= 0; i--) {
                if (inputs[i].value) {
                    inputs[i].value = '';
                    inputs[i].style.borderColor = 'rgba(255, 255, 255, 0.2)';
                    inputs[i].style.background = 'rgba(255, 255, 255, 0.1)';
                    
                    // Анимация удаления
                    inputs[i].style.transform = 'scale(0.9)';
                    setTimeout(() => {
                        inputs[i].style.transform = 'scale(1)';
                    }, 200);
                    
                    inputs[i].focus();
                    break;
                }
            }
        }

        function moveToNext(input, nextIndex) {
            if (input.value && nextIndex < 6) {
                const nextInput = document.querySelector(`.code-input-digit[data-index="${nextIndex}"]`);
                if (nextInput) {
                    nextInput.focus();
                }
            }
        }

        function handleDigitInput(event, index) {
            const key = event.key;
            
            // Разрешаем только цифры
            if (!/^\d$/.test(key) && key !== 'Backspace' && key !== 'Delete' && key !== 'ArrowLeft' && key !== 'ArrowRight') {
                event.preventDefault();
                return;
            }
            
            const inputs = document.querySelectorAll('.code-input-digit');
            
            if (key === 'Backspace' || key === 'Delete') {
                event.preventDefault();
                if (inputs[index].value) {
                    inputs[index].value = '';
                    inputs[index].style.borderColor = 'rgba(255, 255, 255, 0.2)';
                    inputs[index].style.background = 'rgba(255, 255, 255, 0.1)';
                } else if (index > 0) {
                    inputs[index - 1].focus();
                }
            } else if (/^\d$/.test(key)) {
                inputs[index].value = key;
                inputs[index].style.borderColor = '#FFD700';
                inputs[index].style.background = 'rgba(255, 215, 0, 0.1)';
                
                if (index < 5) {
                    inputs[index + 1].focus();
                }
            }
        }

        // ==================== ВЫБОР РАУНДОВ ====================
        function showRoundsSelection() {
            document.getElementById('roundsModal').classList.add('active');
        }

        function closeRoundsModal() {
            document.getElementById('roundsModal').classList.remove('active');
        }

        function selectRounds(rounds) {
            selectedRounds = rounds;
            
            // Снимаем выделение со всех
            document.querySelectorAll('.round-option').forEach(option => {
                option.classList.remove('selected');
            });
            
            // Выделяем выбранное
            document.querySelector(`.round-option[data-rounds="${rounds}"]`).classList.add('selected');
        }

        // ==================== FIREBASE: СОЗДАНИЕ КОМНАТЫ ====================
        async function createRoomWithRounds() {
            try {
                // Генерируем код комнаты
                const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
                let code = '';
                for (let i = 0; i < 6; i++) {
                    code += chars.charAt(Math.floor(Math.random() * chars.length));
                }
                
                currentRoomCode = code;
                gameState.totalRounds = selectedRounds;
                
                // Создаем комнату в Firebase
                const roomRef = window.firebaseRef(window.database, `rooms/${code}`);
                const playerId = generatePlayerId();
                
                const roomData = {
                    code: code,
                    host: playerId,
                    hostName: gameState.telegramUser?.first_name || 'Игрок',
                    players: {
                        [playerId]: {
                            name: gameState.telegramUser?.first_name || 'Игрок',
                            ready: true,
                            score: 0,
                            isHost: true
                        }
                    },
                    status: 'waiting',
                    maxPlayers: 2,
                    currentPlayers: 1,
                    rounds: selectedRounds,
                    currentRound: 1,
                    createdAt: Date.now(),
                    gameState: {
                        totalRounds: selectedRounds,
                        currentGameRound: 1,
                        gamesHistory: []
                    }
                };
                
                await window.firebaseSet(roomRef, roomData);
                
                // Сохраняем ID игрока в localStorage
                localStorage.setItem('yahtzee_player_id', playerId);
                localStorage.setItem('yahtzee_current_room', code);
                
                // Подписываемся на изменения комнаты
                subscribeToRoom(code);
                
                // Показываем лобби
                closeRoundsModal();
                document.getElementById('mainMenu').classList.remove('active');
                document.getElementById('lobbyModal').classList.add('active');
                document.getElementById('roomCode').textContent = code;
                
                showNotification('Комната создана', `Код: ${code}\nРаундов: ${selectedRounds}`);
                playSound('click');
                
            } catch (error) {
                console.error('Ошибка создания комнаты:', error);
                showNotification('Ошибка', 'Не удалось создать комнату');
            }
        }

        // ==================== FIREBASE: ПРИСОЕДИНЕНИЕ ПО КОДУ ====================
        async function joinRoomByCode() {
            try {
                // Получаем код из полей ввода
                const inputs = document.querySelectorAll('.code-input-digit');
                let code = '';
                inputs.forEach(input => {
                    code += input.value;
                });
                
                if (code.length !== 6) {
                    showNotification('Ошибка', 'Введите 6-значный код');
                    return;
                }
                
                // Проверяем существование комнаты
                const roomRef = window.firebaseRef(window.database, `rooms/${code}`);
                const snapshot = await window.firebaseGet(roomRef);
                
                if (!snapshot.exists()) {
                    showNotification('Ошибка', 'Комната не найдена');
                    return;
                }
                
                const roomData = snapshot.val();
                
                // Проверяем, есть ли место в комнате
                if (roomData.currentPlayers >= roomData.maxPlayers) {
                    showNotification('Ошибка', 'Комната заполнена');
                    return;
                }
                
                // Проверяем статус комнаты
                if (roomData.status !== 'waiting') {
                    showNotification('Ошибка', 'Игра уже началась');
                    return;
                }
                
                currentRoomCode = code;
                
                // Добавляем игрока в комнату
                const playerId = generatePlayerId();
                const playerData = {
                    name: gameState.telegramUser?.first_name || 'Гость',
                    ready: true,
                    score: 0,
                    isHost: false
                };
                
                // Обновляем данные комнаты
                const updates = {};
                updates[`players/${playerId}`] = playerData;
                updates['currentPlayers'] = roomData.currentPlayers + 1;
                
                await window.firebaseUpdate(roomRef, updates);
                
                // Сохраняем ID игрока
                localStorage.setItem('yahtzee_player_id', playerId);
                localStorage.setItem('yahtzee_current_room', code);
                
                // Подписываемся на изменения комнаты
                subscribeToRoom(code);
                
                // Закрываем окно ввода кода и показываем лобби
                closeCodeInput();
                document.getElementById('mainMenu').classList.remove('active');
                document.getElementById('lobbyModal').classList.add('active');
                document.getElementById('roomCode').textContent = code;
                
                showNotification('Успех', 'Вы присоединились к комнате!');
                playSound('click');
                
            } catch (error) {
                console.error('Ошибка присоединения:', error);
                showNotification('Ошибка', 'Не удалось присоединиться');
            }
        }

        // ==================== FIREBASE: ПОДПИСКА НА КОМНАТУ ====================
        function subscribeToRoom(roomCode) {
            const roomRef = window.firebaseRef(window.database, `rooms/${roomCode}`);
            
            window.firebaseOnValue(roomRef, (snapshot) => {
                if (!snapshot.exists()) {
                    showNotification('Комната закрыта', 'Хост покинул комнату');
                    leaveRoom();
                    return;
                }
                
                const roomData = snapshot.val();
                currentRoom = roomData;
                
                // Обновляем интерфейс лобби
                updateLobbyUI(roomData);
                
                // Проверяем статус игры
                if (roomData.status === 'playing') {
                    // Начинаем игру
                    startMultiplayerGame(roomData);
                } else if (roomData.status === 'finished') {
                    // Показываем итоги
                    showFinalResults(roomData);
                }
            });
        }

        // ==================== ОБНОВЛЕНИЕ ИНТЕРФЕЙСА ЛОББИ ====================
        function updateLobbyUI(roomData) {
            const players = roomData.players;
            const playerCount = Object.keys(players).length;
            const isHost = checkIfHost();
            
            // Обновляем заголовок
            document.querySelector('.players-list h3').textContent = `ИГРОКИ (${playerCount}/2)`;
            
            // Обновляем список игроков
            const hostPlayer = document.getElementById('hostPlayer');
            const guestPlayer = document.getElementById('guestPlayer');
            
            // Находим хоста
            let hostId = null;
            Object.keys(players).forEach(playerId => {
                if (players[playerId].isHost) {
                    hostId = playerId;
                }
            });
            
            // Обновляем хост
            if (hostId && players[hostId]) {
                hostPlayer.querySelector('.player-name').textContent = players[hostId].name + ' (Хост)';
                hostPlayer.querySelector('.player-status').innerHTML = 
                    `<span class="status-dot ${players[hostId].ready ? '' : 'waiting'}"></span> ${players[hostId].ready ? 'Готов' : 'Не готов'}`;
                
                // Устанавливаем аватар
                const avatar = hostPlayer.querySelector('.player-avatar');
                if (players[hostId].name) {
                    avatar.textContent = players[hostId].name.charAt(0).toUpperCase();
                }
            }
            
            // Обновляем гостя
            const guestIds = Object.keys(players).filter(id => id !== hostId);
            if (guestIds.length > 0 && players[guestIds[0]]) {
                guestPlayer.style.opacity = '1';
                guestPlayer.querySelector('.player-name').textContent = players[guestIds[0]].name;
                guestPlayer.querySelector('.player-status').innerHTML = 
                    `<span class="status-dot ${players[guestIds[0]].ready ? '' : 'waiting'}"></span> ${players[guestIds[0]].ready ? 'Готов' : 'Не готов'}`;
                
                const avatar = guestPlayer.querySelector('.player-avatar');
                if (players[guestIds[0]].name) {
                    avatar.textContent = players[guestIds[0]].name.charAt(0).toUpperCase();
                }
            } else {
                guestPlayer.style.opacity = '0.5';
                guestPlayer.querySelector('.player-name').textContent = 'Ожидание игрока...';
                guestPlayer.querySelector('.player-status').innerHTML = 
                    '<span class="status-dot waiting"></span> Не подключен';
            }
            
            // Активируем кнопку старта если есть два игрока
            const startBtn = document.getElementById('startGameBtn');
            if (isHost && playerCount === 2) {
                startBtn.disabled = false;
            } else {
                startBtn.disabled = true;
            }
        }

        // ==================== FIREBASE: ЗАПУСК ИГРЫ ====================
        async function startGameFromLobby() {
            try {
                if (!currentRoomCode) return;
                
                const roomRef = window.firebaseRef(window.database, `rooms/${currentRoomCode}`);
                
                // Обновляем статус комнаты
                await window.firebaseUpdate(roomRef, {
                    status: 'playing',
                    gameState: {
                        ...currentRoom.gameState,
                        currentRound: 1,
                        currentPlayer: Object.keys(currentRoom.players)[0], // Первый игрок начинает
                        dice: [0, 0, 0, 0, 0],
                        rollsLeft: 3,
                        scores: {},
                        lastUpdate: Date.now()
                    }
                });
                
                showNotification('Игра началась!', 'Удачи!');
                playSound('win');
                
            } catch (error) {
                console.error('Ошибка запуска игры:', error);
                showNotification('Ошибка', 'Не удалось начать игру');
            }
        }

        // ==================== ИТОГИ ВСЕХ РАУНДОВ ====================
        function showFinalResults(roomData) {
            const resultsContainer = document.createElement('div');
            resultsContainer.className = 'final-results';
            
            // Подсчитываем результаты всех раундов
            const roundsHistory = roomData.gameState?.gamesHistory || [];
            const playerNames = {};
            
            // Получаем имена игроков
            Object.keys(roomData.players).forEach(playerId => {
                playerNames[playerId] = roomData.players[playerId].name;
            });
            
            // Подсчитываем общие очки
            const totalScores = {};
            Object.keys(playerNames).forEach(playerId => {
                totalScores[playerId] = 0;
            });
            
            // Заполняем историю раундов
            let roundsHTML = '';
            roundsHistory.forEach((round, index) => {
                const roundNumber = index + 1;
                let roundWinner = null;
                let maxScore = -1;
                
                // Находим победителя раунда
                Object.keys(round.scores || {}).forEach(playerId => {
                    const score = round.scores[playerId] || 0;
                    totalScores[playerId] = (totalScores[playerId] || 0) + score;
                    
                    if (score > maxScore) {
                        maxScore = score;
                        roundWinner = playerId;
                    }
                });
                
                roundsHTML += `
                    <div class="round-result ${roundWinner ? 'round-winner' : ''}">
                        <div class="round-name">Раунд ${roundNumber}</div>
                        <div class="round-scores">
                            ${Object.keys(playerNames).map(playerId => `
                                <div class="round-score">
                                    <div class="round-player">${playerNames[playerId]}</div>
                                    <div class="round-value">${round.scores?.[playerId] || 0}</div>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                `;
            });
            
            // Определяем общего победителя
            let finalWinner = null;
            let finalMaxScore = -1;
            Object.keys(totalScores).forEach(playerId => {
                if (totalScores[playerId] > finalMaxScore) {
                    finalMaxScore = totalScores[playerId];
                    finalWinner = playerId;
                }
            });
            
            resultsContainer.innerHTML = `
                <h2 class="final-title">🏆 ИТОГИ ТУРНИРА</h2>
                <div class="rounds-history">
                    ${roundsHTML}
                </div>
                <div class="total-results">
                    ${Object.keys(playerNames).map(playerId => `
                        <div class="total-box ${playerId === finalWinner ? 'winner' : ''}">
                            ${playerId === finalWinner ? '<div class="champion-crown">👑</div>' : ''}
                            <div class="total-label">${playerNames[playerId]}</div>
                            <div class="total-value">${totalScores[playerId] || 0}</div>
                            <div style="font-size: 0.9rem; opacity: 0.8; margin-top: 10px;">
                                ${playerId === finalWinner ? 'ПОБЕДИТЕЛЬ!' : ''}
                            </div>
                        </div>
                    `).join('')}
                </div>
                <button class="btn btn-success" onclick="returnToMainMenu()" style="margin-top: 30px;">
                    🏠 В ГЛАВНОЕ МЕНЮ
                </button>
            `;
            
            // Показываем результаты
            document.getElementById('gameBoard').style.display = 'none';
            document.body.appendChild(resultsContainer);
            
            // Создаем конфетти для победителя
            createConfetti(200);
        }

        // ==================== ВСПОМОГАТЕЛЬНЫЕ ФУНКЦИИ ====================
        function generatePlayerId() {
            return 'player_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9);
        }

        function checkIfHost() {
            const playerId = localStorage.getItem('yahtzee_player_id');
            return currentRoom?.players?.[playerId]?.isHost || false;
        }

        function leaveRoom() {
            if (currentRoomCode) {
                // Удаляем игрока из комнаты
                const playerId = localStorage.getItem('yahtzee_player_id');
                if (playerId && currentRoom?.players?.[playerId]) {
                    const roomRef = window.firebaseRef(window.database, `rooms/${currentRoomCode}`);
                    const updates = {};
                    updates[`players/${playerId}`] = null;
                    updates['currentPlayers'] = Math.max(0, (currentRoom.currentPlayers || 1) - 1);
                    
                    // Если хост выходит, удаляем комнату
                    if (currentRoom.players[playerId].isHost) {
                        window.firebaseRemove(roomRef);
                    } else {
                        window.firebaseUpdate(roomRef, updates);
                    }
                }
                
                // Очищаем localStorage
                localStorage.removeItem('yahtzee_current_room');
            }
            
            // Возвращаемся в главное меню
            showMainMenu();
        }

        // ==================== ОБНОВЛЕНИЕ ФУНКЦИЙ МЕНЮ ====================
        function createRoom() {
            showRoundsSelection();
        }

        function joinRoom() {
            showCodeInput();
        }

        // Инициализация при загрузке
        window.addEventListener('DOMContentLoaded', () => {
            // Проверяем, есть ли сохраненная комната
            const savedRoom = localStorage.getItem('yahtzee_current_room');
            if (savedRoom) {
                // Пытаемся переподключиться
                subscribeToRoom(savedRoom);
            }
        });
    </script>
</body>
</html>
