<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BRAWL SPY | Шпионская игра</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* ========== ОСНОВНЫЕ СТИЛИ ========== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0A0A0F;
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
        }

        .container {
            width: 100%;
            max-width: 500px;
            min-height: 600px;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 30px 20px;
            position: relative;
        }

        /* Скрываем все экраны кроме активного */
        .screen {
            display: none;
            width: 100%;
            flex-direction: column;
            align-items: center;
            gap: 30px;
            animation: fadeIn 0.5s ease;
        }

        .screen.active {
            display: flex;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* ========== ЛОГОТИП ========== */
        .logo {
            text-align: center;
            margin-bottom: 20px;
        }

        .logo-text {
            font-size: 3.5rem;
            font-weight: 900;
            letter-spacing: 5px;
            text-transform: uppercase;
            background: linear-gradient(45deg, #FF0000, #8B0000, #FF4500);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: 0 0 30px rgba(255, 0, 0, 0.5);
            animation: logoGlow 2s infinite alternate;
        }

        @keyframes logoGlow {
            from { text-shadow: 0 0 30px rgba(255, 0, 0, 0.5); }
            to { text-shadow: 0 0 40px rgba(255, 69, 0, 0.8); }
        }

        /* ========== КНОПКИ ========== */
        .btn {
            width: 100%;
            max-width: 350px;
            padding: 22px;
            border: none;
            border-radius: 15px;
            font-size: 1.3rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.4);
            position: relative;
            overflow: hidden;
        }

        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.5);
        }

        .btn:active {
            transform: translateY(1px);
        }

        .btn-main {
            background: linear-gradient(135deg, #8B0000, #B22222, #8B0000);
            color: #FFD700;
            border: 2px solid #FF4500;
        }

        .btn-main:hover {
            background: linear-gradient(135deg, #9E0000, #C22, #9E0000);
            box-shadow: 0 0 25px rgba(255, 69, 0, 0.6);
        }

        .btn-secondary {
            background: linear-gradient(135deg, #1A1A1A, #2D2D2D, #1A1A1A);
            color: #00CED1;
            border: 2px solid #008B8B;
        }

        .btn-secondary:hover {
            background: linear-gradient(135deg, #222, #333, #222);
            box-shadow: 0 0 20px rgba(0, 139, 139, 0.5);
        }

        .btn-danger {
            background: linear-gradient(135deg, #222, #111, #222);
            color: #FF6347;
            border: 2px solid #8B0000;
        }

        .btn-danger:hover {
            background: linear-gradient(135deg, #2A2A2A, #1A1A1A, #2A2A2A);
            box-shadow: 0 0 20px rgba(139, 0, 0, 0.5);
        }

        .btn-success {
            background: linear-gradient(135deg, #006400, #228B22, #006400);
            color: white;
            border: 2px solid #32CD32;
        }

        .btn-success:hover {
            background: linear-gradient(135deg, #228B22, #32CD32, #228B22);
            box-shadow: 0 0 20px rgba(50, 205, 50, 0.5);
        }

        /* ========== ПОЛЕ ВВОДА ID ========== */
        .input-group {
            width: 100%;
            max-width: 350px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            margin-top: 10px;
        }

        .input-label {
            color: #B0B7C3;
            font-size: 1.1rem;
            text-align: center;
            margin-bottom: 5px;
        }

        .id-input-container {
            display: flex;
            justify-content: center;
            gap: 10px;
        }

        .id-digit {
            width: 50px;
            height: 60px;
            font-size: 2rem;
            text-align: center;
            border: 2px solid #008B8B;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.1);
            color: #00CED1;
            outline: none;
        }

        .id-digit:focus {
            border-color: #00CED1;
            box-shadow: 0 0 10px rgba(0, 206, 209, 0.5);
        }

        .id-separator {
            color: #00CED1;
            font-size: 2rem;
            line-height: 60px;
            font-weight: bold;
        }

        /* ========== НАСТРОЙКИ ЛОББИ ========== */
        .settings-container {
            width: 100%;
            max-width: 350px;
            display: flex;
            flex-direction: column;
            gap: 25px;
        }

        .setting-item {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            padding: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .setting-title {
            color: #FFD700;
            font-size: 1.2rem;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .room-id {
            font-size: 1.8rem;
            color: #00CED1;
            text-align: center;
            letter-spacing: 3px;
            font-weight: bold;
            background: rgba(0, 206, 209, 0.1);
            padding: 15px;
            border-radius: 8px;
            border: 1px dashed #00CED1;
        }

        .counter-controls {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
        }

        .counter-btn {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            border: 2px solid #FF4500;
            background: #8B0000;
            color: white;
            font-size: 1.5rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }

        .counter-btn:hover {
            background: #B22222;
            transform: scale(1.1);
        }

        .counter-value {
            font-size: 2rem;
            color: #FFD700;
            min-width: 60px;
            text-align: center;
            font-weight: bold;
        }

        /* ========== АДАПТИВ ========== */
        @media (max-width: 600px) {
            .container { padding: 20px 15px; }
            .logo-text { font-size: 2.8rem; }
            .btn { padding: 20px; font-size: 1.2rem; }
            .id-digit { width: 40px; height: 50px; font-size: 1.8rem; }
        }
    </style>
</head>
<body>
    <!-- КОНТЕЙНЕР ВСЕЙ ИГРЫ -->
    <div class="container">
        
        <!-- ЭКРАН 1: ГЛАВНОЕ МЕНЮ -->
        <div class="screen active" id="mainMenu">
            <div class="logo">
                <h1 class="logo-text">BRAWL SPY</h1>
            </div>
            
            <button class="btn btn-main" id="createLobbyBtn">
                <i class="fas fa-plus-circle"></i>
                1. СОЗДАТЬ ЛОББИ
            </button>
            
            <button class="btn btn-secondary" id="joinByIdBtn">
                <i class="fas fa-door-closed"></i>
                2. ВХОД ПО ID
            </button>
            
            <button class="btn btn-danger" id="exitBtn">
                <i class="fas fa-sign-out-alt"></i>
                3. ВЫХОД
            </button>
        </div>

        <!-- ЭКРАН 2: ВХОД ПО ID -->
        <div class="screen" id="joinByIdScreen">
            <div class="logo">
                <h1 class="logo-text">ВХОД ПО ID</h1>
            </div>
            
            <div class="input-group">
                <div class="input-label">ВВЕДИТЕ ID ЛОББИ:</div>
                
                <div class="id-input-container">
                    <input type="text" class="id-digit" maxlength="3" id="id1">
                    <span class="id-separator">-</span>
                    <input type="text" class="id-digit" maxlength="3" id="id2">
                    <span class="id-separator">-</span>
                    <input type="text" class="id-digit" maxlength="3" id="id3">
                </div>
                
                <button class="btn btn-success" id="joinBtn">
                    <i class="fas fa-check"></i>
                    ПОДКЛЮЧИТЬСЯ
                </button>
                
                <button class="btn btn-secondary" id="backFromJoinBtn">
                    <i class="fas fa-arrow-left"></i>
                    НАЗАД
                </button>
            </div>
        </div>

        <!-- ЭКРАН 3: НАСТРОЙКА ЛОББИ -->
        <div class="screen" id="lobbyScreen">
            <div class="logo">
                <h1 class="logo-text">НАСТРОЙКА ЛОББИ</h1>
            </div>
            
            <div class="settings-container">
                <!-- ID КОМНАТЫ -->
                <div class="setting-item">
                    <div class="setting-title">
                        <i class="fas fa-hashtag"></i>
                        ID КОМНАТЫ:
                    </div>
                    <div class="room-id" id="roomId">X7F-9K3-AL</div>
                </div>

                <!-- ТЕЛЕГРАМ ЮЗЕР -->
                <div class="setting-item">
                    <div class="setting-title">
                        <i class="fab fa-telegram"></i>
                        ТГ ЮЗЕР:
                    </div>
                    <div style="text-align: center; padding: 10px;">
                        <button class="btn btn-secondary" style="width: 100%;" id="tgBtn">
                            <i class="fab fa-telegram"></i>
                            ПОДКЛЮЧИТЬ ТЕЛЕГРАМ
                        </button>
                    </div>
                </div>

                <!-- УЧАСТНИКИ -->
                <div class="setting-item">
                    <div class="setting-title">
                        <i class="fas fa-users"></i>
                        УЧАСТНИКИ:
                    </div>
                    <div class="counter-controls">
                        <button class="counter-btn" id="decreasePlayers">-</button>
                        <div class="counter-value" id="playersCount">4</div>
                        <button class="counter-btn" id="increasePlayers">+</button>
                    </div>
                </div>

                <!-- ШПИОНЫ -->
                <div class="setting-item">
                    <div class="setting-title">
                        <i class="fas fa-user-secret"></i>
                        ШПИОНЫ:
                    </div>
                    <div class="counter-controls">
                        <button class="counter-btn" id="decreaseSpies">-</button>
                        <div class="counter-value" id="spiesCount">1</div>
                        <button class="counter-btn" id="increaseSpies">+</button>
                    </div>
                </div>

                <!-- КНОПКИ УПРАВЛЕНИЯ -->
                <button class="btn btn-success" id="startGameBtn">
                    <i class="fas fa-play"></i>
                    НАЧАТЬ ИГРУ
                </button>
                
                <button class="btn btn-secondary" id="backFromLobbyBtn">
                    <i class="fas fa-arrow-left"></i>
                    НАЗАД
                </button>
            </div>
        </div>

    </div>

    <script>
        // ========== ПЕРЕКЛЮЧЕНИЕ ЭКРАНОВ ==========
        const screens = {
            main: document.getElementById('mainMenu'),
            join: document.getElementById('joinByIdScreen'),
            lobby: document.getElementById('lobbyScreen')
        };

        function showScreen(screenName) {
            // Скрываем все экраны
            Object.values(screens).forEach(screen => {
                screen.classList.remove('active');
            });
            // Показываем нужный экран
            screens[screenName].classList.add('active');
        }

        // ========== ГЛАВНОЕ МЕНЮ ==========
        document.getElementById('createLobbyBtn').addEventListener('click', () => {
            // Генерируем новый ID комнаты
            const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ0123456789';
            let id = '';
            for (let i = 0; i < 9; i++) {
                id += chars[Math.floor(Math.random() * chars.length)];
                if ((i + 1) % 3 === 0 && i < 8) id += '-';
            }
            document.getElementById('roomId').textContent = id;
            
            showScreen('lobby');
        });

        document.getElementById('joinByIdBtn').addEventListener('click', () => {
            // Очищаем поля ввода
            ['id1', 'id2', 'id3'].forEach(id => {
                document.getElementById(id).value = '';
            });
            showScreen('join');
        });

        document.getElementById('exitBtn').addEventListener('click', () => {
            if (confirm('Вы уверены, что хотите выйти из игры?')) {
                alert('Выход из игры...');
                // Здесь код для реального выхода
            }
        });

        // ========== ВХОД ПО ID ==========
        // Автопереход между полями ввода
        const idInputs = ['id1', 'id2', 'id3'];
        idInputs.forEach((id, index) => {
            const input = document.getElementById(id);
            
            input.addEventListener('input', (e) => {
                // Удаляем все кроме букв и цифр
                e.target.value = e.target.value.replace(/[^A-Za-z0-9]/g, '').toUpperCase();
                
                // Автопереход на следующее поле
                if (e.target.value.length === 3 && index < 2) {
                    document.getElementById(idInputs[index + 1]).focus();
                }
            });
            
            // Поддержка Backspace
            input.addEventListener('keydown', (e) => {
                if (e.key === 'Backspace' && e.target.value.length === 0 && index > 0) {
                    document.getElementById(idInputs[index - 1]).focus();
                }
            });
        });

        // Кнопка подключения
        document.getElementById('joinBtn').addEventListener('click', () => {
            const id1 = document.getElementById('id1').value;
            const id2 = document.getElementById('id2').value;
            const id3 = document.getElementById('id3').value;
            
            if (id1.length === 3 && id2.length === 3 && id3.length === 3) {
                const fullId = `${id1}-${id2}-${id3}`;
                alert(`Подключение к лобби: ${fullId}\nПроверка соединения...`);
                // Здесь код для реального подключения
                showScreen('lobby');
            } else {
                alert('Ошибка! Введите полный ID (9 символов)');
            }
        });

        document.getElementById('backFromJoinBtn').addEventListener('click', () => {
            showScreen('main');
        });

        // ========== НАСТРОЙКА ЛОББИ ==========
        // Управление количеством игроков
        let playersCount = 4;
        let spiesCount = 1;

        document.getElementById('increasePlayers').addEventListener('click', () => {
            if (playersCount < 10) {
                playersCount++;
                document.getElementById('playersCount').textContent = playersCount;
                updateSpiesMax();
            }
        });

        document.getElementById('decreasePlayers').addEventListener('click', () => {
            if (playersCount > 3) {
                playersCount--;
                document.getElementById('playersCount').textContent = playersCount;
                updateSpiesMax();
            }
        });

        // Управление количеством шпионов
        document.getElementById('increaseSpies').addEventListener('click', () => {
            if (spiesCount < Math.floor(playersCount / 2)) {
                spiesCount++;
                document.getElementById('spiesCount').textContent = spiesCount;
            }
        });

        document.getElementById('decreaseSpies').addEventListener('click', () => {
            if (spiesCount > 1) {
                spiesCount--;
                document.getElementById('spiesCount').textContent = spiesCount;
            }
        });

        function updateSpiesMax() {
            const maxSpies = Math.floor(playersCount / 2);
            if (spiesCount > maxSpies) {
                spiesCount = maxSpies;
                document.getElementById('spiesCount').textContent = spiesCount;
            }
        }

        // Телеграм кнопка
        document.getElementById('tgBtn').addEventListener('click', () => {
            alert('Открывается Telegram для подключения...\nБот: @BrawlSpyBot');
            // Здесь код для подключения Telegram
        });

        // Начать игру
        document.getElementById('startGameBtn').addEventListener('click', () => {
            if (spiesCount >= playersCount) {
                alert('Ошибка! Количество шпионов не может быть больше или равно количеству игроков');
                return;
            }
            
            const settings = {
                roomId: document.getElementById('roomId').textContent,
                players: playersCount,
                spies: spiesCount
            };
            
            alert(`Игра начинается!\n\nНастройки:\n• ID комнаты: ${settings.roomId}\n• Игроков: ${settings.players}\n• Шпионов: ${settings.spies}\n\nУдачи!`);
            // Здесь код для начала игры
        });

        document.getElementById('backFromLobbyBtn').addEventListener('click', () => {
            showScreen('main');
        });

        // ========== ИНИЦИАЛИЗАЦИЯ ==========
        // Устанавливаем фокус на первое поле ввода при открытии экрана входа
        document.getElementById('joinByIdBtn').addEventListener('click', () => {
            setTimeout(() => {
                document.getElementById('id1').focus();
            }, 100);
        });

        console.log('BRAWL SPY v1.0 запущен! Все системы работают.');
    </script>
</body>
</html>
