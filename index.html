<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>BRAWL STARS: SPY EDITION - ULTIMATE VERSION</title>
    
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Black+Ops+One&family=Rubik+One&family=Exo+2:wght@900&display=swap" rel="stylesheet">
    
    <style>
        /* --- ОСНОВНЫЕ ПЕРЕМЕННЫЕ ЦВЕТА --- */
        :root {
            --bg-color: #050508;
            --panel-color: #0c0c0f;
            --neon-blue: #4CC9F0;
            --neon-red: #FF0000; /* Тот самый алый */
            --white: #FFFFFF;
            --gold: #ffcc00;
            --tg-blue: #0088cc;
        }

        /* --- ГЛОБАЛЬНЫЕ СТИЛИ --- */
        * { 
            box-sizing: border-box; 
            margin: 0; 
            padding: 0; 
            user-select: none; 
            -webkit-tap-highlight-color: transparent;
        }
        
        body { 
            background-color: var(--bg-color); 
            color: var(--white); 
            height: 100vh; 
            width: 100vw;
            overflow: hidden; 
            display: flex; 
            flex-direction: column; 
            align-items: center;
            font-family: 'Rubik One', sans-serif;
        }

        /* --- 1, 2, 3: СЕКЦИЯ ШПИОН (ВЕРХ, ШИРИНА, АЛЫЙ НЕОН) --- */
        .main-title-container {
            text-align: center;
            margin-top: 35px;
            z-index: 10;
        }

        .title-spy { 
            font-size: 90px; 
            color: var(--white); 
            text-transform: uppercase;
            letter-spacing: -3px;
            display: inline-block;
            transform: scaleX(1.4); /* Очень широкий шрифт по твоему запросу */
            line-height: 0.85;
            /* Сильное алое свечение */
            text-shadow: 
                0 0 10px var(--neon-red), 
                0 0 25px var(--neon-red), 
                0 0 45px var(--neon-red),
                0 0 70px var(--neon-red);
        }

        /* --- 4, 6: BRAWL STARS EDITION (ОБЪЕМ И СВЕЧЕНИЕ) --- */
        .title-brawl {
            font-family: 'Black Ops One', cursive;
            font-size: 36px;
            color: var(--gold);
            text-transform: uppercase;
            margin-top: 15px;
            letter-spacing: 1px;
            /* Объем текста */
            text-shadow: 
                3px 3px 0px #000,
                0 0 10px rgba(255, 204, 0, 0.4);
        }

        .title-edition {
            font-family: 'Exo 2', sans-serif;
            font-size: 20px;
            color: var(--white);
            letter-spacing: 10px;
            text-transform: uppercase;
            margin-top: -3px;
            opacity: 0.9;
            text-shadow: 0 0 8px rgba(255, 255, 255, 0.5);
        }

        /* --- 5: ТГ ЮЗЕР БАР (ПОД EDITION) --- */
        .tg-user-container {
            margin-top: 20px;
            display: flex;
            align-items: center;
            gap: 12px;
            background: rgba(0, 0, 0, 0.7);
            padding: 10px 25px;
            border-radius: 60px;
            border: 2px solid var(--neon-blue);
            box-shadow: 0 0 15px var(--neon-blue), inset 0 0 8px var(--neon-blue);
        }

        .tg-avatar { 
            width: 35px; 
            height: 35px; 
            border-radius: 50%; 
            border: 2px solid var(--neon-blue);
            object-fit: cover;
        }

        .tg-username { 
            font-family: 'Exo 2', sans-serif;
            font-size: 16px; 
            color: var(--neon-blue); 
            text-transform: uppercase;
            font-weight: 900;
            letter-spacing: 1px;
        }

        /* --- КНОПКИ (БЕЛЫЙ ТЕКСТ И НЕОН) --- */
        .screens-wrapper {
            flex: 1;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .screen { 
            display: none; 
            width: 100%; 
            height: 100%; 
            flex-direction: column; 
            align-items: center; 
            padding: 20px 30px;
        }

        .screen.active { display: flex; }

        .btn-main-action {
            width: 100%;
            max-width: 340px;
            padding: 22px;
            margin-bottom: 20px;
            border-radius: 20px;
            background: #000;
            border: 2px solid var(--neon-blue);
            color: var(--white); /* 4: Белый текст */
            font-size: 22px;
            text-transform: uppercase;
            font-family: 'Exo 2', sans-serif;
            font-weight: 900;
            box-shadow: 0 0 15px var(--neon-blue), inset 0 0 10px var(--neon-blue);
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-main-action:active {
            transform: scale(0.95);
            box-shadow: 0 0 25px var(--neon-blue);
        }

        /* --- 7: КНОПКА НАЗАД (БЕЛАЯ) --- */
        .btn-back-nav { 
            position: absolute; 
            top: 15px; 
            left: 20px;
            background: none; 
            border: none; 
            color: var(--white); /* 7: Белый цвет */
            font-family: 'Exo 2', sans-serif;
            font-size: 16px; 
            font-weight: 900;
            text-transform: uppercase;
            cursor: pointer;
            z-index: 1000;
            opacity: 0.8;
        }

        /* --- ИНПУТЫ И ПОЛЯ --- */
        .id-display-box {
            font-size: 50px;
            color: var(--neon-blue);
            border: 3px solid var(--neon-blue);
            padding: 15px 40px;
            border-radius: 25px;
            box-shadow: 0 0 20px var(--neon-blue), inset 0 0 10px var(--neon-blue);
            margin: 40px 0;
            font-family: 'Black Ops One';
            background: rgba(0,0,0,0.5);
        }

        /* --- 3D КАРТА ИГРОКА --- */
        .card-perspective {
            width: 300px;
            height: 420px;
            perspective: 1500px;
            margin-top: 20px;
        }

        .card-flip-engine {
            position: relative;
            width: 100%;
            height: 100%;
            transition: transform 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            transform-style: preserve-3d;
            cursor: pointer;
        }

        .card-flip-engine.is-flipped {
            transform: rotateY(180deg);
        }

        .card-side-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: 40px;
            border: 8px solid var(--neon-blue);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: var(--panel-color);
            box-shadow: 0 0 30px var(--neon-blue);
        }

        .card-side-back {
            transform: rotateY(180deg);
            background: var(--white);
            color: #000;
            border-color: var(--neon-red);
            box-shadow: 0 0 30px var(--neon-red);
        }

        .brawler-portrait {
            width: 250px;
            height: 250px;
            object-fit: contain;
            filter: drop-shadow(0 5px 15px rgba(0,0,0,0.3));
        }

        /* --- ТАЙМЕР --- */
        .game-timer-val {
            font-size: 90px;
            color: var(--neon-red);
            text-shadow: 0 0 25px var(--neon-red);
            font-family: 'Black Ops One';
            margin-top: 40px;
        }
    </style>
</head>
<body>

    <div class="main-title-container">
        <h1 class="title-spy">ШПИОН</h1>
        <h2 class="title-brawl">BRAWL STARS</h2>
        <p class="title-edition">edition</p>

        <div id="tg-profile-bar" class="tg-user-container">
            <img id="tg-avatar-img" class="tg-avatar" src="https://cdn-icons-png.flaticon.com/512/149/149071.png">
            <div class="tg-user-info">
                <span id="tg-name-label">BRAWLER</span>
            </div>
        </div>
    </div>

    <div class="screens-wrapper">
        
        <div id="scr-main-menu" class="screen active">
            <div style="margin-top: auto; width: 100%; display: flex; flex-direction: column; align-items: center;">
                <button class="btn-main-action" onclick="handleCreateRoom()">Создать комнату</button>
                <button class="btn-main-action" onclick="navigateTo('scr-join-room')">Поиск по коду</button>
            </div>
        </div>

        <div id="scr-join-room" class="screen">
            <button class="btn-back-nav" onclick="navigateTo('scr-main-menu')">← НАЗАД</button>
            <h2 style="font-family: 'Exo 2'; margin-top: 50px; text-transform: uppercase;">Ввод кода</h2>
            <input type="number" class="id-display-box" style="background: none; text-align: center; width: 280px;" placeholder="0000">
            <button class="btn-main-action" onclick="alert('Поиск активной сессии...')">Войти</button>
        </div>

        <div id="scr-lobby-room" class="screen">
            <button class="btn-back-nav" onclick="navigateTo('scr-main-menu')">← ВЫЙТИ</button>
            <div class="id-display-box" id="generated-id">----</div>
            
            <div style="width: 100%; margin-bottom: 20px;">
                <p style="text-align: center; opacity: 0.6; font-family: 'Exo 2'; margin-bottom: 15px;">ИГРОКИ В КОМНАТЕ: 3/10</p>
            </div>

            <div style="margin-top: auto; width: 100%; display: flex; flex-direction: column; align-items: center;">
                <button class="btn-main-action" style="border-color: var(--tg-blue); box-shadow: 0 0 15px var(--tg-blue);" onclick="handleInvite()">Пригласить друга</button>
                <button class="btn-main-action" onclick="handleStartGame()">Начать игру</button>
            </div>
        </div>

        <div id="scr-gameplay" class="screen">
            <h3 id="current-player-turn" style="color: var(--neon-blue); font-family: 'Exo 2'; font-size: 24px;">ИГРОК 1</h3>
            
            <div class="card-perspective" onclick="handleCardFlip()">
                <div id="main-card-engine" class="card-flip-engine">
                    <div class="card-side-face">
                        <h1 style="font-size: 150px; color: var(--neon-blue); text-shadow: 0 0 30px var(--neon-blue);">?</h1>
                    </div>
                    <div class="card-side-face card-side-back" id="card-content-target">
                        </div>
                </div>
            </div>

            <div id="active-timer-ui" style="display: none; text-align: center;">
                <div id="timer-countdown-val" class="game-timer-val">05:00</div>
                <p style="font-family: 'Exo 2'; letter-spacing: 5px; color: var(--white);">ОБСУЖДЕНИЕ</p>
            </div>

            <button id="btn-next-step" class="btn-main-action" style="visibility: hidden; margin-top: auto;" onclick="handleNextPlayer()">ДАЛЕЕ</button>
        </div>

    </div>

    <script>
        const tgApp = window.Telegram.WebApp;
        tgApp.expand();

        // РАСШИРЕННАЯ БАЗА БРАВЛЕРОВ (ЧТОБЫ КОД БЫЛ ВЕСОМЫМ)
        const DATABASE_BRAWLERS = [
            { name: "ШЕЛЛИ", img: "https://cdn.brawlstats.com/character-arts/16000000.png" },
            { name: "КОЛЬТ", img: "https://cdn.brawlstats.com/character-arts/16000001.png" },
            { name: "БУЛЛ", img: "https://cdn.brawlstats.com/character-arts/16000002.png" },
            { name: "БРОК", img: "https://cdn.brawlstats.com/character-arts/16000005.png" },
            { name: "ЭЛЬ ПРИМО", img: "https://cdn.brawlstats.com/character-arts/16000012.png" },
            { name: "ПОКО", img: "https://cdn.brawlstats.com/character-arts/16000011.png" },
            { name: "ЛЕОН", img: "https://cdn.brawlstats.com/character-arts/16000017.png" },
            { name: "СПАЙК", img: "https://cdn.brawlstats.com/character-arts/16000007.png" },
            { name: "КРОУ", img: "https://cdn.brawlstats.com/character-arts/16000008.png" },
            { name: "МОРТИС", img: "https://cdn.brawlstats.com/character-arts/16000014.png" },
            { name: "ЭДГАР", img: "https://cdn.brawlstats.com/character-arts/16000042.png" },
            { name: "СЭНДИ", img: "https://cdn.brawlstats.com/character-arts/16000029.png" }
        ];

        let gameState = {
            playersCount: 3,
            currentPlayerIndex: 0,
            assignedRoles: [],
            isCardFlipped: false,
            gameTimerSeconds: 300,
            roomCode: "0000"
        };

        // ИНИЦИАЛИЗАЦИЯ ТЕЛЕГРАМ
        window.onload = () => {
            const userData = tgApp.initDataUnsafe?.user;
            if (userData) {
                document.getElementById('tg-name-label').innerText = userData.first_name;
                if (userData.photo_url) document.getElementById('tg-avatar-img').src = userData.photo_url;
            }
            tgApp.ready();
        };

        // НАВИГАЦИЯ МЕЖДУ ЭКРАНАМИ
        function navigateTo(screenId) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(screenId).classList.add('active');
            
            // Скрытие ТГ-бара на игровых экранах по пункту 2
            const bar = document.getElementById('tg-profile-bar');
            if (screenId === 'scr-lobby-room' || screenId === 'scr-gameplay') {
                bar.style.display = 'none';
            } else {
                bar.style.display = 'flex';
            }
            tgApp.HapticFeedback.impactOccurred('medium');
        }

        // СОЗДАНИЕ КОМНАТЫ
        function handleCreateRoom() {
            gameState.roomCode = Math.floor(1000 + Math.random() * 9000);
            document.getElementById('generated-id').innerText = gameState.roomCode;
            navigateTo('scr-lobby-room');
        }

        // ПРИГЛАШЕНИЕ
        function handleInvite() {
            tgApp.switchInlineQuery("Заходи в Шпиона! Код нашей комнаты: " + gameState.roomCode);
        }

        // ЛОГИКА СТАРТА ИГРЫ
        function handleStartGame() {
            gameState.currentPlayerIndex = 0;
            gameState.assignedRoles = [];
            gameState.isCardFlipped = false;
            gameState.gameTimerSeconds = 300;

            const spyIndex = Math.floor(Math.random() * gameState.playersCount);
            const randomBrawler = DATABASE_BRAWLERS[Math.floor(Math.random() * DATABASE_BRAWLERS.length)];

            for (let i = 0; i < gameState.playersCount; i++) {
                if (i === spyIndex) {
                    gameState.assignedRoles.push({ name: "ШПИОН", img: "https://cdn-icons-png.flaticon.com/512/953/953791.png" });
                } else {
                    gameState.assignedRoles.push(randomBrawler);
                }
            }

            navigateTo('scr-gameplay');
            updateTurnUI();
        }

        // ПЕРЕВОРОТ КАРТЫ
        function handleCardFlip() {
            if (gameState.isCardFlipped) return;

            const role = gameState.assignedRoles[gameState.currentPlayerIndex];
            const content = document.getElementById('card-content-target');
            
            content.innerHTML = `
                <h2 style="font-family: 'Exo 2'; font-size: 38px; margin-bottom: 10px;">${role.name}</h2>
                <img src="${role.img}" class="brawler-portrait">
            `;

            document.getElementById('main-card-engine').classList.add('is-flipped');
            document.getElementById('btn-next-step').style.visibility = 'visible';
            gameState.isCardFlipped = true;
            tgApp.HapticFeedback.impactOccurred('heavy');
        }

        // СЛЕДУЮЩИЙ ИГРОК
        function handleNextPlayer() {
            gameState.currentPlayerIndex++;

            if (gameState.currentPlayerIndex < gameState.playersCount) {
                gameState.isCardFlipped = false;
                document.getElementById('main-card-engine').classList.remove('is-flipped');
                document.getElementById('btn-next-step').style.visibility = 'hidden';
                setTimeout(updateTurnUI, 300);
            } else {
                startDiscussionTimer();
            }
        }

        function updateTurnUI() {
            document.getElementById('current-player-turn').innerText = "ИГРОК " + (gameState.currentPlayerIndex + 1);
        }

        // ТАЙМЕР
        function startDiscussionTimer() {
            document.getElementById('main-card-engine').parentElement.style.display = 'none';
            document.getElementById('btn-next-step').style.display = 'none';
            document.getElementById('active-timer-ui').style.display = 'block';
            document.getElementById('current-player-turn').innerText = "КТО ПРЕДАТЕЛЬ?";

            const interval = setInterval(() => {
                gameState.gameTimerSeconds--;
                const mins = Math.floor(gameState.gameTimerSeconds / 60);
                const secs = gameState.gameTimerSeconds % 60;
                document.getElementById('timer-countdown-val').innerText = `${mins}:${secs < 10 ? '0' + secs : secs}`;

                if (gameState.gameTimerSeconds <= 0) {
                    clearInterval(interval);
                    tgApp.HapticFeedback.notificationOccurred('error');
                }
            }, 1000);
        }
    </script>
</body>
</html>
