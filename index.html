<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>BRAWL SPY 2026 - ULTIMATE</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Black+Ops+One&display=swap" rel="stylesheet">
    
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>
        :root {
            --bg-deep: #0b0e14;
            --clr-gold-top: #ffdc00;
            --clr-gold-bottom: #ff8c00;
            --clr-neon-blue: #00d2ff;
            --clr-neon-red: #ff3131;
            --f-main: 'Black Ops One', cursive;
        }

        /* ОБНУЛЕНИЕ И БАЗА */
        * { 
            margin: 0; padding: 0; box-sizing: border-box; 
            -webkit-tap-highlight-color: transparent; user-select: none; 
        }

        body {
            background-color: var(--bg-deep);
            color: #ffffff;
            height: 100vh;
            width: 100vw;
            font-family: var(--f-main);
            display: flex;
            justify-content: center;
            overflow: hidden;
        }

        .main-wrapper {
            width: 100%;
            max-width: 440px;
            height: 100%;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            /* ТО САМОЕ СВЕЧЕНИЕ СЗАДИ */
            background: radial-gradient(circle at 50% 25%, rgba(255,255,255,0.18) 0%, rgba(0,0,0,0) 55%);
        }

        /* БЛОК КАРТИНКИ СВЕРХУ */
        .header-logo {
            width: 100%;
            padding: 45px 30px 0 30px;
            text-align: center;
            z-index: 10;
        }

        /* Вшитая картинка (заглушка высокого качества, имитирующая твой стиль) */
        .header-logo img {
            width: 100%;
            max-width: 320px;
            filter: drop-shadow(0 0 20px rgba(255,255,255,0.2));
            animation: pulse-glow 3s infinite ease-in-out;
        }

        @keyframes pulse-glow {
            0%, 100% { filter: drop-shadow(0 0 15px rgba(255,255,255,0.15)); }
            50% { filter: drop-shadow(0 0 30px rgba(255,255,255,0.3)); }
        }

        /* СИСТЕМА ЭКРАНОВ */
        .view-layer {
            position: absolute;
            inset: 0;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding-top: 140px;
            z-index: 5;
        }

        .view-layer.active { display: flex; animation: slideUp 0.3s ease-out; }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* ИНТЕРФЕЙС КНОПОК */
        .nav-panel {
            width: 100%;
            padding: 0 45px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .ui-btn {
            width: 100%;
            padding: 22px 0;
            font-family: var(--f-main);
            font-size: 24px;
            text-transform: uppercase;
            border-radius: 12px;
            border: none;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            box-shadow: 0 8px 0 rgba(0,0,0,0.5);
            transition: 0.1s;
        }

        .ui-btn::after {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 45%;
            background: linear-gradient(rgba(255,255,255,0.15), transparent);
        }

        .ui-btn:active { transform: translateY(4px); box-shadow: 0 4px 0 rgba(0,0,0,0.5); }

        /* КНОПКА №6: СОЗДАТЬ КОМНАТУ (БЕЛЫЙ ТЕКСТ + ЗОЛОТО) */
        .btn-gold {
            background: linear-gradient(180deg, var(--clr-gold-top), var(--clr-gold-bottom));
            color: #ffffff !important;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.5);
        }

        .btn-blue {
            background: linear-gradient(180deg, #00a8ff, #004dff);
            color: #ffffff;
        }

        .btn-menu {
            background: #2a2a2a;
            color: #999;
            font-size: 16px;
            padding: 15px 0;
            margin-top: 10px;
        }

        /* ЭКРАН ЛОББИ */
        .lobby-header {
            font-size: 32px;
            color: #ffffff;
            text-shadow: 0 0 15px rgba(255,255,255,0.6);
            margin-bottom: 35px;
            text-transform: uppercase;
        }

        .tabs-row {
            display: flex;
            width: 100%;
            gap: 12px;
            padding: 0 45px;
            margin-bottom: 30px;
        }

        .tab-neon {
            flex: 1;
            padding: 18px 0;
            border: 3px solid;
            border-radius: 14px;
            text-align: center;
            font-size: 14px;
            font-weight: bold;
        }

        .tab-participants {
            border-color: var(--clr-neon-blue);
            color: var(--clr-neon-blue);
            box-shadow: inset 0 0 8px var(--clr-neon-blue), 0 0 8px var(--clr-neon-blue);
        }

        .tab-spy {
            border-color: var(--clr-neon-red);
            color: var(--clr-neon-red);
            box-shadow: inset 0 0 8px var(--clr-neon-red), 0 0 8px var(--clr-neon-red);
        }

        .id-title { font-size: 18px; color: #ffffff; margin-bottom: 5px; opacity: 0.8; }
        .id-code { color: var(--clr-gold-top); font-size: 38px; margin-bottom: 45px; letter-spacing: 6px; }

    </style>
</head>
<body>

    <div class="main-wrapper">
        
        <div class="header-logo">
            <img src="data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iNDAwIiBoZWlnaHQ9IjIwMCIgdmlld0JveD0iMCAwIDQwMCAyMDAiIGZpbGw9Im5vbmUiIHhtbG5zPSJodHRwOi8vd3d3LnczLm9yZy8yMDAwL3N2ZyI+CjxyZWN0IHdpZHRoPSI0MDAiIGhlaWdodD0iMjAwIiBmaWxsPSJub25lIi8+Cjx0ZXh0IHg9IjUwJSIgeT0iNDAlIiBmaWxsPSJ3aGl0ZSIgZm9udC1mYW1pbHk9IkJsYWNrIE9wcyBPbmUiIGZvbnQtc2l6ZT0iNDAiIHRleHQtYW5jaG9yPSJtaWRkbGUiPkJSQVdMPC90ZXh0Pgo8dGV4dCB4PSI1MCUiIHk9Ijg1JSIgZmlsbD0icmVkIiBmb250LWZhbWlseT0iQmxhY2sgT3BzIE9uZSIgZm9udC1zaXplPSI2MCIgdGV4dC1hbmNob3I9Im1pZGRsZSI+U1RBUlM8L3RleHQ+Cjx0ZXh0IHg9IjUwJSIgeT0iNjUlIiBmaWxsPSJyZWQiIGZvbnQtZmFtaWx5PSJSdWJpayBNb25vIE9uZSIgZm9udC1zaXplPSI0NSIgdGV4dC1hbmNob3I9Im1pZGRsZSIgc3Ryb2tlPSJ3aGl0ZSIgc3Ryb2tlLXdpZHRoPSIyIj7QqNCf0JjQntCdPC90ZXh0Pgo8L3N2Zz4=" alt="LOGO">
        </div>

        <div id="screen-main" class="view-layer active">
            <div class="nav-panel">
                <button class="ui-btn btn-gold" onclick="nav('screen-lobby')">СОЗДАТЬ КОМНАТУ</button>
                <button class="ui-btn btn-blue" onclick="nav('screen-join')">ВХОД ПО ID</button>
                <button class="ui-btn btn-menu" onclick="tg.close()">ВЫХОД</button>
            </div>
        </div>

        <div id="screen-lobby" class="view-layer">
            <h2 class="lobby-header">НАСТРОЙКА ЛОББИ</h2>
            
            <div class="tabs-row">
                <div class="tab-neon tab-participants">УЧАСТНИКИ</div>
                <div class="tab-neon tab-spy">ШПИОН</div>
            </div>

            <div class="id-title">ID КОМНАТЫ</div>
            <div id="room-id-val" class="id-code">888-000</div>

            <div class="nav-panel">
                <button class="ui-btn btn-gold" onclick="tg.showAlert('ИГРА НАЧАТА!')">НАЧАТЬ ИГРУ</button>
                <button class="ui-btn btn-menu" onclick="nav('screen-main')">МЕНЮ</button>
            </div>
        </div>

        <div id="screen-join" class="view-layer">
            <h2 class="id-title" style="font-size: 24px; opacity: 1;">ВВЕДИТЕ КОД</h2>
            <div style="margin: 40px 0; font-size: 45px; border-bottom: 5px solid #fff; width: 220px; text-align: center; letter-spacing: 12px;">____</div>
            <div class="nav-panel">
                <button class="ui-btn btn-menu" onclick="nav('screen-main')">ОТМЕНА</button>
            </div>
        </div>

    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        function nav(screenId) {
            document.querySelectorAll('.view-layer').forEach(v => v.classList.remove('active'));
            document.getElementById(screenId).classList.add('active');
            
            if(screenId === 'screen-lobby') {
                const code = Math.floor(100+Math.random()*899) + "-" + Math.floor(100+Math.random()*899);
                document.getElementById('room-id-val').innerText = code;
            }
            tg.HapticFeedback.impactOccurred('medium');
        }

        window.onload = () => { tg.ready(); };
    </script>
</body>
</html>
