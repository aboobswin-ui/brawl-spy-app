<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>BRAWL SPY ULTIMATE</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Black+Ops+One&family=Rubik+One&family=Exo+2:wght@900&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>
        :root {
            --neon-blue: #00d2ff;
            --neon-red: #ff3131;
            --neon-gold: #ffd700;
            --neon-green: #00ff00;
            --bg-black: #020205;
            --glow-white: #ffffff;
        }

        * { 
            box-sizing: border-box; 
            margin: 0; padding: 0; 
            -webkit-user-select: none; 
            -webkit-tap-highlight-color: transparent;
            outline: none; 
        }

        body { 
            background: var(--bg-black); 
            color: #fff; 
            font-family: 'Rubik One', sans-serif; 
            height: 100vh; 
            width: 100vw;
            overflow: hidden; 
            display: flex; 
            justify-content: center; 
            align-items: center;
        }

        .app-shell { 
            width: 100%; 
            height: 100%; 
            max-width: 500px; 
            position: relative; 
            display: flex; 
            flex-direction: column;
        }

        .screen { 
            position: absolute; 
            inset: 0; 
            display: none; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            padding: 50px 30px; 
            background: var(--bg-black); 
        }
        .screen.active { display: flex; animation: fadeIn 0.3s ease; }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        /* --- ГЛАВНЫЙ ЭКРАН --- */
        .logo-box { text-align: center; margin-bottom: 50px; }
        .main-spy { font-size: 110px; color: var(--neon-red); text-shadow: 0 0 35px var(--neon-red); line-height: 0.85; }
        .sub-brawl { font-family: 'Black Ops One'; font-size: 30px; color: var(--neon-gold); text-shadow: 0 0 10px var(--neon-gold); }
        
        /* EDITION 2026 ПОД БРАВЛ СТАРС */
        .edition-2026 { 
            font-family: 'Black Ops One'; 
            font-size: 16px; 
            color: #fff; 
            text-shadow: 0 0 15px #fff; 
            margin-top: 10px;
            letter-spacing: 2px;
        }

        .btn-list { width: 100%; display: flex; flex-direction: column; gap: 20px; }
        .btn-main {
            width: 100%; padding: 25px; background: #000; border: 4px solid var(--neon-blue); 
            box-shadow: 0 0 15px var(--neon-blue); border-radius: 40px; color: #fff; 
            font-family: 'Exo 2'; font-weight: 900; font-size: 24px; text-transform: uppercase; 
            cursor: pointer; text-align: center;
        }
        .btn-exit { border-color: #333; box-shadow: none; color: #666; }

        /* --- НАСТРОЙКА ЛОББИ --- */
        .title-neon { font-family: 'Exo 2'; font-size: 32px; color: #fff; text-shadow: 0 0 20px rgba(255,255,255,0.8); margin-bottom: 30px; }
        .tab-row { display: flex; width: 100%; gap: 10px; margin-bottom: 30px; }
        .tab { 
            flex: 1; padding: 18px; border-radius: 20px; border: 3px solid; background: #000; 
            font-family: 'Exo 2'; font-size: 15px; text-transform: uppercase; text-align: center;
        }
        .tab-participants { border-color: var(--neon-blue); color: var(--neon-blue); box-shadow: 0 0 12px var(--neon-blue); }
        .tab-spy { border-color: var(--neon-red); color: var(--neon-red); box-shadow: 0 0 12px var(--neon-red); }

        .slider-wrap { width: 100%; margin-bottom: 25px; }
        .label-row { display: flex; justify-content: space-between; font-family: 'Exo 2'; font-size: 14px; color: #888; margin-bottom: 10px; }
        .val-num { font-family: 'Black Ops One'; color: #fff; font-size: 20px; }
        
        input[type=range] { width: 100%; -webkit-appearance: none; background: transparent; }
        input[type=range]::-webkit-slider-runnable-track { width: 100%; height: 6px; background: #222; border-radius: 3px; }
        input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; height: 24px; width: 24px; border-radius: 50%; background: #fff; box-shadow: 0 0 10px #fff; margin-top: -9px; }

        /* КНОПКА №6: СОЗДАТЬ КОМНАТУ */
        .btn-gold { border-color: var(--neon-gold); box-shadow: 0 0 20px var(--neon-gold); color: #fff !important; margin-top: 15px; }

        /* --- ВХОД ПО ID (БЕЛЫЙ НЕОН) --- */
        .id-display { display: flex; align-items: center; gap: 10px; margin: 40px 0; }
        .id-digit { 
            font-family: 'Black Ops One'; font-size: 48px; width: 40px; text-align: center; 
            border-bottom: 4px solid #fff; color: #fff; text-shadow: 0 0 20px #fff; 
        }
        .id-sep { font-family: 'Black Ops One'; font-size: 48px; color: #fff; text-shadow: 0 0 20px #fff; transform: translateY(-8px); }

        .numpad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; width: 100%; }
        .key { 
            padding: 22px; background: #0a0a0f; border: 2px solid #1a1a22; border-radius: 25px; 
            font-size: 32px; color: #fff; font-family: 'Black Ops One'; display: flex; justify-content: center; align-items: center;
        }

        /* --- ЛОББИ --- */
        .tg-pill { 
            padding: 10px 25px; border: 2px solid var(--neon-blue); border-radius: 50px; 
            color: var(--neon-blue); font-family: 'Exo 2'; font-size: 18px; 
            box-shadow: 0 0 15px var(--neon-blue); margin-bottom: 30px; 
        }
        .p-list { width: 100%; flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
        .p-item { background: #0f0f15; border: 2px solid #222; border-radius: 20px; padding: 18px; display: flex; justify-content: space-between; }
        .p-ready { color: var(--neon-green); text-shadow: 0 0 10px var(--neon-green); font-family: 'Exo 2'; text-transform: uppercase; font-size: 14px; }
        .p-wait { color: var(--neon-red); text-shadow: 0 0 10px var(--neon-red); font-family: 'Exo 2'; text-transform: uppercase; font-size: 14px; }

    </style>
</head>
<body>
    <div class="app-shell">
        
        <div id="scr-menu" class="screen active">
            <div class="logo-box">
                <div class="main-spy">SPY</div>
                <div class="sub-brawl">BRAWL STARS</div>
                <div class="edition-2026">EDITION 2026</div>
            </div>
            <div class="btn-list">
                <button class="btn-main" onclick="App.nav('scr-setup')">СОЗДАТЬ ЛОББИ</button>
                <button class="btn-main" onclick="App.nav('scr-join')">ВХОД ПО ID</button>
                <button class="btn-main btn-exit" onclick="tg.close()">ВЫХОД</button>
            </div>
        </div>

        <div id="scr-setup" class="screen">
            <h2 class="title-neon">НАСТРОЙКА ЛОББИ</h2>
            <div class="tab-row">
                <div class="tab tab-participants">УЧАСТНИКИ</div>
                <div class="tab tab-spy">ШПИОН</div>
            </div>

            <div class="slider-wrap">
                <div class="label-row">ИГРОКИ <span class="val-num" id="p-val">8</span></div>
                <input type="range" min="3" max="20" value="8" oninput="document.getElementById('p-val').innerText = this.value">
            </div>

            <div class="slider-wrap">
                <div class="label-row">ШПИОНЫ <span class="val-num" id="s-val">1</span></div>
                <input type="range" min="1" max="5" value="1" oninput="document.getElementById('s-val').innerText = this.value">
            </div>

            <div id="id-prev" style="font-family:'Black Ops One'; font-size: 24px; color: var(--neon-gold); margin: 20px 0;">ID: ....-....</div>

            <div class="btn-list">
                <button class="btn-main btn-gold" onclick="App.createRoom()">СОЗДАТЬ КОМНАТУ</button>
                <button class="btn-main" style="border-color:#333;" onclick="App.nav('scr-menu')">НАЗАД</button>
            </div>
        </div>

        <div id="scr-join" class="screen">
            <h2 class="title-neon">ID КОМНАТЫ</h2>
            <div class="id-display">
                <div class="id-digit" id="c1">_</div><div class="id-digit" id="c2">_</div><div class="id-digit" id="c3">_</div><div class="id-digit" id="c4">_</div>
                <div class="id-sep">-</div>
                <div class="id-digit" id="c5">_</div><div class="id-digit" id="c6">_</div><div class="id-digit" id="c7">_</div><div class="id-digit" id="c8">_</div>
            </div>
            <div class="numpad">
                <script>for(let i=1; i<=9; i++) document.write(`<div class="key" onclick="App.key('${i}')">${i}</div>`);</script>
                <div class="key" style="color:var(--neon-red)" onclick="App.key('C')">C</div>
                <div class="key" onclick="App.key('0')">0</div>
                <div class="key" style="color:var(--neon-gold)" onclick="App.joinRoom()">OK</div>
            </div>
            <button class="btn-main" style="margin-top:25px; border-color:#333;" onclick="App.nav('scr-menu')">НАЗАД</button>
        </div>

        <div id="scr-room" class="screen">
            <div class="tg-pill" id="my-name">@USER</div>
            <h2 class="title-neon">ЛОББИ БИТВЫ</h2>
            <div id="active-id" style="font-family:'Black Ops One'; font-size: 26px; color: var(--neon-gold); margin-bottom: 25px;">ID: ....-....</div>
            <div class="p-list" id="player-ui"></div>
            <div class="btn-list" style="margin-top:25px;">
                <button class="btn-main" id="ready-btn" style="border-color:var(--neon-green);" onclick="App.toggleReady()">ГОТОВ</button>
                <button class="btn-main btn-gold" id="start-btn" style="display:none;">НАЧАТЬ ИГРУ</button>
                <button class="btn-main" style="border-color:var(--neon-red);" onclick="location.reload()">ВЫЙТИ</button>
            </div>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDbopGDAnN6RxiXoAk_Il90WZBCW0bVBvg",
            authDomain: "brawlspy.firebaseapp.com",
            databaseURL: "https://brawlspy-default-rtdb.firebaseio.com",
            projectId: "brawlspy",
            storageBucket: "brawlspy.firebasestorage.app",
            messagingSenderId: "803859610634",
            appId: "1:803859610634:web:2310aa16bb6e61049833f3"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        const tg = window.Telegram.WebApp;
        const user = tg.initDataUnsafe.user || { id: 777, username: "Brawler" };
        document.getElementById('my-name').innerText = "@" + (user.username || "Guest");

        const App = {
            room: null, input: "", isReady: false,
            nav: (id) => {
                document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
                document.getElementById(id).classList.add('active');
                if(id === 'scr-setup') {
                    App.room = Math.floor(1000+Math.random()*8999)+"-"+Math.floor(1000+Math.random()*8999);
                    document.getElementById('id-prev').innerText = "ID: " + App.room;
                }
            },
            key: (v) => {
                if(v === 'C') App.input = "";
                else if(App.input.length < 8) App.input += v;
                for(let i=1; i<=8; i++) document.getElementById('c'+i).innerText = App.input[i-1] || "_";
                tg.HapticFeedback.impactOccurred('medium');
            },
            createRoom: () => { App.nav('scr-room'); App.sync(); },
            joinRoom: () => {
                if(App.input.length === 8) {
                    App.room = App.input.slice(0,4) + "-" + App.input.slice(4,8);
                    App.nav('scr-room'); App.sync();
                }
            },
            sync: () => {
                document.getElementById('active-id').innerText = "ID: " + App.room;
                db.ref('rooms/'+App.room+'/players/'+user.id).set({ name: "@"+(user.username||"p"), ready: false });
                db.ref('rooms/'+App.room+'/players').on('value', snap => {
                    const ui = document.getElementById('player-ui');
                    ui.innerHTML = "";
                    const data = snap.val();
                    if(data) Object.values(data).forEach(p => {
                        ui.innerHTML += `<div class="p-item"><span>${p.name}</span><span class="${p.ready?'p-ready':'p-wait'}">${p.ready?'ГОТОВ':'ЖДЕМ'}</span></div>`;
                    });
                });
            },
            toggleReady: () => {
                App.isReady = !App.isReady;
                db.ref('rooms/'+App.room+'/players/'+user.id).update({ ready: App.isReady });
                document.getElementById('ready-btn').innerText = App.isReady ? "ОТМЕНА" : "ГОТОВ";
            }
        };
    </script>
</body>
</html>
